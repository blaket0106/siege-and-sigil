<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Siege & Sigil</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --panel: #14141c;
      --panel2: #1b1b26;
      --line: #2e2c3a;
      --text: #c9b99a;
      --dim: #7d7466;
      --gold: #d4a94a;
      --gold2: #f0cf7d;
      --red: #c0453a;
      --green: #5a9a5e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at top, #15121f 0%, var(--bg) 60%);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
    }
    h1, h2, h3 { font-weight: normal; letter-spacing: 0.08em; margin: 0; color: var(--gold2); }
    button, input, select { font: inherit; color: inherit; }
    input, select {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 9px 11px;
      width: 100%;
    }
    input:focus, select:focus { outline: 1px solid var(--gold); border-color: var(--gold); }
    label { display: block; font-size: 0.8rem; color: var(--dim); margin: 12px 0 4px; letter-spacing: 0.04em; }
    button {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px 14px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--gold); }
    button:disabled { opacity: 0.45; cursor: default; }
    button.primary { background: #3a2f12; border-color: var(--gold); color: var(--gold2); }
    button.primary:hover:not(:disabled) { background: #4d3e17; }
    button.danger { border-color: #6b2e28; color: #e08b82; }
    button.link { background: none; border: none; padding: 0; color: var(--gold); text-decoration: underline; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 48px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--line); margin-bottom: 22px; gap: 12px; flex-wrap: wrap; }
    .topbar .who { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 0.9rem; }
    .brand { font-size: 1.5rem; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; margin-bottom: 20px; }
    .panel > h2 { font-size: 1.1rem; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .auth { max-width: 380px; margin: 12vh auto 0; text-align: center; }
    .auth h1 { font-size: 2.4rem; margin-bottom: 4px; }
    .auth .sub { color: var(--dim); margin-bottom: 24px; font-size: 0.9rem; }
    .auth .panel { text-align: left; }
    .tabs { display: flex; gap: 0; margin-bottom: 8px; }
    .tabs button { flex: 1; border-radius: 0; background: none; border: none; border-bottom: 2px solid var(--line); padding: 10px; color: var(--dim); }
    .tabs button.on { border-bottom-color: var(--gold); color: var(--gold2); }
    .msg { margin-top: 12px; font-size: 0.85rem; color: var(--gold2); }
    .row { display: flex; gap: 10px; align-items: center; }
    .row.wrap2 { flex-wrap: wrap; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    .list > * { border-top: 1px solid var(--line); padding: 12px 0; }
    .list > *:first-child { border-top: none; }
    .game { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .game .name { color: var(--gold2); font-size: 1.02rem; }
    .game .meta { color: var(--dim); font-size: 0.82rem; margin-top: 3px; }
    .empty { color: var(--dim); font-style: italic; padding: 8px 0; }
    .chip { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; border: 1px solid #000; }
    .dots { display: inline-flex; gap: 3px; margin-right: 6px; vertical-align: middle; }
    .tag { font-size: 0.72rem; border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; color: var(--dim); margin-left: 6px; }
    .tag.gold { border-color: var(--gold); color: var(--gold); }
    .tag.green { border-color: var(--green); color: var(--green); }
    .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
    .slot { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 12px; min-height: 64px; display: flex; align-items: center; gap: 10px; }
    .slot.empty { opacity: 0.5; font-style: italic; color: var(--dim); }
    .slot .nm { color: var(--gold2); }
    .slot .fn { color: var(--dim); font-size: 0.8rem; }
    .factions { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 6px; }
    .fac { display: flex; align-items: center; gap: 8px; padding: 8px 10px; text-align: left; }
    .fac.on { border-color: var(--gold); background: #2a2210; }
    .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 16px; font-size: 0.88rem; }
    .kv b { display: block; color: var(--dim); font-weight: normal; font-size: 0.74rem; letter-spacing: 0.05em; text-transform: uppercase; }
    .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 12px; overflow-y: auto; z-index: 10; }
    .modal { background: var(--panel); border: 1px solid var(--gold); border-radius: 6px; padding: 20px; width: 100%; max-width: 520px; }
    .modal h2 { margin-bottom: 8px; }
    .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 0.9rem; color: var(--text); }
    .check input { width: auto; }
    #toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 20; width: min(92vw, 460px); }
    .toast { background: #2a1512; border: 1px solid var(--red); padding: 10px 14px; border-radius: 4px; font-size: 0.9rem; }
    .toast.ok { background: #14231a; border-color: var(--green); }
    .maproot { display: flex; flex-direction: column; height: 100vh; }
    .hud { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 0.88rem; }
    .hud b { color: var(--gold2); font-weight: normal; letter-spacing: 0.06em; }
    .hud .grow { flex: 1; }
    .hud label { margin: 0; display: flex; align-items: center; gap: 6px; color: var(--text); }
    .hud label input { width: auto; }
    .mapbody { flex: 1; display: flex; min-height: 0; }
    .mapwrap { flex: 1; min-width: 0; background: #07070b; position: relative; }
    .mapwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; }
    .mapwrap text { font-family: Georgia, serif; pointer-events: none; fill: #d9ccb0; }
    .side { width: 320px; overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 14px; font-size: 0.88rem; }
    .side h3 { font-size: 1.02rem; margin-bottom: 6px; }
    .side .sec { margin-top: 16px; }
    .side .sec > b { display: block; color: var(--dim); font-weight: normal; font-size: 0.74rem; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 4px; }
    .side .line { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid #20202b; }
    .side .line span:first-child { color: var(--dim); }
    .cmdrow { width: 100%; text-align: left; margin-top: 6px; display: flex; gap: 8px; align-items: center; }
    @media (max-width: 760px) { .mapbody { flex-direction: column; } .side { width: auto; max-height: 42vh; border-left: none; border-top: 1px solid var(--line); } }
    .chatlist { max-height: 46vh; overflow-y: auto; padding: 4px 0; }
    .chatline { padding: 3px 0; word-break: break-word; }
    .chatline small { color: var(--dim); margin-left: 6px; }
    .threadrow { width: 100%; text-align: left; margin-top: 6px; display: block; }
    .threadrow small { display: block; color: var(--dim); margin-top: 2px; }
    .composer { display: flex; gap: 8px; margin-top: 10px; }
    .composer input { flex: 1; }
    .loading { text-align: center; color: var(--dim); margin-top: 30vh; letter-spacing: 0.2em; }
    @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
    @media (pointer: coarse) { button:not(.link), select, input:not([type="checkbox"]) { min-height: 44px; } .hud { gap: 8px 12px; } }
    .zoomonly { display: none; }
    svg.zoomed .zoomonly { display: inline; }
  </style>
</head>
<body>
  <div id="app"><div class="loading">SIEGE &amp; SIGIL</div></div>
  <div id="toasts"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
  <script>
    const SUPABASE_URL = 'https://gyofddvzluokqvrcspxq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_gthIPHl4f-stVfunZ97bxQ_vO3CMTXT';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const DEV_GUEST = false;

    let guestAttempt = null;

    function startGuest() {
      if (!guestAttempt) {
        guestAttempt = sb.auth.signInAnonymously().then(({ error }) => {
          if (!error) return true;
          toast('Guest sign-in failed: ' + error.message + '. Enable anonymous sign-ins in the Supabase dashboard.');
          return false;
        }).finally(() => { guestAttempt = null; });
      }
      return guestAttempt;
    }

    const GAME_COLS = 'id, name, status, created_by, current_tick, last_tick_processed_at, tick_speed, production_cycle_ticks, commander_speed_mult, infra_cost_mult, area_cost_mult, victory_pct, fog_of_war, starting_gold, starting_garrison, starting_treasury_level, starting_industry_level, starting_prestige_level, fill_with_ai, ai_difficulty, truce_ticks, grace_period_ticks, time_limit_ticks, winner_player_id, turn_timeout_minutes, ticks_per_turn, current_turn_ends_at, max_players, map_style, map_size, map_w, map_h, starting_territories, starting_commanders, commander_cost, coronation_ticks, created_at, grace_period_ticks, seasons_enabled, season_length_ticks, events_enabled, mercenaries_enabled, world_scale, free_travel';
    const PLAYER_COLS = 'id, game_id, user_id, faction_slug, display_name, is_ai, eliminated_at_tick, created_at';

    function watchGame(gameId, onRefresh) {
      const channel = sb.channel('game:' + gameId, { config: { private: true } })
        .on('broadcast', { event: 'refresh' }, onRefresh)
        .subscribe((status) => { if (status === 'SUBSCRIBED') onRefresh(); });
      return () => sb.removeChannel(channel);
    }

    const SCHOOLS = [
      { slug: 'battleschool', name: 'Battleschool' },
      { slug: 'university', name: 'University' },
      { slug: 'rangers', name: 'Rangers' },
    ];
    const SPEEDS = { slow: 'Slow (2h ticks)', normal: 'Normal (1h)', fast: 'Fast (30m)', quad: 'Quad (15m)', turn_based: 'Turn-based' };
    const SIZES = { compact: 'Compact', standard: 'Standard', large: 'Large' };
    const STYLES = { scatter: 'Scatter', continents: 'Continents' };
    const MAX_START = { compact: 4, standard: 7, large: 12 };

    const state = {
      session: null,
      profile: null,
      factions: [],
      view: 'auth',
      authTab: 'signin',
      roomId: null,
      cleanup: [],
    };

    function h(tag, props, ...kids) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(props || {})) {
        if (v === undefined || v === null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else if (k === 'value') el.value = v;
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
      for (const kid of kids.flat()) {
        if (kid === null || kid === undefined || kid === false) continue;
        el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      }
      return el;
    }

    function toast(message, ok) {
      const t = h('div', { class: 'toast' + (ok ? ' ok' : '') }, message);
      document.getElementById('toasts').append(t);
      setTimeout(() => t.remove(), 5500);
    }

    async function run(btn, fn) {
      if (btn) btn.disabled = true;
      try {
        return await fn();
      } catch (e) {
        toast(e.message || String(e));
      } finally {
        if (btn && btn.isConnected) btn.disabled = false;
      }
    }

    function clearCleanup() {
      state.cleanup.forEach((fn) => fn());
      state.cleanup = [];
    }

    function mount(node) {
      const app = document.getElementById('app');
      app.replaceChildren(node);
    }

    function modal(title, body, actions) {
      const overlay = h('div', { class: 'overlay' });
      const close = () => overlay.remove();
      overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });
      overlay.append(h('div', { class: 'modal' }, h('h2', {}, title), body, h('div', { class: 'actions' }, actions(close))));
      document.body.append(overlay);
      return close;
    }

    function factionOf(slug) {
      return state.factions.find((f) => f.slug === slug) || { slug, name: slug, color: '#555', color2: '#222' };
    }

    function dots(slug) {
      const f = factionOf(slug);
      return h('span', { class: 'dots' },
        h('span', { class: 'chip', style: `background:${f.color}` }),
        h('span', { class: 'chip', style: `background:${f.color2}` }));
    }

    function factionPicker(taken, initial, onPick) {
      let chosen = initial || null;
      const wrap = h('div', { class: 'factions' });
      const draw = () => {
        const buttons = [
          h('button', { type: 'button', class: 'fac' + (chosen === null ? ' on' : ''), onclick: () => { chosen = null; onPick(null); draw(); } }, 'Random'),
          ...state.factions.map((f) =>
            h('button', {
              type: 'button',
              class: 'fac' + (chosen === f.slug ? ' on' : ''),
              disabled: taken.includes(f.slug),
              onclick: () => { chosen = f.slug; onPick(f.slug); draw(); },
            }, dots(f.slug), f.name)),
        ];
        wrap.replaceChildren(...buttons);
      };
      draw();
      return wrap;
    }

    async function loadProfile() {
      const { data } = await sb.from('profiles').select('*').eq('user_id', state.session.user.id).maybeSingle();
      state.profile = data;
    }

    async function loadFactions() {
      if (state.factions.length) return;
      const { data } = await sb.from('factions').select('*').order('name');
      state.factions = data || [];
    }

    function renderAuth(recovery) {
      let tab = recovery ? 'recovery' : state.authTab;
      const message = h('div', { class: 'msg' });
      const email = h('input', { type: 'email', autocomplete: 'email', placeholder: 'you@example.com' });
      const password = h('input', { type: 'password', autocomplete: tab === 'signup' || tab === 'recovery' ? 'new-password' : 'current-password' });
      const name = h('input', { type: 'text', maxlength: '40', placeholder: 'Shown to other players' });
      const form = h('form', { novalidate: true });

      const draw = () => {
        const submit = h('button', { type: 'submit', class: 'primary', style: 'width:100%;margin-top:18px' },
          { signin: 'Sign in', signup: 'Create account', reset: 'Send reset link', recovery: 'Set new password' }[tab]);
        const tabs = recovery ? null : h('div', { class: 'tabs' },
          h('button', { type: 'button', class: tab === 'signin' ? 'on' : '', onclick: () => { state.authTab = tab = 'signin'; draw(); } }, 'Sign in'),
          h('button', { type: 'button', class: tab === 'signup' ? 'on' : '', onclick: () => { state.authTab = tab = 'signup'; draw(); } }, 'Create account'));
        const kids = [tabs];
        if (tab === 'signup') kids.push(h('label', {}, 'Display name'), name);
        if (tab !== 'recovery') kids.push(h('label', {}, 'Email'), email);
        if (tab !== 'reset') kids.push(h('label', {}, tab === 'recovery' ? 'New password' : 'Password'), password);
        kids.push(submit);
        if (tab === 'signin') kids.push(h('div', { style: 'margin-top:14px;text-align:center' }, h('button', { type: 'button', class: 'link', onclick: () => { tab = 'reset'; draw(); } }, 'Forgot password?')));
        if (tab === 'reset') kids.push(h('div', { style: 'margin-top:14px;text-align:center' }, h('button', { type: 'button', class: 'link', onclick: () => { tab = 'signin'; draw(); } }, 'Back to sign in')));
        kids.push(message);
        form.replaceChildren(...kids.filter(Boolean));
        message.textContent = '';
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = form.querySelector('button[type=submit]');
        await run(btn, async () => {
          message.textContent = '';
          if (tab === 'signin') {
            const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: password.value });
            if (error) throw error;
          } else if (tab === 'signup') {
            const display = name.value.trim();
            if (!display) throw new Error('Choose a display name');
            if (password.value.length < 8) throw new Error('Password must be at least 8 characters');
            const { data, error } = await sb.auth.signUp({
              email: email.value.trim(),
              password: password.value,
              options: { data: { display_name: display }, emailRedirectTo: location.href.split('#')[0] },
            });
            if (error) throw error;
            if (!data.session) message.textContent = 'Account created. Check your email for a confirmation link, then sign in.';
          } else if (tab === 'reset') {
            const { error } = await sb.auth.resetPasswordForEmail(email.value.trim(), { redirectTo: location.href.split('#')[0] });
            if (error) throw error;
            message.textContent = 'If that email has an account, a reset link is on its way.';
          } else {
            if (password.value.length < 8) throw new Error('Password must be at least 8 characters');
            const { error } = await sb.auth.updateUser({ password: password.value });
            if (error) throw error;
            toast('Password updated', true);
            await showHome();
          }
        });
      });

      draw();
      mount(h('div', { class: 'wrap' }, h('div', { class: 'auth' },
        h('h1', {}, 'Siege & Sigil'),
        h('div', { class: 'sub' }, 'Castles. Commanders. Kingdoms at war.'),
        h('div', { class: 'panel' }, form))));
    }

    function topbar() {
      const nameEl = h('span', {}, state.profile ? state.profile.display_name : '');
      return h('div', { class: 'topbar' },
        h('div', { class: 'brand' }, h('h1', {}, 'Siege & Sigil')),
        h('div', { class: 'who' },
          nameEl,
          h('button', { class: 'link', onclick: helpDialog }, 'how to play'),
          h('button', { class: 'link', onclick: renameDialog }, 'rename'),
          h('button', { onclick: () => sb.auth.signOut() }, DEV_GUEST ? 'New guest' : 'Sign out')));
    }

    const HELP = [
      ['Goal', 'Hold the share of castles shown in the top bar ("Castles x / y to win"). The first player to reach it wins. Lose your last castle and you are eliminated.'],
      ['Time', 'The game advances in ticks. Orders you give take effect as ticks pass; the countdown shows the next tick. Turn-based games advance when everyone ends their turn or the deadline passes.'],
      ['Castles', 'Click a castle to see its troops and upgrades. Build Treasury for gold, Recruitment for troops and Prestige for research. Natural resources set the tier (1 to 20 is Tier 1, 21 to 40 Tier 2, 41 to 60 Tier 3) and make upgrades cheaper; the halo around a castle shows how rich it is. Build a road at two castles to march between them faster.'],
      ['Commanders', 'Commanders lead troops. Hire more, spend gold on their abilities and move troops between a commander and a castle. A commander left in a castle garrisons it.'],
      ['Marching', 'Select a commander and choose March, then click a destination. In free-travel games you can march straight to any castle within your range (Stables extends it); the ground between decides the time: forest, hills and high ground slow a march, fords and passes slow it more; the sea, rivers and mountain ranges block a direct march, so cross at a ford (bridge icon) or a mountain pass and chain stops with a multi-stop route. Otherwise armies follow roads through friendly castles.'],
      ['Combat', 'Armies that meet in the field fight, and an army arriving at an enemy castle lays siege. A besieged castle can sally out or be relieved by a friendly army. Battle reports are in the Battles list. A defeated commander may be captured instead of killed: the captor can ransom, release or execute them, and captives sometimes escape. A commander who wins five battles earns a name and a bonus; losing a king or a named commander costs prestige and lowers production for a while.'],
      ['Fog of war', 'In fog games you only see what your castles and armies can scan. A "?" means information you cannot currently see.'],
      ['Diplomacy', 'From the Standings list you can propose an alliance, a non-aggression pact, peace or a trade deal, or declare war. Peace is a truce that blocks attacks for a set number of ticks; at war you can also send peace terms (gold, tribute or a castle). Allies can lock a marriage alliance that cannot be broken until it ends. A third player can offer mediation between two players at war. Breaking a pact or alliance, or attacking during a grace period, costs honor.'],
      ['Council', 'Your seven realm areas are seats held by named councillors. Deploy one as a commander and that seat drops to level 1 until you recall them at one of your castles. If a councillor falls, you lose prestige, production dips for a while and the seat stays empty until you pay for a replacement.'],
      ['Seasons, events and mercenaries', 'If the host turned them on: winter slows troop production (most in the north) and marches, autumn boosts gold. Random events can strike a castle; pay to respond or ignore them. Mercenary companies cost gold, arrive at once and disband after 48 ticks.'],
      ['Chat and messages', 'Use the Chat tab for the game channel and the Inbox for messages and reports. The News tab lists recent events.'],
    ];

    function helpDialog() {
      const body = h('div', { style: 'max-height:60vh;overflow-y:auto;padding-right:6px' },
        ...HELP.map(([t, d]) => h('div', { style: 'margin-bottom:10px' }, h('b', { style: 'color:var(--gold2)' }, t), h('div', { style: 'color:var(--text)' }, d))));
      modal('How to play', body, (close) => [h('button', { class: 'primary', onclick: close }, 'Got it')]);
    }

    async function summaryDialog(gameId) {
      const { data, error } = await sb.rpc('game_summary', { p_game_id: gameId });
      if (error) return toast(error.message);
      const rows = data.players.map((p) => h('div', { class: 'game' },
        h('div', {},
          h('div', { class: 'name' }, dots(p.faction), p.name, p.player_id === data.winner_player_id ? h('span', { class: 'tag gold' }, 'winner') : null, p.is_ai ? h('span', { class: 'tag' }, 'AI') : null),
          h('div', { class: 'meta' }, `${p.castles} castles · ${p.troops} troops · ${p.battles} battles${p.eliminated_at_tick != null ? ` · eliminated at tick ${p.eliminated_at_tick}` : ''}`))));
      modal(`${data.name}: final standings`, h('div', {}, h('div', { class: 'meta', style: 'color:var(--dim);margin-bottom:8px' }, `Ended at tick ${data.ticks}${data.reason ? ` (${data.reason})` : ''}`), h('div', { class: 'list', style: 'max-height:50vh;overflow-y:auto' }, ...rows)), (close) => [h('button', { class: 'primary', onclick: close }, 'Close')]);
    }

    function renameDialog() {

    const TICK_MS = { slow: 7200000, normal: 3600000, fast: 1800000, quad: 900000 };
    const ABILITY_NAMES = { valor: 'Valor', tactics: 'Tactics', siegecraft: 'Siegecraft', bulwark: 'Bulwark', muster: 'Muster', steward: 'Steward', scholar: 'Scholar', pace: 'Pace', scout: 'Scout', plunder: 'Plunder' };
