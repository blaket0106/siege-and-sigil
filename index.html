        if (sg && sg.troops && typeof t.troops === 'number') {
          const frac = Math.max(0, Math.min(1, t.troops / sg.troops));
          out.push(h('div', { class: 'sgbar', title: 'Garrison strength compared with when the siege began' },
            h('div', { class: 'sgbar-top' }, h('span', {}, 'Garrison holding'), h('b', {}, `${Math.round(frac * 100)}%`)),
            h('div', { class: 'sgbar-track' }, h('div', { class: 'sgbar-fill' + (frac < 0.35 ? ' low' : frac < 0.65 ? ' mid' : ''), style: `width:${Math.round(frac * 100)}%` })),
            h('div', { class: 'sgbar-note' }, `${pluralN(t.troops, 'troop')} left of ${sg.troops} when the siege began. The garrison starves about 3% a tick, and one level of Treasury, Recruitment or Prestige is lost each production cycle.`)));
        }
        if (t.owner_player_id === ms.me.id) {
          const defenders = ms.cmd.filter((c) => c.current_territory_id === t.id && c.status === 'idle' && isFriend(c.owner_player_id));
          const force = t.troops + defenders.reduce((a, c) => a + c.troops, 0);
          out.push(line('Your force', `${t.troops} garrison + ${defenders.length} commander${defenders.length === 1 ? '' : 's'} (${force} troops)`),
            h('div', { style: 'margin-top:8px' }, h('button', {
              class: 'danger',
              onclick: (e) => {
                if (confirm('Sally out? Your garrison and idle commanders here fight the besiegers in the open. Ties go to the besiegers. If you lose, the garrison is emptied and those commanders die.')) {
                  order('sally_out', { p_territory_id: t.id }, (d) => (d.winner === 'sally' ? `Siege broken. ${d.survivors} survivors` : 'The sally was destroyed'))(e);
                }
              },
            }, 'Sally out')));
        }
        if (siegers.some((c) => c.owner_player_id === ms.me.id)) out.push(h('div', { style: 'margin-top:8px' }, assaultButton(t)));
        return h('div', { class: 'sec' }, out);
      };

      const routeLines = (route, call, c) => h('div', { style: 'margin-bottom:8px' },
        route.stops.map((st, i) => {
          const nm = (ms.t.get(st.territory_id) || { name: '?' }).name;
          const what = st.action && st.action !== 'nothing' ? ` · ${ACTION_NAMES[st.action]}${ACTION_NEEDS_AMOUNT.has(st.action) ? ' ' + st.amount : ''}` : '';
          const wait = st.delay ? ` · wait ${st.delay}` : '';
          return h('div', { style: `color:${i === route.next_stop_index ? 'var(--gold2)' : 'var(--dim)'}` }, `${i + 1}. ${nm}${what}${wait}`);
        }),
        route.looping ? h('div', { style: `color:${route.next_stop_index >= route.stops.length ? 'var(--gold2)' : 'var(--dim)'}` }, `Then back to ${(ms.t.get(route.origin_territory_id) || { name: '?' }).name} and repeat`) : null,
        h('div', { style: 'margin-top:6px' }, h('button', { onclick: call('set_route_loop', { p_commander_id: c.id, p_loop: !route.looping }, route.looping ? 'Loop turned off' : 'Looping from the last stop') }, route.looping ? 'Stop looping' : 'Loop route')));

      const commanderActions = (c) => {
        if (c.owner_player_id !== ms.me.id || !canAct()) return null;
        const call = (fn, args, message) => (e) => act(e.currentTarget, async () => {
          const { error } = await sb.rpc(fn, { p_game_id: gameId, ...args });
          if (error) throw error;
          if (message) toast(message, true);
        });

        if (c.status === 'moving') {
          const route = ms.routes.get(c.id);
          const m = ms.mov.get(c.id);
          if (route && route.status === 'aborted' && m) {
            return h('div', { class: 'sec' }, h('b', {}, 'Orders'),
              h('div', { style: 'color:var(--gold2)' }, `Halting at ${ms.t.get(m.to_territory_id).name}.`));
          }
          return h('div', { class: 'sec' }, h('b', {}, 'Orders'),
            route && route.status === 'active' ? routeLines(route, call, c) : null,
            h('div', { class: 'row wrap2' },
              m && m.departed_tick === ms.game.current_tick && (!route || (route.created_tick === m.departed_tick && !route.next_stop_index))
                ? h('button', { onclick: call('cancel_march', { p_commander_id: c.id }, 'March cancelled') }, 'Cancel march') : null,
              h('button', { onclick: call('abort_route', { p_commander_id: c.id }, 'Will halt at the next stop') }, 'Halt at next stop')),
            h('div', { class: 'tip' }, m && m.departed_tick === ms.game.current_tick && (!route || (route.created_tick === m.departed_tick && !route.next_stop_index))
              ? 'You can cancel this march until the next tick. After that the army is committed.'
              : `Orders are locked: this army left at tick ${m ? m.departed_tick : '?'}. You can still halt at the next stop.`));
        }
        if ((c.status !== 'idle' && c.status !== 'sieging') || !c.current_territory_id) return null;

        const t = ms.t.get(c.current_territory_id);
        const out = [h('b', {}, 'Orders')];
        const waiting = ms.routes.get(c.id);
        if (waiting && waiting.status === 'active' && waiting.resume_tick != null) {
          out.push(h('div', { style: 'color:var(--gold2);margin-bottom:6px' }, `Waiting at ${t.name} until tick ${waiting.resume_tick}, then continues its route.`),
            routeLines(waiting, call, c),
            h('div', { style: 'margin-bottom:10px' }, h('button', { onclick: call('abort_route', { p_commander_id: c.id }, 'Remaining stops dropped') }, 'Drop remaining stops')));
        }
        if (c.status === 'sieging') {
          out.push(h('div', { style: 'color:var(--gold2);margin-bottom:8px' }, `Besieging ${t.name}. The garrison starves each tick.`),
            h('div', { style: 'margin-bottom:10px' }, assaultButton(t)));
        }

        if (t.owner_player_id === ms.me.id) {
          const amount = h('input', { type: 'number', min: '1', value: ms.xfer, style: 'width:90px', oninput: (e) => { ms.xfer = Math.max(1, Number(e.target.value) || 1); } });
          out.push(h('div', { class: 'row wrap2', style: 'margin-bottom:10px' },
            amount,
            h('button', { onclick: (e) => act(e.currentTarget, async () => {
              const { error } = await sb.rpc('transfer_troops', { p_game_id: gameId, p_commander_id: c.id, p_amount: Number(amount.value) || 1 });
              if (error) throw error;
            }) }, 'Take'),
            h('button', { onclick: (e) => act(e.currentTarget, async () => {
              const { error } = await sb.rpc('transfer_troops', { p_game_id: gameId, p_commander_id: c.id, p_amount: -(Number(amount.value) || 1) });
              if (error) throw error;
            }) }, 'Leave'),
            h('span', { style: 'color:var(--dim);font-size:.8rem' }, `Garrison ${t.troops}`)));
        }

        const extras = [];
        if (t.owner_player_id === ms.me.id && t.garrison_commander_id !== c.id) {
          extras.push(h('button', { title: 'This commander takes charge of the castle and stays to defend it. Their abilities boost the garrison. Release them to send them out again.', onclick: order('assign_garrison_commander', { p_commander_id: c.id }, 'Now holds this castle') }, 'Hold this castle'));
        }
        if (!ms.cmd.some((x) => x.owner_player_id === ms.me.id && x.role === 'king')) {
          extras.push(h('button', { onclick: order('crown_commander', { p_commander_id: c.id }, (d) => `Crowned. Takes effect at tick ${d.effective_tick}`) }, 'Crown as king'));
        }
        if (extras.length) out.push(h('div', { class: 'row wrap2', style: 'margin-bottom:10px' }, extras));

        if (t.garrison_commander_id === c.id) {
          out.push(h('div', { style: 'color:var(--dim);margin-bottom:8px' }, 'Leads this garrison and cannot march.'),
            h('button', { onclick: call('unassign_garrison_commander', { p_territory_id: t.id }, 'No longer holds the castle') }, 'Release from the castle'));
          return h('div', { class: 'sec' }, out);
        }

        if (!ms.marching) {
          out.push(h('button', { class: 'primary', onclick: () => { ms.marching = true; ms.preview = null; render(); drawSide(); } }, 'March...'));
          return h('div', { class: 'sec' }, out);
        }

        out.push(h('div', { style: 'color:var(--gold2);margin-bottom:8px' }, ms.stops.length ? 'Click a castle to add the next stop.' : 'Click a castle on the map to choose the destination.'));
        const pv = ms.preview;
        if (pv && pv.error) out.push(h('div', { style: 'color:var(--gules-hi);margin-bottom:8px' }, pv.error));
        if (pv && !pv.plan && !pv.error) out.push(h('div', { class: 'empty' }, 'Planning route...'));
        if (pv && pv.plan) {
          const plan = pv.plan;
          const dest = ms.t.get(pv.to);
          const interval = TICK_MS[ms.game.tick_speed];
          const eta = interval ? ` (about ${fmtDuration((plan.arrival_tick - tickF()) * interval)})` : '';
          out.push(h('div', {},
            line('Destination', dest.name),
            line('Route', plan.path.filter((id) => !ms.t.get(id).is_junction).map((id) => ms.t.get(id).name).join(' > ')),
            line('Travel', `${plan.travel_ticks} ticks`),
            line('Arrives', `tick ${plan.arrival_tick}${eta}`),
            line('Distance / range', `${leagueText(plan.raw_length)} / ${leagueText(plan.range)} leagues`),
            line('In range', plan.in_range ? (plan.raw_length > plan.range ? 'Yes (single hop)' : 'Yes') : 'No')));
          const friendly = dest.owner_player_id && isFriend(dest.owner_player_id);
          if (!friendly) {
            const type = h('select', { onchange: (e) => { pv.type = e.target.value; } },
              h('option', { value: 'assault' }, 'Assault the castle'),
              h('option', { value: 'siege' }, 'Lay siege'));
            type.value = pv.type;
            out.push(h('label', {}, 'On arrival'), type, assaultPreview(dest, c));
          }
          if (ms.collectAt === pv.to) out.push(h('div', { class: 'tip', style: 'color:var(--gold2)' }, 'On arrival this army will collect all the troops in the castle.'));
          out.push(h('div', { class: 'row wrap2', style: 'margin-top:10px' },
            h('button', {
              class: 'primary',
              disabled: !plan.in_range,
              onclick: (e) => act(e.currentTarget, async () => {
                const collecting = ms.collectAt === pv.to;
                const { data, error } = collecting
                  ? await sb.rpc('send_on_route', { p_game_id: gameId, p_commander_id: c.id, p_march_type: pv.type, p_stops: [{ territory_id: pv.to, march_type: pv.type, action: 'collect_all', amount: 0, delay: 0 }], p_options: {} })
                  : await sb.rpc('march_commander', { p_game_id: gameId, p_commander_id: c.id, p_to_territory_id: pv.to, p_march_type: pv.type });
                if (error) throw error;
                ms.collectAt = null;
                ms.marching = false;
                ms.preview = null;
                ms.stops = []; ms.loop = false;
                toast(`Marching. Arrives at tick ${data.arrival_tick}`, true);
              }),
            }, 'March'),
            h('button', {
              disabled: !plan.in_range,
              onclick: () => { ms.stops = [{ id: pv.to, type: pv.type, action: PREFS.action, amount: 0, delay: 0, path: plan.path, cost: plan.raw_length }]; ms.loop = false; ms.preview = null; render(); drawSide(); },
            }, 'Start a route here')));
        }
        if (ms.stops.length) {
          const when = stopTicks();
          const origin = ms.t.get(c.current_territory_id);
          const loopBlocked = ms.loop && ms.stops[ms.stops.length - 1].id === c.current_territory_id;
          out.push(h('div', { class: 'sec' }, h('b', {}, `Route (${ms.stops.length} of 10 stops)`),
            ms.stops.map((st, i) => {
              const dest = ms.t.get(st.id);
              const friendly = dest.owner_player_id && isFriend(dest.owner_player_id);
              const type = friendly ? null : h('select', { style: 'width:auto;padding:3px 6px', onchange: (e) => { st.type = e.target.value; } },
                h('option', { value: 'assault' }, 'Assault'), h('option', { value: 'siege' }, 'Siege'));
              if (type) type.value = st.type;
              return h('div', {},
                h('div', { class: 'line', style: 'align-items:center' },
                  h('span', { style: 'color:var(--text)' }, `${i + 1}. ${dest.name}`),
                  h('span', { class: 'row' }, ms.speed && st.cost ? h('span', { style: 'color:var(--dim);font-size:.8rem' }, `+${when[i]} ticks`) : null, type,
                    h('button', { style: 'padding:2px 8px', onclick: () => { if (trailsOn()) ms.stops.splice(i); else ms.stops.splice(i, 1); render(); drawSide(); } }, 'x'))),
                dest.owner_player_id === ms.me.id ? orderControls(st, drawSide) : null);
            }),
            ms.speed ? line('Reaches the last stop in', tickText(when[when.length - 1])) : null,
            h('label', { class: 'check', style: 'margin:8px 0' }, h('input', { type: 'checkbox', checked: ms.loop, onchange: (e) => { ms.loop = e.target.checked; drawSide(); } }), `Loop: return to ${origin.name} and repeat`),
            ms.loop ? h('div', {}, h('div', { style: 'color:var(--dim);font-size:.8rem' }, `On each return to ${origin.name}`), orderControls(ms.originOrder, drawSide)) : null,
            loopBlocked ? h('div', { style: 'color:var(--gules-hi);margin:6px 0' }, 'A looping route must end somewhere other than where it starts.') : null,
            h('div', { style: 'color:var(--dim);font-size:.8rem;margin:6px 0' }, trailsOn()
              ? 'Click castles to add stops. Each stop must be within range of the one before it. Orders run when the commander arrives at a castle you own.'
              : 'Click more castles to add stops. Only the first leg is checked now; later legs are planned when the commander reaches each stop, and the route ends if one is blocked.'),
            h('button', {
              class: 'primary',
              disabled: loopBlocked,
              onclick: (e) => act(e.currentTarget, async () => {
                const { data, error } = await sb.rpc('send_on_route', {
                  p_game_id: gameId, p_commander_id: c.id, p_march_type: 'assault',
                  p_stops: ms.stops.map((st) => ({ territory_id: st.id, march_type: st.type, action: st.action || 'nothing', amount: st.amount || 0, delay: st.delay || 0 })),
                  p_options: { loop: ms.loop, origin_order: ms.originOrder },
                });
                if (error) throw error;
                ms.marching = false;

          if (ms.me.gold >= 120) lines.push(h('div', { class: 'tip', style: 'margin-top:8px' }, `You hold ${ms.me.gold} gold. Spend it with Upgrade everywhere below, or hire a commander at a castle.`));
          box.replaceChildren(...(lines.length ? [h('div', { class: 'sec' }, h('b', {}, 'Next move'), ...lines)] : []));
        };
        const paint = async (stats) => {
          try { await paintInner(stats); } catch {
            box.replaceChildren(h('div', { class: 'sec' }, h('b', {}, 'Next move'), h('div', { class: 'tip' }, 'Checking the roads. This updates at the next refresh.')));
          }
        };
        if (!best) { paint(new Map()); return box; }
        const actorIds = [...idleAll.filter((c) => c.role !== 'king'), ...idleAll.filter((c) => c.role === 'king')].slice(0, 5).map((c) => c.id);
        const es = actorIds.map((id) => [id, attackStats([id])]);
        const armoryLvl = ((ms.areas || []).find((a2) => a2.area === 'armory') || { level: 1 }).level;
        const gather = () => new Map(es.filter(([, e]) => e.data || !e.p).map(([id, e]) => [id, e.data || { armory: armoryLvl, damage: Math.max(1, armoryLvl) }]));
        paint(gather());
        const waiting = es.map(([, e]) => e.p).filter(Boolean);
        if (waiting.length) Promise.all(waiting).then(() => paint(gather()));
        return box;
      };

      const assaultSection = (t) => {
        if (!canAct() || t.is_junction || t.owner_player_id === ms.me.id || (t.owner_player_id && isFriend(t.owner_player_id))) return null;
        const best = strongestIdle();
        const box = h('div', {});
        const paint = (st) => {
          const est = defenceEstimate(t, st ? st.armory : 1);
          const out = [h('b', {}, 'Taking this castle')];
          if (!est) {
            out.push(h('div', { class: 'empty' }, ms.vis.has(t.id) ? 'The garrison is not visible.' : 'The garrison is out of sight. Move a commander or a watchtower within range to see it.'));
          } else {
            const mine = st ? st.damage : 1;
            out.push(line('Defenders', est.stationed ? `${est.troops} troops, ${est.troops - t.troops} with ${pluralN(est.stationed, 'commander')}` : `${est.troops} troops`),
              line('Their damage per round', est.exact ? String(est.dmg) : `${est.dmg} (estimate)`),
              line('Your damage per round', String(mine)),
              h('div', { class: 'tip' }, 'The fewest troops you need to take it, by the damage per round you deal:'),
              h('div', { class: 'needs' }, [1, 2, 3, 4].map((a) => h('span', { class: 'need' + (a === mine ? ' mine' : ''), style: a === mine ? 'outline:1px solid var(--gold2)' : '' }, h('b', {}, String(troopsNeeded(est.troops, est.dmg, a))), ` at ${a}`))));
            const need = troopsNeeded(est.troops, est.dmg, mine);
            if (best) {
              const ok = best.troops >= need;
              out.push(h('div', { style: `margin-top:6px;color:${ok ? '#7fd08a' : 'var(--gules-hi)'}` }, ok ? `${best.name} has ${best.troops} troops: enough.` : `${best.name}, your strongest, has ${best.troops}. You need ${need - best.troops} more.`));
              if (ok && best.current_territory_id !== t.id) out.push(h('button', { class: 'primary', style: 'margin-top:6px', onclick: () => sendHere(best, t) }, `Send ${best.name}`));
            }
            if (est.expected) out.push(h('div', { class: 'tip' }, 'Out of sight. An unclaimed castle holds no troops and never grows any, so this is reliable unless it was taken or changed.'));
            else if (!est.exact) out.push(h('div', { class: 'tip' }, 'Estimate: assumes their Armory matches yours and their leader has no Valor. Real defence may be stronger.'));
          }
          box.replaceChildren(h('div', { class: 'sec' }, out));
        };
        const e = attackStats(best ? [best.id] : []);
        paint(e.data);
        if (!e.data && e.p) e.p.then(paint);
        return box;
      };

      const assaultPreview = (dest, c) => {
        const box = h('div', {});
        const paint = (st) => {
          const est = defenceEstimate(dest, st ? st.armory : 1);
          if (!est || !st) { box.replaceChildren(h('div', { class: 'tip' }, 'The defenders are not visible, so the result cannot be predicted.'), c.role === 'king' ? h('div', { style: 'color:var(--gules-hi);margin-top:4px' }, 'Your king leads this army. If it loses, the king dies. Scout the castle first, or send another commander.') : null); return; }
          const rounds = combatSim(c.troops, st.damage, est.troops, est.dmg, true);
          const last = rounds[rounds.length - 1];
          const win = last[1] === 0 && last[0] > 0;
          box.replaceChildren(h('div', { class: 'sec' }, h('b', {}, 'If you assault'),
            h('div', { style: `color:${win ? '#7fd08a' : 'var(--gules-hi)'};margin:4px 0` }, win ? `Predicted win: ${pluralN(last[0], 'troop')} left of ${c.troops}.` : `Predicted loss: ${c.troops} against ${est.troops} fails. You would need ${troopsNeeded(est.troops, est.dmg, st.damage)} troops.`),
            h('div', { class: 'tip' }, `${rounds.length - 1} rounds. You deal ${st.damage} per round, they deal ${est.dmg}${est.exact ? '' : ' (estimate)'}. The defender strikes first.`),
            !est.exact && c.role === 'king' ? h('div', { style: 'color:var(--gules-hi);margin-top:4px' }, 'Your king leads this army and the garrison is only estimated. If it loses, the king dies. Send another commander, or scout first.') : null));
        };
        const e = attackStats([c.id]);
        paint(e.data);
        if (!e.data && e.p) e.p.then(paint);
        return box;
      };

      const castleReportBox = (t) => {
        if (t.owner_player_id == null || !ms.vis.has(t.id)) return null;
        const own = t.owner_player_id === ms.me.id;
        if (!own && dipStatus(t.owner_player_id) !== 'allied') return null;
        const box = h('div', {}, h('div', { class: 'sec' }, h('div', { class: 'empty' }, 'Reading the castle...')));
        ms.crep = ms.crep || new Map();
        const paint = (r) => {
          if (!r) return;
          const y = r.yield; const d = r.defence;
          const out = [];
          if (own) {
            out.push(h('div', { class: 'sec' }, h('b', {}, 'Production'),
              line('Troops per cycle', String(y.troops)), line('Gold per cycle', String(y.gold)), line('Prestige per tick', String(y.prestige)),
              h('div', { class: 'tip' }, `A cycle is ${r.cycle_ticks} ticks. The next level of each would add: Treasury +${y.next_gold} gold per cycle, Recruitment +${y.next_troops} troops per cycle, Prestige +${y.next_prestige} per tick.`)));
          }
          out.push(h('div', { class: 'sec' }, h('b', {}, 'Defence'),
            line('Damage per round', String(d.damage)),
            h('div', { class: 'tip' }, `Armory ${d.armory} + leader Valor ${d.valor} + 1 base${d.terrain_bonus ? ' + 1 for mountain' : ''}.`),
            line('Troops', d.stationed ? `${d.troops} in the castle, ${d.total_troops - d.troops} with ${d.stationed} commander${d.stationed === 1 ? '' : 's'}` : String(d.troops)),
            d.garrison ? line('Garrison leader', d.garrison.name) : null,
            h('div', { class: 'tip' }, 'The fewest troops an attacker needs to take it, by the damage per round they deal:'),
            h('div', { class: 'needs' }, d.needed.map((n) => h('span', { class: 'need' }, h('b', {}, String(n.troops_needed)), ` at ${n.attacker_damage}`)))));
          box.replaceChildren(...out);
        };
        const hit = ms.crep.get(t.id);
        if (hit) paint(hit.data);
        if (!hit || Date.now() - hit.at > 12000) sb.rpc('castle_report', { p_game_id: gameId, p_territory_id: t.id }).then(({ data }) => { if (data) { ms.crep.set(t.id, { at: Date.now(), data }); paint(data); } });
        return box;
      };

      const castleThreat = (t) => {
        if (t.owner_player_id !== ms.me.id || !ms.vis.has(t.id)) return null;
        const hostile = (pid) => pid && pid !== ms.me.id && dipStatus(pid) !== 'allied';
        const incoming = ms.cmd.filter((c) => hostile(c.owner_player_id)).map((c) => ({ c, m: ms.mov.get(c.id) })).filter((x) => x.m && x.m.to_territory_id === t.id);
        const besiegers = ms.cmd.filter((c) => hostile(c.owner_player_id) && c.status === 'sieging' && c.current_territory_id === t.id);
        const force = incoming.reduce((a, x) => a + (typeof x.c.troops === 'number' ? x.c.troops : 0), 0) + besiegers.reduce((a, c) => a + (typeof c.troops === 'number' ? c.troops : 0), 0);
        const near = castleLinks(t.id).filter((l) => ms.vis.has(l.t.id) && hostile(l.t.owner_player_id) && !l.t.is_junction).sort((a, b) => a.len - b.len).slice(0, 4);
        return h('div', { class: 'sec' }, h('b', {}, 'Threats'),
          besiegers.map((c) => h('div', { class: 'line k-threat' }, h('span', {}, `${houseOf(c.owner_player_id) || 'An enemy'} army, ${c.troops} troops`), h('span', {}, 'besieging now'))),
          incoming.length ? incoming.map(({ c, m }) => h('div', { class: 'line k-threat' }, h('span', {}, `${houseOf(c.owner_player_id) || 'An enemy'} army, ${c.troops} troops`), h('span', {}, `arrives tick ${m.arrival_tick}`)))
            : (besiegers.length ? null : h('div', { class: 'empty' }, 'No hostile armies are marching here that you can see.')),
          incoming.length + besiegers.length > 1 ? h('div', { class: 'line k-threat' }, h('b', {}, 'Total force you can see'), h('b', {}, String(force))) : null,
          near.length ? h('div', { class: 'tip' }, 'Nearest hostile castles:') : null,
          near.map((l) => h('div', { class: 'line' }, h('span', {}, `${l.t.name}, House ${houseOf(l.t.owner_player_id) || '?'}`), h('span', {}, `${l.t.troops} troops`))));
      };

      const castleSupply = (t) => {
        if (t.owner_player_id !== ms.me.id) return null;
        const rows = [];
        ms.routes.forEach((r) => {
          if (r.status !== 'active') return;
          const cmd = ms.cmd.find((x) => x.id === r.commander_id);
          if (!cmd) return;
          const stops = (r.stops || []).filter((st) => st.territory_id === t.id);
          if (r.origin_territory_id === t.id) rows.push([cmd, `starts here${r.looping ? ' and loops back' : ''}`]);
          stops.forEach((st) => rows.push([cmd, `${(ACTION_NAMES[st.action] || st.action).toLowerCase()}${st.amount ? ' ' + st.amount : ''} here`]));
        });
        return h('div', { class: 'sec' }, h('b', {}, 'Supply lines'),
          rows.length ? rows.map(([cmd, what]) => h('div', { class: 'line' }, h('span', {}, cmd.name), h('span', {}, what)))
            : h('div', { class: 'empty' }, 'No route runs through this castle. Give a commander a looping route to feed it.'));
      };

      const castleHistory = (t) => {
        const box = h('div', { class: 'sec chron' }, h('h4', {}, `History of ${t.name}`), h('div', { class: 'chron-body' }, h('div', { class: 'empty' }, 'Reading the records...')));
        ms.chist = ms.chist || new Map();
        const paint = (entries) => {
          const body = box.querySelector('.chron-body');
          if (!body) return;
          const draw = (all) => body.replaceChildren(...[
            ...(entries.length ? (all ? entries : entries.slice(0, 10)).map((e) => h('div', { class: 'chron-row' }, h('span', { class: 'ct' }, `Tick ${e.tick}`), h('span', {}, e.text))) : [h('div', { class: 'empty' }, 'Nothing you know of has happened here yet.')]),
            !all && entries.length > 10 ? h('button', { type: 'button', class: 'link', onclick: () => draw(true) }, `Show all ${entries.length}`) : null].filter(Boolean));
          draw(false);
        };
        const hit = ms.chist.get(t.id);
        if (hit) paint(hit.entries);
        if (!hit || Date.now() - hit.at > 20000) {
          Promise.all([
            sb.from('battle_reports').select('tick,kind,winner:report->winner,captured:report->captured,sides:report->sides').eq('game_id', gameId).eq('territory_id', t.id).order('tick', { ascending: false }).limit(30),
            sb.from('game_moments').select('tick,type,payload').eq('game_id', gameId).in('type', ['castle_captured', 'siege_started', 'siege_lifted']).filter('payload->>territory_id', 'eq', String(t.id)).order('tick', { ascending: false }).limit(40),
          ]).then(([br, mo]) => {
            const out = [];
            const capturedTicks = new Set();
            (br.data || []).forEach((b) => {
              const [a, d] = b.sides || [];
              if (!a || !d) return;
              const lead = (a.commanders || []).slice(0, 2).map((x) => x.name).join(' and ');
              const att = a.player_id ? `House ${houseOf(a.player_id)}` : 'An army';
              const def = d.player_id ? `House ${houseOf(d.player_id)}` : 'the free garrison';
              if (b.kind === 'assault') {
                if (b.captured) { capturedTicks.add(b.tick); out.push({ tick: b.tick, text: `${att} took it from ${def}${lead ? `, led by ${lead}` : ''}.` }); }
                else if (Number(b.winner) === 1) out.push({ tick: b.tick, text: `${def} held it against ${att}${lead ? ` and ${lead}` : ''}.` });
                else out.push({ tick: b.tick, text: `${att} beat the defenders${lead ? `, led by ${lead}` : ''}.` });
              } else if (b.kind === 'sally') {
                out.push({ tick: b.tick, text: Number(b.winner) === 0 ? `A sally broke the siege laid by ${d.player_id ? `House ${houseOf(d.player_id)}` : 'the besiegers'}.` : `A sally from the castle was driven back by ${d.player_id ? `House ${houseOf(d.player_id)}` : 'the besiegers'}.` });
              }
            });
            (mo.data || []).forEach((m) => {
              const pl = m.payload || {};
              if (m.type === 'castle_captured' && !capturedTicks.has(m.tick)) out.push({ tick: m.tick, text: `${pl.to_player_id ? `House ${houseOf(pl.to_player_id)}` : 'An army'} took it from ${pl.from_player_id ? `House ${houseOf(pl.from_player_id)}` : 'the free garrison'}.` });
              if (m.type === 'siege_started') out.push({ tick: m.tick, text: `${pl.by_player_id ? `House ${houseOf(pl.by_player_id)}` : 'An army'} laid siege to it.` });
              if (m.type === 'siege_lifted') out.push({ tick: m.tick, text: pl.by === 'sally' ? 'The siege was broken by a sally.' : 'The siege was lifted.' });
            });
            out.sort((x, y) => y.tick - x.tick);
            ms.chist.set(t.id, { at: Date.now(), entries: out });
            paint(out);
          });
        }
        return box;
      };
      const cmdRow = (c) => h('button', { class: 'cmdrow', onclick: () => select('c', c.id) },
        cmdCard(c, { faction: slugOf(c.owner_player_id) }),
        `${c.role === 'king' ? '♛ ' : ''}${c.name}`,
        h('span', { style: 'color:var(--dim);margin-left:auto' }, `R${rankOf(c)} · ${c.troops}`));

      const momentText = (m) => {
        const p = m.payload;
        switch (m.type) {
          case 'game_started': return 'The realms are drawn. The game begins.';
          case 'war_declared': return `${pname(p.by_player_id)} ${p.how === 'declared' ? 'declared war on' : 'and'} ${pname(p.against_player_id)}${p.how === 'declared' ? '' : ' are at war'}${p.how === 'alliance_broken' ? ' after a broken alliance' : p.how === 'declared' ? '' : ' after the first attack'}`;
          case 'nap_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} signed a non-aggression pact`;
          case 'nap_broken': return `${pname(p.by_player_id)} broke the non-aggression pact with ${pname(p.against_player_id)}`;
          case 'marriage_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} sealed a marriage alliance until tick ${p.until_tick}`;
          case 'world_event': return p.kind === 'plague' ? `Plague breaks out at ${p.territory}` : p.kind === 'rebellion' ? `Unrest at ${p.territory}` : p.kind === 'harvest' ? `A bumper harvest at ${p.territory} (+${p.gold} gold)` : 'A comet crosses the sky; every realm gains prestige';
          case 'commander_captured': return `${p.name} (${pname(p.owner_player_id)}) was captured by ${pname(p.captor_player_id)}`;
          case 'captive_executed': return `${pname(p.by_player_id)} executed the captive ${p.name}`;
          case 'trade_agreed': return `${pname(p.player_a)} and ${pname(p.player_b)} agreed a trade deal`;
          case 'mediation_succeeded': return `${pname(p.mediator)} brokered a truce between ${pname(p.player_a)} and ${pname(p.player_b)}`;
          case 'alliance_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} formed an alliance`;
          case 'truce_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} agreed a truce until tick ${p.ends_tick}`;
          case 'truce_ended': return `The truce between ${pname(p.player_a)} and ${pname(p.player_b)} has ended`;
          case 'alliance_broken': return `${pname(p.by_player_id)} broke the alliance with ${pname(p.against_player_id)}`;
          case 'castle_captured': return `${pname(p.to_player_id)} captured ${p.territory}${p.from_player_id ? ' from ' + pname(p.from_player_id) : ''}`;
          case 'castle_abandoned': return `${pname(p.player_id)} abandoned ${p.territory}`;
          case 'siege_started': return `${pname(p.by_player_id)} laid siege to ${p.territory}`;
          case 'siege_lifted': return `The siege of ${p.territory} was lifted ${p.by === 'sally' ? 'by a sally' : 'by relief forces'}`;
          case 'king_killed': return `${p.name}, king of ${pname(p.player_id)}, was killed`;
          case 'player_eliminated': return `${pname(p.player_id)} was eliminated`;
          case 'game_won': return `${pname(p.player_id)} won the game${p.reason === 'time_limit' ? ' at the time limit' : ''}`;
          default: return m.type.replace(/_/g, ' ');
        }
      };

      const markRead = async () => {
        const ids = ms.inbox.filter((i) => !i.is_read).map((i) => i.id);
        if (!ids.length) return;
        ms.newIds = new Set(ids);
        ms.inbox.forEach((i) => { i.is_read = true; });
        await sb.from('player_inbox').update({ is_read: true }).in('id', ids);
      };

      const sideTabs = () => {
        const unread = ms.inbox.filter((i) => !i.is_read).length + battlesUnread();
        const tab = (k, label) => h('button', {
          class: ms.tab === k ? 'on' : '',
          onclick: async () => {
            if (k === 'info' && ms.tab === 'info' && ms.sel) { ms.sel = null; ms.marching = false; ms.preview = null; ms.stops = []; ms.loop = false; render(); }
            ms.tab = k;
            if (k === 'inbox') await markRead();
            drawSide();
            drawHud();
          },
        }, label);
        const chatN = chatUnread() + [...ms.threads.values()].filter(threadUnread).length;
        return h('div', { class: 'tabs' }, tab('info', 'Info'), tab('news', 'News'), tab('inbox', `Inbox${unread ? ` (${unread})` : ''}`), tab('chat', `Chat${chatN && !(ms.tab === 'chat') ? ` (${chatN})` : ''}`));
      };

      const threadUnread = (t) => t.msgs.some((m) => m.player_id !== ms.me.id && (!t.read || Date.parse(m.created_at) > Date.parse(t.read)));
      const chatUnread = () => ms.chat.filter((m) => m.player_id !== ms.me.id && !ms.muted.has(m.player_id) && m.id > ms.chatSeen).length;

      const markChatSeen = () => {
        const top = ms.chat.length ? ms.chat[ms.chat.length - 1].id : 0;
        if (top <= ms.chatSeen) return;
        ms.chatSeen = top;
        try { localStorage.setItem(chatSeenKey, String(top)); } catch {}
      };

      const markThreadRead = (t) => {
        if (!threadUnread(t)) return;
        t.read = new Date().toISOString();
        sb.from('thread_participants').update({ last_read_at: t.read }).eq('thread_id', t.id).eq('player_id', ms.me.id).then(() => {});
      };

      const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const readable = (pid) => {
        const c = color(pid);
        const n = parseInt(c.slice(1), 16);
        const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
        return lum < 0.3 ? color2(pid) : c;
      };

      const setMuted = (pid, on) => {
        if (on) ms.muted.add(pid); else ms.muted.delete(pid);
        try { localStorage.setItem(mutedKey, JSON.stringify([...ms.muted])); } catch {}
        drawSide();
      };

      const chatLine = (pid, text, at, subject) => (ms.muted.has(pid) ? null : h('div', { class: 'chatline' },
        subject ? h('div', { class: 'tsubj' }, subject) : null,
        h('b', { style: `color:${readable(pid)};font-weight:bold` }, `${pname(pid)}: `), text, h('small', {}, fmtTime(at)),
        ...(pid !== ms.me.id && !(ms.players.get(pid) || {}).is_ai ? [h('button', { class: 'link', style: 'margin-left:6px', onclick: () => setMuted(pid, true) }, 'mute')] : [])));

      const mutedBar = () => (ms.muted.size
        ? h('div', { class: 'meta', style: 'color:var(--dim);margin-top:8px' }, 'Muted: ',
          ...[...ms.muted].map((pid) => h('button', { class: 'link', style: 'margin-right:8px', onclick: () => setMuted(pid, false) }, `${pname(pid)} (unmute)`)))
        : null);

      const threadTitle = (t) => t.parts.filter((id) => id !== ms.me.id).map(pname).join(', ') || 'Just you';

      const composer = (input, onSend) => h('form', { class: 'composer', onsubmit: (e) => { e.preventDefault(); onSend(); } },
        input, h('button', { type: 'submit', class: 'primary' }, 'Send'));

      const sendGeneral = async () => {
        const text = ms.chatInput.value.trim();
        if (!text) return;
        ms.chatInput.value = '';
        const { error } = await sb.rpc('send_chat_message', { p_game_id: gameId, p_message: text });
        if (error) { ms.chatInput.value = text; toast(error.message); return; }
        await load();
      };

      const sendInThread = async (t) => {
        const text = ms.threadInput.value.trim();
        if (!text) return;
        ms.threadInput.value = '';
        const { error } = await sb.rpc('send_thread_message', { p_thread_id: t.id, p_body: text });
        if (error) { ms.threadInput.value = text; toast(error.message); return; }
        await load();
      };

      const openDm = (pid) => {
        const want = [ms.me.id, pid].sort((a, b) => a - b).join(',');
        const t = [...ms.threads.values()].find((x) => [...x.parts].sort((a, b) => a - b).join(',') === want);
        ms.tab = 'chat';
        ms.chatTab = 'messages';
        ms.thread = t ? t.id : null;
        ms.compose = t ? null : { ids: new Set([pid]) };
        drawSide();
      };

      const chatView = () => {
        const nThreads = [...ms.threads.values()].filter(threadUnread).length;
        const sub = (k, label) => h('button', {
          class: ms.chatTab === k ? 'primary' : '',
          onclick: () => { ms.chatTab = k; ms.thread = null; ms.compose = null; drawSide(); },

        const ly = e.clientY - box.top;
        const k = Math.min(W / view.w, H / view.h);

      svg.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 2) return;
        const mid = { clientX: (e.touches[0].clientX + e.touches[1].clientX) / 2, clientY: (e.touches[0].clientY + e.touches[1].clientY) / 2 };
        pinch = { d: touchDist(e.touches), view: { ...ms.view }, at: toMap(mid) };
        ms.dragged = true;
      }, { passive: true });
      svg.addEventListener('touchmove', (e) => {
        if (!pinch || e.touches.length !== 2) return;
        e.preventDefault();
        const nw = Math.min(ms.full.w * 1.04, Math.max(ms.full.w / 40, pinch.view.w * (pinch.d / touchDist(e.touches))));
        const k = nw / pinch.view.w;
        ms.view = clampView({ x: pinch.at.x - (pinch.at.x - pinch.view.x) * k, y: pinch.at.y - (pinch.at.y - pinch.view.y) * k, w: nw, h: pinch.view.h * k });
        applyView();
      }, { passive: false });
      svg.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) pinch = null;
        setTimeout(() => { ms.dragged = false; }, 0);
      }, { passive: true });

      svg.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        const start = { x: e.clientX, y: e.clientY, view: { ...ms.view }, at: toMapWith(ms.view, e) };
        ms.dragged = false;
        const move = (ev) => {
          if (pinch) return;
          const dx = ev.clientX - start.x;
          const dy = ev.clientY - start.y;
          if (Math.hypot(dx, dy) > 4) ms.dragged = true;
          if (!ms.dragged) return;
          const now = toMapWith(start.view, ev);
          ms.view = clampView({ ...start.view, x: start.view.x + start.at.x - now.x, y: start.view.y + start.at.y - now.y });
          applyView();
        };
        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          setTimeout(() => { ms.dragged = false; }, 0);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      });

      svg.addEventListener('click', (e) => {
        if (e.target === svg) select(null);
      });

      let firstLoad = true;
      const LITE_FETCH = new Set([0, 1, 2, 3, 8, 9]);
      const load = async (opts = {}) => {
        if (state.view !== 'map' || state.roomId !== gameId) return;
        if (ms.jumping && !opts.force) return;
        const lite = !!opts.lite && !!ms.lastRes;
        const fetchers = [
          () => sb.rpc('get_game_view', { p_game_id: gameId }),
          () => sb.from('game_moments').select('*').eq('game_id', gameId).order('id', { ascending: false }).limit(100),
          () => sb.from('player_inbox').select('*').eq('game_id', gameId).order('id', { ascending: false }).limit(100),
          () => sb.from('battle_reports').select('*').eq('game_id', gameId).order('id', { ascending: false }).limit(100),
          () => sb.from('game_chat').select('*').eq('game_id', gameId).order('id', { ascending: false }).limit(150),
          () => sb.from('message_threads').select('*').eq('game_id', gameId),
          () => sb.from('thread_participants').select('*').eq('game_id', gameId),
          () => (ms.edgesAll && !ms.fogDark ? Promise.resolve({ data: ms.edgesAll }) : sb.rpc('get_game_edges', { p_game_id: gameId })),
          () => sb.rpc('my_diplomacy_offers', { p_game_id: gameId }),
          () => sb.rpc('my_world_events', { p_game_id: gameId }),
          () => Promise.resolve({ data: [] }),
        ];
        const res = await Promise.all(fetchers.map((f, i) => (lite && !LITE_FETCH.has(i) ? Promise.resolve(ms.lastRes[i]) : f())));
        ms.lastRes = res;
        if (state.view !== 'map' || state.roomId !== gameId) return;

        const [vw, mo, ib, br, ch, th, pt, ed, of, we, cn] = res;
        if (vw.error && vw.error.message.includes('not in this game')) { toast('That game is no longer available.'); return showHome(); }
        const failed = res.find((r) => r.error);
        if (failed) {
          if (!ms.loadRetry) {
            ms.loadRetry = true;
            setTimeout(() => { ms.loadRetry = false; load({ force: true }); }, 3000);
          }
          if (!ms.lastRes || !ms.game) toast(failed.error.message);
          return;
        }
        const view = vw.data;
        const threadIds = th.data.map((t) => t.id);
        const tm = lite && ms.lastTm ? ms.lastTm : threadIds.length
          ? await sb.from('thread_messages').select('*').in('thread_id', threadIds).order('id', { ascending: false }).limit(500)
          : { data: [] };
        ms.lastTm = tm;
        if (tm.error) { toast(tm.error.message); return; }
        if (state.view !== 'map' || state.roomId !== gameId) return;
        const prevTick = ms.game ? ms.game.current_tick : null;
        const prevBattle = ms.battles && ms.battles.length ? Math.max(...ms.battles.map((b) => b.id)) : null;
        ms.game = view.game;
        ms.players = new Map(view.players.map((p) => [p.id, p]));
        ms.me = ms.players.get(view.me);
        if (ms.me) setHouse(factionOf(ms.me.faction_slug));
        const prevOwn = ms.t && !ms.replay && ms.me ? new Map([...ms.t].map(([id, t]) => [id, t.owner_player_id])) : null;
        ms.t = new Map(view.territories.map((t) => [t.id, t]));
        if (prevOwn && ms.me) {
          let gained = 0;
          let lostN = 0;
          ms.lost = ms.lost || new Set();
          ms.t.forEach((t, id) => {
            const was = prevOwn.get(id);
            if (t.owner_player_id === ms.me.id) ms.lost.delete(id);
            if (was === undefined || was === t.owner_player_id) return;
            if (t.owner_player_id === ms.me.id) gained++;
            else if (was === ms.me.id) { lostN++; ms.lost.add(id); }
          });
          if (lostN) Sfx.lost(); else if (gained) Sfx.fanfare();
        }
        ms.standings = view.standings;
        ms.serverSources = view.sources;
        ms.winAt = view.win_at;
        ms.explored = view.explored || null;
        if (ms.cmd && ms.cmd.length && !ms.replay && ms.me) {
          const before = new Map(ms.cmd.map((c) => [c.id, c]));
          const arrived = [];
          view.commanders.forEach((c) => {
            const old = before.get(c.id);
            if (old && c.owner_player_id === ms.me.id && old.status === 'moving' && (c.status === 'idle' || c.status === 'sieging') && c.current_territory_id) {
              const dest = ms.t.get(c.current_territory_id);
              ms.arrivedKeys = ms.arrivedKeys || new Set();
              const akey = `${c.id}:${c.current_territory_id}:${c.status}:${view.game.current_tick}`;
              if (ms.arrivedKeys.has(akey)) return;
              ms.arrivedKeys.add(akey);
              arrived.push(`${c.name} ${c.status === 'sieging' ? 'laid siege to' : 'reached'} ${dest ? dest.name : 'a castle'}`);
            }
          });
          if (arrived.length) { toast(arrived.slice(0, 2).join('. ') + (arrived.length > 2 ? ` and ${arrived.length - 2} more` : ''), true); Sfx.bell(); }
        }
        ms.cmd = view.commanders;
        ms.captives = view.captives || [];
        ms.abil = new Map();
        view.abilities.forEach((a) => {
          const m = ms.abil.get(a.commander_id) || {};
          m[a.ability] = a.level;
          ms.abil.set(a.commander_id, m);
        });
        ms.mov = new Map(view.movements.map((m) => [m.commander_id, m]));
        ms.areas = view.areas;
        ms.wl = (view.areas.find((a) => a.area === 'watchtowers') || { level: 0 }).level;
        ms.dip = view.diplomacy;
        ms.offers = of.data.offers;
        ms.worldEvents = we.data;
        ms.council = cn.data;
        ms.deals = of.data.deals;
        ms.locks = of.data.locks;
        ms.moments = mo.data;
        ms.inbox = ib.data;
        ms.battles = br.data;
        if (prevTick !== null && view.game.current_tick > prevTick) Sfx.bell();
        if (prevBattle !== null && br.data.some((b) => b.id > prevBattle)) setTimeout(Sfx.horn, 700);
        if (prevBattle !== null && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          br.data.filter((b) => b.id > prevBattle).slice(0, 3).forEach((b) => {
            const r = b.report;
            const [sa, sb2] = r.sides;
            const where = b.territory_id ? ms.t.get(b.territory_id) : (r.location ? { x: r.location.x, y: r.location.y } : null);
            if (!where || !sa || !sb2) return;
            const cols = (pid) => (pid && ms.players.get(pid) ? [color(pid), color2(pid)] : ['#8a8478', '#5a574f']);
            let at = { x: where.x, y: where.y };
            let angle = 0;
            const camped = b.territory_id && ms.sgStart && ms.sgStart.has(b.territory_id);
            if (camped && ms.view3d && ms.m3) {
              const e = ms.m3.siegeEdge(b.territory_id);
              if (e) { at = { x: e.x, y: e.z }; angle = e.angle; }
            } else if (camped) {
              const tt = ms.t.get(b.territory_id);
              const Wp = (tt.tier || 1) >= 3 ? 64 : (tt.tier || 1) === 2 ? 50 : 36;
              at = { x: where.x + Wp * 1.0 * M() * 1.3, y: where.y + Wp * 0.18 * M() * 1.3 };
            }
            const spec = { x: at.x, y: at.y, angle, colA: cols(sa.player_id), colB: cols(sb2.player_id), winner: Number(r.winner), tierA: armyTier(sa.troops), tierB: armyTier(sb2.troops) };
            if (ms.view3d && ms.m3) ms.m3.playBattle({ x: spec.x, z: spec.y, angle: spec.angle, colA: spec.colA, colB: spec.colB, winner: spec.winner, tierA: spec.tierA, tierB: spec.tierB });
            else ms.fx = (ms.fx || []).concat([{ ...spec, t0: Date.now() }]).slice(-6);
          });
        }
        if (view.game.tick_speed === 'turn_based' && view.game.status === 'active') {
          const ts = await sb.rpc('turn_status', { p_game_id: gameId });
          ms.turn = ts.data || null;
        } else {
          ms.turn = null;
        }
        if (!ms.repAt || Date.now() - ms.repAt > 60000 || ms.tab === 'info' && !ms.sel && Date.now() - ms.repAt > 20000) {
          const repRes = await sb.rpc('player_reputations', { p_game_id: gameId });
          ms.repAt = Date.now();
          ms.profiles = new Map((repRes.data || []).map((x) => [x.player_id, x]));
          const rgRes = await sb.rpc('regards', { p_game_id: gameId });
          ms.regard = rgRes.error ? null : rgRes.data;
        }
        ms.chat = ch.data.slice().reverse();
        ms.threads = new Map(th.data.map((t) => [t.id, { id: t.id, parts: [], msgs: [], read: null }]));
        pt.data.forEach((x) => {
          const t = ms.threads.get(x.thread_id);
          if (!t) return;
          t.parts.push(x.player_id);
          if (x.player_id === ms.me.id) t.read = x.last_read_at;
        });
        tm.data.slice().reverse().forEach((m) => {
          const t = ms.threads.get(m.thread_id);
          if (t) t.msgs.push(m);
        });
        if (!ms.notes) await loadNotes();
        if (view.game.status === 'finished' && !ms.storyShown) {
          ms.storyShown = true;
          try {
            const sk = `ss-story-${gameId}`;
            if (!localStorage.getItem(sk)) { localStorage.setItem(sk, '1'); setTimeout(() => storyDialog(gameId), 1500); }
          } catch {}
        }
        ms.routes = new Map();
        view.routes.sort((a, b) => a.id - b.id).forEach((r) => ms.routes.set(r.commander_id, r));
        const firstEdges = !ms.edgesAll;
        ms.fogDark = !!view.game.fog_dark;
        if (firstEdges || ms.fogDark) ms.edgesAll = ed.data;
        ms.edges = ms.edgesAll.filter((e) => ms.t.has(e.from_territory_id) && ms.t.has(e.to_territory_id));
        if (firstEdges) {
          const artRow = await sb.from('games').select('map_art').eq('id', gameId).maybeSingle();
          ms.art = artRow.data && artRow.data.map_art ? artRow.data.map_art : null;
          if (ms.art) initTerrain();
          else ms.cells = voronoiCells([...ms.t.values()].filter((t) => !t.is_junction), view.game.map_w, view.game.map_h);
        }
        if (firstLoad) {
          firstLoad = false;
          const sc = (view.game && view.game.world_scale) || 1;
          const castles = [...ms.t.values()].filter((t) => !t.is_junction);
          const xs = castles.map((t) => t.x), ys = castles.map((t) => t.y);
          const pad = 250 * sc;
          const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
          const side = Math.max(Math.max(...xs) + pad - x0, Math.max(...ys) + pad - y0);
          ms.full = { x: x0 - (side - (Math.max(...xs) + pad - x0)) / 2, y: y0 - (side - (Math.max(...ys) + pad - y0)) / 2, w: side, h: side };
          ms.view = { ...ms.full };
          ms.goHome = () => {
            const mine = [...ms.t.values()].filter((t) => !t.is_junction && ms.me && t.owner_player_id === ms.me.id);
            const cap = ms.me && ms.t.get(ms.me.capital_territory_id);
            const pts = mine.length ? mine : cap ? [cap] : [];
            const viewW = 150 * 6 * sc;
            if (pts.length && ms.full.w > viewW * 1.1) {
              const px = pts.map((t) => t.x), py = pts.map((t) => t.y);
              const cx = (Math.min(...px) + Math.max(...px)) / 2, cy = (Math.min(...py) + Math.max(...py)) / 2;
              const w = Math.max(viewW, Math.max(Math.max(...px) - Math.min(...px), Math.max(...py) - Math.min(...py)) * 1.6 + 300 * sc);
              ms.view = { x: cx - w / 2, y: cy - w / 2, w, h: w };
            } else ms.view = { ...ms.full };
            if (ms.view3d && ms.m3 && cap) ms.m3.focus(cap.id, 3200);
            applyView();
          };
          ms.focusOn = (id) => {
            const t = ms.t.get(id);
            if (!t) return;
            if (ms.view3d && ms.m3) ms.m3.focus(id, 1100);
            else { const w = Math.min(ms.view.w, 150 * 5 * sc); ms.view = { x: t.x - w / 2, y: t.y - w / 2, w, h: w }; applyView(); }
          };
          ms.goHome();
          try {
            const key = `ss-lastseen-${gameId}`;
            const prev = Number(localStorage.getItem(key));
            const nowTick = view.game.current_tick;
            if (prev && nowTick - prev >= 4 && view.game.status === 'active') {
              const inbox = (ms.inbox || []).filter((i) => i.tick > prev);
              const fights = (ms.battles || []).filter((b) => b.tick > prev);
              const news = (ms.moments || []).filter((m) => m.tick > prev && ['castle_captured', 'siege_started', 'war_declared', 'alliance_formed', 'player_eliminated'].includes(m.type));
              if (inbox.length || fights.length || news.length) {
                setTimeout(() => modal(`Since you were last here (tick ${prev} to ${nowTick})`, h('div', {},
                  h('div', { class: 'tip', style: 'margin:0 0 8px' }, `${pluralN(nowTick - prev, 'tick')} have passed. ${pluralN(fights.length, 'battle')} involved you, ${pluralN(news.length, 'notable event')} happened in the realm, and ${pluralN(inbox.length, 'report')} arrived.`),
                  h('div', { class: 'sec' }, h('b', {}, 'Latest')), inbox.slice(0, 6).map((i) => feedRow(i.tick, i.title, false)), news.slice(0, 5).map((m) => feedRow(m.tick, momentText(m), false))), (close) => [h('button', { class: 'primary', onclick: close }, 'Continue')]), 700);
              }
            }
            window.addEventListener('beforeunload', () => { try { localStorage.setItem(key, String(ms.game.current_tick)); } catch {} });
            state.cleanup.push(() => { try { localStorage.setItem(key, String(ms.game.current_tick)); } catch {} });
          } catch {}
        }
        render();
        drawSide();
      };

      await load();

      let debounce = null;
      const kick = () => { clearTimeout(debounce); debounce = setTimeout(load, 300); };
      const unwatch = watchGame(gameId, kick);
      const f = `game_id=eq.${gameId}`;
      let channel = sb.channel('map-data-' + gameId);
      ['diplomacy', 'realm_areas', 'game_moments', 'player_inbox', 'game_chat'].forEach((table) => {
        channel = channel.on('postgres_changes', { event: '*', schema: 'public', table, filter: f }, kick);
      });
      channel = channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'thread_messages' }, kick);
      channel.subscribe();
      let animStep = 0;
      const tickTimer = setInterval(() => {
        if (!ms.game) return;
        animStep = (animStep + 1) % 4;
        if (ms.mov.size || animStep === 0) renderDyn();
        if (animStep === 0) updateCountdown();
      }, 250);
      const fxTimer = setInterval(() => { if (ms.fx && ms.fx.length && !ms.view3d) renderDyn(); }, 90);
      const loadTimer = setInterval(load, 20000);
      try { if (!TOUCH_DEVICE && localStorage.getItem('ss-view3d') === '1' && ms.art) toggle3D(); } catch {}
      const onKey = (e) => {
        if (e.key !== 'Escape' || document.activeElement instanceof HTMLInputElement) return;
        if (ms.marching) { ms.marching = false; ms.preview = null; ms.stops = []; ms.loop = false; render(); drawSide(); }
        else if (ms.sel) select(null);
      };
      window.addEventListener('keydown', onKey);
      state.cleanup.push(() => { window.removeEventListener('keydown', onKey); clearTimeout(debounce); clearInterval(tickTimer); clearInterval(fxTimer); clearInterval(loadTimer); unwatch(); sb.removeChannel(channel); });
    }

    async function onSession(session, event) {
      state.session = session;
      if (!session) {
        clearCleanup();
        state.profile = null;
        state.view = 'auth';
        if (DEV_GUEST && await startGuest()) return;
        renderAuth(false);
        return;
      }
      if (event === 'PASSWORD_RECOVERY') {
        state.view = 'recovery';
        renderAuth(true);
        return;
      }
      if (state.view === 'recovery') return;
      if (['home', 'room', 'map', 'create', 'picking'].includes(state.view)) return;
      await loadProfile();
      await showHome();
    }

    initStage();

    sb.auth.onAuthStateChange((event, session) => {
      setTimeout(() => onSession(session, event), 0);
    });

    sb.auth.getSession().then(async ({ data }) => {
      if (data.session) return;
      if (DEV_GUEST && await startGuest()) return;
      renderAuth(false);
    });
  </script>
</body>
</html>
