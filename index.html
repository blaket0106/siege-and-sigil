    function h(tag, props, ...kids) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(props || {})) {
        if (v === undefined || v === null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else if (k === 'value') el.value = v;
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
      for (const kid of kids.flat()) {
        if (kid === null || kid === undefined || kid === false) continue;
        el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      }
      return el;
    }

    function patchKeyed(host, items) {
      const cur = new Map([...host.children].map((el) => [el.dataset.k, el]));
      const next = items.filter(Boolean).map((it) => {
        const old = cur.get(it.key);
        if (old && old.dataset.sig === it.sig) return old;
        const el = it.build();
        el.dataset.k = it.key;
        el.dataset.sig = it.sig;
        return el;
      });
      const kids = [...host.children];
      if (next.length === kids.length && next.every((n, i) => n === kids[i])) return;
      host.replaceChildren(...next);
    }

    function toast(message, ok, action) {
      const host = document.getElementById('toasts');
      const t = h('div', { class: 'toast' + (ok ? ' ok' : ''), role: 'status' }, h('span', {}, message),
        action ? h('button', { type: 'button', class: 'small', onclick: () => { t.remove(); action.fn(); } }, action.label) : null,

      if (ok) Sfx.ok(); else Sfx.bad();
      while (host.children.length >= 3) host.firstChild.remove();
      host.append(t);
      setTimeout(() => t.remove(), action ? 12000 : 5500);
    }

    function confirmDialog(message, label, opts = {}) {
      return new Promise((resolve) => {
        const title = opts.title || (message.length > 60 ? message.slice(0, message.indexOf('?') + 1 || 60) : message);
        const body = message.length > 60 ? message.slice(title.length).trim() : '';

        const finish = (ok, close) => { if (done) return; done = true; close(); resolve(ok); };
        const close = modal(title, h('div', { class: 'confirm-box' }, body ? h('p', {}, body) : null), (c) => [
          h('button', { class: 'ghost', onclick: () => finish(false, c) }, opts.cancel || 'Keep as is'),
          h('button', { class: opts.safe ? 'primary' : 'danger', onclick: () => finish(true, c) }, label || 'Continue'),

    const Sfx = (() => {
      let ac = null;
      let master = null;
      let pad = null;
      let on = true;
      let music = true;
      try { on = localStorage.getItem('ss-sound') !== '0'; music = localStorage.getItem('ss-music') !== '0'; } catch {}
      const ensure = () => {
        if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = on ? 0.9 : 0;
        const comp = ac.createDynamicsCompressor();
        master.connect(comp);
        comp.connect(ac.destination);
        return ac;
      };
      const tone = (freq, dur, o = {}) => {
        if (!on || !ensure()) return;
        const t0 = ac.currentTime + (o.at || 0);
        const osc = ac.createOscillator();
        const g = ac.createGain();
        const f = ac.createBiquadFilter();
        osc.type = o.type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t0 + dur);
        f.type = 'lowpass';
        f.frequency.value = o.cut || 6000;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t0 + (o.attack || 0.006));
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(f); f.connect(g); g.connect(master);
        osc.start(t0); osc.stop(t0 + dur + 0.05);
      };
      const noise = (dur, o = {}) => {
        if (!on || !ensure()) return;
        const t0 = ac.currentTime + (o.at || 0);
        const buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        const src = ac.createBufferSource();
        src.buffer = buf;
        const f = ac.createBiquadFilter();
        f.type = 'bandpass';
        f.frequency.value = o.freq || 2000;
        const g = ac.createGain();
        g.gain.value = o.vol || 0.1;
        src.connect(f); f.connect(g); g.connect(master);
        src.start(t0);
      };
      const startMusic = () => {
        if (pad || !music || !ensure()) return;
        const out = ac.createGain();
        out.gain.value = 0.0001;
        out.gain.exponentialRampToValueAtTime(0.05, ac.currentTime + 6);
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 520;
        const lfo = ac.createOscillator();
        const lfoG = ac.createGain();
        lfo.frequency.value = 0.06;
        lfoG.gain.value = 220;
        lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
        const roots = [110, 98, 123.47, 87.31];
        const oscs = [];
        [1, 1.5, 2, 3].forEach((m, i) => {
          [-5, 5].forEach((det) => {
            const o = ac.createOscillator();
            o.type = i < 2 ? 'sawtooth' : 'triangle';
            o.frequency.value = roots[0] * m;
            o.detune.value = det;
            const g = ac.createGain();
            g.gain.value = i < 2 ? 0.5 : 0.25;
            o.connect(g); g.connect(lp); o.start();
            oscs.push({ o, m });
          });
        });
        lp.connect(out); out.connect(master);
        let step = 0;
        const timer = setInterval(() => {
          step = (step + 1) % roots.length;
          oscs.forEach(({ o, m }) => o.frequency.setTargetAtTime(roots[step] * m, ac.currentTime, 3));
        }, 14000);
        pad = { out, timer, oscs };
      };
      const stopMusic = () => {
        if (!pad) return;
        clearInterval(pad.timer);
        const p = pad;
        pad = null;
        p.out.gain.setTargetAtTime(0.0001, ac.currentTime, 0.6);
        setTimeout(() => p.oscs.forEach(({ o }) => { try { o.stop(); } catch {} }), 2500);
      };
      return {
        get on() { return on; },
        get music() { return music; },
        click: () => { tone(900, 0.05, { type: 'triangle', vol: 0.07 }); noise(0.03, { freq: 3500, vol: 0.05 }); },
        ok: () => { tone(523.25, 0.18, { type: 'triangle', vol: 0.12 }); tone(783.99, 0.28, { type: 'triangle', vol: 0.1, at: 0.08 }); },
        bad: () => { tone(150, 0.28, { type: 'sawtooth', vol: 0.13, slide: 90, cut: 700 }); },
        bell: () => { [1, 2.4, 3.9].forEach((m, i) => tone(329.63 * m, 2.2 - i * 0.5, { vol: 0.14 / (i + 1), attack: 0.004 })); },
        fanfare: () => { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.32, { type: 'triangle', vol: 0.12, at: i * 0.1, attack: 0.01 })); },
        lost: () => { [392, 311.13, 233.08].forEach((f, i) => tone(f, 0.45, { type: 'sawtooth', vol: 0.09, at: i * 0.16, cut: 800 })); },
        alarm: () => { [0, 0.28, 0.56].forEach((at) => tone(740, 0.2, { type: 'square', vol: 0.06, at, cut: 1800 })); },
        horn: () => { tone(98, 1.5, { type: 'sawtooth', vol: 0.16, attack: 0.3, cut: 500 }); tone(147, 1.5, { type: 'sawtooth', vol: 0.1, attack: 0.35, cut: 500 }); },
        toggle: () => {
          on = !on;
          try { localStorage.setItem('ss-sound', on ? '1' : '0'); } catch {}
          ensure();
          if (master) master.gain.setTargetAtTime(on ? 0.9 : 0, ac.currentTime, 0.1);
          if (on) { startMusic(); tone(660, 0.12, { type: 'triangle', vol: 0.1 }); } else stopMusic();
          return on;
        },
        wake: () => { if (on) startMusic(); },
      };
    })();

    const stageFx = { embers: null, raf: 0, parts: [] };

    function stageEmbers(light) {
      const el = stageFx.embers;
      const ctx = el.getContext('2d');
      const resize = () => { el.width = window.innerWidth; el.height = window.innerHeight; };
      resize();
      stageFx.parts = Array.from({ length: light ? 28 : 46 }, () => ({ x: Math.random() * el.width, y: Math.random() * el.height, r: 0.6 + Math.random() * 1.8, v: 0.12 + Math.random() * 0.4, a: Math.random() * Math.PI * 2, s: 0.003 + Math.random() * 0.01 }));
      const frame = () => {
        stageFx.raf = requestAnimationFrame(frame);
        if (document.hidden || document.body.classList.contains('in-map')) return;
        if (el.width !== window.innerWidth || el.height !== window.innerHeight) resize();
        ctx.clearRect(0, 0, el.width, el.height);
        const dark = document.documentElement.getAttribute('data-theme') !== 'light';
        stageFx.parts.forEach((p) => {
          p.y -= p.v; p.a += p.s; p.x += Math.sin(p.a) * 0.35;
          if (p.y < -10) { p.y = el.height + 10; p.x = Math.random() * el.width; }
          const flick = 0.55 + 0.45 * Math.sin(p.a * 6);
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
          g.addColorStop(0, dark ? `rgba(255,190,90,${0.9 * flick})` : `rgba(110,80,30,${0.35 * flick})`);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 5, 0, Math.PI * 2); ctx.fill();
        });
      };
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) frame();
    }

      overlay.append(h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, h('h2', {}, title), body, h('div', { class: 'actions' }, actions(close))));
      document.body.append(overlay);
      const first = overlay.querySelector('input:not([type=checkbox]), select');
      if (first) first.focus();
      return close;

    function flightTrack(api, castles, altitude) {
      const N = 900;
      const M = 48;
      const blur = (arr, w, passes) => {
        let a = arr;
        for (let p = 0; p < passes; p++) {
          const out = new Array(N);
          for (let i = 0; i < N; i++) { let s = 0; for (let k = -w; k <= w; k++) s += a[(i + k + N) % N]; out[i] = s / (2 * w + 1); }
          a = out;
        }
        return a;
      };
      const mx = castles.reduce((s, q) => s + q.x, 0) / castles.length;
      const mz = castles.reduce((s, q) => s + q.z, 0) / castles.length;
      const sum = new Array(M).fill(0);
      const cnt = new Array(M).fill(0);
      let rAll = 0;
      castles.forEach((q) => {
        const r = Math.hypot(q.x - mx, q.z - mz);
        rAll += r;
        const k = Math.floor(((Math.atan2(q.z - mz, q.x - mx) + Math.PI) / (2 * Math.PI)) * M) % M;
        sum[k] += r; cnt[k] += 1;
      });
      rAll /= castles.length;
      let rad = sum.map((s, k) => (cnt[k] ? s / cnt[k] : rAll));
      for (let pass = 0; pass < 8; pass++) rad = rad.map((_, k) => (rad[(k + M - 2) % M] + 2 * rad[(k + M - 1) % M] + 3 * rad[k] + 2 * rad[(k + 1) % M] + rad[(k + 2) % M]) / 9);
      const rawX = [];
      const rawZ = [];
      for (let i = 0; i < N; i++) {
        const fb = (i / N) * M - 0.5;
        const k0 = Math.floor(fb);
        const fr = fb - k0;
        const rr = Math.max((rad[((k0 % M) + M) % M] * (1 - fr) + rad[(((k0 + 1) % M) + M) % M] * fr) * 0.92, rAll * 0.5);
        const ang = (i / N) * 2 * Math.PI - Math.PI;
        rawX.push(mx + rr * Math.cos(ang)); rawZ.push(mz + rr * Math.sin(ang));
      }
      const X = blur(rawX, 8, 2);
      const Z = blur(rawZ, 8, 2);
      const off = Math.min(300, rAll * 0.2);
      const CX = [];
      const CZ = [];
      for (let i = 0; i < N; i++) {
        const dx = X[(i + 8) % N] - X[(i - 8 + N) % N];
        const dz = Z[(i + 8) % N] - Z[(i - 8 + N) % N];
        const l = Math.hypot(dx, dz) || 1;
        CX.push(X[i] - (dz / l) * off); CZ.push(Z[i] + (dx / l) * off);
      }
      const lift = (x, z) => { let m = 0; for (const s of castles) { const d = Math.hypot(s.x - x, s.z - z); if (d < 650) m = Math.max(m, 230 * (1 - d / 650)); } return m; };
      const ahead = (i, n, drop) => api.groundAt(CX[(i + n) % N], CZ[(i + n) % N]) + lift(CX[(i + n) % N], CZ[(i + n) % N]) - drop;
      const gmax = CX.map((x, i) => Math.max(api.groundAt(x, CZ[i]) + lift(x, CZ[i]), ahead(i, 15, 20), ahead(i, 30, 40)));
      let Y = blur(gmax.map((g) => g + altitude), 55, 3);
      Y = blur(Y.map((y, i) => Math.max(y, gmax[i] + 120)), 25, 2);
      const len = CX.reduce((s, x, i) => s + Math.hypot(CX[(i + 1) % N] - x, CZ[(i + 1) % N] - CZ[i]), 0);
      return { N, CX, CZ, Y, LA: Math.round(N * 0.045), len };
    }

      let stopped = false;

        const seed0 = Math.floor(Math.random() * 2 ** 30) + 1;
        const layout = await loginWorld({ players: 3, mapSize: 'compact', startingTerritories: 4, style: 'scatter', startingGarrison: 10, scale: 2.6, freeTravel: false, shape: 'continent', richness: 'standard', randomRoads: 'none', starScatter: 'random', mirrored: false, trails: true, preset: presets[seed0 % 3], homeDistance: 'medium' }, seed0);

        const seats = ['kaldran', 'veyra', 'thornwick'];
        const sites = layout.territories.map((t, i) => ({ id: i, x: t.x, y: t.y, tier: t.tier, name: t.name, terrain: t.terrain, crossing_kind: t.crossing_kind || null, junction: !!t.junction, owner: null, troops: null, mine: false }));
        const edges = layout.edges.map((e) => ({ a: e.a, b: e.b, kind: e.kind, length: e.length, mult: e.move_cost_mult, path: e.path }));
        let track = null;
        let castles = [];
        let frames = 0;
        let t0 = 0;
        let checked = false;
        let label = '';
        const giveUp = () => { stopped = true; host.classList.remove('on'); setTimeout(() => { if (api) { try { api.dispose(); } catch {} api = null; } }, 2400); };
        const made = await createMap3D(host, {
          map_w: layout.map_w, art: layout.art, sites, edges, lowQuality: false,
          colors: (pid) => { const f = factionOf(seats[pid]); return [f.color, f.color2]; },
          sun: FLIGHT.sun, horizon: FLIGHT.horizon, fogMul: FLIGHT.fog, exposure: FLIGHT.exposure,
          onFrame: (t, dt, cam, controls) => {
            if (!track || stopped) return;
            if (!t0) t0 = performance.now();
            frames += 1;
            const el = performance.now() - t0;
            if (!checked && el > 6000) { checked = true; if ((frames * 1000) / el < 18) { giveUp(); return; } }
            controls.enabled = false; controls.maxPolarAngle = Math.PI * 0.62; controls.minDistance = 1;
            if (Math.abs(cam.fov - FLIGHT.fov) > 0.01) { cam.fov = FLIGHT.fov; cam.updateProjectionMatrix(); }
            const f = ((((t * FLIGHT.speed) / track.len) % 1) + 1) % 1 * track.N;
            const at = (arr, k) => { const i = Math.floor(k) % track.N; const j = (i + 1) % track.N; const r = k - Math.floor(k); return arr[i] * (1 - r) + arr[j] * r; };
            const px = at(track.CX, f); const pz = at(track.CZ, f); const py = at(track.Y, f);
            const lx = at(track.CX, f + track.LA); const lz = at(track.CZ, f + track.LA);
            const ly = py - Math.hypot(lx - px, lz - pz) * Math.tan(FLIGHT.pitch);
            cam.position.set(px, py, pz); cam.up.set(0, 1, 0); cam.lookAt(lx, ly, lz);
            controls.target.set(lx, Math.max(made.groundAt(lx, lz), 20), lz);
            let near = null; let nd = 1e9;
            for (const s of castles) { const d = Math.hypot(s.x - px, s.z - pz); if (d < nd) { nd = d; near = s; } }
            if (near && nd < 1500 && near.name !== label) {
              label = near.name;
              const owner = sites[near.id].owner;
              caption.replaceChildren(document.createTextNode(owner != null ? `LANDS OF HOUSE ${factionOf(seats[owner]).name.toUpperCase()}` : 'FREE HOLDING'), h('b', {}, near.name.toUpperCase()));
              caption.classList.add('on');
            } else if (nd >= 1800 && label) { label = ''; caption.classList.remove('on'); }
          },
        });
        api = made;
        if (!alive()) { try { made.dispose(); } catch {} api = null; return; }
        made.update(layout.territories.map((t, i) => ({ id: i, owner: t.owner_seat, troops: t.owner_seat != null ? 10 + (i % 7) * 3 : 12, mine: false })));
        castles = made.sites().filter((s) => !sites[s.id].crossing_kind && !sites[s.id].junction);
        track = flightTrack(made, castles, FLIGHT.alt);
        host.classList.add('on');
      } catch (err) {
        console.warn('Login fly-over unavailable:', err);
        if (api) { try { api.dispose(); } catch {} api = null; }
      }
    }

    const combatSim = (aT, aD, dT, dD, defFirst = true) => {
      const rounds = [[aT, dT]];
      let a = aT;
      let d = dT;
      for (let g = 0; g < 2000 && a > 0 && d > 0; g++) {
        if (defFirst) { a = Math.max(0, a - dD); if (a > 0 && d > 0) d = Math.max(0, d - aD); } else { d = Math.max(0, d - aD); if (a > 0 && d > 0) a = Math.max(0, a - dD); }
        rounds.push([a, d]);
      }
      return rounds;
    };
    const troopsNeeded = (dT, dD, aD) => dD * Math.ceil(dT / Math.max(1, aD)) + 1;

          'Click or tap near a castle to select it; the nearest castle to your pointer wins, so you do not need to hit the sprite exactly. A marching or besieging army on top of a castle is selected before the castle, except while you are choosing a march destination or measuring with the ruler, when the castle always wins; commanders resting inside a castle are reached from the castle panel.',
          'The selected castle is drawn above its neighbours with a moving gilt ring. A castle that changes hands flashes a ring once. A castle under threat pulses its red ring three times and then keeps it.',
          'Troop badges show only counts you know: a number, a tilde for the count you last saw, or nothing when you have never seen inside.',
          'Marching armies are drawn as troop figures at every zoom, a small column of soldiers in the house colour with the troop count above, growing with the size of the army. A hostile army heading for one of your castles has a red ring under it. Click the figure to open the commander.',
          'Armies stand where the last tick left them. When a tick lands they slide to their new position over about a second, so a march advances in steps, one per tick, exactly as the rules move it. Sight and interception are still worked out by the server from the army\'s position within the tick.',
          'Castle markers and army badges scale with the zoom: about half size when the whole realm is in view, full size at four times closer, and a little larger again when you zoom right in. The sprites and terrain are the art itself and do not change.',
          'Switching between the 2D and 3D map crossfades. Under reduced motion none of this animates.',
        ]],
        ['h', 'On a phone'],
        ['list', [
          'The panel is a sheet under the map with three heights. Dragged down to its lowest, it becomes a strip: the castle or commander you selected with its troops, one quick action (the cheapest upgrade, or March) and View, which raises the sheet again. On the leaderboard the strip shows your castle count.',
        ]],

        ['p', 'The realm is a set of castles joined by routes. Everything that matters happens at castles or on the routes between them.'],
        ['diagram', 'map'],
        ['h', 'Trails and free travel'],
        ['p', 'The host chooses how armies travel ([[hosting#realm|Realm settings]]). In trail games armies walk the trails between castles and never cross country. In free-travel games an army can march straight to any castle within range, and the ground in between decides how long it takes: forest, hills and high ground slow a march.'],
        ['p', 'Where three or more trails meet away from a castle, the map shows a crossroads. An army marching through passes straight over it without stopping, so the route between two castles can bend at a crossroads to the shortest way. Castles are spread fairly evenly across the land, and trails are laid so that the way between two neighbouring castles is never much longer than a straight march: no castle is left with a single road out when a second way exists. Most castles have two or three trails. Rivers and mountain ranges still block, but they are crossed at fords and passes wherever the long way round would be far longer. A crossroads cannot be held or attacked and does not count toward victory.'],
        ['p', 'Some castles sit where many routes meet. The castle panel marks them as a chokepoint or a major chokepoint. Holding one makes it harder for rivals to move across the realm, so the AI also treats them as worth fighting for, along with enemy capitals.'],
        ['h', 'Rivers and mountains'],
        ['list', [
          'Rivers and mountain ranges cannot be crossed on open ground.',
          'A river castle sits on a crossing. Whoever holds it controls the crossing.',
          'A pass castle sits in a gap in the mountains. Hold the pass and the range is closed to your enemies.',
          'A march ends at the first castle that is not yours or an ally\'s, so you must [[battles|take the crossing castle]] before you can go beyond it.',
        ]],
        ['h', 'Marching armies and battles'],
        ['p', 'A marching army is drawn on both the 2D and 3D map in its house colours. Its size shows how many troops it carries. An army of 1 to 100 troops shows one soldier per troop up to 20. From 101 to 250 troops it is 40 foot soldiers and 10 cavalry with a captain. Above 250 it is a host of 75 foot soldiers, 20 cavalry and 5 siege engines (rams and catapults) under two banners. Each army is labelled with the name of its commander and its troop count. Scroll in on the 2D map to see the figures up close. Enemy armies you can see are drawn the same way, so you can judge a threat before it arrives.'],
        ['p', 'When a battle is reported, the map plays a short skirmish where it happened: the two armies close, clash in a cloud of dust, and the winner raises a banner. The result is decided instantly by the [[battles|battle rules]]; the animation is only for show and is skipped if your device asks for reduced motion.'],
        ['p', 'A castle under siege shows it. The besiegers pitch a camp beside it: tents, a campfire, their banner and, in 3D, one or two trebuchets that hurl stones at the walls. The bigger the besieging force, the bigger the camp. Smoke rises from the castle and thickens, with fires breaking out on the walls, the longer the siege lasts. The banner of a besieged castle droops as the siege wears on. When your garrison sallies out or a relief army arrives, the fight is played out between the castle walls and the camp. It is all for show; the real siege is the garrison starving each tick. Select a besieged castle to see a bar showing how much of the garrison is left compared with when the siege began.'],
        ['h', 'Strategic castles and outposts'],
        ['p', 'The largest neutral castles stand at the crossroads of the realm: the places many routes pass through, so holding one gives you a grip on the war. Small castles sit out on the edges and dead ends as outposts. Where a trail runs through forest, the trees are cleared back from it so the road is visible.'],
        ['h', 'Natural wealth'],
        ['p', 'Each castle has natural resources, shown by the halo around it. Richer castles make [[economy#upgrade-costs|upgrades cheaper]], and tiers are Tier 1 (1 to 20), Tier 2 (21 to 40) and Tier 3 (41 to 60). Grab the rich ones first.'],
      ] },
      { id: 'economy', group: 'The world', title: 'Castles and economy', blocks: [
        ['p', 'Every castle has three upgrade tracks. Each track pays out in a different way.'],
        ['diagram', 'economy'],
        ['table', { head: ['Track', 'What it gives', 'Base cost'], rows: [
          ['Treasury', 'Gold every production cycle', '500'],
          ['Recruitment', 'New troops at that castle', '1000'],
          ['Prestige', 'Prestige that builds your [[areas|realm areas]]', '4000'],
        ] }],
        ['h', 'How production works'],
        ['list', [
          'A production cycle is 24 ticks by default. Gold is paid in one lump at the end of each cycle. Troops arrive a little every tick, so the count on a castle goes up between cycles.',
          'Gold per cycle = total Treasury levels, times 10 plus 2 for every level of your [[areas|Mint]].',
          'Troops arrive a little every tick. Over a cycle a castle produces its Recruitment level times (4 plus your [[areas|Barracks]] level).',
          'Prestige arrives every tick and goes to the [[areas|realm area]] you are currently building.',
        ]],
        ['h', 'Upgrade costs'],
        ['p', 'An upgrade costs base times (current level plus one), divided by the castle\'s resources. [[map#natural-wealth|Natural resources]] and your [[areas|Guildhall]] make upgrades cheaper, so the same gold goes further at a rich castle. Upgrade everywhere on the Realm tab spends a budget (your whole treasury by default) on the cheapest castles first, and shows what it would buy, castle by castle, before you press Spend.'],
        ['h', 'Roads'],
        ['p', 'Build a road at two castles and [[marching|marches]] between them are faster by a factor of the square root of (3 + your Stables level): about 1.7 times at Stables 0, 2 times at 1 and 3 times at 6. A road costs 6 gold per natural resource of the castle, so richer castles cost more.'],
        ['h', 'Capturing castles'],
        ['p', 'A captured castle keeps its Recruitment, Prestige and roads but its Treasury is destroyed. You are paid 10 gold for each Treasury level destroyed. The castle starts with no garrison, so the army that took it must hold it.'],
        ['h', 'The castle page'],
        ['p', 'Select a castle to open its page. Besides the owner, troops and levels, you will find:'],
        ['list', [
          'Your note: a private tag (Staging, Target, Watch, Fortress, Supply or Danger) and up to 160 characters. The tag shows beside the castle on the map. Only you can see it.',
          'Last scouted: for a castle hidden by fog, the tick you last saw it and what you saw then.',
          'Production (your castles): troops, gold and prestige the castle yields, and what the next level of each upgrade would add. Garrison commanders and your realm areas are included.',
          'Defence (your and allied castles): the damage per round the defenders deal, split into Armory, the leader\'s Valor and terrain, plus the fewest troops an attacker needs to take the castle for each level of damage they deal.',
          'Threats (your castles): hostile armies you can see marching here, with their arrival tick, and the nearest hostile castles.',
          'Supply lines (your castles): every route of yours that starts at, or stops at, this castle, and what the commander does there.',
          'History: who took the castle, who held it, the sieges it has seen and the commanders who led them. You only see events you were part of or that were public.',
        ]],
      ] },
      { id: 'areas', group: 'The world', title: 'Realm areas', blocks: [
        ['p', 'Your realm has seven areas. They are not buildings on the map. They are levels that apply across all of your castles. You build one at a time, and prestige from all of your castles flows into the one you choose.'],
        ['table', { head: ['Area', 'What it does'], rows: [
          ['Armory', 'How many troops your army kills each round of a [[battles#damage-per-round|battle]]'],
          ['Mint', 'Raises the [[economy#how-production-works|gold]] you earn from Treasury'],
          ['Barracks', 'Raises [[economy#how-production-works|troop production]]'],
          ['Guildhall', 'Makes every [[economy#upgrade-costs|upgrade]] cheaper'],
          ['Watchtowers', 'How far you can [[fog|see]], and who strikes first in [[battles#fighting-in-the-open|open-field battles]]'],
          ['Library', 'Adds a bonus of prestige to one of your other areas every cycle'],
          ['Stables', 'How far an army can [[marching#range|march]] in one order'],
        ] }],
        ['h', 'Research screen'],
        ['p', 'Menu, Research lists every area with its level, how much prestige it holds, what the next level costs and how many production cycles that takes at your current prestige income. Only the active area earns from your castles, so use Make active to switch.'],
        ['p', 'Armory decides [[battles|battles]], so most winning players raise it early. Mint and Guildhall pay for themselves in a long game. [[marching#range|Stables]] matters most on big maps.'],
      ] },
      { id: 'commanders', group: 'Your forces', title: 'Commanders', blocks: [
        ['p', 'Commanders carry troops, and there is no limit to how many. Gather troops from several castles into one army before a big attack. Commanders are cheap, and you will lose some. A commander who survives [[battles|battles]] gets stronger and becomes worth protecting.'],
        ['h', 'Hiring'],
        ['p', 'Pick a school and pay the price. You get a new commander with a name from your house\'s own culture and one level in a random ability of that school.'],
        ['h', 'Names, faces and backgrounds'],
        ['p', 'Every commander has a profile card: a portrait, an age, sometimes an epithet such as "Quillhand", and a short background made of where they grew up, something that happened to them, and a habit. Your house\'s starting king and commanders are its named [[lore|leaders]]. The card shows the commander\'s school, rank and troops. Select a commander to read the full profile. Portraits and backgrounds are for flavor only and do not change any ability.'],
        ['h', 'The chronicle'],
        ['p', 'Every commander keeps a chronicle of their story, shown under their background when you select one of your own. It records when they took up arms, the battles they won and lost, castles they stormed or held, sieges they broke, times they were taken prisoner or ransomed back, the skills they mastered, the name they earned after five victories, being crowned, and how they fell. The summary line counts their victories, defeats and castles taken. Each entry is stamped with the tick it happened on.'],
        ['p', 'Under the chronicle the summary also shows the commander\'s record: battles fought, wins and losses with the win rate, castles taken and times captured. Once they have been beaten, it names their nemesis, the enemy commander who has beaten them most, and their old foe, the house they have fought most.'],
        ['h', 'Growing abilities'],
        ['p', 'On your own commanders, each ability has a progress bar toward its next level, a line on what it does, and the XP still needed. The abilities of the commander\'s own school are marked and learn 1.5 times faster. Rank is the sum of all ability levels and is capped at 20. The "Now" line says what the commander is doing: marching (with arrival tick and route), waiting, besieging or leading a garrison.'],
        ['h', 'Rename and the Hall of the Fallen'],
        ['p', 'Use Rename next to a commander\'s name to give them a name of your own (letters, spaces, hyphens and apostrophes). The old name stays in the chronicle. Commanders who die are not forgotten: the Hall of the Fallen, a button in the Realm panel, lists each with their portrait, school, years of service, last deeds and how they fell.'],
        ['table', { head: ['School', 'Abilities'], rows: [
          ['Battleschool', 'Valor (more [[battles#damage-per-round|damage]]), Tactics (strike first in the [[battles#fighting-in-the-open|field]]), Siegecraft (stronger [[sieges|sieges]])'],
          ['University', 'Muster (more troops), Steward (more gold), Scholar (more prestige)'],
          ['Rangers', 'Pace (faster [[marching|marches]]), Scout (see [[fog|further]]), Plunder (more gold on [[economy#capturing-castles|capture]])'],
        ] }],
        ['h', 'Growing stronger'],
        ['p', 'Abilities level up on their own through use: Valor from winning battles, Muster from troops produced at the castle the commander leads, Pace from marching, and so on. Each ability tops out at level 3 and a commander tops out at rank 20, so no one commander can have everything.'],
        ['h', 'Garrison commanders'],
        ['p', 'Assign an idle commander to a castle to lead it. He leads its defense and his Muster, Steward and Scholar abilities apply there. He cannot march until you unassign him.'],
        ['h', 'The king'],
        ['p', 'Each house has one king, chosen from your commanders. The king\'s abilities become realm-wide bonuses and his battle abilities apply to any [[battles|fight]] he is in. If he dies, those bonuses vanish instantly and it takes a few ticks to crown a new one. Keep him out of the front line.'],
        ['note', 'A commander whose army is destroyed in a [[battles#fighting-at-a-castle|battle]] dies. So does every commander in a castle that falls.'],
      ] },
      { id: 'marching', group: 'Your forces', title: 'Marching and routes', blocks: [
        ['h', 'Giving a march order'],
        ['list', [
          'Open a commander and press March, or press the March shortcut beside a commander in a castle panel. A bar across the top of the map says what to click; Escape or Cancel ends it.',
          'Click the destination. The panel shows whether it is in range of one order, the route, the arrival tick and the predicted result of an assault.',
          'If the castle is out of range in one order but a path runs through castles you or an ally hold, the panel offers March in N legs, which sends the army stop by stop, and Edit route, which opens the same stops in the route editor so you can change them. If no such path exists, the panel says so: raise Stables or take a closer castle first.',
        ]],
        ['p', 'Select a [[commanders|commander]] and choose March, then click a destination. The map shows the path, the time to arrive and the cost.'],
        ['h', 'Range'],
        ['p', 'One order can cover only so much distance. Your [[areas|Stables]] level sets that distance. A single hop to a neighbouring castle is always allowed. Castles you can reach glow on the map.'],
        ['p', 'Distance is measured in leagues. One league is the spacing between neighbouring castles on a standard map. Range, scan radius and march speed are fixed in leagues and leagues per tick, so a bigger map means castles lie more leagues apart and journeys take longer. Games created before leagues keep their old scaling.'],
        ['h', 'The ruler'],
        ['p', 'Press Ruler in the top bar and click two castles. It shows the straight-line distance in leagues, how long the trip takes on foot and by road, your range, and the Stables level you need to reach it in one march. The ETA uses the commander you have selected, or your king. On trail and road maps it measures the route the march would take, through castles you hold, so it agrees with the march preview. If there is no such route it says so.'],
        ['h', 'March types'],
        ['list', [
          'Assault: the army [[battles|fights]] on arrival.',
          '[[sieges|Siege]]: the army sets up outside the castle and starves it instead of fighting at once.',
        ]],
        ['h', 'Passing through castles'],
        ['p', 'An army passes through castles that belong to you or an [[diplomacy|ally]]. It stops at the first castle that is not yours, and there it fights or begins a siege.'],
        ['h', 'Routes'],
        ['p', 'Add stops to build a route of up to 10 castles. At each castle you own you can set an action:'],
        ['list', [
          'Collect troops from the castle onto the commander.',
          'Drop troops from the commander into the castle.',
          '[[commanders#garrison-commanders|Garrison]]: leave the commander to lead the castle.',
          'Wait for a number of ticks before moving on.',
        ]],
        ['p', 'Turn on Loop and the commander repeats the route forever. That is how you keep a front line supplied without checking in every hour.'],
        ['h', 'Changing your mind'],
        ['p', 'When you build a route, each stop is a row with its name, a summary of the order it carries (assault or siege, what to do with the troops, any wait) and the ticks to reach it; Edit opens the controls for that stop and Done closes them. Each stop must be within range of the stop before it. While you are adding stops the map dims every castle the next leg cannot reach and keeps the ones in range bright, with the range measured from the last stop you added. Stops that are out of range cannot be added (the message names both castles), and the server refuses a route with one. If a later stop becomes unreachable (for example a castle changes hands) the army stops at the last castle it reached and you get a message naming the army and the stop.'],
        ['p', 'Orders lock at the first tick. From the moment you send an army until the next tick arrives you can press Cancel march and it stays where it was. After that the army is committed to its destination and cannot turn back.'],
        ['p', 'On a route with several stops you can still press Halt at next stop, or Drop remaining stops while it waits. The army finishes its current stretch, stops at that castle and does not go on.'],
      ] },
      { id: 'battles', group: 'War', title: 'Battles', blocks: [
        ['p', 'There are no dice. Each side destroys a fixed number of enemy troops every round and the battle runs until one side has none left.'],
        ['h', 'Damage per round'],
        ['p', 'Your damage each round is your [[areas|Armory]] level plus the [[commanders|Valor]] of the commander leading your army. It is never less than 1.'],
        ['h', 'Fighting at a castle'],
        ['list', [
          'The defender strikes first and gets +1 damage per round.',
          'The attacker wins only if they outlast the defender: they must bring more troops than the defense can kill.',
          'The winners keep what survives, and an attacker who wins [[economy#capturing-castles|captures the castle]]. Every [[commanders|commander]] on the losing side dies.',
        ]],
        ['p', 'To starve a castle instead of storming it, see [[sieges|Sieges]].'],
        ['h', 'A worked example'],
        ['p', '30 troops attack a castle held by 20 troops. Both sides have Armory 2 and no Valor. The attacker kills 2 troops per round and the defender kills 3. The defender needs 10 rounds to destroy 30 troops. The attacker needs 10 rounds to destroy 20. The defender strikes first, so the defender wins with 2 troops left. Bring 33 troops and the attacker wins instead.'],
        ['h', 'Try it yourself'],
        ['p', 'Change the numbers and drag the slider to watch a battle play out round by round.'],
        ['calc'],
        ['h', 'Fighting in the open'],
        ['p', 'When two armies meet on the [[marching|trail]], both are attackers with no defender bonus. The side with the higher initiative ([[areas|Watchtowers]] level plus the leader\'s [[commanders|Tactics]]) strikes first. The loser is destroyed.'],
        ['h', 'Taking this castle'],
        ['p', 'Select an enemy or neutral castle and the "Taking this castle" panel shows the defenders, the damage each side deals and how many troops you need, using the same arithmetic as the battle. It also shows whether your strongest idle army is enough. Neutral castles are exact; an enemy garrison you cannot see is an estimate. The march preview shows the same odds before you commit.'],
        ['h', 'Allies'],
        ['p', '[[diplomacy|Allied]] armies fight as one side using the best Armory among them, and the defending team gets the +1.'],
      ] },
      { id: 'sieges', group: 'War', title: 'Sieges', blocks: [
        ['p', 'A siege starves a castle instead of [[battles#fighting-at-a-castle|storming]] it. It is slow, but you do not lose troops to the castle\'s +1 defense.'],
        ['diagram', 'siege'],
        ['list', [
          'Every tick the garrison loses about 3% of its troops, more if the besieger has [[commanders|Siegecraft]].',
          'Every production cycle the castle loses one level on one of its [[economy|tracks]].',
          'The defender can sally out: the garrison fights the besiegers [[battles#fighting-in-the-open|in the open]] with no castle bonus for anyone. A win destroys the besiegers and lifts the siege.',
          'A friendly army that reaches the castle fights the besiegers in the open. A win lifts the siege.',
          'The besieger can break off and [[marching|assault]] at any time.',
        ]],
        ['p', 'While you besiege, the castle panel shows a siege bar: ticks under siege and the garrison left.'],
        ['note', 'A sieging army can be caught by a relief force. Keep the besiegers strong enough to beat what is coming.'],
      ] },
      { id: 'fog', group: 'War', title: 'Fog of war', blocks: [
        ['p', 'If the [[hosting#rules|host]] turned fog on, you only see the troops and armies that your castles and commanders can scan. A question mark means information you cannot see right now. Who owns each castle is always shown, so you can see where the other houses are. Fog hides troop counts and armies outside your scan range. In dark games the owner of ground you have not explored stays unknown and is shown with a blue-grey dotted ring.'],
        ['list', [
          '[[areas|Watchtowers]] extends the scan range of every castle you own.',
          'The Scout ability ([[commanders|Commanders]]) extends it for a commander.',
          'In dark games the map is black until something of yours scans it. Explored ground stays visible but only updates live inside your scan range.',
        ]],
      ] },
      { id: 'diplomacy', group: 'Other players', title: 'Diplomacy and honor', blocks: [
        ['p', 'Open Standings and click a player. You can propose an alliance, a non-aggression pact, peace or a trade deal, or declare war.'],
        ['list', [
          'Peace is a truce that blocks attacks for a set number of ticks.',
          'At war you can send peace terms: gold, tribute or a castle.',
          'Allies can lock a marriage alliance that cannot be broken until it ends.',
          'A third player can offer to mediate between two players at war.',
          'You can send gold to anyone. Menu, Ledger lists every gift and payment and totals them by house.',
          'Every AI house has a regard for you from -10 to +10, shown in Standings. Taking its castles and declaring war lower it. Gold, shared technology and an alliance raise it. The higher it is, the likelier it accepts your alliance and peace offers, and regard fades over about 120 ticks.',
        ]],
        ['h', 'Messages'],
        ['p', 'Open Chat and Messages to write privately to one or several players, human or AI, with an optional subject. A human answers when they read it. An AI answers on its next move, in the manner of its style and your standing with it (allied, at war or neither), and it picks up a few keywords: alliance, peace, gold or trade, and threats of war. An AI reply is a greeting or a stance, not a negotiation: to make a deal use the proposals in Standings.'],
        ['h', 'Honor'],
        ['p', 'Honor is your reputation across games. Breaking a pact or alliance, or attacking during a grace period, costs honor. It is public on the Roll of Honor.'],
      ] },
      { id: 'friends', group: 'Other players', title: 'Friends', blocks: [
        ['p', 'Friends are players you approve. They can see your profile and stats, and you can see theirs. Open Friends in the top bar.'],
        ['h', 'Adding a friend'],
        ['list', [
          'Share your friend code, such as 4QV3-H6SQ, and ask your friend to send you a request with it, or send one with theirs.',
          'After a game ends, open the final standings and use Add friend next to any human player. Names are shown again at the end, even in games that hid them.',
          'A request must be accepted before anything is shared.',
        ]],
        ['h', 'What friends can see'],
        ['p', 'A friend can see your honor, infamy, games, wins, favorite house and your recent finished games. They never see games still in progress, so they cannot tell which house you are in an anonymous game.'],
        ['h', 'Who can see your stats'],
        ['list', [
          'Friends only (the default): only approved friends see your stats.',
          'Everyone: any player can see you on the Roll of honor.',
        ]],
        ['note', 'You can remove a friend at any time from their profile. Removing a friend stops them seeing your stats.'],
      ] },
      { id: 'hosting', group: 'Other players', title: 'Hosting a game', blocks: [
        ['p', 'Anyone can raise a campaign. The setup is one screen. The choices that change the game most sit at the top: the name, who sits at the table, the land, its size and the pace. Everything else has a sensible default and folds open below: Rules, Realm detail, Houses, Time and Who can join. Each fold shows its current settings in one line, and the summary on the right updates as you go. The realm preview draws the land the same settings will create; New map rolls another.'],
        ['note', 'With the defaults, seats 2 to 4 are AI opponents, so Raise campaign gives you a game you can start alone from the lobby. Make a seat a player to leave it open for someone to join.'],
        ['h', 'Realm'],
        ['list', [
          'Land shape and size, and how many castles each house starts with.',
          'Map style presets such as river valley, highlands, or a ring around a sea. They set how much water, high ground and mountain there is.',
          'Travel: [[map#trails-and-free-travel|trails or free travel]], and how far apart the capitals start.',
          'Map size runs from Classic (0.3x) to Titanic (1.8x), with Standard (1x) as the base game. Standard spaces castles about twice as far apart as the earlier base, so a march between neighbours takes around 6 to 8 ticks. Larger maps mean longer marches and more room between castles; the number of castles stays the same.',
        ]],
        ['h', 'Rules'],
        ['list', [
          '[[basics#how-time-works|Tick speed]], [[basics#what-wins-the-game|victory share]], [[fog|fog of war]], alliances and truces.',
          'Who can join: Open (listed for everyone), Friends only (listed for your [[friends|friends]]) or Invite only (not listed).',
          'Player names: shown, or hidden until the game ends. When hidden, everyone appears under their house name.',
          'Each seat is a player or an AI with its own strength, from Squire to Warlord, and its own style. A Defensive AI builds from the back: it is hard to conquer and starts a fight only when it is nearly certain to win. A Balanced AI takes land steadily and fights when the odds are good. An Aggressive AI expands relentlessly and presses its rivals, but only attacks where it can win, and grows stronger with every castle. Strength sets how well it plays; style sets how willing it is to fight. Aggressive and Balanced houses build a strike force once they have grown: one commander gathers troops from nearby castles and goes after the weakest rival castle it can reach, and they steer their expansion toward their rivals. Defensive houses rarely start a fight. You can switch a seat between player and AI from the lobby until the game starts. A player seat still empty at the start is dropped. AI houses hire many commanders, run looping supply routes that carry troops from safe castles to the front (a house hemmed in on every side moves troops from its strongest castles to its weakest instead), gather troops from several castles before a big attack, keep bigger garrisons where enemies are close, aim at the leading house, enemy capitals and chokepoints, and in the late game may break an alliance to strike, stronger AIs more often.',
        ]],
        ['h', 'Inviting players'],
        ['list', [
          'Every game has a short code, such as K7M2-9QX4, and a share link. Find them in the lobby under Invite players, and copy either one to anyone, friend or not.',
          'Players enter the code in Join by code on the home screen, or open the link after signing in.',
          'Invite friends lists your [[friends|friends]]. They see "invited you" at the top of their home screen and can join or decline.',
          'In an Invite only game, only people with the code, the link or an invitation can join. A password, if you set one, still applies.',
        ]],
        ['h', 'The lobby'],
        ['list', [
          'The table shows every seat: players, AI houses with their strength and style, and open seats. The host can seat an AI in any open seat, change an AI, or remove a player.',
          'Begin holds the start button and tells you what is still needed. A game needs at least two houses; seat an AI to play alone. Cancel game and Leave sit below it.',
          'Invite players shows the game code and link with copy buttons, and Invite friends. Starting schools lets each player choose where their king and commanders trained before the game begins.',

    function manualCalc() {
      const field = (label, input) => h('div', {}, h('label', {}, label), input);
      const num = (v) => h('input', { type: 'number', min: '0', value: String(v) });
      const aT = num(30); const aD = num(2); const dT = num(20); const dD = num(2);
      const kind = selectOf({ castle: 'Castle (defender strikes first, +1 damage)', field: 'Open field (attacker strikes first)' }, 'castle');
      const slider = h('input', { type: 'range', min: '0', max: '0', value: '0', 'aria-label': 'Round' });
      const out = h('div', { class: 'calcout' });
      const sim = () => {
        const mode = kind.value;
        const A = { t: Math.max(0, Math.floor(Number(aT.value))), dmg: Math.max(1, Math.floor(Number(aD.value))) };
        const D = { t: Math.max(0, Math.floor(Number(dT.value))), dmg: Math.max(1, Math.floor(Number(dD.value))) + (mode === 'castle' ? 1 : 0) };
        const defFirst = mode === 'castle';
        const rounds = combatSim(A.t, A.dmg, D.t, D.dmg, defFirst);
        return { rounds, A, D };
      };
      const draw = () => {
        const { rounds, A, D } = sim();
        slider.max = String(rounds.length - 1);
        const i = Math.min(Number(slider.value), rounds.length - 1);
        slider.value = String(i);
        const [a, d] = rounds[i];
        const last = rounds[rounds.length - 1];
        const verdict = last[0] === 0 && last[1] === 0 ? 'Both sides are empty.' : last[1] === 0 ? `Attacker wins with ${pluralN(last[0], 'troop')} left.` : last[0] === 0 ? `Defender wins with ${pluralN(last[1], 'troop')} left.` : '';
        const bar = (who, now, start, cls) => h('div', { class: 'cbarrow' }, h('span', {}, who), h('div', { class: 'cbar' }, h('i', { class: cls, style: `width:${start ? (100 * now) / start : 0}%` })), h('b', {}, String(now)));
        out.replaceChildren(
          bar('Attacker', a, A.t, 'att'), bar('Defender', d, D.t, 'def'),
          h('div', { class: 'tip' }, `After round ${i} of ${rounds.length - 1}. ${verdict}`));
      };
      [aT, aD, dT, dD, kind].forEach((el) => { el.addEventListener('input', draw); el.addEventListener('change', draw); });
      slider.addEventListener('input', draw);
      draw();
      return h('div', { class: 'mcalc' },
        h('div', { class: 'grid2' }, field('Attacker troops', aT), field('Attacker damage per round', aD), field('Defender troops', dT), field('Defender damage per round', dD)),
        h('label', {}, 'Kind of battle'), kind,
        h('label', {}, 'Step through the rounds'), slider, out);
    }

    let manualGo = null;
    const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const XREF = /\[\[([a-z]+)(?:#([a-z0-9-]+))?\|([^\]]+)\]\]/g;
    const inline = (text) => {
      const out = [];
      let last = 0;
      let m;
      XREF.lastIndex = 0;
      while ((m = XREF.exec(text))) {
        if (m.index > last) out.push(text.slice(last, m.index));
        const [, id, anchor, label] = m;
        out.push(manualGo ? h('button', { type: 'button', class: 'xref', onclick: () => manualGo(id, anchor) }, label) : label);
        last = XREF.lastIndex;
      }
      if (last < text.length) out.push(text.slice(last));
      return out;
    };

      if (kind === 'note') return h('div', { class: 'mnote' }, ...inline(v));

    function resolveFight(mode, a, d, firstSide) {
      const aT = Math.max(0, Math.floor(a.troops));
      const dT = Math.max(0, Math.floor(d.troops));
      const aDmg = Math.max(1, Math.floor(a.damage));
      const dDmg = Math.max(1, Math.floor(d.damage)) + (mode === 'castle' ? 1 : 0);
      if (mode === 'castle' && dT === 0) return { winner: 'attacker', left: aT, note: 'An undefended castle always falls.' };
      if (aT === 0 && dT === 0) return { winner: null, left: 0, note: 'Neither side has troops.' };
      if (aT === 0) return { winner: 'defender', left: dT, note: 'The attacker has no troops.' };
      if (dT === 0) return { winner: 'attacker', left: aT, note: 'The defender has no troops.' };
      const defFirst = mode === 'castle' || firstSide === 'defender';
      const F = defFirst ? { side: 'defender', t: dT, dmg: dDmg } : { side: 'attacker', t: aT, dmg: aDmg };
      const S = defFirst ? { side: 'attacker', t: aT, dmg: aDmg } : { side: 'defender', t: dT, dmg: dDmg };
      const rS = Math.ceil(S.t / F.dmg);
      const rF = Math.ceil(F.t / S.dmg);
      if (rS <= rF) return { winner: F.side, left: F.t - (rS - 1) * S.dmg, note: `${F.side} strikes first and needs ${rS} round${rS === 1 ? '' : 's'}; ${S.side} needs ${rF}.` };
      return { winner: S.side, left: S.t - rF * F.dmg, note: `${F.side} strikes first and needs ${rS} round${rS === 1 ? '' : 's'}; ${S.side} needs ${rF}.` };
    }

    function lineChart(series, label) {

      const H = 260;
      const pad = { l: 52, r: 14, t: 14, b: 30 };

      const x1 = Math.max(...xs, x0 + 1);
      const y1 = Math.max(...ys, 1);
      const X = (x) => pad.l + ((x - x0) / (x1 - x0)) * (W - pad.l - pad.r);
      const Y = (y) => H - pad.b - (y / y1) * (H - pad.t - pad.b);
      const grid = [0, 0.25, 0.5, 0.75, 1].flatMap((f) => [
        sv('line', { x1: pad.l, x2: W - pad.r, y1: Y(y1 * f), y2: Y(y1 * f), stroke: 'rgba(90,70,40,0.25)', 'stroke-width': 1 }),
        sv('text', { x: pad.l - 6, y: Y(y1 * f) + 4, 'text-anchor': 'end', 'font-size': 16, style: 'fill:#4a3a22' }, String(Math.round(y1 * f))),
      ]);
      return sv('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img', 'aria-label': label },

        sv('text', { x: pad.l, y: H - 6, 'font-size': 16, style: 'fill:#4a3a22' }, `tick ${x0}`),

      const color2 = (pid) => (pid && ms.players.get(pid) ? factionOf(ms.players.get(pid).faction_slug).color2 : '#2a2a35');
      state.cleanup.push(() => { const r = document.documentElement.style; r.removeProperty('--house'); r.removeProperty('--house2'); });
      const pname = (pid) => (pid && ms.players.get(pid) ? ms.players.get(pid).display_name : 'Unclaimed');
      const ownerUnknown = (t, seen) => !!(ms.game.fog_of_war && !seen && !t.is_junction && t.owner_player_id === undefined && !ms.mem[t.id]);
      const dipStatus = (pid) => {
        const r = ms.dip.find((d) => d.player_a_id === pid || d.player_b_id === pid);
        return r ? r.status : 'neutral';
      };
      const isFriend = (pid) => pid === ms.me.id || dipStatus(pid) === 'allied';
      const rankOf = (c) => Object.values(ms.abil.get(c.id) || {}).reduce((a, b) => a + b, 0);

      const S = () => (ms.game && ms.game.world_scale) || 1;
      const U = () => ((ms.game && ms.game.league ? ms.game.unit_scale : ms.game && ms.game.world_scale) || 1);
      const LEAGUE = 1500;
      const leagueText = (d) => `${(d / LEAGUE).toFixed(1)}`;
      const M = () => Math.pow(S(), 0.5);
      const rangeOf = (stables) => (trailsOn() ? (300 + 120 * stables) * U() : ms.game.free_travel ? (210 + 60 * stables) * U() : (90 + 60 * stables) * (ms.game.league ? U() : 1));
      const trailsOn = () => ms.game.travel_mode === 'trails';
      const myStables = () => (ms.areas.find((a) => a.area === 'stables') || { level: 0 }).level;
      const reachableFrom = (tid) => {
        const range = rangeOf(myStables());
        const out = new Map();
        ms.edges.forEach((e) => {
          if (e.length > range) return;
          if (e.from_territory_id === tid) out.set(e.to_territory_id, e);
          else if (e.to_territory_id === tid) out.set(e.from_territory_id, e);
        });
        return out;
      };

      const adjacency = () => {
        if (ms.adjFor === ms.edges) return ms.adj;
        const adj = new Map();
        ms.edges.forEach((e) => {
          const w = e.length * e.move_cost_mult;
          if (!adj.has(e.from_territory_id)) adj.set(e.from_territory_id, []);
          if (!adj.has(e.to_territory_id)) adj.set(e.to_territory_id, []);
          adj.get(e.from_territory_id).push({ to: e.to_territory_id, w });
          adj.get(e.to_territory_id).push({ to: e.from_territory_id, w });

        ms.adj = adj;
        ms.adjFor = ms.edges;
        return adj;
      };
      const castleLinks = (tid) => {
        const adj = new Map();
        ms.edges.forEach((e) => {
          if (!adj.has(e.from_territory_id)) adj.set(e.from_territory_id, []);
          if (!adj.has(e.to_territory_id)) adj.set(e.to_territory_id, []);
          adj.get(e.from_territory_id).push({ to: e.to_territory_id, len: e.length, cost: e.length * e.move_cost_mult, kind: e.kind });
          adj.get(e.to_territory_id).push({ to: e.from_territory_id, len: e.length, cost: e.length * e.move_cost_mult, kind: e.kind });
        });
        const rank = { land: 0, river: 1, pass: 2 };
        const out = new Map();
        const walk = (id, len, cost, kind, seen) => {
          (adj.get(id) || []).forEach((n) => {
            if (seen.has(n.to)) return;
            const nl = len + n.len;
            const nc = cost + n.cost;
            const nk = (rank[n.kind] || 0) > (rank[kind] || 0) ? n.kind : kind;
            const tt = ms.t.get(n.to);
            if (tt && tt.is_junction) walk(n.to, nl, nc, nk, new Set([...seen, n.to]));
            else if (tt && !out.has(n.to)) out.set(n.to, { t: tt, len: nl, kind: nk, mult: nc / nl });

        };
        walk(tid, 0, 0, 'land', new Set([tid]));
        return [...out.values()];
      };
      const trailReach = (fromId) => {
        const adj = adjacency();
        const range = rangeOf(myStables());
        const cost = new Map([[fromId, 0]]);
        const prev = new Map();
        const done = new Set();
        for (;;) {
          let u = null;
          let best = Infinity;
          cost.forEach((c, id) => { if (!done.has(id) && c < best) { best = c; u = id; } });
          if (u === null) break;
          done.add(u);
          const tu = ms.t.get(u);
          if (u !== fromId && !(tu && (tu.is_junction || isFriend(tu.owner_player_id)))) continue;
          (adj.get(u) || []).forEach(({ to, w }) => {
            if (!done.has(to) && best + w < (cost.get(to) ?? Infinity)) { cost.set(to, best + w); prev.set(to, u); }
          });
        }
        const out = new Map();
        cost.forEach((c, id) => {
          if (id === fromId || (ms.t.get(id) && ms.t.get(id).is_junction)) return;
          const path = [id];
          while (path[0] !== fromId) path.unshift(prev.get(path[0]));
          if (path.filter((n) => !(ms.t.get(n) && ms.t.get(n).is_junction)).length === 2 || c <= range) out.set(id, { cost: c, path });
        });
        return out;
      };
      const trailPoly = (ids) => {
        const pts = [];
        for (let i = 0; i < ids.length - 1; i++) {
          const a = ids[i];
          const b = ids[i + 1];
          const e = ms.edges.find((x) => (x.from_territory_id === a && x.to_territory_id === b) || (x.from_territory_id === b && x.to_territory_id === a));
          let seg = e && e.path ? e.path.map((q) => ({ x: q[0], y: q[1] })) : [ms.t.get(a), ms.t.get(b)];
          if (e && e.path && e.from_territory_id !== a) seg = seg.slice().reverse();
          pts.push(...(i ? seg.slice(1) : seg));
        }
        return pts;
      };
      const stopTicks = () => {
        let ticks = 0;
        return ms.stops.map((st) => {
          if (st.cost && ms.speed) ticks += Math.ceil(st.cost / ms.speed);
          const at = ticks;
          ticks += st.delay || 0;
          return at;
        });
      };
      const tickText = (n) => {
        const interval = TICK_MS[ms.game.tick_speed];
        return interval ? `${n} ticks (about ${fmtDuration(n * interval)})` : `${n} ticks`;
      };

      const tickF = () => {
        const g = ms.game;
        const interval = TICK_MS[g.tick_speed];
        if (!interval || !g.last_tick_processed_at || g.status !== 'active' || g.paused_at) return g.current_tick;
        return g.current_tick + Math.min(1, Math.max(0, (Date.now() - Date.parse(g.last_tick_processed_at)) / interval));
      };
      const SLIDE_MS = 700;
      const sliding = () => !!(ms.slide && Date.now() - ms.slide.at < SLIDE_MS);
      const viewTick = () => {
        const g = ms.game;
        if (!ms.slide || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return g.current_tick;
        const f = Math.min(1, (Date.now() - ms.slide.at) / SLIDE_MS);
        const e = f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
        return ms.slide.from + (g.current_tick - ms.slide.from) * e;
      };

      const edgePath = (a, b) => {
        if (ms.edgeMapFor !== ms.edges) { ms.edgeMap = new Map(ms.edges.map((e) => [e.from_territory_id + '-' + e.to_territory_id, e])); ms.edgeMapFor = ms.edges; }
        const e = ms.edgeMap.get(a + '-' + b) || ms.edgeMap.get(b + '-' + a);
        if (!e || !e.path || e.path.length < 2) return null;
        const pts = e.path.map((q) => ({ x: q[0], y: q[1] }));
        return e.from_territory_id === a ? pts : pts.reverse();
      };
      const alongPath = (pts, f) => {
        let total = 0;
        for (let k = 1; k < pts.length; k++) total += Math.hypot(pts[k].x - pts[k - 1].x, pts[k].y - pts[k - 1].y);
        let d = f * total;
        for (let k = 1; k < pts.length; k++) {
          const L = Math.hypot(pts[k].x - pts[k - 1].x, pts[k].y - pts[k - 1].y);
          if (d <= L || k === pts.length - 1) {
            const u = L ? Math.min(1, d / L) : 1;
            return { x: pts[k - 1].x + (pts[k].x - pts[k - 1].x) * u, y: pts[k - 1].y + (pts[k].y - pts[k - 1].y) * u, dx: pts[k].x - pts[k - 1].x, dy: pts[k].y - pts[k - 1].y };
          }
          d -= L;
        }
        return null;
      };

      const movementPos = (m, tf) => {
        const p = m.path;
        const a = m.path_arrival_ticks;
        const n = p.length;
        if (tf >= a[n - 1]) {
          const t = ms.t.get(p[n - 1]);
          return { x: t.x, y: t.y, i: n - 1 };
        }
        let i = 0;
        while (i < n - 2 && a[i + 1] <= tf) i++;
        const A = ms.t.get(p[i]);
        const B = ms.t.get(p[i + 1]);
        const d = a[i + 1] - a[i];
        const f = d <= 0 ? 1 : Math.min(1, Math.max(0, (tf - a[i]) / d));

      const cmdPos = (c, tf) => {

      };

      const computeVis = () => {
        ms.vis = new Set([...ms.t.values()].filter((t) => t.seen).map((t) => t.id));

      const commanderSeen = () => true;

      const rulerPick = async (id) => {

      const rulerPanel = () => {

            h('div', { style: `margin-top:6px;color:${d.in_range ? '#7fd08a' : 'var(--gules-hi)'}` }, d.in_range ? 'Within your range now.' : d.route_error ? 'You cannot march there in one order.' : 'Out of your range in one march.'),

      const select = (type, id) => {

        ms.scr = null;

        ms.stack = [];
        ms.scr = null;
        ms.sel = null;
        ms.tab = 'info';
        ms.navDir = 'back';
        if (location.hash !== hashFor()) history.replaceState(null, '', hashFor());
        render();
        drawSide();
        drawHud();
      };
      const MAIL_SUB = { inbox: 'reports', reports: 'reports', messages: 'messages', chat: 'chat', news: 'events', events: 'events' };
      const openTab = async (k) => {
        const sub = MAIL_SUB[k] || ms.mailTab || 'reports';

        render();

        return () => { if (ms.scr && ms.scr.content === content) goBack(); };
      };
      state.cleanup.push(() => { slotHost = null; });
      const applyHash = () => {
        const m = location.hash.match(/^#g(\d+)(?:\/([tc])(\d+))?/);

      const flashSection = (name) => {

      const addStop = (id) => {

        if (id === last) return;

        }

        drawSide();
      };

      const previewTo = async (id) => {

      const fmtDuration = (msec) => {

      };

      const initTerrain = () => {

        const d = (r) => 'M' + r.p.map((q) => `${q[0]} ${q[1]}`).join(' L');
        L.rivers.replaceChildren(...ms.terr.rivers.flatMap((r) => [
          sv('path', { d: d(r), fill: 'none', stroke: '#2f6aa3', 'stroke-width': (4 + r.w * 1.6) * M(), 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.9, style: 'pointer-events:none' }),
          sv('path', { d: d(r), fill: 'none', stroke: '#7fb9ea', 'stroke-width': (2 + r.w * 1.1) * M(), 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.95, style: 'pointer-events:none' }),
        ]));
        const bridge = (x, y) => sv('g', { transform: `translate(${x},${y}) scale(${M()})` },
          sv('rect', { x: -9, y: -4, width: 18, height: 8, rx: 1, fill: '#c9a46a', stroke: '#2a2418', 'stroke-width': 1.2 }),
          sv('line', { x1: -9, y1: -1, x2: 9, y2: -1, stroke: '#2a2418', 'stroke-width': 0.8 }),
          sv('line', { x1: -9, y1: 2, x2: 9, y2: 2, stroke: '#2a2418', 'stroke-width': 0.8 }));
        const gap = (x, y) => sv('g', { transform: `translate(${x},${y}) scale(${M()})` },
          sv('path', { d: 'M-9,5 L-4,-6 L0,1 L4,-6 L9,5 Z', fill: '#e8dcc2', stroke: '#2a2418', 'stroke-width': 1.2 }),
          sv('line', { x1: 0, y1: 1, x2: 0, y2: 5, stroke: '#2a2418', 'stroke-width': 1 }));

        if (ms.marching) { leaveMode(); render(); drawSide(); }
        else if (ms.ruler) toggleRuler();
        else if (ms.quick) toggleQuick();
        else if (!atHome()) goBack();
      };
      window.addEventListener('keydown', onKey);
      window.addEventListener('popstate', applyHash);
      applyHash();
      state.cleanup.push(() => { window.removeEventListener('keydown', onKey); window.removeEventListener('popstate', applyHash); if (location.hash) history.replaceState(null, '', location.pathname + location.search); clearTimeout(debounce); clearInterval(tickTimer); clearInterval(fxTimer); clearInterval(loadTimer); unwatch(); sb.removeChannel(channel); });
    }

    async function onSession(session, event) {
      state.session = session;
      if (!session) {
        clearCleanup();
        state.profile = null;
        state.view = 'auth';
        if (DEV_GUEST && await startGuest()) return;
        renderAuth(false);
        return;
      }
      if (event === 'PASSWORD_RECOVERY') {
        state.view = 'recovery';
        renderAuth(true);
        return;
      }
      if (state.view === 'recovery') return;
      if (['home', 'room', 'map', 'create', 'picking'].includes(state.view)) return;
      await loadProfile();
      await showHome();
    }

    initStage();

    sb.auth.onAuthStateChange((event, session) => {
      setTimeout(() => onSession(session, event), 0);
    });

    sb.auth.getSession().then(async ({ data }) => {
      if (data.session) return;
      if (DEV_GUEST && await startGuest()) return;
      renderAuth(false);
    });
  </script>
</body>
</html>
