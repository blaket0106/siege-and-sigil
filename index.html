          const sub = (k, label) => h('button', { class: ms.inboxTab === k ? 'primary' : '', onclick: () => { ms.inboxTab = k; ms.report = null; drawSide(); drawHud(); } }, label);
          if (ms.inboxTab === 'battles') markBattlesSeen();
          const bar = h('div', { class: 'row', style: 'margin:12px 0' }, sub('reports', 'Reports'), sub('battles', `Battles${ms.battles.length ? ` (${ms.battles.length})` : ''}`));
          const open = ms.report ? ms.battles.find((x) => x.id === ms.report) : null;
          let body;
          if (ms.inboxTab === 'battles') {
            body = open ? battleDetail(open) : [ms.battles.length ? ms.battles.map(battleRow) : h('div', { class: 'empty' }, 'No battles yet.')];
          } else {
            body = [h('div', { class: 'sec' }, ms.inbox.length
              ? ms.inbox.map((i) => feedRow(i.tick, i.title, ms.newIds.has(i.id)))
              : h('div', { class: 'empty' }, 'No reports yet.'))];
          }
          sideEl.replaceChildren(sideTabs(), bar, ...body.flat());
          return;
        }
        if (sel && sel.type === 't') {
          const t = ms.t.get(sel.id);
          const seen = ms.vis.has(t.id);
          const owner = seen ? t.owner_player_id : (ms.mem[t.id] ? ms.mem[t.id].o : null);
          parts.push(h('h3', {}, t.name), h('div', { style: 'color:var(--dim)' }, `Tier ${t.tier} · ${t.natural_resources} natural resources${t.region ? ' · ' + t.region : ''}${t.terrain ? ' · ' + (TERRAIN_NAMES[t.terrain] || t.terrain) : ''}${t.terrain === 'mountain' ? ' (defenders strike harder)' : ''}`));
          parts.push(h('div', { class: 'sec' },
            line('Owner', owner ? pname(owner) + (seen ? '' : ' (last seen)') : 'Unclaimed'),
            line('Troops', seen ? t.troops : 'Unknown'),
            seen && t.resources !== undefined && t.resources !== null && t.resources !== t.natural_resources ? line('Resources (with terraforming)', t.resources) : null,
            seen ? line('Treasury / Industry / Prestige', `${t.treasury_level} / ${t.industry_level} / ${t.prestige_level}`) : null,
            seen ? line('Road', t.has_road ? 'Yes' : 'No') : null,
            t.garrison_commander_id && seen ? line('Garrison leader', (ms.cmd.find((c) => c.id === t.garrison_commander_id) || {}).name || '') : null));
          const here = ms.cmd.filter((c) => c.current_territory_id === t.id && commanderSeen(c, tf));
          if (here.length) parts.push(h('div', { class: 'sec' }, h('b', {}, 'Commanders here'), here.map(cmdRow)));
          const fought = ms.battles.filter((b) => b.territory_id === t.id);
          if (fought.length) parts.push(h('div', { class: 'sec' }, h('b', {}, 'Battles here'), fought.map(battleRow)));
          parts.push(siegeSection(t), buildSection(t));
          const reachRange = ms.game.free_travel ? rangeOf(myStables()) : Infinity;
          const links = ms.edges.filter((e) => (e.from_territory_id === t.id || e.to_territory_id === t.id) && e.length <= reachRange)
            .map((e) => ({ t: ms.t.get(e.from_territory_id === t.id ? e.to_territory_id : e.from_territory_id), len: e.length, kind: e.kind, mult: e.move_cost_mult }))
            .sort((a, b) => a.len - b.len);
          parts.push(h('div', { class: 'sec' }, h('b', {}, ms.game.free_travel ? 'Within your range' : 'Roads to'), links.slice(0, ms.game.free_travel ? 14 : 99).map((l) => h('button', { class: 'cmdrow', onclick: () => select('t', l.t.id) }, l.t.name, h('span', { style: 'color:var(--dim);margin-left:auto' }, `${l.kind && l.kind !== 'land' ? EDGE_NAMES[l.kind] + ' · ' : ''}${l.mult > 1.05 ? 'slow ×' + l.mult.toFixed(1) + ' · ' : ''}${Math.round(l.len)}`)))));
        } else if (sel && sel.type === 'c') {
          const c = ms.cmd.find((x) => x.id === sel.id);
          if (!c || !commanderSeen(c, tf)) {
            ms.sel = null;
            drawSide();
            return;
          }
          const ab = ms.abil.get(c.id) || {};
          const m = ms.mov.get(c.id);
          parts.push(h('h3', {}, `${c.role === 'king' ? '♛ ' : ''}${c.name}`),
            h('div', { style: 'color:var(--dim)' }, `${pname(c.owner_player_id)} · ${c.school}${c.council_area ? ` · Councillor of the ${AREA_NAMES[c.council_area] || c.council_area}` : ''}${c.promoted ? ' · Veteran' : ''}`));
          parts.push(h('div', { class: 'sec' },
            line('Rank', rankOf(c)),
            line('Troops', c.troops),
            line('Status', c.status),
            c.current_territory_id ? line('At', ms.t.get(c.current_territory_id).name) : null,
            c.status === 'moving' && m ? line('Heading to', `${ms.t.get(m.to_territory_id).name} (tick ${m.arrival_tick})`) : null));
          const known = Object.entries(ab).filter(([, v]) => v > 0);
          parts.push(h('div', { class: 'sec' }, h('b', {}, 'Abilities'),
            known.length ? known.map(([k, v]) => line(ABILITY_NAMES[k] || k, v)) : h('div', { class: 'empty' }, 'None yet')));
          parts.push(commanderActions(c));
          if (c.current_territory_id) parts.push(h('div', { class: 'sec' }, h('button', { onclick: () => select('t', c.current_territory_id) }, 'Show territory')));
        } else {
          const pl = [...ms.players.values()].map((p) => ({ p, n: castlesOf(p.id) })).sort((a, b) => b.n - a.n);
          parts.push(h('h3', {}, 'Realm'), ...realmSection());
          parts.push(offersSection());
          parts.push(councilSection());
          parts.push(eventsSection());
          parts.push(prisonersSection());
          parts.push(h('div', { class: 'sec' }, h('b', {}, 'Standings'), pl.map(({ p, n }) => {
            const st = p.id === ms.me.id ? 'you' : dipStatus(p.id);
            const ctl = diplomacyControls(p);
            return h('div', { style: 'padding:6px 0;border-bottom:1px solid #20202b' },
              h('div', { class: 'line', style: 'border:none' },
                h('span', { style: 'color:var(--text)' }, dots(p.faction_slug), p.display_name, p.eliminated_at_tick !== null && p.eliminated_at_tick !== undefined ? h('span', { class: 'tag' }, 'out') : null),
                h('span', {}, `${n} · ${st === 'neutral' ? '' : st.replace('_', ' ')}`)),
              profileLine(p),
              p.id !== ms.me.id || ctl ? h('div', { class: 'row wrap2', style: 'margin-top:4px' }, ctl, p.id !== ms.me.id && !p.is_ai ? h('button', { onclick: () => openDm(p.id) }, 'Message') : null, p.id !== ms.me.id && !p.is_ai && canAct() && !(p.eliminated_at_tick != null) ? h('button', { onclick: () => sendGoldDialog(p) }, 'Send gold') : null) : null);
          })));
          if (canAct() && ms.players.size > 2) parts.push(h('div', { class: 'sec' }, h('button', { onclick: mediationDialog }, 'Offer mediation')));
          parts.push(h('div', { class: 'sec', style: 'color:var(--dim);font-size:.8rem' }, 'Click a castle or commander for details. Drag to pan, scroll to zoom. A gold ring marks a king.'));
        }
        sideEl.replaceChildren(sideTabs(), ...parts.filter(Boolean));
      };

      const toMap = (e) => new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
      const applyView = () => {
        svg.setAttribute('viewBox', `${ms.view.x} ${ms.view.y} ${ms.view.w} ${ms.view.h}`);
        svg.classList.toggle('zoomed', !!ms.full && ms.view.w < ms.full.w * 0.5);
      };

      svg.addEventListener('wheel', (e) => {
        e.preventDefault();
        const pt = toMap(e);
        const v = ms.view;
        const nw = Math.min(ms.full.w * 1.3, Math.max(ms.full.w / 8, v.w * Math.exp(e.deltaY * 0.0015)));
        const k = nw / v.w;
        ms.view = { x: pt.x - (pt.x - v.x) * k, y: pt.y - (pt.y - v.y) * k, w: nw, h: v.h * k };
        applyView();
      }, { passive: false });

      let pinch = null;
      const touchDist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
      svg.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 2) return;
        const mid = { clientX: (e.touches[0].clientX + e.touches[1].clientX) / 2, clientY: (e.touches[0].clientY + e.touches[1].clientY) / 2 };
        pinch = { d: touchDist(e.touches), view: { ...ms.view }, at: toMap(mid) };
        ms.dragged = true;
      }, { passive: true });
      svg.addEventListener('touchmove', (e) => {
        if (!pinch || e.touches.length !== 2) return;
        e.preventDefault();
        const nw = Math.min(ms.full.w * 1.3, Math.max(ms.full.w / 8, pinch.view.w * (pinch.d / touchDist(e.touches))));
        const k = nw / pinch.view.w;
        ms.view = { x: pinch.at.x - (pinch.at.x - pinch.view.x) * k, y: pinch.at.y - (pinch.at.y - pinch.view.y) * k, w: nw, h: pinch.view.h * k };
        applyView();
      }, { passive: false });
      svg.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) pinch = null;
        setTimeout(() => { ms.dragged = false; }, 0);
      }, { passive: true });

      svg.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        const start = { x: e.clientX, y: e.clientY, view: { ...ms.view } };
        const scale = svg.getScreenCTM().a;
        ms.dragged = false;
        const move = (ev) => {
          if (pinch) return;
          const dx = ev.clientX - start.x;
          const dy = ev.clientY - start.y;
          if (Math.hypot(dx, dy) > 4) ms.dragged = true;
          if (!ms.dragged) return;
          ms.view = { ...start.view, x: start.view.x - dx / scale, y: start.view.y - dy / scale };
          applyView();
        };
        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          setTimeout(() => { ms.dragged = false; }, 0);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      });

      svg.addEventListener('click', (e) => {
        if (e.target === svg) select(null);
      });

      let firstLoad = true;
      const load = async () => {
        if (state.view !== 'map' || state.roomId !== gameId) return;
        const res = await Promise.all([
          sb.rpc('get_game_view', { p_game_id: gameId }),
          sb.from('game_moments').select('*').eq('game_id', gameId).order('id', { ascending: false }).limit(100),
          sb.from('player_inbox').select('*').eq('game_id', gameId).order('id', { ascending: false }).limit(100),
          sb.from('battle_reports').select('*').eq('game_id', gameId).order('id', { ascending: false }).limit(100),
          sb.from('game_chat').select('*').eq('game_id', gameId).order('id', { ascending: false }).limit(150),
          sb.from('message_threads').select('*').eq('game_id', gameId),
          sb.from('thread_participants').select('*').eq('game_id', gameId),
          ms.edges ? Promise.resolve({ data: ms.edges }) : sb.from('territory_edges').select('*').eq('game_id', gameId),
          sb.rpc('my_diplomacy_offers', { p_game_id: gameId }),
          sb.rpc('my_world_events', { p_game_id: gameId }),
          sb.rpc('my_council', { p_game_id: gameId }),
        ]);
        if (state.view !== 'map' || state.roomId !== gameId) return;

        const [vw, mo, ib, br, ch, th, pt, ed, of, we, cn] = res;
        if (vw.error && vw.error.message.includes('not in this game')) { toast('That game is no longer available.'); return showHome(); }
        const failed = res.find((r) => r.error);
        if (failed) { toast(failed.error.message); return; }
        const view = vw.data;
        const threadIds = th.data.map((t) => t.id);
        const tm = threadIds.length
          ? await sb.from('thread_messages').select('*').in('thread_id', threadIds).order('id', { ascending: false }).limit(500)
          : { data: [] };
        if (tm.error) { toast(tm.error.message); return; }
        if (state.view !== 'map' || state.roomId !== gameId) return;
        ms.game = view.game;
        ms.players = new Map(view.players.map((p) => [p.id, p]));
        ms.me = ms.players.get(view.me);
        ms.t = new Map(view.territories.map((t) => [t.id, t]));
        ms.standings = view.standings;
        ms.serverSources = view.sources;
        ms.cmd = view.commanders;
        ms.captives = view.captives || [];
        ms.abil = new Map();
        view.abilities.forEach((a) => {
          const m = ms.abil.get(a.commander_id) || {};
          m[a.ability] = a.level;
          ms.abil.set(a.commander_id, m);
        });
        ms.mov = new Map(view.movements.map((m) => [m.commander_id, m]));
        ms.areas = view.areas;
        ms.wl = (view.areas.find((a) => a.area === 'watchtowers') || { level: 0 }).level;
        ms.dip = view.diplomacy;
        ms.offers = of.data.offers;
        ms.worldEvents = we.data;
        ms.council = cn.data;
        ms.deals = of.data.deals;
        ms.locks = of.data.locks;
        ms.moments = mo.data;
        ms.inbox = ib.data;
        ms.battles = br.data;
        if (view.game.tick_speed === 'turn_based' && view.game.status === 'active') {
          const ts = await sb.rpc('turn_status', { p_game_id: gameId });
          ms.turn = ts.data || null;
        } else {
          ms.turn = null;
        }
        const humanIds = view.players.filter((p) => p.user_id).map((p) => p.user_id);
        const profRes = await sb.from('profiles').select('user_id, honor, infamy, total_games, total_wins').in('user_id', humanIds);
        ms.profiles = new Map((profRes.data || []).map((x) => [x.user_id, x]));
        ms.chat = ch.data.slice().reverse();
        ms.threads = new Map(th.data.map((t) => [t.id, { id: t.id, parts: [], msgs: [], read: null }]));
        pt.data.forEach((x) => {
          const t = ms.threads.get(x.thread_id);
          if (!t) return;
          t.parts.push(x.player_id);
          if (x.player_id === ms.me.id) t.read = x.last_read_at;
        });
        tm.data.slice().reverse().forEach((m) => {
          const t = ms.threads.get(m.thread_id);
          if (t) t.msgs.push(m);
        });
        ms.routes = new Map();
        view.routes.sort((a, b) => a.id - b.id).forEach((r) => ms.routes.set(r.commander_id, r));
        if (!ms.edges) {
          ms.edges = ed.data;
          ms.cells = voronoiCells([...ms.t.values()], view.game.map_w, view.game.map_h);
          const artRow = await sb.from('games').select('map_art').eq('id', gameId).maybeSingle();
          ms.art = artRow.data && artRow.data.map_art ? artRow.data.map_art : null;
          if (ms.art) initTerrain();
        }
        if (firstLoad) {
          firstLoad = false;
          const pad = 40 * ((view.game && view.game.world_scale) || 1);
          ms.full = { x: -pad, y: -pad, w: view.game.map_w + 2 * pad, h: view.game.map_h + 2 * pad };
          ms.view = { ...ms.full };
          const cap = ms.me && ms.t.get(ms.me.capital_territory_id);
          const viewW = 150 * 6 * ((view.game && view.game.world_scale) || 1);
          if (cap && ms.full.w > viewW * 1.1) ms.view = { x: cap.x - viewW / 2, y: cap.y - viewW / 2, w: viewW, h: viewW };
          applyView();
        }
        render();
        drawSide();
      };

      await load();

      let debounce = null;
      const kick = () => { clearTimeout(debounce); debounce = setTimeout(load, 300); };
      const unwatch = watchGame(gameId, kick);
      const f = `game_id=eq.${gameId}`;
      let channel = sb.channel('map-data-' + gameId);
      ['diplomacy', 'realm_areas', 'game_moments', 'player_inbox', 'game_chat'].forEach((table) => {
        channel = channel.on('postgres_changes', { event: '*', schema: 'public', table, filter: f }, kick);
      });
      channel = channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'thread_messages' }, kick);
      channel.subscribe();
      let animStep = 0;
      const tickTimer = setInterval(() => {
        if (!ms.game) return;
        animStep = (animStep + 1) % 4;
        if (ms.mov.size || animStep === 0) renderDyn();
        if (animStep === 0) updateCountdown();
      }, 250);
      const loadTimer = setInterval(load, 20000);
      const onKey = (e) => {
        if (e.key !== 'Escape' || document.activeElement instanceof HTMLInputElement) return;
        if (ms.marching) { ms.marching = false; ms.preview = null; ms.stops = []; render(); drawSide(); }
        else if (ms.sel) select(null);
      };
      window.addEventListener('keydown', onKey);
      state.cleanup.push(() => { window.removeEventListener('keydown', onKey); clearTimeout(debounce); clearInterval(tickTimer); clearInterval(loadTimer); unwatch(); sb.removeChannel(channel); });
    }

    async function onSession(session, event) {
      state.session = session;
      if (!session) {
        clearCleanup();
        state.profile = null;
        state.view = 'auth';
        if (DEV_GUEST && await startGuest()) return;
        renderAuth(false);
        return;
      }
      if (event === 'PASSWORD_RECOVERY') {
        state.view = 'recovery';
        renderAuth(true);
        return;
      }
      if (state.view === 'recovery') return;
      if (state.view === 'home' || state.view === 'room' || state.view === 'map') return;
      await loadProfile();
      await showHome();
    }

    sb.auth.onAuthStateChange((event, session) => {
      setTimeout(() => onSession(session, event), 0);
    });

    sb.auth.getSession().then(async ({ data }) => {
      if (data.session) return;
      if (DEV_GUEST && await startGuest()) return;
      renderAuth(false);
    });
  </script>
</body>
</html>
