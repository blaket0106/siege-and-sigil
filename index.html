    function h(tag, props, ...kids) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(props || {})) {
        if (v === undefined || v === null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else if (k === 'value') el.value = v;
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
      for (const kid of kids.flat()) {
        if (kid === null || kid === undefined || kid === false) continue;
        el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      }
      return el;
    }

    const Sfx = (() => {
      let ac = null;
      let master = null;
      let pad = null;
      let on = true;
      let music = true;
      try { on = localStorage.getItem('ss-sound') !== '0'; music = localStorage.getItem('ss-music') !== '0'; } catch {}
      const ensure = () => {
        if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = on ? 0.9 : 0;
        const comp = ac.createDynamicsCompressor();
        master.connect(comp);
        comp.connect(ac.destination);
        return ac;
      };
      const tone = (freq, dur, o = {}) => {
        if (!on || !ensure()) return;
        const t0 = ac.currentTime + (o.at || 0);
        const osc = ac.createOscillator();
        const g = ac.createGain();
        const f = ac.createBiquadFilter();
        osc.type = o.type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t0 + dur);
        f.type = 'lowpass';
        f.frequency.value = o.cut || 6000;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t0 + (o.attack || 0.006));
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(f); f.connect(g); g.connect(master);
        osc.start(t0); osc.stop(t0 + dur + 0.05);
      };
      const noise = (dur, o = {}) => {
        if (!on || !ensure()) return;
        const t0 = ac.currentTime + (o.at || 0);
        const buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        const src = ac.createBufferSource();
        src.buffer = buf;
        const f = ac.createBiquadFilter();
        f.type = 'bandpass';
        f.frequency.value = o.freq || 2000;
        const g = ac.createGain();
        g.gain.value = o.vol || 0.1;
        src.connect(f); f.connect(g); g.connect(master);
        src.start(t0);
      };
      const startMusic = () => {
        if (pad || !music || !ensure()) return;
        const out = ac.createGain();
        out.gain.value = 0.0001;
        out.gain.exponentialRampToValueAtTime(0.05, ac.currentTime + 6);
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 520;
        const lfo = ac.createOscillator();
        const lfoG = ac.createGain();
        lfo.frequency.value = 0.06;
        lfoG.gain.value = 220;
        lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
        const roots = [110, 98, 123.47, 87.31];
        const oscs = [];
        [1, 1.5, 2, 3].forEach((m, i) => {
          [-5, 5].forEach((det) => {
            const o = ac.createOscillator();
            o.type = i < 2 ? 'sawtooth' : 'triangle';
            o.frequency.value = roots[0] * m;
            o.detune.value = det;
            const g = ac.createGain();
            g.gain.value = i < 2 ? 0.5 : 0.25;
            o.connect(g); g.connect(lp); o.start();
            oscs.push({ o, m });
          });
        });
        lp.connect(out); out.connect(master);
        let step = 0;
        const timer = setInterval(() => {
          step = (step + 1) % roots.length;
          oscs.forEach(({ o, m }) => o.frequency.setTargetAtTime(roots[step] * m, ac.currentTime, 3));
        }, 14000);
        pad = { out, timer, oscs };
      };
      const stopMusic = () => {
        if (!pad) return;
        clearInterval(pad.timer);
        const p = pad;
        pad = null;
        p.out.gain.setTargetAtTime(0.0001, ac.currentTime, 0.6);
        setTimeout(() => p.oscs.forEach(({ o }) => { try { o.stop(); } catch {} }), 2500);
      };
      return {
        get on() { return on; },
        get music() { return music; },
        click: () => { tone(900, 0.05, { type: 'triangle', vol: 0.07 }); noise(0.03, { freq: 3500, vol: 0.05 }); },
        ok: () => { tone(523.25, 0.18, { type: 'triangle', vol: 0.12 }); tone(783.99, 0.28, { type: 'triangle', vol: 0.1, at: 0.08 }); },
        bad: () => { tone(150, 0.28, { type: 'sawtooth', vol: 0.13, slide: 90, cut: 700 }); },
        bell: () => { [1, 2.4, 3.9].forEach((m, i) => tone(329.63 * m, 2.2 - i * 0.5, { vol: 0.14 / (i + 1), attack: 0.004 })); },
        fanfare: () => { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.32, { type: 'triangle', vol: 0.12, at: i * 0.1, attack: 0.01 })); },
        lost: () => { [392, 311.13, 233.08].forEach((f, i) => tone(f, 0.45, { type: 'sawtooth', vol: 0.09, at: i * 0.16, cut: 800 })); },
        alarm: () => { [0, 0.28, 0.56].forEach((at) => tone(740, 0.2, { type: 'square', vol: 0.06, at, cut: 1800 })); },
        horn: () => { tone(98, 1.5, { type: 'sawtooth', vol: 0.16, attack: 0.3, cut: 500 }); tone(147, 1.5, { type: 'sawtooth', vol: 0.1, attack: 0.35, cut: 500 }); },
        toggle: () => {
          on = !on;
          try { localStorage.setItem('ss-sound', on ? '1' : '0'); } catch {}
          ensure();
          if (master) master.gain.setTargetAtTime(on ? 0.9 : 0, ac.currentTime, 0.1);
          if (on) { startMusic(); tone(660, 0.12, { type: 'triangle', vol: 0.1 }); } else stopMusic();
          return on;
        },
        wake: () => { if (on) startMusic(); },
      };
    })();

    function stageEmbers(light) {
      const el = stageFx.embers;
      const ctx = el.getContext('2d');
      const resize = () => { el.width = window.innerWidth; el.height = window.innerHeight; };
      resize();
      stageFx.parts = Array.from({ length: light ? 28 : 46 }, () => ({ x: Math.random() * el.width, y: Math.random() * el.height, r: 0.6 + Math.random() * 1.8, v: 0.12 + Math.random() * 0.4, a: Math.random() * Math.PI * 2, s: 0.003 + Math.random() * 0.01 }));
      const frame = () => {
        stageFx.raf = requestAnimationFrame(frame);
        if (document.hidden || document.body.classList.contains('in-map')) return;
        if (el.width !== window.innerWidth || el.height !== window.innerHeight) resize();
        ctx.clearRect(0, 0, el.width, el.height);
        const dark = document.documentElement.getAttribute('data-theme') !== 'light';
        stageFx.parts.forEach((p) => {
          p.y -= p.v; p.a += p.s; p.x += Math.sin(p.a) * 0.35;
          if (p.y < -10) { p.y = el.height + 10; p.x = Math.random() * el.width; }
          const flick = 0.55 + 0.45 * Math.sin(p.a * 6);
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
          g.addColorStop(0, dark ? `rgba(255,190,90,${0.9 * flick})` : `rgba(110,80,30,${0.35 * flick})`);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 5, 0, Math.PI * 2); ctx.fill();
        });
      };
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) frame();
    }

      document.body.append(overlay);
      const first = overlay.querySelector('input:not([type=checkbox]), select');
      if (first) first.focus();
      return close;

    function shieldSvg(H, width, opts = {}) {
      sigilDefs();
      const lod = width >= 56 ? 2 : width >= 30 ? 1 : 0;
      const C = CHARGES[H.ch] || CHARGES.star;
      const cy = (H.div === 'chief' ? 66 : 56) + C.dy;
      const inner = lod === 2 ? C.svg : C.svg;
      const chargeFill = C.fill ? `<g fill="url(#sg-gilt)"${lod < 2 ? ' stroke="rgba(0,0,0,.6)" stroke-width="1.6" paint-order="stroke" stroke-linejoin="round"' : ''}>${inner}</g>` : inner;
      const charge = `<g transform="translate(50 ${cy}) scale(1.28)"${lod === 2 ? ' filter="url(#sg-relief)"' : ''}>${chargeFill}</g>`;
      const rimW = lod === 2 ? 6.2 : 7.5;
      const svgText = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 124" width="${width}" height="${sigH(width)}" class="sigil${H.cls ? ' ' + H.cls : ''}${opts.draw ? ' draw' : ''}" role="img" aria-label="${H.name} arms" style="overflow:visible">
        <path d="${SHIELD}" fill="${H.c1}"/>
        <g clip-path="url(#sg-clip)">

    function loginWorld(opts, seed0) {
      const src = 'self.onmessage = async (e) => { try { const m = await import(e.data.url); self.postMessage({ ok: true, layout: m.generateWorld(e.data.opts) }); } catch (err) { self.postMessage({ ok: false, error: String((err && err.message) || err) }); } };';

          if (e.data.ok) { worker.terminate(); resolve(e.data.layout); return; }
          if (++tries < 8) { seed += 7919; attempt(); return; }

        attempt();

    }

    function flightTrack(api, castles, altitude) {
      const N = 900;
      const M = 48;
      const blur = (arr, w, passes) => {
        let a = arr;
        for (let p = 0; p < passes; p++) {
          const out = new Array(N);
          for (let i = 0; i < N; i++) { let s = 0; for (let k = -w; k <= w; k++) s += a[(i + k + N) % N]; out[i] = s / (2 * w + 1); }
          a = out;
        }
        return a;
      };
      const mx = castles.reduce((s, q) => s + q.x, 0) / castles.length;
      const mz = castles.reduce((s, q) => s + q.z, 0) / castles.length;
      const sum = new Array(M).fill(0);
      const cnt = new Array(M).fill(0);
      let rAll = 0;
      castles.forEach((q) => {
        const r = Math.hypot(q.x - mx, q.z - mz);
        rAll += r;
        const k = Math.floor(((Math.atan2(q.z - mz, q.x - mx) + Math.PI) / (2 * Math.PI)) * M) % M;
        sum[k] += r; cnt[k] += 1;
      });
      rAll /= castles.length;
      let rad = sum.map((s, k) => (cnt[k] ? s / cnt[k] : rAll));
      for (let pass = 0; pass < 8; pass++) rad = rad.map((_, k) => (rad[(k + M - 2) % M] + 2 * rad[(k + M - 1) % M] + 3 * rad[k] + 2 * rad[(k + 1) % M] + rad[(k + 2) % M]) / 9);
      const rawX = [];
      const rawZ = [];
      for (let i = 0; i < N; i++) {
        const fb = (i / N) * M - 0.5;
        const k0 = Math.floor(fb);
        const fr = fb - k0;
        const rr = Math.max((rad[((k0 % M) + M) % M] * (1 - fr) + rad[(((k0 + 1) % M) + M) % M] * fr) * 0.92, rAll * 0.5);
        const ang = (i / N) * 2 * Math.PI - Math.PI;
        rawX.push(mx + rr * Math.cos(ang)); rawZ.push(mz + rr * Math.sin(ang));
      }
      const X = blur(rawX, 8, 2);
      const Z = blur(rawZ, 8, 2);
      const off = Math.min(300, rAll * 0.2);
      const CX = [];
      const CZ = [];
      for (let i = 0; i < N; i++) {
        const dx = X[(i + 8) % N] - X[(i - 8 + N) % N];
        const dz = Z[(i + 8) % N] - Z[(i - 8 + N) % N];
        const l = Math.hypot(dx, dz) || 1;
        CX.push(X[i] - (dz / l) * off); CZ.push(Z[i] + (dx / l) * off);
      }
      const lift = (x, z) => { let m = 0; for (const s of castles) { const d = Math.hypot(s.x - x, s.z - z); if (d < 650) m = Math.max(m, 230 * (1 - d / 650)); } return m; };
      const ahead = (i, n, drop) => api.groundAt(CX[(i + n) % N], CZ[(i + n) % N]) + lift(CX[(i + n) % N], CZ[(i + n) % N]) - drop;
      const gmax = CX.map((x, i) => Math.max(api.groundAt(x, CZ[i]) + lift(x, CZ[i]), ahead(i, 15, 20), ahead(i, 30, 40)));
      let Y = blur(gmax.map((g) => g + altitude), 55, 3);
      Y = blur(Y.map((y, i) => Math.max(y, gmax[i] + 120)), 25, 2);
      const len = CX.reduce((s, x, i) => s + Math.hypot(CX[(i + 1) % N] - x, CZ[(i + 1) % N] - CZ[i]), 0);
      return { N, CX, CZ, Y, LA: Math.round(N * 0.045), len };
    }

    async function startLoginFlyover(host, caption) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (navigator.connection && navigator.connection.saveData) return;
      if (window.innerWidth < 900 || window.matchMedia('(pointer: coarse)').matches) return;
      let stopped = false;
      let api = null;
      const alive = () => host.isConnected && !stopped;
      state.cleanup.push(() => { stopped = true; if (api) { try { api.dispose(); } catch {} } });
      try {
        const presets = ['highlands', 'river_valley', 'continental'];
        const seed0 = Math.floor(Math.random() * 2 ** 30) + 1;
        const layout = await loginWorld({ players: 3, mapSize: 'compact', startingTerritories: 4, style: 'scatter', startingGarrison: 10, scale: 2.6, freeTravel: false, shape: 'continent', richness: 'standard', randomRoads: 'none', starScatter: 'random', mirrored: false, trails: true, preset: presets[seed0 % 3], homeDistance: 'medium' }, seed0);
        if (!alive()) return;
        const { createMap3D } = await import('./map3d.js');
        if (!alive()) return;
        const seats = ['kaldran', 'veyra', 'thornwick'];
        const sites = layout.territories.map((t, i) => ({ id: i, x: t.x, y: t.y, tier: t.tier, name: t.name, terrain: t.terrain, crossing_kind: t.crossing_kind || null, junction: !!t.junction, owner: null, troops: null, mine: false }));
        const edges = layout.edges.map((e) => ({ a: e.a, b: e.b, kind: e.kind, length: e.length, mult: e.move_cost_mult, path: e.path }));
        let track = null;
        let castles = [];
        let frames = 0;
        let t0 = 0;
        let checked = false;
        let label = '';
        const giveUp = () => { stopped = true; host.classList.remove('on'); setTimeout(() => { if (api) { try { api.dispose(); } catch {} api = null; } }, 2400); };
        const made = await createMap3D(host, {
          map_w: layout.map_w, art: layout.art, sites, edges, lowQuality: false,
          colors: (pid) => { const f = factionOf(seats[pid]); return [f.color, f.color2]; },
          sun: FLIGHT.sun, horizon: FLIGHT.horizon, fogMul: FLIGHT.fog, exposure: FLIGHT.exposure,
          onFrame: (t, dt, cam, controls) => {
            if (!track || stopped) return;
            if (!t0) t0 = performance.now();
            frames += 1;
            const el = performance.now() - t0;
            if (!checked && el > 6000) { checked = true; if ((frames * 1000) / el < 18) { giveUp(); return; } }
            controls.enabled = false; controls.maxPolarAngle = Math.PI * 0.62; controls.minDistance = 1;
            if (Math.abs(cam.fov - FLIGHT.fov) > 0.01) { cam.fov = FLIGHT.fov; cam.updateProjectionMatrix(); }
            const f = ((((t * FLIGHT.speed) / track.len) % 1) + 1) % 1 * track.N;
            const at = (arr, k) => { const i = Math.floor(k) % track.N; const j = (i + 1) % track.N; const r = k - Math.floor(k); return arr[i] * (1 - r) + arr[j] * r; };
            const px = at(track.CX, f); const pz = at(track.CZ, f); const py = at(track.Y, f);
            const lx = at(track.CX, f + track.LA); const lz = at(track.CZ, f + track.LA);
            const ly = py - Math.hypot(lx - px, lz - pz) * Math.tan(FLIGHT.pitch);
            cam.position.set(px, py, pz); cam.up.set(0, 1, 0); cam.lookAt(lx, ly, lz);
            controls.target.set(lx, Math.max(made.groundAt(lx, lz), 20), lz);
            let near = null; let nd = 1e9;
            for (const s of castles) { const d = Math.hypot(s.x - px, s.z - pz); if (d < nd) { nd = d; near = s; } }
            if (near && nd < 1500 && near.name !== label) {
              label = near.name;
              const owner = sites[near.id].owner;
              caption.replaceChildren(document.createTextNode(owner != null ? `LANDS OF HOUSE ${factionOf(seats[owner]).name.toUpperCase()}` : 'FREE HOLDING'), h('b', {}, near.name.toUpperCase()));
              caption.classList.add('on');
            } else if (nd >= 1800 && label) { label = ''; caption.classList.remove('on'); }
          },
        });
        api = made;
        if (!alive()) { try { made.dispose(); } catch {} api = null; return; }
        made.update(layout.territories.map((t, i) => ({ id: i, owner: t.owner_seat, troops: t.owner_seat != null ? 10 + (i % 7) * 3 : 12, mine: false })));
        castles = made.sites().filter((s) => !sites[s.id].crossing_kind && !sites[s.id].junction);
        track = flightTrack(made, castles, FLIGHT.alt);
        host.classList.add('on');
      } catch (err) {
        console.warn('Login fly-over unavailable:', err);
        if (api) { try { api.dispose(); } catch {} api = null; }
      }
    }

        if (tab === 'signin' || tab === 'signup') kids.push(h('div', { class: 'switch' }, h('button', { type: 'button', class: 'link', onclick: () => { state.authTab = tab = tab === 'signin' ? 'signup' : 'signin'; draw(); } }, tab === 'signin' ? 'New here? Create an account' : 'Have an account? Sign in')));

      };

      form.addEventListener('submit', async (e) => {

            if (password.value.length < 8) throw new Error('Password must be at least 8 characters');
            const { error } = await sb.auth.updateUser({ password: password.value });
            if (error) throw error;
            toast('Password updated', true);
            await showHome();
          }
        });
      });

      draw();
      const slugs = Object.keys(FACTION_FALLBACK);
      let current = slugs[Math.floor(Math.random() * slugs.length)];
      const crestHost = h('div', { class: 'bigcrest' });
      const houseName = h('div', { class: 'housename' });
      const buttons = slugs.map((sl) => h('button', { type: 'button', class: 'housebtn', 'aria-label': factionOf(sl).name, onmouseenter: () => showCrest(sl), onfocus: () => showCrest(sl), onclick: () => showCrest(sl) }, sigil(sl, 40)));
      function showCrest(sl, first) {
        if (sl === current && !first) return;
        current = sl;
        crestHost.replaceChildren(sigil(sl, 190, { draw: first }));
        if (!first) { crestHost.classList.remove('swap'); void crestHost.offsetWidth; crestHost.classList.add('swap'); }
        houseName.textContent = `House ${factionOf(sl).name}`;
        buttons.forEach((btn, i) => btn.classList.toggle('on', slugs[i] === sl));
      }
      showCrest(current, true);
      const flyHost = h('div', { class: 'flyover' });
      const caption = h('div', { class: 'lower' });
      mount(h('div', { class: 'login' },
        h('div', { class: 'login-poster' }), flyHost,
        h('div', { class: 'login-grade' }), h('div', { class: 'login-vignette' }),
        h('aside', { class: 'login-rail' },
          crestHost,
          h('h1', {}, 'Siege & Sigil'),
          h('div', { class: 'rule' }),
          h('p', { class: 'lede' }, 'Raise a house. Hold the castles.'),
          h('div', { class: 'auth-card' }, form),
          h('div', { class: 'roster', role: 'group', 'aria-label': 'The eight houses' }, buttons),
          houseName),
        caption));
      setTimeout(() => startLoginFlyover(flyHost, caption), 700);
    }

    function topbar() {
      const light = document.documentElement.getAttribute('data-theme') === 'light';
      setTimeout(refreshFriendBadge, 0);
      return h('div', { class: 'topbar' },
        h('button', { class: 'brandmark', onclick: showHome, 'aria-label': 'Siege and Sigil home' }, emblem(30), h('span', {}, 'Siege & Sigil')),

          h('button', { class: 'ghost hide-m', onclick: helpDialog }, 'How to play'),
          h('button', { class: 'iconbtn', id: 'soundbtn', onclick: (e) => { const on = Sfx.toggle(); e.currentTarget.replaceChildren(icon(on ? 'sound' : 'mute')); }, title: 'Sound on or off', 'aria-label': 'Toggle sound' }, icon(Sfx.on ? 'sound' : 'mute')),
          h('button', { class: 'iconbtn', id: 'themebtn', onclick: toggleTheme, title: 'Switch theme', 'aria-label': 'Switch between dark and light theme' }, icon(light ? 'moon' : 'sun')),
          h('button', { class: 'ghost', onclick: () => sb.auth.signOut() }, DEV_GUEST ? 'New guest' : 'Sign out')));
    }

    const pluralN = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

    const combatSim = (aT, aD, dT, dD, defFirst = true) => {
      const rounds = [[aT, dT]];
      let a = aT;
      let d = dT;
      for (let g = 0; g < 2000 && a > 0 && d > 0; g++) {
        if (defFirst) { a = Math.max(0, a - dD); if (a > 0 && d > 0) d = Math.max(0, d - aD); } else { d = Math.max(0, d - aD); if (a > 0 && d > 0) a = Math.max(0, a - dD); }
        rounds.push([a, d]);
      }
      return rounds;
    };
    const troopsNeeded = (dT, dD, aD) => dD * Math.ceil(dT / Math.max(1, aD)) + 1;

    const MANUAL = [
      { id: 'basics', group: 'Start here', title: 'The basics', blocks: [
        ['p', 'Siege & Sigil is a game of castles and armies. You lead a house. Take [[map|castles]], grow their [[economy|income]], and hold more of the realm than anyone else. There are no dice: every [[battles|fight]] is arithmetic, so the player who plans better wins.'],
        ['h', 'What wins the game'],
        ['p', 'The first player to hold the share of castles shown in the "Road to victory" bar wins. The host sets it ([[hosting#rules|Hosting a game]]); half of all castles is the default. A player who loses every castle is eliminated. If only one player is left standing, that player wins.'],
        ['h', 'The story of the war'],
        ['p', 'When a game ends, "The story" button opens a chronicle of the whole campaign: who took the Hollow Crown and how, the war told in three chapters (the Scramble, the War and the Reckoning) with the castles each house took and the alliances, betrayals, fallen kings and eliminated houses, the heroes of the war with their portraits and deeds, and how every house stood at the end. It opens by itself the first time you enter a finished game, and you can reopen it from the game screen or your campaigns list.'],
        ['h', 'How time works'],
        ['p', 'The game runs in ticks. The host picks the speed: a tick is 2 hours, 1 hour, 30 minutes or 15 minutes, or the game is turn-based and moves forward when everyone ends their turn or the deadline passes. The game keeps running while you are away, so orders you give now are carried out as ticks pass.'],
        ['h', 'Your first ten minutes'],
        ['list', [
          'Click your starting castle and look at its three [[economy|upgrade tracks]].',
          'Spend your first gold on [[economy|Treasury]] at your richest castle, then on Recruitment. Income first, army second.',
          'Hire a [[commanders|commander]] from one of the three [[commanders#hiring|schools]] and move troops onto them.',
          '[[marching|Capture]] a neutral castle next to you. Neutral castles hold no troops and never grow any, so a single trooper takes one, and you can see how far each is by its trail.',
          'Open Standings and meet your neighbours ([[diplomacy|Diplomacy]]). A quiet border is worth more than one more army.',
        ]],
      ] },
      { id: 'screen', group: 'Start here', title: 'Reading the screen', blocks: [
        ['p', 'This is the map screen, where you spend nearly all of a game. The numbers in the picture match the list below it.'],
        ['diagram', 'screen'],
        ['table', { head: ['', 'What it shows'], rows: [
          ['1', 'The game name and the time to the next tick.'],
          ['2', 'Road to victory: how close the leader is to the castle share that wins ([[basics#what-wins-the-game|how you win]]).'],
          ['3', 'Your gold. It grows each production cycle ([[economy#how-production-works|production]]).'],
          ['4', 'Menu: Empires, Intel, Battle calculator, Game rules, Host tools, Options and this manual.'],
          ['5', 'Your castle. The plate shows its name and troops, and the ring is its colour.'],
          ['6', 'Castles you can reach with an order glow ([[marching#range|range]]).'],
          ['7', 'A route in progress ([[marching#routes|routes]]).'],
          ['8', 'The side panel. Info shows what you have selected, News lists events, Inbox holds messages and reports, Chat is the game channel.'],
          ['9', 'The legend: yours, other players, unclaimed and unknown ([[fog|fog of war]]). It also explains the markers.'],
        ] }],
        ['note', 'Click any castle or army to select it and see its actions in the Info tab.'],
        ['h', 'Finding your way'],
        ['list', [
          'The Next move box at the top of the Info tab tells you what to do first: put troops under a commander, then which neutral castle you can take now, with a button to send them. When troops are short it can send the army to collect a richer castle\'s garrison on arrival. It lists orders for up to three armies at once, and when troops sit in castles with no commander it tells you to hire one, because troops only fight under a commander. It looks at every free army, not just the strongest: a castle you lost comes first (retake), then unclaimed castles near any of your armies, then rival castles you can beat. When a castle of yours is under threat it shows the enemy force, who is holding it, and a button to send the nearest army that can march there. An army already standing in a threatened castle is never told to leave. Your king is offered as a helper only when no commander can go, with a warning, and one army is never offered for two castles at once.',
          'Your gold box shows what the next production pays and how many ticks away it is.',
          'Quick start on the home screen makes a four-house game with three AI rivals and begins it at once.',
          'Sounds mark a castle gained, a castle lost, and a new threat to your castles.',
          'Castles opens a table of every castle you hold with troops, income and who is threatening it. Home flies the map back to your starting castle.',
          'A red chip in the top bar means one of your castles is under threat. Click it to jump to the castle.',
          'Menu, Intel charts castles, troops, commanders and buildings over time for every house, and can add them up by the groups you set in Empires. Menu, Recorder lists the war in order, and you can filter it by house or kind of event.',
          'Armies you can see show their troop count. Armies outside your scan range are not shown at all.',
          'Finished games offer Watch replay on the story and final standings screens, with a score for every house and badges such as Conqueror and Iron Wall.',
          'A castle you cannot hold can be given up from its Build section with Abandon castle. It becomes unclaimed and its troops are lost. You need another castle, no army of yours inside, and no siege against it.',

          'Returning after time away shows a "since you were last here" summary, and an army arriving at a castle pops up a notice.',
          'On a phone the map sits above the side panel and the top bar scrolls sideways.',

      ] },
      { id: 'lore', group: 'The world', title: 'History of the realm', blocks: [
        ['p', 'For four hundred years the Aldermark was one realm, the Concord of the Eight Seals. Eight great houses each held a seal, and a castle belonged to whoever held a charter stamped with the Throne\'s seal and their own house\'s. The Great Roads joined every chartered castle, kept by Road-Wardens who set a milestone and a signpost at every crossroads.'],
        ['h', 'The Hollow Year'],
        ['p', 'Emperor Aldous died without naming an heir, and in the same week the Chancery that kept the charters burned. Every house claimed the right to seal the succession and none could prove it. Within a decade a charter meant nothing: a castle belonged to whoever could hold it. The seals themselves were scattered, and the Throne has stood empty ever since. The Hollow Year is year zero, and the realm now counts sixty years since.'],
        ['h', 'The Hollow Crown'],
        ['p', 'The roads still stand, patched and contested. The house that holds enough castles, and keeps troops and gold flowing along the old roads to the ones that matter, will have the realm\'s consent to seal a new charter. That is the game: the share of castles in the "Road to victory" bar is what the houses call taking the Throne.'],
        ['note', 'Click a house below, a crest on the game screen or in Standings, or "Read their history and leaders" when choosing a house, to open that house\'s history and meet its leaders. A house\'s king and starting commanders are its named leaders. They play like any commander; nothing about them changes the rules yet.'],
        ['h', 'The eight houses'],
        ['houses'],
      ] },
      { id: 'map', group: 'The world', title: 'The map', blocks: [
        ['p', 'The realm is a set of castles joined by routes. Everything that matters happens at castles or on the routes between them.'],
        ['diagram', 'map'],
        ['h', 'Trails and free travel'],
        ['p', 'The host chooses how armies travel ([[hosting#realm|Realm settings]]). In trail games armies walk the trails between castles and never cross country. In free-travel games an army can march straight to any castle within range, and the ground in between decides how long it takes: forest, hills and high ground slow a march.'],
        ['p', 'Where three or more trails meet away from a castle, the map shows a crossroads. An army marching through passes straight over it without stopping, so the route between two castles can bend at a crossroads to the shortest way. Castles are spread fairly evenly across the land, and trails are laid so that the way between two neighbouring castles is never much longer than a straight march: no castle is left with a single road out when a second way exists. Most castles have two or three trails. Rivers and mountain ranges still block, but they are crossed at fords and passes wherever the long way round would be far longer. A crossroads cannot be held or attacked and does not count toward victory.'],
        ['p', 'Some castles sit where many routes meet. The castle panel marks them as a chokepoint or a major chokepoint. Holding one makes it harder for rivals to move across the realm, so the AI also treats them as worth fighting for, along with enemy capitals.'],
        ['h', 'Rivers and mountains'],
        ['list', [
          'Rivers and mountain ranges cannot be crossed on open ground.',
          'A river castle sits on a crossing. Whoever holds it controls the crossing.',
          'A pass castle sits in a gap in the mountains. Hold the pass and the range is closed to your enemies.',
          'A march ends at the first castle that is not yours or an ally\'s, so you must [[battles|take the crossing castle]] before you can go beyond it.',
        ]],
        ['h', 'Marching armies and battles'],
        ['p', 'A marching army is drawn on both the 2D and 3D map in its house colours. Its size shows how many troops it carries. An army of 1 to 100 troops shows one soldier per troop up to 20. From 101 to 250 troops it is 40 foot soldiers and 10 cavalry with a captain. Above 250 it is a host of 75 foot soldiers, 20 cavalry and 5 siege engines (rams and catapults) under two banners. Each army is labelled with the name of its commander and its troop count. Scroll in on the 2D map to see the figures up close. Enemy armies you can see are drawn the same way, so you can judge a threat before it arrives.'],
        ['p', 'When a battle is reported, the map plays a short skirmish where it happened: the two armies close, clash in a cloud of dust, and the winner raises a banner. The result is decided instantly by the [[battles|battle rules]]; the animation is only for show and is skipped if your device asks for reduced motion.'],
        ['p', 'A castle under siege shows it. The besiegers pitch a camp beside it: tents, a campfire, their banner and, in 3D, one or two trebuchets that hurl stones at the walls. The bigger the besieging force, the bigger the camp. Smoke rises from the castle and thickens, with fires breaking out on the walls, the longer the siege lasts. The banner of a besieged castle droops as the siege wears on. When your garrison sallies out or a relief army arrives, the fight is played out between the castle walls and the camp. It is all for show; the real siege is the garrison starving each tick. Select a besieged castle to see a bar showing how much of the garrison is left compared with when the siege began.'],
        ['h', 'Strategic castles and outposts'],
        ['p', 'The largest neutral castles stand at the crossroads of the realm: the places many routes pass through, so holding one gives you a grip on the war. Small castles sit out on the edges and dead ends as outposts. Where a trail runs through forest, the trees are cleared back from it so the road is visible.'],
        ['h', 'Natural wealth'],
        ['p', 'Each castle has natural resources, shown by the halo around it. Richer castles make [[economy#upgrade-costs|upgrades cheaper]], and tiers are Tier 1 (1 to 20), Tier 2 (21 to 40) and Tier 3 (41 to 60). Grab the rich ones first.'],
      ] },
      { id: 'economy', group: 'The world', title: 'Castles and economy', blocks: [
        ['p', 'Every castle has three upgrade tracks. Each track pays out in a different way.'],
        ['diagram', 'economy'],
        ['table', { head: ['Track', 'What it gives', 'Base cost'], rows: [
          ['Treasury', 'Gold every production cycle', '500'],
          ['Recruitment', 'New troops at that castle', '1000'],
          ['Prestige', 'Prestige that builds your [[areas|realm areas]]', '4000'],
        ] }],
        ['h', 'How production works'],
        ['list', [
          'A production cycle is 24 ticks by default. Gold is paid in one lump at the end of each cycle. Troops arrive a little every tick, so the count on a castle goes up between cycles.',
          'Gold per cycle = total Treasury levels, times 10 plus 2 for every level of your [[areas|Mint]].',
          'Troops arrive a little every tick. Over a cycle a castle produces its Recruitment level times (4 plus your [[areas|Barracks]] level).',
          'Prestige arrives every tick and goes to the [[areas|realm area]] you are currently building.',
        ]],
        ['h', 'Upgrade costs'],
        ['p', 'An upgrade costs base times (current level plus one), divided by the castle\'s resources. [[map#natural-wealth|Natural resources]] and your [[areas|Guildhall]] make upgrades cheaper, so the same gold goes further at a rich castle. Bulk upgrade spends a budget on the cheapest castles first.'],
        ['h', 'Roads'],
        ['p', 'Build a road at two castles and [[marching|marches]] between them are faster by a factor of the square root of (3 + your Stables level): about 1.7 times at Stables 0, 2 times at 1 and 3 times at 6. A road costs 6 gold per natural resource of the castle, so richer castles cost more.'],
        ['h', 'Capturing castles'],
        ['p', 'A captured castle keeps its Recruitment, Prestige and roads but its Treasury is destroyed. You are paid 10 gold for each Treasury level destroyed. The castle starts with no garrison, so the army that took it must hold it.'],
        ['h', 'The castle page'],
        ['p', 'Select a castle to open its page. Besides the owner, troops and levels, you will find:'],
        ['list', [
          'Your note: a private tag (Staging, Target, Watch, Fortress, Supply or Danger) and up to 160 characters. The tag shows beside the castle on the map. Only you can see it.',
          'Last scouted: for a castle hidden by fog, the tick you last saw it and what you saw then.',
          'Production (your castles): troops, gold and prestige the castle yields, and what the next level of each upgrade would add. Garrison commanders and your realm areas are included.',

      { id: 'areas', group: 'The world', title: 'Realm areas', blocks: [
        ['p', 'Your realm has seven areas. They are not buildings on the map. They are levels that apply across all of your castles. You build one at a time, and prestige from all of your castles flows into the one you choose.'],
        ['table', { head: ['Area', 'What it does'], rows: [
          ['Armory', 'How many troops your army kills each round of a [[battles#damage-per-round|battle]]'],
          ['Mint', 'Raises the [[economy#how-production-works|gold]] you earn from Treasury'],
          ['Barracks', 'Raises [[economy#how-production-works|troop production]]'],
          ['Guildhall', 'Makes every [[economy#upgrade-costs|upgrade]] cheaper'],
          ['Watchtowers', 'How far you can [[fog|see]], and who strikes first in [[battles#fighting-in-the-open|open-field battles]]'],
          ['Library', 'Adds a bonus of prestige to one of your other areas every cycle'],
          ['Stables', 'How far an army can [[marching#range|march]] in one order'],
        ] }],
        ['h', 'Research screen'],
        ['p', 'Menu, Research lists every area with its level, how much prestige it holds, what the next level costs and how many production cycles that takes at your current prestige income. Only the active area earns from your castles, so use Make active to switch.'],
        ['p', 'Armory decides [[battles|battles]], so most winning players raise it early. Mint and Guildhall pay for themselves in a long game. [[marching#range|Stables]] matters most on big maps.'],
      ] },
      { id: 'commanders', group: 'Your forces', title: 'Commanders', blocks: [
        ['p', 'Commanders carry troops, and there is no limit to how many. Gather troops from several castles into one army before a big attack. Commanders are cheap, and you will lose some. A commander who survives [[battles|battles]] gets stronger and becomes worth protecting.'],
        ['h', 'Hiring'],
        ['p', 'Pick a school and pay the price. You get a new commander with a name from your house\'s own culture and one level in a random ability of that school.'],
        ['h', 'Names, faces and backgrounds'],
        ['p', 'Every commander has a profile card: a portrait, an age, sometimes an epithet such as "Quillhand", and a short background made of where they grew up, something that happened to them, and a habit. Your house\'s starting king and commanders are its named [[lore|leaders]]. The card shows the commander\'s school, rank and troops. Select a commander to read the full profile. Portraits and backgrounds are for flavor only and do not change any ability.'],
        ['h', 'The chronicle'],
        ['p', 'Every commander keeps a chronicle of their story, shown under their background when you select one of your own. It records when they took up arms, the battles they won and lost, castles they stormed or held, sieges they broke, times they were taken prisoner or ransomed back, the skills they mastered, the name they earned after five victories, being crowned, and how they fell. The summary line counts their victories, defeats and castles taken. Each entry is stamped with the tick it happened on.'],
        ['p', 'Under the chronicle the summary also shows the commander\'s record: battles fought, wins and losses with the win rate, castles taken and times captured. Once they have been beaten, it names their nemesis, the enemy commander who has beaten them most, and their old foe, the house they have fought most.'],
        ['h', 'Growing abilities'],
        ['p', 'On your own commanders, each ability has a progress bar toward its next level, a line on what it does, and the XP still needed. The abilities of the commander\'s own school are marked and learn 1.5 times faster. Rank is the sum of all ability levels and is capped at 20. The "Now" line says what the commander is doing: marching (with arrival tick and route), waiting, besieging or leading a garrison.'],
        ['h', 'Rename and the Hall of the Fallen'],
        ['p', 'Use Rename next to a commander\'s name to give them a name of your own (letters, spaces, hyphens and apostrophes). The old name stays in the chronicle. Commanders who die are not forgotten: the Hall of the Fallen, a button in the Realm panel, lists each with their portrait, school, years of service, last deeds and how they fell.'],
        ['table', { head: ['School', 'Abilities'], rows: [
          ['Battleschool', 'Valor (more [[battles#damage-per-round|damage]]), Tactics (strike first in the [[battles#fighting-in-the-open|field]]), Siegecraft (stronger [[sieges|sieges]])'],
          ['University', 'Muster (more troops), Steward (more gold), Scholar (more prestige)'],
          ['Rangers', 'Pace (faster [[marching|marches]]), Scout (see [[fog|further]]), Plunder (more gold on [[economy#capturing-castles|capture]])'],
        ] }],
        ['h', 'Growing stronger'],
        ['p', 'Abilities level up on their own through use: Valor from winning battles, Muster from troops produced at the castle the commander leads, Pace from marching, and so on. Each ability tops out at level 3 and a commander tops out at rank 20, so no one commander can have everything.'],
        ['h', 'Garrison commanders'],
        ['p', 'Assign an idle commander to a castle to lead it. He leads its defense and his Muster, Steward and Scholar abilities apply there. He cannot march until you unassign him.'],
        ['h', 'The king'],
        ['p', 'Each house has one king, chosen from your commanders. The king\'s abilities become realm-wide bonuses and his battle abilities apply to any [[battles|fight]] he is in. If he dies, those bonuses vanish instantly and it takes a few ticks to crown a new one. Keep him out of the front line.'],
        ['note', 'A commander whose army is destroyed in a [[battles#fighting-at-a-castle|battle]] dies. So does every commander in a castle that falls.'],
      ] },
      { id: 'marching', group: 'Your forces', title: 'Marching and routes', blocks: [
        ['p', 'Select a [[commanders|commander]] and choose March, then click a destination. The map shows the path, the time to arrive and the cost.'],
        ['h', 'Range'],
        ['p', 'One order can cover only so much distance. Your [[areas|Stables]] level sets that distance. A single hop to a neighbouring castle is always allowed. Castles you can reach glow on the map.'],
        ['p', 'Distance is measured in leagues. One league is the spacing between neighbouring castles on a standard map. Range, scan radius and march speed are fixed in leagues and leagues per tick, so a bigger map means castles lie more leagues apart and journeys take longer. Games created before leagues keep their old scaling.'],
        ['h', 'The ruler'],
        ['p', 'Press Ruler in the top bar and click two castles. It shows the straight-line distance in leagues, how long the trip takes on foot and by road, your range, and the Stables level you need to reach it in one march. The ETA uses the commander you have selected, or your king. On trail and road maps it measures the route the march would take, through castles you hold, so it agrees with the march preview. If there is no such route it says so.'],
        ['h', 'March types'],
        ['list', [
          'Assault: the army [[battles|fights]] on arrival.',
          '[[sieges|Siege]]: the army sets up outside the castle and starves it instead of fighting at once.',
        ]],
        ['h', 'Passing through castles'],
        ['p', 'An army passes through castles that belong to you or an [[diplomacy|ally]]. It stops at the first castle that is not yours, and there it fights or begins a siege.'],
        ['h', 'Routes'],
        ['p', 'Add stops to build a route of up to 10 castles. At each castle you own you can set an action:'],
        ['list', [
          'Collect troops from the castle onto the commander.',
          'Drop troops from the commander into the castle.',
          '[[commanders#garrison-commanders|Garrison]]: leave the commander to lead the castle.',
          'Wait for a number of ticks before moving on.',
        ]],
        ['p', 'Turn on Loop and the commander repeats the route forever. That is how you keep a front line supplied without checking in every hour.'],
        ['h', 'Changing your mind'],
        ['p', 'When you build a route, each stop must be within range of the stop before it. Stops that are out of range cannot be added, and the server refuses a route with one. If a later stop becomes unreachable (for example a castle changes hands) the army stops at the last castle it reached and you get a message naming the army and the stop.'],
        ['p', 'Orders lock at the first tick. From the moment you send an army until the next tick arrives you can press Cancel march and it stays where it was. After that the army is committed to its destination and cannot turn back.'],
        ['p', 'On a route with several stops you can still press Halt at next stop, or Drop remaining stops while it waits. The army finishes its current stretch, stops at that castle and does not go on.'],
      ] },
      { id: 'battles', group: 'War', title: 'Battles', blocks: [
        ['p', 'There are no dice. Each side destroys a fixed number of enemy troops every round and the battle runs until one side has none left.'],
        ['h', 'Damage per round'],
        ['p', 'Your damage each round is your [[areas|Armory]] level plus the [[commanders|Valor]] of the commander leading your army. It is never less than 1.'],
        ['h', 'Fighting at a castle'],
        ['list', [
          'The defender strikes first and gets +1 damage per round.',
          'The attacker wins only if they outlast the defender: they must bring more troops than the defense can kill.',
          'The winners keep what survives, and an attacker who wins [[economy#capturing-castles|captures the castle]]. Every [[commanders|commander]] on the losing side dies.',
        ]],
        ['p', 'To starve a castle instead of storming it, see [[sieges|Sieges]].'],

    function manualCalc() {
      const field = (label, input) => h('div', {}, h('label', {}, label), input);
      const num = (v) => h('input', { type: 'number', min: '0', value: String(v) });
      const aT = num(30); const aD = num(2); const dT = num(20); const dD = num(2);
      const kind = selectOf({ castle: 'Castle (defender strikes first, +1 damage)', field: 'Open field (attacker strikes first)' }, 'castle');
      const slider = h('input', { type: 'range', min: '0', max: '0', value: '0', 'aria-label': 'Round' });
      const out = h('div', { class: 'calcout' });
      const sim = () => {
        const mode = kind.value;
        const A = { t: Math.max(0, Math.floor(Number(aT.value))), dmg: Math.max(1, Math.floor(Number(aD.value))) };
        const D = { t: Math.max(0, Math.floor(Number(dT.value))), dmg: Math.max(1, Math.floor(Number(dD.value))) + (mode === 'castle' ? 1 : 0) };
        const defFirst = mode === 'castle';
        const rounds = combatSim(A.t, A.dmg, D.t, D.dmg, defFirst);
        return { rounds, A, D };
      };
      const draw = () => {
        const { rounds, A, D } = sim();
        slider.max = String(rounds.length - 1);
        const i = Math.min(Number(slider.value), rounds.length - 1);
        slider.value = String(i);
        const [a, d] = rounds[i];
        const last = rounds[rounds.length - 1];
        const verdict = last[0] === 0 && last[1] === 0 ? 'Both sides are empty.' : last[1] === 0 ? `Attacker wins with ${pluralN(last[0], 'troop')} left.` : last[0] === 0 ? `Defender wins with ${pluralN(last[1], 'troop')} left.` : '';
        const bar = (who, now, start, cls) => h('div', { class: 'cbarrow' }, h('span', {}, who), h('div', { class: 'cbar' }, h('i', { class: cls, style: `width:${start ? (100 * now) / start : 0}%` })), h('b', {}, String(now)));
        out.replaceChildren(
          bar('Attacker', a, A.t, 'att'), bar('Defender', d, D.t, 'def'),
          h('div', { class: 'tip' }, `After round ${i} of ${rounds.length - 1}. ${verdict}`));
      };
      [aT, aD, dT, dD, kind].forEach((el) => { el.addEventListener('input', draw); el.addEventListener('change', draw); });
      slider.addEventListener('input', draw);
      draw();
      return h('div', { class: 'mcalc' },
        h('div', { class: 'grid2' }, field('Attacker troops', aT), field('Attacker damage per round', aD), field('Defender troops', dT), field('Defender damage per round', dD)),
        h('label', {}, 'Kind of battle'), kind,
        h('label', {}, 'Step through the rounds'), slider, out);
    }

    let manualGo = null;
    const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const XREF = /\[\[([a-z]+)(?:#([a-z0-9-]+))?\|([^\]]+)\]\]/g;
    const inline = (text) => {
      const out = [];
      let last = 0;
      let m;
      XREF.lastIndex = 0;
      while ((m = XREF.exec(text))) {
        if (m.index > last) out.push(text.slice(last, m.index));
        const [, id, anchor, label] = m;
        out.push(manualGo ? h('button', { type: 'button', class: 'xref', onclick: () => manualGo(id, anchor) }, label) : label);
        last = XREF.lastIndex;
      }
      if (last < text.length) out.push(text.slice(last));
      return out;
    };

    const renderBlock = (block) => {
      const [kind, v] = block;
      if (kind === 'p') return h('p', {}, ...inline(v));
      if (kind === 'h') return h('h3', { 'data-anchor': slug(v) }, v);
      if (kind === 'note') return h('div', { class: 'mnote' }, ...inline(v));

    function helpDialog(section) {
      const startId = typeof section === 'string' ? section : MANUAL[0].id;
      const overlay = h('div', { class: 'overlay' });
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      const close = () => { document.removeEventListener('keydown', onKey); manualGo = null; overlay.remove(); };
      overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });
      document.addEventListener('keydown', onKey);

      const nav = h('nav', { class: 'mnav', 'aria-label': 'Sections' });
      const pane = h('div', { class: 'mpane', tabindex: '-1' });
      const search = h('input', { type: 'search', placeholder: 'Search the manual', 'aria-label': 'Search the manual' });
      let current = startId;
      let currentAnchor = null;
      const trail = [];
      const backBtn = h('button', { class: 'ghost', style: 'display:none', onclick: () => { const prev = trail.pop(); showSection(prev.id, prev.anchor, true); } }, 'Back');

      const textOf = (sec) => `${sec.title} ${sec.blocks.map((b) => (typeof b[1] === 'string' ? b[1] : JSON.stringify(b[1]))).join(' ')}`.replace(/\[\[[^|\]]*\|([^\]]+)\]\]/g, '$1').toLowerCase();

      const showSection = (id, anchor, fromBack) => {
        if (!fromBack && (id !== current || anchor)) trail.push({ id: current, anchor: currentAnchor });
        current = id;
        currentAnchor = anchor || null;
        const sec = MANUAL.find((s) => s.id === id) || MANUAL[0];
        const i = MANUAL.indexOf(sec);
        pane.replaceChildren(
          h('h2', {}, sec.title),
          ...sec.blocks.map(renderBlock),
          h('div', { class: 'mfoot' },
            i > 0 ? h('button', { class: 'ghost', onclick: () => showSection(MANUAL[i - 1].id) }, `Back: ${MANUAL[i - 1].title}`) : h('span'),
            i < MANUAL.length - 1 ? h('button', { class: 'ghost', onclick: () => showSection(MANUAL[i + 1].id) }, `Next: ${MANUAL[i + 1].title}`) : h('span')));
        const target = anchor ? pane.querySelector(`[data-anchor="${anchor}"]`) : null;
        if (target) pane.scrollTop = target.offsetTop - pane.offsetTop - 8;
        else pane.scrollTop = 0;
        backBtn.style.display = trail.length ? '' : 'none';
        drawNav();
      };

      const drawNav = () => {
        const q = search.value.trim().toLowerCase();
        const shown = q ? MANUAL.filter((s) => textOf(s).includes(q)) : MANUAL;
        const items = [];
        let lastGroup = null;
        shown.forEach((sec) => {
          if (!q && sec.group !== lastGroup) { items.push(h('div', { class: 'mgroup' }, sec.group)); lastGroup = sec.group; }
          items.push(h('button', { type: 'button', class: 'mnavbtn' + (sec.id === current ? ' on' : ''), onclick: () => showSection(sec.id) }, sec.title));
        });
        if (!shown.length) items.push(h('div', { class: 'tip' }, 'Nothing matches that search.'));
        nav.replaceChildren(...items);
      };
      search.addEventListener('input', drawNav);

      overlay.append(h('div', { class: 'modal manual', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Field manual' },
        h('div', { class: 'mhead' }, h('h2', {}, 'Field manual'), backBtn, search, h('button', { class: 'ghost', onclick: close }, 'Close')),
        h('div', { class: 'mbody' }, nav, pane)));
      document.body.append(overlay);
      manualGo = (id, anchor) => showSection(id, anchor);
      showSection(startId);
    }

    async function storyDialog(gameId) {
      const { data, error } = await sb.rpc('game_story', { p_game_id: gameId });
      if (error || !data) return toast(error ? error.message : 'The story is told once the war is over');
      await loadFactions();
      const fname = (slug) => `House ${factionOf(slug).name}`;

      const house = (pid) => (byPlayer.get(pid) ? fname(byPlayer.get(pid).faction) : 'a lost house');
      const winner = byPlayer.get(data.winner_player_id);
      const MIN = { slow: 120, normal: 60, fast: 30, quad: 15, blitz: 5 };
      const days = MIN[data.tick_speed] ? Math.max(1, Math.round((data.ticks * MIN[data.tick_speed]) / 1440)) : null;
      const plural = (n, w) => `${n} ${n === 1 ? w : /[^aeiou]y$/.test(w) ? `${w.slice(0, -1)}ies` : `${w}s`}`;

          sigil(winner.faction, 92),
          h('div', {},
            h('h2', {}, `${fname(winner.faction)} took the Hollow Crown`),
            h('div', { class: 'story-sub' }, `${data.reason === 'last_standing' ? `${fname(winner.faction)} was the last house standing` : `${fname(winner.faction)} held ${winner.castles} of ${data.total_castles} castles`}, after ${plural(data.ticks, 'tick')}${days ? ` (about ${plural(days, 'day')})` : ''}.`)))

      const intro = h('p', { class: 'story-intro' },

      const TITLES = ['I. The Scramble', 'II. The War', 'III. The Reckoning'];
      const eventText = (e) => {
        const p = e.payload || {};
        if (e.type === 'player_eliminated') return `${house(p.player_id)} was driven from the realm.`;
        if (e.type === 'king_killed') return `${p.name || 'A king'} of ${house(p.player_id)} fell in battle.`;

    function renameDialog() {
      const input = h('input', { type: 'text', maxlength: '40', value: state.profile ? state.profile.display_name : '' });
      modal('Display name', h('div', {}, input), (close) => [
        h('button', { onclick: close }, 'Cancel'),
        h('button', {
          class: 'primary',
          onclick: (e) => run(e.currentTarget, async () => {
            const value = input.value.trim();
            if (!value) throw new Error('Name cannot be empty');
            const { error } = await sb.from('profiles').update({ display_name: value }).eq('user_id', state.session.user.id);
            if (error) throw error;
            await loadProfile();
            close();
            await showHome();
          }),
        }, 'Save'),
      ]);
    }

    function describeGame(g) {
      return gameFacts(g).join(' · ');
    }

    function gameFacts(g) {
      return [`${SIZES[g.map_size] || g.map_size} castles each`, SPEEDS[g.tick_speed] || g.tick_speed,
        `${Math.round(g.victory_pct * 100)}% to win`, g.fog_dark ? 'Dark fog' : g.fog_of_war ? 'Fog of war' : 'No fog'].filter(Boolean);
    }

    async function showHome() {
      clearCleanup();
      state.view = 'home';
      state.roomId = null;
      await Promise.all([loadFactions(), state.profile ? null : loadProfile()]);

      const openList = h('div', { class: 'list' });
      const inviteStrip = h('div', { class: 'invites' });
      const codeInput = h('input', { type: 'text', placeholder: 'Game code, such as K7M2-9QX4', maxlength: '12', 'aria-label': 'Game code', autocomplete: 'off' });
      codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); const v = codeInput.value.trim(); if (v) joinByCode(v); } });
      const bannerGrid = h('div', { class: 'banners' });
      const boardList = h('div', { class: 'list' }, h('div', { class: 'empty' }, 'Loading'));
      const crestHolder = h('div', { class: 'crest' });

      const statusText = (g) => ({ lobby: 'In the lobby', picking: 'Choose your start', active: `Tick ${g.current_tick}`, finished: 'Finished' }[g.status] || g.status);

      const unread = new Map();
      const banner = (r) => {
        const g = r.games;
        const f = factionOf(r.faction_slug);
        return h('button', { class: 'banner', style: `--tint:${f.color}`, onclick: () => openGame(g.id) },
          h('div', { class: 'sig' }, sigil(r.faction_slug, 44)),
          h('div', { class: 'bname' }, g.name),
          h('div', { class: 'bmeta' }, `House ${f.name}`),
          h('div', { class: 'bstate' }, statusText(g)),
          unread.get(g.id) ? h('span', { class: 'bunread', title: 'Unread inbox reports and messages (not chat)' }, String(unread.get(g.id))) : null);
      };

      const openRow = (g) => {
        const taken = g.taken_factions || [];
        const pips = h('div', { class: 'pips', 'aria-label': `${g.player_count} of ${g.max_players} seats taken` },
          taken.map((sl) => sigil(sl, 20)),
          Array.from({ length: Math.max(0, g.max_players - taken.length) }, () => openShield(20)));
        return h('div', { class: 'lobby-strip' },
          h('div', {},
            h('div', { class: 'name game' }, g.name, g.joined ? h('span', { class: 'tag green' }, 'joined') : null, g.has_password ? h('span', { class: 'tag' }, 'password') : null),
            h('div', { class: 'meta game', style: 'margin-top:0' }, `Hosted by ${g.host_name}`),
            pips,
            h('div', { class: 'facts' }, gameFacts(g).map((t) => h('span', { class: 'fact' }, t)))),
          g.joined
            ? h('button', { class: 'primary small', onclick: () => showRoom(g.id) }, 'Open')
            : h('button', { class: 'primary small', disabled: g.player_count >= g.max_players, onclick: () => joinDialog(g) }, g.player_count >= g.max_players ? 'Full' : 'Join'));
      };

      const refresh = async () => {
        if (state.view !== 'home' || document.hidden) return;
        const [open, mine, inv] = await Promise.all([
          sb.rpc('list_open_games'),
          sb.rpc('my_games'),
          sb.rpc('my_game_invites'),
        ]);
        if (state.view !== 'home') return;

        if (open.error) toast(open.error.message);
        else {
          openList.replaceChildren(...(open.data.length ? open.data.map(openRow) : [h('div', { class: 'empty' }, 'No open lobbies right now. Raise a campaign and others can join it.')]));
        }

        const invites = inv.data || [];
        inviteStrip.replaceChildren(...invites.map((i) => h('div', { class: 'panel invite' },
          h('div', {}, h('b', {}, i.host_name), ' invited you to ', h('b', {}, i.game_name)),
          h('div', { class: 'row', style: 'display:flex;gap:8px' },
            h('button', { class: 'primary small', onclick: () => { const g = (open.data || []).find((x) => x.id === i.game_id); if (g) joinDialog(g); else toast('That game is no longer open'); } }, 'Join'),
            h('button', { class: 'small', onclick: (e) => run(e.currentTarget, async () => { const r = await sb.rpc('decline_game_invite', { p_id: i.id }); if (r.error) throw r.error; await refresh(); }) }, 'Decline')))));
        if (mine.error) toast(mine.error.message);
        else {
          const rows = (mine.data || []).filter((r) => r.games).sort((a, b) => b.games.id - a.games.id);
          campaignsB.textContent = String(((state.profile && state.profile.total_games) || 0) + rows.filter((r) => r.games.status !== 'finished').length);
          const ur = await sb.rpc('my_unread');
          unread.clear();
          (ur.data || []).forEach((u) => { if (u.unread) unread.set(u.game_id, u.unread); });
          bannerGrid.replaceChildren(...rows.map(banner), h('button', { class: 'banner new', onclick: createDialog },
            h('span', { class: 'plus', 'aria-hidden': 'true' }, '+'), h('span', {}, rows.length ? 'Raise another campaign' : 'Raise your first campaign')));
        }
      };

      const profile = state.profile || {};
      const campaignsB = h('b', {}, profile.total_games ?? 0);
      crestHolder.replaceChildren(emblem(150, { draw: !state.homeDrawn }));
      state.homeDrawn = true;

      mount(h('div', { class: 'wrap' }, topbar(),
        h('div', { class: 'home' },
          h('aside', { class: 'panel house' },
            crestHolder,
            h('h2', { onclick: renameDialog, title: 'Change your name', style: 'cursor:pointer' }, profile.display_name || 'Lord'),
            h('div', { class: 'record' },
              h('div', {}, campaignsB, 'campaigns'),
              h('div', {}, h('b', {}, profile.total_wins ?? 0), 'victories'),
              h('div', {}, h('b', {}, profile.honor ?? 0), 'honor')),
            h('div', { class: 'actions' },
              h('button', { class: 'primary', onclick: createDialog }, 'Raise a campaign'),
              h('button', { onclick: quickStart, title: 'Four houses with three AI rivals and default rules, ready to play' }, 'Quick start'),
              h('button', { class: 'ghost', onclick: helpDialog }, 'How to play'))),
          h('main', {},
            inviteStrip,
            h('div', { class: 'section-title' }, h('h2', {}, 'Your campaigns')),
            bannerGrid,
            h('div', { class: 'section-title' }, h('h2', {}, 'Open lobbies'), h('button', { class: 'ghost', onclick: (e) => run(e.currentTarget, refresh) }, 'Refresh')),
            h('div', { class: 'panel' }, h('div', { class: 'joincode' }, codeInput, h('button', { class: 'small', onclick: () => { const v = codeInput.value.trim(); if (v) joinByCode(v); } }, 'Join by code')), openList),
            h('div', { class: 'section-title' }, h('h2', {}, 'Roll of honor')),
            h('div', { class: 'panel' }, boardList),
            legalLinks()))));

      sb.rpc('get_leaderboard', { p_limit: 15 }).then(({ data, error }) => {
        if (error) return toast(error.message);
        boardList.replaceChildren(...(data.length
          ? data.map((r, i) => h('div', { class: 'honor' },
            h('span', { class: 'rank' }, i + 1),
            h('div', {}, h('div', { class: 'name', style: 'font-weight:700' }, r.display_name), h('div', { class: 'meta', style: 'color:var(--dim);font-size:.88rem' }, `${r.total_wins} wins in ${r.total_games} campaigns`)),
            h('span', { class: 'tag gold' }, `${r.honor} honor${r.infamy ? `, ${r.infamy} infamy` : ''}`)))
          : [h('div', { class: 'empty' }, 'No finished campaigns yet. The first victory will be recorded here.')]));
      });

      await refresh();
      try { const pending = sessionStorage.getItem('ss-join'); if (pending) { sessionStorage.removeItem('ss-join'); joinByCode(pending); } } catch {}

      const timer = setInterval(refresh, 8000);
      state.cleanup.push(() => clearInterval(timer));
    }

    const JOIN_HASH = /^#join=([A-Za-z0-9-]{3,12})$/;
    try {
      const m = JOIN_HASH.exec(location.hash);
      if (m) { sessionStorage.setItem('ss-join', m[1].toUpperCase()); history.replaceState(null, '', location.pathname + location.search); }
    } catch {}

    async function joinByCode(code) {
      const { data, error } = await sb.rpc('lookup_game_by_code', { p_code: code });
      if (error) return toast(error.message);
      if (data && data.error) return toast(data.error);
      if (data.joined) return showRoom(data.id);
      if (data.player_count >= data.max_players) return toast('That game is full');
      joinDialog(data, code);
    }

    async function inviteFriendsDialog(gameId) {
      const body = h('div', { class: 'friends' }, h('div', { class: 'empty' }, 'Loading'));
      const sent = new Set();
      const draw = (data) => {
        if (!data.friends.length) { body.replaceChildren(h('div', { class: 'empty' }, 'You have no friends yet. Open Friends from the top bar to add some, or share the code or link instead.')); return; }
        body.replaceChildren(...data.friends.map((f) => h('div', { class: 'frow' },
          h('span', {}, h('b', {}, f.name)),
          h('button', {
            class: sent.has(f.id) ? 'small' : 'primary small',
            disabled: sent.has(f.id),
            onclick: (e) => run(e.currentTarget, async () => { const r = await sb.rpc('invite_friend', { p_game_id: gameId, p_friendship_id: f.id }); if (r.error) throw r.error; sent.add(f.id); toast(`${f.name} invited`, true); draw(data); }),
          }, sent.has(f.id) ? 'Invited' : 'Invite'))));
      };
      modal('Invite friends', body, (close) => [h('button', { class: 'primary', onclick: close }, 'Done')]);
      const { data, error } = await sb.rpc('list_friends');
      if (error) { toast(error.message); return; }
      draw(data);
    }

    function joinDialog(g, code) {
      let pick = null;
      const picker = factionPicker(g.taken_factions, null, (v) => { pick = v; });
      const pw = h('input', { type: 'password', placeholder: 'game password' });
      modal(g.name, h('div', {}, h('div', { class: 'tip', style: 'margin:0 0 6px' }, `Hosted by ${g.host_name}`), h('div', { class: 'facts' }, gameFacts(g).map((t) => h('span', { class: 'fact' }, t))), h('label', {}, 'Choose your house'), picker, g.has_password ? h('div', {}, h('label', {}, 'Password'), pw) : null), (close) => [
        h('button', { onclick: close }, 'Cancel'),
        h('button', {
          class: 'primary',
          onclick: (e) => run(e.currentTarget, async () => {
            const { data, error } = code
              ? await sb.rpc('join_game_by_code', { p_code: code, p_faction_slug: pick, p_password: g.has_password ? pw.value : null })
              : await sb.rpc('join_game', { p_game_id: g.id, p_faction_slug: pick, p_password: g.has_password ? pw.value : null });
            if (error) throw error;
            if (code && data === null) throw new Error('No game has that code');
            close();
            await showRoom(g.id);
          }),
        }, 'Take your seat'),
      ]);
    }

    function clipPoly(poly, a, b, c) {
      const out = [];
      for (let i = 0; i < poly.length; i++) {

          const t = dp / (dp - dq);
          out.push([p[0] + t * (q[0] - p[0]), p[1] + t * (q[1] - p[1])]);

      return out;
    }

    function voronoiCells(sites, w, ht) {

          const a = o.x - s.x;

          poly = clipPoly(poly, a, b, (o.x * o.x + o.y * o.y - s.x * s.x - s.y * s.y) / 2);

      }

      const b = grid[iy * G + ix + 1];

      const d = grid[(iy + 1) * G + ix + 1];

    function resolveFight(mode, a, d, firstSide) {
      const aT = Math.max(0, Math.floor(a.troops));
      const dT = Math.max(0, Math.floor(d.troops));
      const aDmg = Math.max(1, Math.floor(a.damage));
      const dDmg = Math.max(1, Math.floor(d.damage)) + (mode === 'castle' ? 1 : 0);
      if (mode === 'castle' && dT === 0) return { winner: 'attacker', left: aT, note: 'An undefended castle always falls.' };
      if (aT === 0 && dT === 0) return { winner: null, left: 0, note: 'Neither side has troops.' };
      if (aT === 0) return { winner: 'defender', left: dT, note: 'The attacker has no troops.' };
      if (dT === 0) return { winner: 'attacker', left: aT, note: 'The defender has no troops.' };
      const defFirst = mode === 'castle' || firstSide === 'defender';
      const F = defFirst ? { side: 'defender', t: dT, dmg: dDmg } : { side: 'attacker', t: aT, dmg: aDmg };
      const S = defFirst ? { side: 'attacker', t: aT, dmg: aDmg } : { side: 'defender', t: dT, dmg: dDmg };
      const rS = Math.ceil(S.t / F.dmg);
      const rF = Math.ceil(F.t / S.dmg);
      if (rS <= rF) return { winner: F.side, left: F.t - (rS - 1) * S.dmg, note: `${F.side} strikes first and needs ${rS} round${rS === 1 ? '' : 's'}; ${S.side} needs ${rF}.` };
      return { winner: S.side, left: S.t - rF * F.dmg, note: `${F.side} strikes first and needs ${rS} round${rS === 1 ? '' : 's'}; ${S.side} needs ${rF}.` };
    }

            const mint = (ms.areas.find((a) => a.area === 'mint') || { level: 1 }).level;
            const inc = [...ms.t.values()].filter((t) => t.owner_player_id === ms.me.id).reduce((a, t) => a + (t.treasury_level || 0) * (10 + 2 * mint), 0);
            const cyc = g.production_cycle_ticks;
            const left = cyc - (g.current_tick % cyc);
            return h('div', { class: 'stat', title: `Production pays every ${cyc} ticks. About +${inc} gold at the next one, in ${left} tick${left === 1 ? '' : 's'}.` }, h('span', {}, 'Treasury'), h('b', {}, String(ms.me.gold)), h('span', { class: 'sub' }, `+${inc} in ${left}t`));
          })(),
          g.fog_of_war ? h('label', { class: 'check hud-opt', style: 'margin:0' }, h('input', { type: 'checkbox', checked: ms.rings, onchange: (e) => { ms.rings = e.target.checked; render(); } }), 'Scan rings') : null,
          h('button', { class: 'ghost hud-opt', onclick: (e) => { const on = Sfx.toggle(); e.currentTarget.textContent = on ? 'Sound on' : 'Sound off'; } }, Sfx.on ? 'Sound on' : 'Sound off'),
          TOUCH_DEVICE ? null : h('button', { onclick: toggle3D }, ms.view3d ? '2D map' : '3D map'),
          h('button', { class: 'ghost', onclick: castlesDialog, title: 'Every castle in one table' }, 'Castles'),
          h('button', { class: ms.ruler ? 'primary' : 'ghost', onclick: () => { ms.ruler = ms.ruler ? null : { a: null, b: null, data: null }; ms.marching = false; ms.preview = null; ms.stops = []; render(); drawSide(); drawHud(); }, title: 'Measure the distance between two castles' }, 'Ruler'),
          h('button', { class: 'ghost', onclick: () => ms.goHome && ms.goHome(), title: 'Back to your castles' }, 'Home'),
          h('button', { class: 'primary hud-menu', onclick: menuDialog }, 'Menu'),
          h('button', { class: 'ghost', onclick: helpDialog }, 'Help')].filter(Boolean));
        updateCountdown();
      };

      const order = (fn, args, message) => (e) => act(e.currentTarget, async () => {
        const { data, error } = await sb.rpc(fn, { p_game_id: gameId, ...args });
        if (error) throw error;
        if (message) toast(typeof message === 'function' ? message(data) : message, true);
      });

      const INFRA = [
        { type: 'treasury', name: 'Treasury', col: 'treasury_level', base: 1250, note: 'gold', mult: 'treasury_cost_mult' },
        { type: 'recruitment', name: 'Recruitment', col: 'industry_level', base: 2500, note: 'troops', mult: 'recruitment_cost_mult' },
        { type: 'prestige', name: 'Prestige', col: 'prestige_level', base: 10000, note: 'prestige', mult: 'prestige_cost_mult' },
      ];

      const buildSection = (t) => {
        if (t.owner_player_id !== ms.me.id || !canAct()) return null;
        const mult = ms.game.infra_cost_mult;
        const gold = ms.me.gold;
        const out = [h('b', {}, 'Build')];
        INFRA.forEach((i) => {
          const lvl = t[i.col];
          const cost = Math.max(1, Math.floor(i.base * (lvl + 1) / t.resources * mult * ms.game[i.mult]));
          out.push(h('button', {
            class: 'cmdrow',
            disabled: gold < cost,
            onclick: order('upgrade_infrastructure', { p_territory_id: t.id, p_type: i.type }, (d) => `${i.name} is now level ${d.level}`),
          }, `${i.name} ${lvl} > ${lvl + 1}`, h('span', { style: 'color:var(--dim);margin-left:auto' }, `${cost} gold`)));
        });
        if (t.has_road) {
          out.push(h('button', { class: 'cmdrow', onclick: order('demolish_road', { p_territory_id: t.id }, 'Road demolished') }, 'Demolish road', h('span', { style: 'color:var(--dim);margin-left:auto' }, 'free')));
        } else {
          const cost = Math.max(1, Math.floor(6 * t.resources * mult * (ms.game.roads_mode === 'expensive' ? 3 : 1)));
          if (ms.game.roads_mode !== 'disabled') out.push(h('button', { class: 'cmdrow', disabled: gold < cost, onclick: order('build_road', { p_territory_id: t.id }, 'Road built') }, 'Build road', h('span', { style: 'color:var(--dim);margin-left:auto' }, `${cost} gold`)));
        }
        if (ms.game.mercenaries_enabled) {
          const size = h('input', { type: 'number', min: '10', max: '60', value: '20', style: 'width:80px' });
          out.push(h('b', { style: 'margin-top:12px' }, 'Hire mercenaries (5 gold per troop, 48 tick contract)'),
            h('div', { class: 'row wrap2' }, size, h('button', {
              disabled: gold < 50,
              onclick: (e) => order('hire_mercenaries', { p_territory_id: t.id, p_troops: Number(size.value) }, (d) => `${d.name} hired for ${d.cost} gold`)(e),
            }, 'Hire company')));
        }
        const hire = ms.game.commander_cost;
        out.push(h('b', { style: 'margin-top:12px' }, `Hire a commander (${hire} gold)`),
          h('div', { class: 'row wrap2' }, SCHOOLS.map((sc) => h('button', {
            disabled: gold < hire,
            onclick: order('hire_commander', { p_territory_id: t.id, p_school: sc.slug }, (d) => `${d.name} joins${d.role === 'king' ? ' as king' : ''}`),
          }, sc.name))));
        out.push(h('div', { class: 'row wrap2', style: 'margin-top:12px' }, h('button', {
          class: 'danger',
          title: 'Give the castle up. It becomes unclaimed and loses its troops.',
          onclick: (e) => {
            if (confirm(`Abandon ${t.name}? It becomes unclaimed, its troops are lost, and anyone can take it. This cannot be undone.`)) order('abandon_castle', { p_territory_id: t.id }, (d) => `${d.abandoned} abandoned`)(e);
          },
        }, 'Abandon castle')));
        return h('div', { class: 'sec' }, out);
      };

      const realmSection = () => {
        const g = ms.game;
        const live = canAct();
        const order_ = Object.keys(AREA_NAMES);
        const rows = [...ms.areas].sort((x, y) => order_.indexOf(x.area) - order_.indexOf(y.area)).map((a) => {
          const need = Math.ceil(144 * a.level * g.area_cost_mult);
          return h('div', { class: 'line' },
            h('span', { style: 'color:var(--text)' }, `${AREA_NAMES[a.area] || a.area}${a.is_active ? ' (active)' : ''}`),
            h('span', {}, `Lv ${a.level} · ${a.prestige_accumulated}/${need}`),
            live && !a.is_active ? h('button', { style: 'padding:2px 8px;font-size:.78rem', onclick: order('set_active_area', { p_area: a.area }, `${AREA_NAMES[a.area]} is now the active area`) }, 'Activate') : null);
        });
        const type = h('select', {}, INFRA.map((i) => h('option', { value: i.type }, i.name)));
        type.value = 'recruitment';
        const budget = h('input', { type: 'number', min: '1', value: Math.min(100, ms.me.gold) || 1, style: 'width:90px' });
        return [
          h('div', { class: 'sec' }, h('b', {}, 'Realm areas (level, prestige to next)'), rows),
          live ? h('div', { class: 'sec' }, h('b', {}, 'Upgrade everywhere, cheapest first'),
            h('div', { class: 'row wrap2' }, type, budget,
              h('button', {
                onclick: (e) => order('bulk_upgrade_infrastructure', { p_infra_type: type.value, p_budget: Number(budget.value) || 1 }, (d) => (d.upgraded ? `${pluralN(d.upgraded, 'upgrade')} for ${d.spent} gold` : `Nothing bought. Every ${type.value} upgrade costs more than your budget of ${budget.value || 1} gold, or each castle is at its limit. Try a bigger budget or another track.`))(e),
              }, 'Spend')),
            h('div', { class: 'tip' }, 'Recruitment adds troops each cycle, Treasury adds gold, Prestige speeds your realm areas. Early on, Recruitment wins the most castles.')) : null,
          live ? h('div', { class: 'sec' }, h('b', {}, 'Surrender'),
            h('button', {
              class: 'danger',
              onclick: (e) => {
                if (confirm('Concede defeat? You are eliminated at once, your commanders die and your castles become unowned. This cannot be undone.')) {
                  order('concede_defeat', {}, 'You have conceded')(e);
                }
              },
            }, 'Concede defeat')) : null,
        ];
      };

      const assaultButton = (t) => h('button', {
        class: 'danger',
        onclick: (e) => {
          if (confirm(`Your besieging commanders at ${t.name} attack the castle now. The defenders get their bonus. Continue?`)) {
            order('break_siege_and_assault', { p_territory_id: t.id }, (d) => (d.captured ? `${t.name} captured` : 'The assault failed'))(e);
          }
        },
      }, 'Assault now');

      const siegeSection = (t) => {
        if (!canAct()) return null;
        const siegers = ms.cmd.filter((c) => c.status === 'sieging' && c.current_territory_id === t.id && commanderSeen(c, tickF()));
        if (!siegers.length) return null;
        const troops = siegers.reduce((a, c) => a + c.troops, 0);
        const out = [h('b', {}, 'Under siege'),
          line('Besieged by', [...new Set(siegers.map((c) => pname(c.owner_player_id)))].join(', ')),
          line('Besiegers', `${siegers.length} commander${siegers.length > 1 ? 's' : ''}, ${troops} troops`)];
