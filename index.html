    function h(tag, props, ...kids) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(props || {})) {
        if (v === undefined || v === null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else if (k === 'value') el.value = v;
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
      for (const kid of kids.flat()) {
        if (kid === null || kid === undefined || kid === false) continue;
        el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      }
      return el;
    }

    const Sfx = (() => {
      let ac = null;
      let master = null;
      let pad = null;
      let on = true;
      let music = true;
      try { on = localStorage.getItem('ss-sound') !== '0'; music = localStorage.getItem('ss-music') !== '0'; } catch {}
      const ensure = () => {
        if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = on ? 0.9 : 0;
        const comp = ac.createDynamicsCompressor();
        master.connect(comp);
        comp.connect(ac.destination);
        return ac;
      };
      const tone = (freq, dur, o = {}) => {
        if (!on || !ensure()) return;
        const t0 = ac.currentTime + (o.at || 0);
        const osc = ac.createOscillator();
        const g = ac.createGain();
        const f = ac.createBiquadFilter();
        osc.type = o.type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t0 + dur);
        f.type = 'lowpass';
        f.frequency.value = o.cut || 6000;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t0 + (o.attack || 0.006));
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(f); f.connect(g); g.connect(master);
        osc.start(t0); osc.stop(t0 + dur + 0.05);
      };
      const noise = (dur, o = {}) => {
        if (!on || !ensure()) return;
        const t0 = ac.currentTime + (o.at || 0);
        const buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        const src = ac.createBufferSource();
        src.buffer = buf;
        const f = ac.createBiquadFilter();
        f.type = 'bandpass';
        f.frequency.value = o.freq || 2000;
        const g = ac.createGain();
        g.gain.value = o.vol || 0.1;
        src.connect(f); f.connect(g); g.connect(master);
        src.start(t0);
      };
      const startMusic = () => {
        if (pad || !music || !ensure()) return;
        const out = ac.createGain();
        out.gain.value = 0.0001;
        out.gain.exponentialRampToValueAtTime(0.05, ac.currentTime + 6);
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 520;
        const lfo = ac.createOscillator();
        const lfoG = ac.createGain();
        lfo.frequency.value = 0.06;
        lfoG.gain.value = 220;
        lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
        const roots = [110, 98, 123.47, 87.31];
        const oscs = [];
        [1, 1.5, 2, 3].forEach((m, i) => {
          [-5, 5].forEach((det) => {
            const o = ac.createOscillator();
            o.type = i < 2 ? 'sawtooth' : 'triangle';
            o.frequency.value = roots[0] * m;
            o.detune.value = det;
            const g = ac.createGain();
            g.gain.value = i < 2 ? 0.5 : 0.25;
            o.connect(g); g.connect(lp); o.start();
            oscs.push({ o, m });
          });
        });
        lp.connect(out); out.connect(master);
        let step = 0;
        const timer = setInterval(() => {
          step = (step + 1) % roots.length;
          oscs.forEach(({ o, m }) => o.frequency.setTargetAtTime(roots[step] * m, ac.currentTime, 3));
        }, 14000);
        pad = { out, timer, oscs };
      };
      const stopMusic = () => {
        if (!pad) return;
        clearInterval(pad.timer);
        const p = pad;
        pad = null;
        p.out.gain.setTargetAtTime(0.0001, ac.currentTime, 0.6);
        setTimeout(() => p.oscs.forEach(({ o }) => { try { o.stop(); } catch {} }), 2500);
      };
      return {
        get on() { return on; },
        get music() { return music; },
        click: () => { tone(900, 0.05, { type: 'triangle', vol: 0.07 }); noise(0.03, { freq: 3500, vol: 0.05 }); },
        ok: () => { tone(523.25, 0.18, { type: 'triangle', vol: 0.12 }); tone(783.99, 0.28, { type: 'triangle', vol: 0.1, at: 0.08 }); },
        bad: () => { tone(150, 0.28, { type: 'sawtooth', vol: 0.13, slide: 90, cut: 700 }); },
        bell: () => { [1, 2.4, 3.9].forEach((m, i) => tone(329.63 * m, 2.2 - i * 0.5, { vol: 0.14 / (i + 1), attack: 0.004 })); },
        horn: () => { tone(98, 1.5, { type: 'sawtooth', vol: 0.16, attack: 0.3, cut: 500 }); tone(147, 1.5, { type: 'sawtooth', vol: 0.1, attack: 0.35, cut: 500 }); },
        toggle: () => {
          on = !on;
          try { localStorage.setItem('ss-sound', on ? '1' : '0'); } catch {}
          ensure();
          if (master) master.gain.setTargetAtTime(on ? 0.9 : 0, ac.currentTime, 0.1);
          if (on) { startMusic(); tone(660, 0.12, { type: 'triangle', vol: 0.1 }); } else stopMusic();
          return on;
        },
        wake: () => { if (on) startMusic(); },
      };
    })();

    const stageFx = { embers: null, raf: 0, parts: [] };

    function stageEmbers(light) {
      const el = stageFx.embers;
      const ctx = el.getContext('2d');
      const resize = () => { el.width = window.innerWidth; el.height = window.innerHeight; };
      resize();
      stageFx.parts = Array.from({ length: light ? 28 : 46 }, () => ({ x: Math.random() * el.width, y: Math.random() * el.height, r: 0.6 + Math.random() * 1.8, v: 0.12 + Math.random() * 0.4, a: Math.random() * Math.PI * 2, s: 0.003 + Math.random() * 0.01 }));
      const frame = () => {
        stageFx.raf = requestAnimationFrame(frame);
        if (document.hidden || document.body.classList.contains('in-map')) return;
        if (el.width !== window.innerWidth || el.height !== window.innerHeight) resize();
        ctx.clearRect(0, 0, el.width, el.height);
        const dark = document.documentElement.getAttribute('data-theme') !== 'light';
        stageFx.parts.forEach((p) => {
          p.y -= p.v; p.a += p.s; p.x += Math.sin(p.a) * 0.35;
          if (p.y < -10) { p.y = el.height + 10; p.x = Math.random() * el.width; }
          const flick = 0.55 + 0.45 * Math.sin(p.a * 6);
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
          g.addColorStop(0, dark ? `rgba(255,190,90,${0.9 * flick})` : `rgba(110,80,30,${0.35 * flick})`);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 5, 0, Math.PI * 2); ctx.fill();
        });
      };
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) frame();
    }

      overlay.append(h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, h('h2', {}, title), body, h('div', { class: 'actions' }, actions(close))));
      document.body.append(overlay);
      const first = overlay.querySelector('input:not([type=checkbox]), select');
      if (first) first.focus();
      return close;
    }

    function shieldSvg(H, width, opts = {}) {
      sigilDefs();
      const lod = width >= 56 ? 2 : width >= 30 ? 1 : 0;
      const C = CHARGES[H.ch] || CHARGES.star;
      const cy = (H.div === 'chief' ? 66 : 56) + C.dy;
      const inner = lod === 2 ? C.svg : C.svg;
      const chargeFill = C.fill ? `<g fill="url(#sg-gilt)"${lod < 2 ? ' stroke="rgba(0,0,0,.6)" stroke-width="1.6" paint-order="stroke" stroke-linejoin="round"' : ''}>${inner}</g>` : inner;
      const charge = `<g transform="translate(50 ${cy}) scale(1.28)"${lod === 2 ? ' filter="url(#sg-relief)"' : ''}>${chargeFill}</g>`;
      const rimW = lod === 2 ? 6.2 : 7.5;
      const svgText = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 124" width="${width}" height="${sigH(width)}" class="sigil${H.cls ? ' ' + H.cls : ''}${opts.draw ? ' draw' : ''}" role="img" aria-label="${H.name} arms" style="overflow:visible">
        <path d="${SHIELD}" fill="${H.c1}"/>
        <g clip-path="url(#sg-clip)">
          ${DIVISIONS[H.div] ? `<path d="${DIVISIONS[H.div]}" fill="${H.c2}"/>` : ''}
          ${lod === 2 ? '<rect width="100" height="124" filter="url(#sg-noise)" opacity=".28" style="mix-blend-mode:multiply"/>' : ''}
          ${lod >= 1 ? `<path d="${SHIELD}" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="1.2" transform="translate(50 62) scale(.84) translate(-50 -62)"/>` : ''}
          ${charge}
          <path d="${SHIELD}" fill="url(#sg-sheen)"/>
        </g>

    function loginWorld(opts, seed0) {
      const src = 'self.onmessage = async (e) => { try { const m = await import(e.data.url); self.postMessage({ ok: true, layout: m.generateWorld(e.data.opts) }); } catch (err) { self.postMessage({ ok: false, error: String((err && err.message) || err) }); } };';
      const worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })), { type: 'module' });
      const genUrl = new URL('supabase/functions/start-game/generator.js', location.href).href;
      return new Promise((resolve, reject) => {
        let seed = seed0;
        let tries = 0;
        const attempt = () => worker.postMessage({ url: genUrl, opts: { ...opts, seed } });
        worker.onmessage = (e) => {
          if (e.data.ok) { worker.terminate(); resolve(e.data.layout); return; }
          if (++tries < 8) { seed += 7919; attempt(); return; }
          worker.terminate();
          reject(new Error(e.data.error));
        };
        worker.onerror = () => { worker.terminate(); reject(new Error('worker failed')); };
        attempt();
      });
    }

    function flightTrack(api, castles, altitude) {
      const N = 900;
      const M = 48;
      const blur = (arr, w, passes) => {
        let a = arr;
        for (let p = 0; p < passes; p++) {
          const out = new Array(N);
          for (let i = 0; i < N; i++) { let s = 0; for (let k = -w; k <= w; k++) s += a[(i + k + N) % N]; out[i] = s / (2 * w + 1); }
          a = out;
        }
        return a;
      };
      const mx = castles.reduce((s, q) => s + q.x, 0) / castles.length;
      const mz = castles.reduce((s, q) => s + q.z, 0) / castles.length;
      const sum = new Array(M).fill(0);
      const cnt = new Array(M).fill(0);
      let rAll = 0;
      castles.forEach((q) => {
        const r = Math.hypot(q.x - mx, q.z - mz);
        rAll += r;
        const k = Math.floor(((Math.atan2(q.z - mz, q.x - mx) + Math.PI) / (2 * Math.PI)) * M) % M;
        sum[k] += r; cnt[k] += 1;
      });
      rAll /= castles.length;
      let rad = sum.map((s, k) => (cnt[k] ? s / cnt[k] : rAll));
      for (let pass = 0; pass < 8; pass++) rad = rad.map((_, k) => (rad[(k + M - 2) % M] + 2 * rad[(k + M - 1) % M] + 3 * rad[k] + 2 * rad[(k + 1) % M] + rad[(k + 2) % M]) / 9);
      const rawX = [];
      const rawZ = [];
      for (let i = 0; i < N; i++) {
        const fb = (i / N) * M - 0.5;
        const k0 = Math.floor(fb);
        const fr = fb - k0;
        const rr = Math.max((rad[((k0 % M) + M) % M] * (1 - fr) + rad[(((k0 + 1) % M) + M) % M] * fr) * 0.92, rAll * 0.5);
        const ang = (i / N) * 2 * Math.PI - Math.PI;
        rawX.push(mx + rr * Math.cos(ang)); rawZ.push(mz + rr * Math.sin(ang));
      }
      const X = blur(rawX, 8, 2);
      const Z = blur(rawZ, 8, 2);
      const off = Math.min(300, rAll * 0.2);
      const CX = [];
      const CZ = [];
      for (let i = 0; i < N; i++) {
        const dx = X[(i + 8) % N] - X[(i - 8 + N) % N];
        const dz = Z[(i + 8) % N] - Z[(i - 8 + N) % N];
        const l = Math.hypot(dx, dz) || 1;
        CX.push(X[i] - (dz / l) * off); CZ.push(Z[i] + (dx / l) * off);
      }
      const lift = (x, z) => { let m = 0; for (const s of castles) { const d = Math.hypot(s.x - x, s.z - z); if (d < 650) m = Math.max(m, 230 * (1 - d / 650)); } return m; };
      const ahead = (i, n, drop) => api.groundAt(CX[(i + n) % N], CZ[(i + n) % N]) + lift(CX[(i + n) % N], CZ[(i + n) % N]) - drop;
      const gmax = CX.map((x, i) => Math.max(api.groundAt(x, CZ[i]) + lift(x, CZ[i]), ahead(i, 15, 20), ahead(i, 30, 40)));
      let Y = blur(gmax.map((g) => g + altitude), 55, 3);
      Y = blur(Y.map((y, i) => Math.max(y, gmax[i] + 120)), 25, 2);
      const len = CX.reduce((s, x, i) => s + Math.hypot(CX[(i + 1) % N] - x, CZ[(i + 1) % N] - CZ[i]), 0);
      return { N, CX, CZ, Y, LA: Math.round(N * 0.045), len };
    }

    async function startLoginFlyover(host, caption) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (navigator.connection && navigator.connection.saveData) return;
      if (window.innerWidth < 900 || window.matchMedia('(pointer: coarse)').matches) return;
      let stopped = false;
      let api = null;
      const alive = () => host.isConnected && !stopped;
      state.cleanup.push(() => { stopped = true; if (api) { try { api.dispose(); } catch {} } });
      try {
        const presets = ['highlands', 'river_valley', 'continental'];
        const seed0 = Math.floor(Math.random() * 2 ** 30) + 1;
        const layout = await loginWorld({ players: 3, mapSize: 'compact', startingTerritories: 4, style: 'scatter', startingGarrison: 10, scale: 2.6, freeTravel: false, shape: 'continent', richness: 'standard', randomRoads: 'none', starScatter: 'random', mirrored: false, trails: true, preset: presets[seed0 % 3], homeDistance: 'medium' }, seed0);
        if (!alive()) return;
        const { createMap3D } = await import('./map3d.js');
        if (!alive()) return;
        const seats = ['kaldran', 'veyra', 'thornwick'];
        const sites = layout.territories.map((t, i) => ({ id: i, x: t.x, y: t.y, tier: t.tier, name: t.name, terrain: t.terrain, crossing_kind: t.crossing_kind || null, owner: null, troops: null, mine: false }));
        const edges = layout.edges.map((e) => ({ a: e.a, b: e.b, kind: e.kind, length: e.length, mult: e.move_cost_mult, path: e.path }));
        let track = null;
        let castles = [];
        let frames = 0;
        let t0 = 0;
        let checked = false;
        let label = '';
        const giveUp = () => { stopped = true; host.classList.remove('on'); setTimeout(() => { if (api) { try { api.dispose(); } catch {} api = null; } }, 2400); };
        const made = await createMap3D(host, {
          map_w: layout.map_w, art: layout.art, sites, edges, lowQuality: false,
          colors: (pid) => { const f = factionOf(seats[pid]); return [f.color, f.color2]; },
          sun: FLIGHT.sun, horizon: FLIGHT.horizon, fogMul: FLIGHT.fog, exposure: FLIGHT.exposure,
          onFrame: (t, dt, cam, controls) => {
            if (!track || stopped) return;
            if (!t0) t0 = performance.now();
            frames += 1;
            const el = performance.now() - t0;
            if (!checked && el > 6000) { checked = true; if ((frames * 1000) / el < 18) { giveUp(); return; } }
            controls.enabled = false; controls.maxPolarAngle = Math.PI * 0.62; controls.minDistance = 1;
            if (Math.abs(cam.fov - FLIGHT.fov) > 0.01) { cam.fov = FLIGHT.fov; cam.updateProjectionMatrix(); }
            const f = ((((t * FLIGHT.speed) / track.len) % 1) + 1) % 1 * track.N;
            const at = (arr, k) => { const i = Math.floor(k) % track.N; const j = (i + 1) % track.N; const r = k - Math.floor(k); return arr[i] * (1 - r) + arr[j] * r; };
            const px = at(track.CX, f); const pz = at(track.CZ, f); const py = at(track.Y, f);
            const lx = at(track.CX, f + track.LA); const lz = at(track.CZ, f + track.LA);
            const ly = py - Math.hypot(lx - px, lz - pz) * Math.tan(FLIGHT.pitch);
            cam.position.set(px, py, pz); cam.up.set(0, 1, 0); cam.lookAt(lx, ly, lz);
            controls.target.set(lx, Math.max(made.groundAt(lx, lz), 20), lz);
            let near = null; let nd = 1e9;
            for (const s of castles) { const d = Math.hypot(s.x - px, s.z - pz); if (d < nd) { nd = d; near = s; } }
            if (near && nd < 1500 && near.name !== label) {
              label = near.name;
              const owner = sites[near.id].owner;
              caption.replaceChildren(document.createTextNode(owner != null ? `LANDS OF HOUSE ${factionOf(seats[owner]).name.toUpperCase()}` : 'FREE HOLDING'), h('b', {}, near.name.toUpperCase()));
              caption.classList.add('on');
            } else if (nd >= 1800 && label) { label = ''; caption.classList.remove('on'); }
          },
        });
        api = made;
        if (!alive()) { try { made.dispose(); } catch {} api = null; return; }
        made.update(layout.territories.map((t, i) => ({ id: i, owner: t.owner_seat, troops: t.owner_seat != null ? 10 + (i % 7) * 3 : 12, mine: false })));
        castles = made.sites().filter((s) => !sites[s.id].crossing_kind);
        track = flightTrack(made, castles, FLIGHT.alt);
        host.classList.add('on');
      } catch (err) {
        console.warn('Login fly-over unavailable:', err);
        if (api) { try { api.dispose(); } catch {} api = null; }
      }
    }

        message.textContent = '';

      form.addEventListener('submit', async (e) => {

          message.textContent = '';
          if (tab === 'signin') {
            const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: password.value });
            if (error) throw error;
          } else if (tab === 'signup') {
            const display = name.value.trim();

            if (password.value.length < 8) throw new Error('Password must be at least 8 characters');

    function manualCalc() {
      const field = (label, input) => h('div', {}, h('label', {}, label), input);
      const num = (v) => h('input', { type: 'number', min: '0', value: String(v) });
      const aT = num(30); const aD = num(2); const dT = num(20); const dD = num(2);
      const kind = selectOf({ castle: 'Castle (defender strikes first, +1 damage)', field: 'Open field (attacker strikes first)' }, 'castle');
      const slider = h('input', { type: 'range', min: '0', max: '0', value: '0', 'aria-label': 'Round' });
      const out = h('div', { class: 'calcout' });
      const sim = () => {
        const mode = kind.value;
        const A = { t: Math.max(0, Math.floor(Number(aT.value))), dmg: Math.max(1, Math.floor(Number(aD.value))) };
        const D = { t: Math.max(0, Math.floor(Number(dT.value))), dmg: Math.max(1, Math.floor(Number(dD.value))) + (mode === 'castle' ? 1 : 0) };
        const defFirst = mode === 'castle';
        const F = defFirst ? D : A;
        const S = defFirst ? A : D;
        const rounds = [[A.t, D.t]];
        let a = A.t; let d = D.t;
        for (let guard = 0; guard < 400 && a > 0 && d > 0; guard++) {
          const hitF = defFirst ? () => { a = Math.max(0, a - F.dmg); } : () => { d = Math.max(0, d - F.dmg); };
          const hitS = defFirst ? () => { d = Math.max(0, d - S.dmg); } : () => { a = Math.max(0, a - S.dmg); };
          hitF();
          if (a > 0 && d > 0) hitS();
          rounds.push([a, d]);
        }
        return { rounds, A, D };
      };
      const draw = () => {
        const { rounds, A, D } = sim();
        slider.max = String(rounds.length - 1);
        const i = Math.min(Number(slider.value), rounds.length - 1);
        slider.value = String(i);
        const [a, d] = rounds[i];
        const last = rounds[rounds.length - 1];
        const verdict = last[0] === 0 && last[1] === 0 ? 'Both sides are empty.' : last[1] === 0 ? `Attacker wins with ${last[0]} troops left.` : last[0] === 0 ? `Defender wins with ${last[1]} troops left.` : '';
        const bar = (who, now, start, cls) => h('div', { class: 'cbarrow' }, h('span', {}, who), h('div', { class: 'cbar' }, h('i', { class: cls, style: `width:${start ? (100 * now) / start : 0}%` })), h('b', {}, String(now)));
        out.replaceChildren(
          bar('Attacker', a, A.t, 'att'), bar('Defender', d, D.t, 'def'),
          h('div', { class: 'tip' }, `After round ${i} of ${rounds.length - 1}. ${verdict}`));
      };
      [aT, aD, dT, dD, kind].forEach((el) => { el.addEventListener('input', draw); el.addEventListener('change', draw); });
      slider.addEventListener('input', draw);
      draw();
      return h('div', { class: 'mcalc' },
        h('div', { class: 'grid2' }, field('Attacker troops', aT), field('Attacker damage per round', aD), field('Defender troops', dT), field('Defender damage per round', dD)),
        h('label', {}, 'Kind of battle'), kind,
        h('label', {}, 'Step through the rounds'), slider, out);
    }

    const XREF = /\[\[([a-z]+)(?:#([a-z0-9-]+))?\|([^\]]+)\]\]/g;
    const inline = (text) => {
      const out = [];
      let last = 0;
      let m;
      XREF.lastIndex = 0;
      while ((m = XREF.exec(text))) {
        if (m.index > last) out.push(text.slice(last, m.index));
        const [, id, anchor, label] = m;
        out.push(manualGo ? h('button', { type: 'button', class: 'xref', onclick: () => manualGo(id, anchor) }, label) : label);
        last = XREF.lastIndex;

      if (last < text.length) out.push(text.slice(last));
      return out;
    };

            i < MANUAL.length - 1 ? h('button', { class: 'ghost', onclick: () => showSection(MANUAL[i + 1].id) }, `Next: ${MANUAL[i + 1].title}`) : h('span')));

        h('div', { class: 'mbody' }, nav, pane)));

      const boardList = h('div', { class: 'list' }, h('div', { class: 'empty' }, 'Loading'));

      const banner = (r) => {
        const g = r.games;
        const f = factionOf(r.faction_slug);
        return h('button', { class: 'banner', style: `--tint:${f.color}`, onclick: () => openGame(g.id) },
          h('div', { class: 'sig' }, sigil(r.faction_slug, 44)),
          h('div', { class: 'bname' }, g.name),
          h('div', { class: 'bmeta' }, `House ${f.name}`),
          h('div', { class: 'bstate' }, statusText(g)));
      };

      const openRow = (g) => {
        const taken = g.taken_factions || [];
        const pips = h('div', { class: 'pips', 'aria-label': `${g.player_count} of ${g.max_players} seats taken` },
          taken.map((sl) => sigil(sl, 20)),
          Array.from({ length: Math.max(0, g.max_players - taken.length) }, () => openShield(20)));
        return h('div', { class: 'lobby-strip' },
          h('div', {},
            h('div', { class: 'name game' }, g.name, g.joined ? h('span', { class: 'tag green' }, 'joined') : null, g.has_password ? h('span', { class: 'tag' }, 'password') : null),
            h('div', { class: 'meta game', style: 'margin-top:0' }, `Hosted by ${g.host_name}`),
            pips,
            h('div', { class: 'facts' }, gameFacts(g).map((t) => h('span', { class: 'fact' }, t)))),
          g.joined
            ? h('button', { class: 'primary small', onclick: () => showRoom(g.id) }, 'Open')
            : h('button', { class: 'primary small', disabled: g.player_count >= g.max_players, onclick: () => joinDialog(g) }, g.player_count >= g.max_players ? 'Full' : 'Join'));
      };

      const refresh = async () => {
        if (state.view !== 'home') return;
        const [open, mine, inv] = await Promise.all([
          sb.rpc('list_open_games'),
          sb.rpc('my_games'),
          sb.rpc('my_game_invites'),
        ]);
        if (state.view !== 'home') return;

        if (open.error) toast(open.error.message);
        else {
          openList.replaceChildren(...(open.data.length ? open.data.map(openRow) : [h('div', { class: 'empty' }, 'No open lobbies right now. Raise a campaign and others can join it.')]));
        }

        const invites = inv.data || [];
        inviteStrip.replaceChildren(...invites.map((i) => h('div', { class: 'panel invite' },
          h('div', {}, h('b', {}, i.host_name), ' invited you to ', h('b', {}, i.game_name)),
          h('div', { class: 'row', style: 'display:flex;gap:8px' },
            h('button', { class: 'primary small', onclick: () => { const g = (open.data || []).find((x) => x.id === i.game_id); if (g) joinDialog(g); else toast('That game is no longer open'); } }, 'Join'),
            h('button', { class: 'small', onclick: (e) => run(e.currentTarget, async () => { const r = await sb.rpc('decline_game_invite', { p_id: i.id }); if (r.error) throw r.error; await refresh(); }) }, 'Decline')))));
        if (mine.error) toast(mine.error.message);
        else {
          const rows = (mine.data || []).filter((r) => r.games).sort((a, b) => b.games.id - a.games.id);
          bannerGrid.replaceChildren(...rows.map(banner), h('button', { class: 'banner new', onclick: createDialog },
            h('span', { class: 'plus', 'aria-hidden': 'true' }, '+'), h('span', {}, rows.length ? 'Raise another campaign' : 'Raise your first campaign')));
        }
      };

      const profile = state.profile || {};
      crestHolder.replaceChildren(emblem(150, { draw: !state.homeDrawn }));
      state.homeDrawn = true;

      mount(h('div', { class: 'wrap' }, topbar(),

          h('aside', { class: 'panel house' },

            h('div', { class: 'record' },
              h('div', {}, h('b', {}, profile.total_games ?? 0), 'campaigns'),
              h('div', {}, h('b', {}, profile.total_wins ?? 0), 'victories'),
              h('div', {}, h('b', {}, profile.honor ?? 0), 'honor')),
            h('div', { class: 'actions' },
              h('button', { class: 'primary', onclick: createDialog }, 'Raise a campaign'),
              h('button', { class: 'ghost', onclick: helpDialog }, 'How to play'))),
          h('main', {},

            h('div', { class: 'panel' }, boardList),

      sb.rpc('get_leaderboard', { p_limit: 15 }).then(({ data, error }) => {
        if (error) return toast(error.message);
        boardList.replaceChildren(...(data.length
          ? data.map((r, i) => h('div', { class: 'honor' },

      });

      await refresh();
      try { const pending = sessionStorage.getItem('ss-join'); if (pending) { sessionStorage.removeItem('ss-join'); joinByCode(pending); } } catch {}

      const timer = setInterval(refresh, 8000);
      state.cleanup.push(() => clearInterval(timer));
    }

    const JOIN_HASH = /^#join=([A-Za-z0-9-]{3,12})$/;
    try {
      const m = JOIN_HASH.exec(location.hash);
      if (m) { sessionStorage.setItem('ss-join', m[1].toUpperCase()); history.replaceState(null, '', location.pathname + location.search); }
    } catch {}

    async function joinByCode(code) {
      const { data, error } = await sb.rpc('lookup_game_by_code', { p_code: code });
      if (error) return toast(error.message);
      if (data && data.error) return toast(data.error);
      if (data.joined) return showRoom(data.id);
      if (data.player_count >= data.max_players) return toast('That game is full');
      joinDialog(data, code);
    }

    async function inviteFriendsDialog(gameId) {
      const body = h('div', { class: 'friends' }, h('div', { class: 'empty' }, 'Loading'));
      const sent = new Set();
      const draw = (data) => {
        if (!data.friends.length) { body.replaceChildren(h('div', { class: 'empty' }, 'You have no friends yet. Open Friends from the top bar to add some, or share the code or link instead.')); return; }
        body.replaceChildren(...data.friends.map((f) => h('div', { class: 'frow' },
          h('span', {}, h('b', {}, f.name)),
          h('button', {
            class: sent.has(f.id) ? 'small' : 'primary small',
            disabled: sent.has(f.id),
            onclick: (e) => run(e.currentTarget, async () => { const r = await sb.rpc('invite_friend', { p_game_id: gameId, p_friendship_id: f.id }); if (r.error) throw r.error; sent.add(f.id); toast(`${f.name} invited`, true); draw(data); }),
          }, sent.has(f.id) ? 'Invited' : 'Invite'))));
      };
      modal('Invite friends', body, (close) => [h('button', { class: 'primary', onclick: close }, 'Done')]);
      const { data, error } = await sb.rpc('list_friends');
      if (error) { toast(error.message); return; }
      draw(data);
    }

      let pick = null;
      const picker = factionPicker(g.taken_factions, null, (v) => { pick = v; });
      const pw = h('input', { type: 'password', placeholder: 'game password' });
      modal(g.name, h('div', {}, h('div', { class: 'tip', style: 'margin:0 0 6px' }, `Hosted by ${g.host_name}`), h('div', { class: 'facts' }, gameFacts(g).map((t) => h('span', { class: 'fact' }, t))), h('label', {}, 'Choose your house'), picker, g.has_password ? h('div', {}, h('label', {}, 'Password'), pw) : null), (close) => [
        h('button', { onclick: close }, 'Cancel'),
        h('button', {
          class: 'primary',
          onclick: (e) => run(e.currentTarget, async () => {
            const { data, error } = code
              ? await sb.rpc('join_game_by_code', { p_code: code, p_faction_slug: pick, p_password: g.has_password ? pw.value : null })
              : await sb.rpc('join_game', { p_game_id: g.id, p_faction_slug: pick, p_password: g.has_password ? pw.value : null });
            if (error) throw error;
            if (code && data === null) throw new Error('No game has that code');
            close();

          }),

    function sv(tag, attrs, ...kids) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v === undefined || v === null || v === false) continue;
        if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v);
      }
      for (const kid of kids.flat()) {
        if (kid === null || kid === undefined || kid === false) continue;
        el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      }
      return el;
    }

    function clipPoly(poly, a, b, c) {
      const out = [];
      for (let i = 0; i < poly.length; i++) {
        const p = poly[i];
        const q = poly[(i + 1) % poly.length];
        const dp = a * p[0] + b * p[1] - c;
        const dq = a * q[0] + b * q[1] - c;
        if (dp <= 0) out.push(p);
        if ((dp < 0 && dq > 0) || (dp > 0 && dq < 0)) {
          const t = dp / (dp - dq);
          out.push([p[0] + t * (q[0] - p[0]), p[1] + t * (q[1] - p[1])]);
        }
      }
      return out;
    }

    function voronoiCells(sites, w, ht) {
      const cells = new Map();
      for (const s of sites) {
        let poly = [[0, 0], [w, 0], [w, ht], [0, ht]];
        for (const o of sites) {
          if (o === s || !poly.length) continue;
          const a = o.x - s.x;
          const b = o.y - s.y;
          poly = clipPoly(poly, a, b, (o.x * o.x + o.y * o.y - s.x * s.x - s.y * s.y) / 2);
        }
        cells.set(s.id, poly.map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' '));
      }
      return cells;
    }

    function decodeArt(art) {
      const G = art.grid;
      const h = new Float32Array(G * G);
      const m = new Float32Array(G * G);
      for (let i = 0; i < G * G; i++) {
        h[i] = parseInt(art.h.substr(i * 2, 2), 36) / 1295;
        m[i] = Number(art.m[i]) / 9;
      }
      return { G, h, m, sea: art.sea, seed: art.seed, rivers: art.rivers };
    }

    function bilerp(grid, G, fx, fy) {
      fx = Math.min(G - 1.001, Math.max(0, fx));
      fy = Math.min(G - 1.001, Math.max(0, fy));
      const ix = Math.floor(fx);
      const iy = Math.floor(fy);
      const tx = fx - ix;
      const ty = fy - iy;
      const a = grid[iy * G + ix];
      const b = grid[iy * G + ix + 1];
      const c = grid[(iy + 1) * G + ix];
      const d = grid[(iy + 1) * G + ix + 1];
      return a * (1 - tx) * (1 - ty) + b * tx * (1 - ty) + c * (1 - tx) * ty + d * tx * ty;
    }


    function paintTerrain(art, mapW, sites) {
      const d = decodeArt(art);
      const G = d.G;
      const cell = mapW / G;
      const W = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = W;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(W, W);
      const H = (x, y) => bilerp(d.h, G, x / cell - 0.5, y / cell - 0.5);
      const M = (x, y) => bilerp(d.m, G, x / cell - 0.5, y / cell - 0.5);
      const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
      const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
      const deep = [14, 47, 79];
      const shallow = [52, 128, 168];
      const foam = [150, 205, 210];
      const sand = [214, 196, 140];
      const dry = [150, 160, 88];
      const wet = [84, 138, 70];
      const forestC = [44, 98, 58];
      const hillC = [148, 138, 86];
      const rockC = [128, 120, 112];
      const snow = [240, 243, 247];
      const e = cell * 0.8;

      for (let py = 0; py < W; py++) {
        for (let px = 0; px < W; px++) {
          const x = ((px + 0.5) / W) * mapW;
          const y = ((py + 0.5) / W) * mapW;
          const h = H(x, y);
          let c;
          if (h < d.sea) {
            const t = h / d.sea;
            c = mix(deep, shallow, ss(0.25, 1, t));
            if (t > 0.9) c = mix(c, foam, 0.55 * ss(0.9, 1, t));
          } else {
            const el = (h - d.sea) / (1 - d.sea);
            const m = M(x, y);
            c = mix(dry, wet, m);
            c = mix(c, forestC, ss(0.55, 0.72, m) * (1 - ss(0.35, 0.55, el)));
            c = mix(c, hillC, ss(0.22, 0.4, el) * 0.8);
            c = mix(c, rockC, ss(0.38, 0.55, el));
            c = mix(c, snow, ss(0.62, 0.78, el));
            c = mix(sand, c, ss(0, 0.07, el));
            const shade = (-(H(x + e, y) - H(x - e, y)) - (H(x, y + e) - H(x, y - e))) * 4.6;
            const f = Math.min(1.5, Math.max(0.62, 1 + shade));
            c = [c[0] * f, c[1] * f, c[2] * f];
          }
          const o = (py * W + px) * 4;
          img.data[o] = Math.min(255, c[0]);
          img.data[o + 1] = Math.min(255, c[1]);
          img.data[o + 2] = Math.min(255, c[2]);
          img.data[o + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const OUT = 2048;
      const hi = document.createElement('canvas');
      hi.width = OUT;
      hi.height = OUT;
      const cx = hi.getContext('2d');
      cx.imageSmoothingEnabled = true;
      cx.imageSmoothingQuality = 'high';
      cx.drawImage(canvas, 0, 0, OUT, OUT);

      let seed = d.seed >>> 0;
      const rnd = () => {
        seed = (seed + 0x6d2b79f5) | 0;

      };
      const scale = OUT / mapW;
      const clear = (x, y) => sites.every((s) => Math.hypot(s.x - x, s.y - y) > 30);
      const peaks = [];
      const trees = [];
      for (let py = 6; py < W - 6; py += 8) {
        for (let px = 6; px < W - 6; px += 8) {
          const x = ((px + rnd() * 8) / W) * mapW;
          const y = ((py + rnd() * 8) / W) * mapW;
          const h = H(x, y);
          if (h < d.sea + 0.02) continue;
          const el = (h - d.sea) / (1 - d.sea);
          const m = M(x, y);
          if (el > 0.4 && rnd() < 0.3 && clear(x, y)) peaks.push({ px: x * scale, py: y * scale, size: (12 + el * 17 + rnd() * 6) * 2, snow: el > 0.58, j: rnd() });
          else if (m > 0.55 && el < 0.45 && rnd() < 0.6 && clear(x, y)) trees.push({ px: x * scale, py: y * scale, r: (2.4 + rnd() * 1.6) * 2, kind: rnd(), tone: rnd() });
        }
      }
      trees.sort((a, b) => a.py - b.py);
      for (const t of trees) {
        const g = 34 + t.tone * 30;
        cx.fillStyle = 'rgba(10,34,18,0.38)';
        cx.beginPath();
        cx.ellipse(t.px + t.r * 0.5, t.py + t.r * 0.35, t.r * 1.2, t.r * 0.5, 0, 0, 7);
        cx.fill();
        if (t.kind < 0.65) {
          const hgt = t.r * 3.4;
          cx.fillStyle = '#3b2a18';
          cx.fillRect(t.px - t.r * 0.14, t.py - t.r * 0.4, t.r * 0.28, t.r * 0.6);
          for (let i = 0; i < 3; i++) {
            const yb = t.py - t.r * 0.3 - i * hgt * 0.26;
            const w = t.r * (1.15 - i * 0.28);
            cx.fillStyle = `rgb(${20 + i * 6},${g + 30 + i * 14},${40 + i * 6})`;
            cx.beginPath();
            cx.moveTo(t.px - w, yb);

            cx.fill();

        }
      }
      peaks.sort((a, b) => a.py - b.py);
      for (const p of peaks) {
        const w = p.size;
        const ht = p.size * 1.05;
        const j = p.j;
        cx.fillStyle = 'rgba(0,0,0,0.25)';
        cx.beginPath();
        cx.ellipse(p.px + w * 0.22, p.py + 2, w * 0.7, w * 0.17, 0, 0, 7);
        cx.fill();
        const lx = p.px - w * 0.5;
        const rx = p.px + w * 0.5;
        const apex = p.px + (j - 0.5) * w * 0.12;
        const lit = cx.createLinearGradient(lx, p.py - ht, apex, p.py);
        lit.addColorStop(0, '#d8cfbc');
        lit.addColorStop(1, '#a39a88');
        const dark = cx.createLinearGradient(apex, p.py - ht, rx, p.py);
        dark.addColorStop(0, '#80766a');
        dark.addColorStop(1, '#524a42');
        cx.fillStyle = lit;
        cx.beginPath();
        cx.moveTo(lx, p.py);
        cx.lineTo(lx + w * 0.16, p.py - ht * 0.42);
        cx.lineTo(apex - w * 0.08, p.py - ht * 0.62);
        cx.lineTo(apex, p.py - ht);
        cx.lineTo(apex + w * 0.04, p.py - ht * 0.3);
        cx.lineTo(apex + w * 0.05, p.py);
        cx.closePath();
        cx.fill();
        cx.fillStyle = dark;
        cx.beginPath();
        cx.moveTo(apex, p.py - ht);
        cx.lineTo(apex + w * 0.12, p.py - ht * 0.58);
        cx.lineTo(rx - w * 0.14, p.py - ht * 0.36);
        cx.lineTo(rx, p.py);

        cx.lineTo(apex + w * 0.04, p.py - ht * 0.3);
        cx.closePath();
        cx.fill();

        cx.beginPath();
        cx.moveTo(apex, p.py - ht);
        cx.lineTo(apex + w * 0.04, p.py - ht * 0.3);
        cx.lineTo(apex + w * 0.05, p.py);

        cx.strokeStyle = 'rgba(255,255,255,0.12)';
        cx.beginPath();
        cx.moveTo(apex - w * 0.02, p.py - ht * 0.9);

          cx.moveTo(apex - w * 0.2, p.py - ht * 0.66);
          cx.lineTo(apex - w * 0.06, p.py - ht * 0.6);
          cx.lineTo(apex - w * 0.02, p.py - ht * 0.7);
          cx.lineTo(apex, p.py - ht);
          cx.lineTo(apex + w * 0.06, p.py - ht * 0.74);
          cx.lineTo(apex + w * 0.14, p.py - ht * 0.62);
          cx.lineTo(apex + w * 0.2, p.py - ht * 0.58);
          cx.lineTo(apex + w * 0.04, p.py - ht * 0.5);
          cx.closePath();
          cx.fill();
          cx.fillStyle = 'rgba(110,130,160,0.35)';
          cx.beginPath();
          cx.moveTo(apex, p.py - ht);
          cx.lineTo(apex + w * 0.06, p.py - ht * 0.74);
          cx.lineTo(apex + w * 0.2, p.py - ht * 0.58);
          cx.lineTo(apex + w * 0.04, p.py - ht * 0.5);

    function paintExplored(grid, sources, mapW) {

    function resolveFight(mode, a, d, firstSide) {
      const aT = Math.max(0, Math.floor(a.troops));
      const dT = Math.max(0, Math.floor(d.troops));
      const aDmg = Math.max(1, Math.floor(a.damage));
      const dDmg = Math.max(1, Math.floor(d.damage)) + (mode === 'castle' ? 1 : 0);
      if (mode === 'castle' && dT === 0) return { winner: 'attacker', left: aT, note: 'An undefended castle always falls.' };
      if (aT === 0 && dT === 0) return { winner: null, left: 0, note: 'Neither side has troops.' };
      if (aT === 0) return { winner: 'defender', left: dT, note: 'The attacker has no troops.' };
      if (dT === 0) return { winner: 'attacker', left: aT, note: 'The defender has no troops.' };
      const defFirst = mode === 'castle' || firstSide === 'defender';
      const F = defFirst ? { side: 'defender', t: dT, dmg: dDmg } : { side: 'attacker', t: aT, dmg: aDmg };
      const S = defFirst ? { side: 'attacker', t: aT, dmg: aDmg } : { side: 'defender', t: dT, dmg: dDmg };
      const rS = Math.ceil(S.t / F.dmg);
      const rF = Math.ceil(F.t / S.dmg);
      if (rS <= rF) return { winner: F.side, left: F.t - (rS - 1) * S.dmg, note: `${F.side} strikes first and needs ${rS} round${rS === 1 ? '' : 's'}; ${S.side} needs ${rF}.` };
      return { winner: S.side, left: S.t - rF * F.dmg, note: `${F.side} strikes first and needs ${rS} round${rS === 1 ? '' : 's'}; ${S.side} needs ${rF}.` };
    }

          if (u !== fromId && !(tu && isFriend(tu.owner_player_id))) continue;
          (adj.get(u) || []).forEach(({ to, w }) => {

          });
        }
        const out = new Map();
        cost.forEach((c, id) => {
          if (id === fromId) return;

          while (path[0] !== fromId) path.unshift(prev.get(path[0]));

        });
        return out;
      };
      const trailPoly = (ids) => {
        const pts = [];
        for (let i = 0; i < ids.length - 1; i++) {
          const a = ids[i];
          const b = ids[i + 1];
          const e = ms.edges.find((x) => (x.from_territory_id === a && x.to_territory_id === b) || (x.from_territory_id === b && x.to_territory_id === a));
          let seg = e && e.path ? e.path.map((q) => ({ x: q[0], y: q[1] })) : [ms.t.get(a), ms.t.get(b)];
          if (e && e.path && e.from_territory_id !== a) seg = seg.slice().reverse();
          pts.push(...(i ? seg.slice(1) : seg));
        }
        return pts;
      };
      const stopTicks = () => {
        let ticks = 0;
        return ms.stops.map((st) => {
          if (st.cost && ms.speed) ticks += Math.ceil(st.cost / ms.speed);
          const at = ticks;
          ticks += st.delay || 0;
          return at;
        });
      };
      const tickText = (n) => {
        const interval = TICK_MS[ms.game.tick_speed];

      };

      const tickF = () => {
        const g = ms.game;
        const interval = TICK_MS[g.tick_speed];
        if (!interval || !g.last_tick_processed_at || g.status !== 'active' || g.paused_at) return g.current_tick;
        return g.current_tick + Math.min(1, Math.max(0, (Date.now() - Date.parse(g.last_tick_processed_at)) / interval));

      const edgePath = (a, b) => {
        if (ms.edgeMapFor !== ms.edges) { ms.edgeMap = new Map(ms.edges.map((e) => [e.from_territory_id + '-' + e.to_territory_id, e])); ms.edgeMapFor = ms.edges; }

        for (let k = 1; k < pts.length; k++) total += Math.hypot(pts[k].x - pts[k - 1].x, pts[k].y - pts[k - 1].y);
        let d = f * total;
        for (let k = 1; k < pts.length; k++) {

      const renderDyn = () => {

          h('button', { class: 'ghost', onclick: helpDialog }, 'Help')].filter(Boolean));
        updateCountdown();
      };

      const order = (fn, args, message) => (e) => act(e.currentTarget, async () => {
        const { data, error } = await sb.rpc(fn, { p_game_id: gameId, ...args });
        if (error) throw error;
        if (message) toast(typeof message === 'function' ? message(data) : message, true);
      });

      const INFRA = [
        { type: 'treasury', name: 'Treasury', col: 'treasury_level', base: 1250, note: 'gold', mult: 'treasury_cost_mult' },
        { type: 'recruitment', name: 'Recruitment', col: 'industry_level', base: 2500, note: 'troops', mult: 'recruitment_cost_mult' },
        { type: 'prestige', name: 'Prestige', col: 'prestige_level', base: 10000, note: 'prestige', mult: 'prestige_cost_mult' },
      ];

      const buildSection = (t) => {
        if (t.owner_player_id !== ms.me.id || !canAct()) return null;
        const mult = ms.game.infra_cost_mult;
        const gold = ms.me.gold;
        const out = [h('b', {}, 'Build')];
        INFRA.forEach((i) => {
          const lvl = t[i.col];
          const cost = Math.max(1, Math.floor(i.base * (lvl + 1) / t.resources * mult * ms.game[i.mult]));
          out.push(h('button', {
            class: 'cmdrow',
            disabled: gold < cost,
            onclick: order('upgrade_infrastructure', { p_territory_id: t.id, p_type: i.type }, (d) => `${i.name} is now level ${d.level}`),
          }, `${i.name} ${lvl} > ${lvl + 1}`, h('span', { style: 'color:var(--dim);margin-left:auto' }, `${cost} gold`)));
        });
        if (t.has_road) {
          out.push(h('button', { class: 'cmdrow', onclick: order('demolish_road', { p_territory_id: t.id }, 'Road demolished') }, 'Demolish road', h('span', { style: 'color:var(--dim);margin-left:auto' }, 'free')));
        } else {
          const cost = Math.max(1, Math.floor(6 * t.resources * mult * (ms.game.roads_mode === 'expensive' ? 3 : 1)));
          if (ms.game.roads_mode !== 'disabled') out.push(h('button', { class: 'cmdrow', disabled: gold < cost, onclick: order('build_road', { p_territory_id: t.id }, 'Road built') }, 'Build road', h('span', { style: 'color:var(--dim);margin-left:auto' }, `${cost} gold`)));
        }
        if (ms.game.mercenaries_enabled) {
          const size = h('input', { type: 'number', min: '10', max: '60', value: '20', style: 'width:80px' });
          out.push(h('b', { style: 'margin-top:12px' }, 'Hire mercenaries (5 gold per troop, 48 tick contract)'),
            h('div', { class: 'row wrap2' }, size, h('button', {
              disabled: gold < 50,
              onclick: (e) => order('hire_mercenaries', { p_territory_id: t.id, p_troops: Number(size.value) }, (d) => `${d.name} hired for ${d.cost} gold`)(e),
            }, 'Hire company')));
        }
        const hire = ms.game.commander_cost;
        out.push(h('b', { style: 'margin-top:12px' }, `Hire a commander (${hire} gold)`),
          h('div', { class: 'row wrap2' }, SCHOOLS.map((sc) => h('button', {
            disabled: gold < hire,
            onclick: order('hire_commander', { p_territory_id: t.id, p_school: sc.slug }, (d) => `${d.name} joins${d.role === 'king' ? ' as king' : ''}`),
          }, sc.name))));
        return h('div', { class: 'sec' }, out);
      };

      const realmSection = () => {
        const g = ms.game;
        const live = canAct();
        const order_ = Object.keys(AREA_NAMES);
        const rows = [...ms.areas].sort((x, y) => order_.indexOf(x.area) - order_.indexOf(y.area)).map((a) => {
          const need = Math.ceil(144 * a.level * g.area_cost_mult);
          return h('div', { class: 'line' },
            h('span', { style: 'color:var(--text)' }, `${AREA_NAMES[a.area] || a.area}${a.is_active ? ' (active)' : ''}`),
            h('span', {}, `Lv ${a.level} · ${a.prestige_accumulated}/${need}`),
            live && !a.is_active ? h('button', { style: 'padding:2px 8px;font-size:.78rem', onclick: order('set_active_area', { p_area: a.area }, `${AREA_NAMES[a.area]} is now the active area`) }, 'Activate') : null);
        });
        const type = h('select', {}, INFRA.map((i) => h('option', { value: i.type }, i.name)));
        const budget = h('input', { type: 'number', min: '1', value: Math.min(100, ms.me.gold) || 1, style: 'width:90px' });
        return [
          h('div', { class: 'sec' }, h('b', {}, 'Realm areas (level, prestige to next)'), rows),
          live ? h('div', { class: 'sec' }, h('b', {}, 'Surrender'),
            h('button', {
              class: 'danger',
              onclick: (e) => {
                if (confirm('Concede defeat? You are eliminated at once, your commanders die and your castles become unowned. This cannot be undone.')) {
                  order('concede_defeat', {}, 'You have conceded')(e);
                }
              },
            }, 'Concede defeat')) : null,
          live ? h('div', { class: 'sec' }, h('b', {}, 'Upgrade everywhere, cheapest first'),
            h('div', { class: 'row wrap2' }, type, budget,
              h('button', {
                onclick: (e) => order('bulk_upgrade_infrastructure', { p_infra_type: type.value, p_budget: Number(budget.value) || 1 }, (d) => `${d.upgraded} upgrades for ${d.spent} gold`)(e),
              }, 'Spend'))) : null,
        ];
      };

      const assaultButton = (t) => h('button', {
        class: 'danger',
        onclick: (e) => {
          if (confirm(`Your besieging commanders at ${t.name} attack the castle now. The defenders get their bonus. Continue?`)) {
            order('break_siege_and_assault', { p_territory_id: t.id }, (d) => (d.captured ? `${t.name} captured` : 'The assault failed'))(e);
          }
        },
      }, 'Assault now');

      const siegeSection = (t) => {
        if (!canAct()) return null;
        const siegers = ms.cmd.filter((c) => c.status === 'sieging' && c.current_territory_id === t.id && commanderSeen(c, tickF()));
        if (!siegers.length) return null;
        const troops = siegers.reduce((a, c) => a + c.troops, 0);
        const out = [h('b', {}, 'Under siege'),
          line('Besieged by', [...new Set(siegers.map((c) => pname(c.owner_player_id)))].join(', ')),
          line('Besiegers', `${siegers.length} commander${siegers.length > 1 ? 's' : ''}, ${troops} troops`)];
        if (t.owner_player_id === ms.me.id) {
          const defenders = ms.cmd.filter((c) => c.current_territory_id === t.id && c.status === 'idle' && isFriend(c.owner_player_id));
          const force = t.troops + defenders.reduce((a, c) => a + c.troops, 0);
          out.push(line('Your force', `${t.troops} garrison + ${defenders.length} commander${defenders.length === 1 ? '' : 's'} (${force} troops)`),
            h('div', { style: 'margin-top:8px' }, h('button', {
              class: 'danger',
              onclick: (e) => {
                if (confirm('Sally out? Your garrison and idle commanders here fight the besiegers in the open. Ties go to the besiegers. If you lose, the garrison is emptied and those commanders die.')) {
                  order('sally_out', { p_territory_id: t.id }, (d) => (d.winner === 'sally' ? `Siege broken. ${d.survivors} survivors` : 'The sally was destroyed'))(e);
                }
              },
            }, 'Sally out')));
        }
        if (siegers.some((c) => c.owner_player_id === ms.me.id)) out.push(h('div', { style: 'margin-top:8px' }, assaultButton(t)));
        return h('div', { class: 'sec' }, out);
      };

      const routeLines = (route, call, c) => h('div', { style: 'margin-bottom:8px' },
        route.stops.map((st, i) => {
          const nm = (ms.t.get(st.territory_id) || { name: '?' }).name;
          const what = st.action && st.action !== 'nothing' ? ` · ${ACTION_NAMES[st.action]}${ACTION_NEEDS_AMOUNT.has(st.action) ? ' ' + st.amount : ''}` : '';
          const wait = st.delay ? ` · wait ${st.delay}` : '';
          return h('div', { style: `color:${i === route.next_stop_index ? 'var(--gold2)' : 'var(--dim)'}` }, `${i + 1}. ${nm}${what}${wait}`);
        }),
        route.looping ? h('div', { style: `color:${route.next_stop_index >= route.stops.length ? 'var(--gold2)' : 'var(--dim)'}` }, `Then back to ${(ms.t.get(route.origin_territory_id) || { name: '?' }).name} and repeat`) : null,
        h('div', { style: 'margin-top:6px' }, h('button', { onclick: call('set_route_loop', { p_commander_id: c.id, p_loop: !route.looping }, route.looping ? 'Loop turned off' : 'Looping from the last stop') }, route.looping ? 'Stop looping' : 'Loop route')));

      const commanderActions = (c) => {
        if (c.owner_player_id !== ms.me.id || !canAct()) return null;
        const call = (fn, args, message) => (e) => act(e.currentTarget, async () => {
          const { error } = await sb.rpc(fn, { p_game_id: gameId, ...args });
          if (error) throw error;
          if (message) toast(message, true);
        });

        if (c.status === 'moving') {
          const route = ms.routes.get(c.id);
          const m = ms.mov.get(c.id);
          if (route && route.status === 'recalled' && m) {
            return h('div', { class: 'sec' }, h('b', {}, 'Orders'),
              h('div', { style: 'color:var(--gold2)' }, `Recalled. Reaches ${ms.t.get(m.to_territory_id).name} first, then returns to ${ms.t.get(route.origin_territory_id).name}.`));
          }
          if (route && route.status === 'aborted' && m) {
            return h('div', { class: 'sec' }, h('b', {}, 'Orders'),
              h('div', { style: 'color:var(--gold2)' }, `Halting at ${ms.t.get(m.to_territory_id).name}.`));
          }
          return h('div', { class: 'sec' }, h('b', {}, 'Orders'),
            route && route.status === 'active' ? routeLines(route, call, c) : null,
            h('div', { class: 'row wrap2' },
              h('button', { onclick: call('abort_route', { p_commander_id: c.id }, 'Will halt at the next stop') }, 'Halt at next stop'),
              h('button', { onclick: call('recall_route', { p_commander_id: c.id }, 'Recalling to origin') }, 'Recall')));
        }
        if ((c.status !== 'idle' && c.status !== 'sieging') || !c.current_territory_id) return null;

        const t = ms.t.get(c.current_territory_id);
        const out = [h('b', {}, 'Orders')];
        const waiting = ms.routes.get(c.id);
        if (waiting && waiting.status === 'active' && waiting.resume_tick != null) {
          out.push(h('div', { style: 'color:var(--gold2);margin-bottom:6px' }, `Waiting at ${t.name} until tick ${waiting.resume_tick}, then continues its route.`),
            routeLines(waiting, call, c),
            h('div', { style: 'margin-bottom:10px' }, h('button', { onclick: call('abort_route', { p_commander_id: c.id }, 'Route cancelled') }, 'Cancel route')));
        }
        if (c.status === 'sieging') {
          out.push(h('div', { style: 'color:var(--gold2);margin-bottom:8px' }, `Besieging ${t.name}. The garrison starves each tick.`),
            h('div', { style: 'margin-bottom:10px' }, assaultButton(t)));
        }

        if (t.owner_player_id === ms.me.id) {
          const amount = h('input', { type: 'number', min: '1', value: ms.xfer, style: 'width:90px', oninput: (e) => { ms.xfer = Math.max(1, Number(e.target.value) || 1); } });
          out.push(h('div', { class: 'row wrap2', style: 'margin-bottom:10px' },
            amount,
            h('button', { onclick: (e) => act(e.currentTarget, async () => {
              const { error } = await sb.rpc('transfer_troops', { p_game_id: gameId, p_commander_id: c.id, p_amount: Number(amount.value) || 1 });
              if (error) throw error;
            }) }, 'Take'),
            h('button', { onclick: (e) => act(e.currentTarget, async () => {
              const { error } = await sb.rpc('transfer_troops', { p_game_id: gameId, p_commander_id: c.id, p_amount: -(Number(amount.value) || 1) });
              if (error) throw error;
            }) }, 'Leave'),
            h('span', { style: 'color:var(--dim);font-size:.8rem' }, `Garrison ${t.troops}`)));
        }

        const extras = [];
        if (t.owner_player_id === ms.me.id && t.garrison_commander_id !== c.id) {
          extras.push(h('button', { onclick: order('assign_garrison_commander', { p_commander_id: c.id }, 'Now leads the garrison') }, 'Lead garrison'));
        }
        if (!ms.cmd.some((x) => x.owner_player_id === ms.me.id && x.role === 'king')) {
          extras.push(h('button', { onclick: order('crown_commander', { p_commander_id: c.id }, (d) => `Crowned. Takes effect at tick ${d.effective_tick}`) }, 'Crown as king'));
        }
        if (extras.length) out.push(h('div', { class: 'row wrap2', style: 'margin-bottom:10px' }, extras));

        if (t.garrison_commander_id === c.id) {
          out.push(h('div', { style: 'color:var(--dim);margin-bottom:8px' }, 'Leads this garrison and cannot march.'),
            h('button', { onclick: call('unassign_garrison_commander', { p_territory_id: t.id }, 'Released from the garrison') }, 'Release from garrison'));
          return h('div', { class: 'sec' }, out);
        }

        if (!ms.marching) {
          out.push(h('button', { class: 'primary', onclick: () => { ms.marching = true; ms.preview = null; render(); drawSide(); } }, 'March...'));
          return h('div', { class: 'sec' }, out);
        }

        out.push(h('div', { style: 'color:var(--gold2);margin-bottom:8px' }, ms.stops.length ? 'Click a castle to add the next stop.' : 'Click a castle on the map to choose the destination.'));
        const pv = ms.preview;
        if (pv && pv.error) out.push(h('div', { style: 'color:var(--gules-hi);margin-bottom:8px' }, pv.error));
        if (pv && !pv.plan && !pv.error) out.push(h('div', { class: 'empty' }, 'Planning route...'));
        if (pv && pv.plan) {
          const plan = pv.plan;
          const dest = ms.t.get(pv.to);
          const interval = TICK_MS[ms.game.tick_speed];
          const eta = interval ? ` (about ${fmtDuration((plan.arrival_tick - tickF()) * interval)})` : '';
          out.push(h('div', {},
            line('Destination', dest.name),
            line('Route', plan.path.map((id) => ms.t.get(id).name).join(' > ')),
            line('Travel', `${plan.travel_ticks} ticks`),
            line('Arrives', `tick ${plan.arrival_tick}${eta}`),
            line('Distance / range', `${Math.round(plan.raw_length)} / ${plan.range}`),
            line('In range', plan.in_range ? (plan.raw_length > plan.range ? 'Yes (single hop)' : 'Yes') : 'No')));
          const friendly = dest.owner_player_id && isFriend(dest.owner_player_id);
          if (!friendly) {
            const type = h('select', { onchange: (e) => { pv.type = e.target.value; } },
              h('option', { value: 'assault' }, 'Assault the castle'),
              h('option', { value: 'siege' }, 'Lay siege'));
            type.value = pv.type;
            out.push(h('label', {}, 'On arrival'), type);
          }
          out.push(h('div', { class: 'row wrap2', style: 'margin-top:10px' },
            h('button', {
              class: 'primary',
              disabled: !plan.in_range,
              onclick: (e) => act(e.currentTarget, async () => {
                const { data, error } = await sb.rpc('march_commander', { p_game_id: gameId, p_commander_id: c.id, p_to_territory_id: pv.to, p_march_type: pv.type });
                if (error) throw error;
                ms.marching = false;
                ms.preview = null;
                ms.stops = []; ms.loop = false;
                toast(`Marching. Arrives at tick ${data.arrival_tick}`, true);
              }),
            }, 'March'),
            h('button', {
              disabled: !plan.in_range,
              onclick: () => { ms.stops = [{ id: pv.to, type: pv.type, action: PREFS.action, amount: 0, delay: 0, path: plan.path, cost: plan.raw_length }]; ms.loop = false; ms.preview = null; render(); drawSide(); },
            }, 'Start a route here')));
        }
        if (ms.stops.length) {
          const when = stopTicks();
          const origin = ms.t.get(c.current_territory_id);
          const loopBlocked = ms.loop && ms.stops[ms.stops.length - 1].id === c.current_territory_id;
          out.push(h('div', { class: 'sec' }, h('b', {}, `Route (${ms.stops.length} of 10 stops)`),
            ms.stops.map((st, i) => {
              const dest = ms.t.get(st.id);
              const friendly = dest.owner_player_id && isFriend(dest.owner_player_id);
              const type = friendly ? null : h('select', { style: 'width:auto;padding:3px 6px', onchange: (e) => { st.type = e.target.value; } },
                h('option', { value: 'assault' }, 'Assault'), h('option', { value: 'siege' }, 'Siege'));
              if (type) type.value = st.type;
              return h('div', {},
                h('div', { class: 'line', style: 'align-items:center' },
                  h('span', { style: 'color:var(--text)' }, `${i + 1}. ${dest.name}`),
                  h('span', { class: 'row' }, ms.speed && st.cost ? h('span', { style: 'color:var(--dim);font-size:.8rem' }, `+${when[i]} ticks`) : null, type,
                    h('button', { style: 'padding:2px 8px', onclick: () => { if (trailsOn()) ms.stops.splice(i); else ms.stops.splice(i, 1); render(); drawSide(); } }, 'x'))),
                dest.owner_player_id === ms.me.id ? orderControls(st, drawSide) : null);
            }),
            ms.speed ? line('Reaches the last stop in', tickText(when[when.length - 1])) : null,
            h('label', { class: 'check', style: 'margin:8px 0' }, h('input', { type: 'checkbox', checked: ms.loop, onchange: (e) => { ms.loop = e.target.checked; drawSide(); } }), `Loop: return to ${origin.name} and repeat`),
            ms.loop ? h('div', {}, h('div', { style: 'color:var(--dim);font-size:.8rem' }, `On each return to ${origin.name}`), orderControls(ms.originOrder, drawSide)) : null,
            loopBlocked ? h('div', { style: 'color:var(--gules-hi);margin:6px 0' }, 'A looping route must end somewhere other than where it starts.') : null,
            h('div', { style: 'color:var(--dim);font-size:.8rem;margin:6px 0' }, trailsOn()
              ? 'Click castles to add stops. Each stop must be within range of the one before it. Orders run when the commander arrives at a castle you own.'
              : 'Click more castles to add stops. Only the first leg is checked now; later legs are planned when the commander reaches each stop, and the route ends if one is blocked.'),
            h('button', {
              class: 'primary',
              disabled: loopBlocked,
              onclick: (e) => act(e.currentTarget, async () => {
                const { data, error } = await sb.rpc('send_on_route', {
                  p_game_id: gameId, p_commander_id: c.id, p_march_type: 'assault',
                  p_stops: ms.stops.map((st) => ({ territory_id: st.id, march_type: st.type, action: st.action || 'nothing', amount: st.amount || 0, delay: st.delay || 0 })),
                  p_options: { loop: ms.loop, origin_order: ms.originOrder },
                });
                if (error) throw error;
                ms.marching = false;
                ms.preview = null;
                ms.stops = []; ms.loop = false;
                toast(`Route started with ${data.stops} stop${data.stops === 1 ? '' : 's'}. First leg arrives at tick ${data.arrival_tick}`, true);
              }),
            }, `Send route (${ms.stops.length} stop${ms.stops.length === 1 ? '' : 's'})`)));
        }
        out.push(h('div', { style: 'margin-top:10px' }, h('button', { onclick: () => { ms.marching = false; ms.preview = null; ms.stops = []; ms.loop = false; render(); drawSide(); } }, 'Cancel')));
        return h('div', { class: 'sec' }, out);
      };

      const line = (k, v) => h('div', { class: 'line' }, h('span', {}, k), h('span', {}, v));
      const cmdRow = (c) => h('button', { class: 'cmdrow', onclick: () => select('c', c.id) },
        h('span', { class: 'chip', style: `background:${color(c.owner_player_id)}` }),
        `${c.role === 'king' ? '♛ ' : ''}${c.name}`,
        h('span', { style: 'color:var(--dim);margin-left:auto' }, `R${rankOf(c)} · ${c.troops}`));

      const momentText = (m) => {
        const p = m.payload;
        switch (m.type) {
          case 'game_started': return 'The realms are drawn. The game begins.';
          case 'war_declared': return `${pname(p.by_player_id)} ${p.how === 'declared' ? 'declared war on' : 'and'} ${pname(p.against_player_id)}${p.how === 'declared' ? '' : ' are at war'}${p.how === 'alliance_broken' ? ' after a broken alliance' : p.how === 'declared' ? '' : ' after the first attack'}`;
          case 'nap_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} signed a non-aggression pact`;
          case 'nap_broken': return `${pname(p.by_player_id)} broke the non-aggression pact with ${pname(p.against_player_id)}`;
          case 'marriage_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} sealed a marriage alliance until tick ${p.until_tick}`;
          case 'world_event': return p.kind === 'plague' ? `Plague breaks out at ${p.territory}` : p.kind === 'rebellion' ? `Unrest at ${p.territory}` : p.kind === 'harvest' ? `A bumper harvest at ${p.territory} (+${p.gold} gold)` : 'A comet crosses the sky; every realm gains prestige';
          case 'commander_captured': return `${p.name} (${pname(p.owner_player_id)}) was captured by ${pname(p.captor_player_id)}`;
          case 'captive_executed': return `${pname(p.by_player_id)} executed the captive ${p.name}`;
          case 'trade_agreed': return `${pname(p.player_a)} and ${pname(p.player_b)} agreed a trade deal`;
          case 'mediation_succeeded': return `${pname(p.mediator)} brokered a truce between ${pname(p.player_a)} and ${pname(p.player_b)}`;
          case 'alliance_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} formed an alliance`;
          case 'truce_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} agreed a truce until tick ${p.ends_tick}`;
          case 'truce_ended': return `The truce between ${pname(p.player_a)} and ${pname(p.player_b)} has ended`;
          case 'alliance_broken': return `${pname(p.by_player_id)} broke the alliance with ${pname(p.against_player_id)}`;
          case 'castle_captured': return `${pname(p.to_player_id)} captured ${p.territory}${p.from_player_id ? ' from ' + pname(p.from_player_id) : ''}`;
          case 'siege_started': return `${pname(p.by_player_id)} laid siege to ${p.territory}`;
          case 'siege_lifted': return `The siege of ${p.territory} was lifted ${p.by === 'sally' ? 'by a sally' : 'by relief forces'}`;
          case 'king_killed': return `${p.name}, king of ${pname(p.player_id)}, was killed`;
          case 'player_eliminated': return `${pname(p.player_id)} was eliminated`;
          case 'game_won': return `${pname(p.player_id)} won the game${p.reason === 'time_limit' ? ' at the time limit' : ''}`;
          default: return m.type.replace(/_/g, ' ');
        }
      };

      const markRead = async () => {
        const ids = ms.inbox.filter((i) => !i.is_read).map((i) => i.id);
        if (!ids.length) return;
        ms.newIds = new Set(ids);
        ms.inbox.forEach((i) => { i.is_read = true; });
        await sb.from('player_inbox').update({ is_read: true }).in('id', ids);
      };

      const sideTabs = () => {
        const unread = ms.inbox.filter((i) => !i.is_read).length + battlesUnread();
        const tab = (k, label) => h('button', {
          class: ms.tab === k ? 'on' : '',

      const drawSide = () => {
        const tf = tickF();

          sideEl.replaceChildren(sideTabs(), h('div', { class: 'sec' }, ms.moments.length

          } else {

          const fought = ms.battles.filter((b) => b.territory_id === t.id);
