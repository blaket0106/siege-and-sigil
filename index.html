    function sv(tag, attrs, ...kids) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v === undefined || v === null || v === false) continue;
        if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v);
      }
      for (const kid of kids.flat()) {
        if (kid === null || kid === undefined || kid === false) continue;
        el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      }
      return el;
    }

    function clipPoly(poly, a, b, c) {
      const out = [];
      for (let i = 0; i < poly.length; i++) {
        const p = poly[i];
        const q = poly[(i + 1) % poly.length];
        const dp = a * p[0] + b * p[1] - c;
        const dq = a * q[0] + b * q[1] - c;
        if (dp <= 0) out.push(p);
        if ((dp < 0 && dq > 0) || (dp > 0 && dq < 0)) {
          const t = dp / (dp - dq);
          out.push([p[0] + t * (q[0] - p[0]), p[1] + t * (q[1] - p[1])]);
        }
      }
      return out;
    }

    function voronoiCells(sites, w, ht) {
      const cells = new Map();
      for (const s of sites) {
        let poly = [[0, 0], [w, 0], [w, ht], [0, ht]];
        for (const o of sites) {
          if (o === s || !poly.length) continue;
          const a = o.x - s.x;
          const b = o.y - s.y;
          poly = clipPoly(poly, a, b, (o.x * o.x + o.y * o.y - s.x * s.x - s.y * s.y) / 2);
        }
        cells.set(s.id, poly.map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' '));
      }
      return cells;
    }

    const TERRAIN_NAMES = { plains: 'Plains', forest: 'Forest', hills: 'Hills', mountain: 'Mountain fortress', coast: 'Coast' };
    const EDGE_NAMES = { land: 'open ground', pass: 'mountain pass', river: 'ford', sea: 'sea lane' };

    function decodeArt(art) {
      const G = art.grid;
      const h = new Float32Array(G * G);
      const m = new Float32Array(G * G);
      for (let i = 0; i < G * G; i++) {
        h[i] = parseInt(art.h.substr(i * 2, 2), 36) / 1295;
        m[i] = Number(art.m[i]) / 9;
      }
      return { G, h, m, sea: art.sea, seed: art.seed, rivers: art.rivers };
    }

    function bilerp(grid, G, fx, fy) {
      fx = Math.min(G - 1.001, Math.max(0, fx));
      fy = Math.min(G - 1.001, Math.max(0, fy));
      const ix = Math.floor(fx);
      const iy = Math.floor(fy);
      const tx = fx - ix;
      const ty = fy - iy;
      const a = grid[iy * G + ix];
      const b = grid[iy * G + ix + 1];
      const c = grid[(iy + 1) * G + ix];
      const d = grid[(iy + 1) * G + ix + 1];
      return a * (1 - tx) * (1 - ty) + b * tx * (1 - ty) + c * (1 - tx) * ty + d * tx * ty;
    }

    function hexToRgb(hex) {
      const n = parseInt(hex.replace('#', ''), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function paintTerrain(art, mapW, sites) {
      const d = decodeArt(art);
      const G = d.G;
      const cell = mapW / G;
      const W = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = W;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(W, W);
      const H = (x, y) => bilerp(d.h, G, x / cell - 0.5, y / cell - 0.5);
      const M = (x, y) => bilerp(d.m, G, x / cell - 0.5, y / cell - 0.5);
      const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
      const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
      const deep = [14, 47, 79];
      const shallow = [52, 128, 168];
      const foam = [150, 205, 210];
      const sand = [214, 196, 140];
      const dry = [150, 160, 88];
      const wet = [84, 138, 70];
      const forestC = [44, 98, 58];
      const hillC = [148, 138, 86];
      const rockC = [128, 120, 112];
      const snow = [240, 243, 247];
      const e = cell * 0.8;

      for (let py = 0; py < W; py++) {
        for (let px = 0; px < W; px++) {
          const x = ((px + 0.5) / W) * mapW;
          const y = ((py + 0.5) / W) * mapW;
          const h = H(x, y);
          let c;
          if (h < d.sea) {
            const t = h / d.sea;
            c = mix(deep, shallow, ss(0.25, 1, t));
            if (t > 0.9) c = mix(c, foam, 0.55 * ss(0.9, 1, t));
          } else {
            const el = (h - d.sea) / (1 - d.sea);
            const m = M(x, y);
            c = mix(dry, wet, m);
            c = mix(c, forestC, ss(0.55, 0.72, m) * (1 - ss(0.35, 0.55, el)));
            c = mix(c, hillC, ss(0.22, 0.4, el) * 0.8);
            c = mix(c, rockC, ss(0.38, 0.55, el));
            c = mix(c, snow, ss(0.62, 0.78, el));
            c = mix(sand, c, ss(0, 0.07, el));
            const shade = (-(H(x + e, y) - H(x - e, y)) - (H(x, y + e) - H(x, y - e))) * 4.6;
            const f = Math.min(1.5, Math.max(0.62, 1 + shade));
            c = [c[0] * f, c[1] * f, c[2] * f];
          }
          const o = (py * W + px) * 4;
          img.data[o] = Math.min(255, c[0]);
          img.data[o + 1] = Math.min(255, c[1]);
          img.data[o + 2] = Math.min(255, c[2]);
          img.data[o + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);

      let seed = d.seed >>> 0;
      const rnd = () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const scale = W / mapW;
      const clear = (x, y) => sites.every((s) => Math.hypot(s.x - x, s.y - y) > 26);
      const peaks = [];
      const trees = [];
      for (let py = 6; py < W - 6; py += 8) {
        for (let px = 6; px < W - 6; px += 8) {
          const x = ((px + rnd() * 8) / W) * mapW;
          const y = ((py + rnd() * 8) / W) * mapW;
          const h = H(x, y);
          if (h < d.sea + 0.02) continue;
          const el = (h - d.sea) / (1 - d.sea);
          const m = M(x, y);
          if (el > 0.4 && rnd() < 0.38 && clear(x, y)) peaks.push({ px: x * scale, py: y * scale, size: 13 + el * 20 + rnd() * 7, snow: el > 0.58 });
          else if (m > 0.6 && el < 0.45 && rnd() < 0.55 && clear(x, y)) trees.push({ px: x * scale, py: y * scale, r: 2.6 + rnd() * 1.6 });
        }
      }
      trees.sort((a, b) => a.py - b.py);
      for (const t of trees) {
        ctx.fillStyle = 'rgba(14,44,26,0.35)';
        ctx.beginPath();
        ctx.ellipse(t.px + 1.2, t.py + t.r * 0.9, t.r * 1.1, t.r * 0.5, 0, 0, 7);
        ctx.fill();
        ctx.fillStyle = '#2b6a3b';
        ctx.beginPath();
        ctx.arc(t.px, t.py, t.r, 0, 7);
        ctx.fill();
        ctx.fillStyle = 'rgba(150,200,110,0.55)';
        ctx.beginPath();
        ctx.arc(t.px - t.r * 0.3, t.py - t.r * 0.3, t.r * 0.5, 0, 7);
        ctx.fill();
      }
      peaks.sort((a, b) => a.py - b.py);
      for (const p of peaks) {
        const w = p.size;
        const ht = p.size * 0.9;
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(p.px + w * 0.15, p.py + 1, w * 0.62, w * 0.18, 0, 0, 7);
        ctx.fill();
        ctx.fillStyle = '#b3aba0';
        ctx.beginPath();
        ctx.moveTo(p.px - w / 2, p.py);
        ctx.lineTo(p.px, p.py - ht);
        ctx.lineTo(p.px + w * 0.05, p.py);
        ctx.fill();
        ctx.fillStyle = '#6f675e';
        ctx.beginPath();
        ctx.moveTo(p.px + w * 0.05, p.py);
        ctx.lineTo(p.px, p.py - ht);
        ctx.lineTo(p.px + w / 2, p.py);
        ctx.fill();
        if (p.snow) {
          ctx.fillStyle = '#f4f6f8';
          ctx.beginPath();
          ctx.moveTo(p.px - w * 0.14, p.py - ht * 0.68);
          ctx.lineTo(p.px, p.py - ht);
          ctx.lineTo(p.px + w * 0.14, p.py - ht * 0.68);
          ctx.lineTo(p.px + w * 0.04, p.py - ht * 0.6);
          ctx.fill();
        }
      }

      const T = 512;
      const near = new Int16Array(T * T);
      const land = new Uint8Array(T * T);
      for (let ty = 0; ty < T; ty++) {
        for (let tx = 0; tx < T; tx++) {
          const x = ((tx + 0.5) / T) * mapW;
          const y = ((ty + 0.5) / T) * mapW;
          const i = ty * T + tx;
          land[i] = H(x, y) >= d.sea ? 1 : 0;
          let best = 0;
          let bd = Infinity;
          for (let k = 0; k < sites.length; k++) {
            const dx = sites[k].x - x;
            const dy = sites[k].y - y;
            const dd = dx * dx + dy * dy;
            if (dd < bd) { bd = dd; best = k; }
          }
          near[i] = best;
        }
      }

      return {
        url: canvas.toDataURL(),
        T,
        near,
        land,
        mapW,
        rivers: d.rivers,
        landAt: (x, y) => H(x, y) >= d.sea,
      };
    }

    function paintTint(terr, state) {
      const { T, near, land } = terr;
      const canvas = terr.tintCanvas || (terr.tintCanvas = Object.assign(document.createElement('canvas'), { width: T, height: T }));
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(T, T);
      for (let y = 0; y < T; y++) {
        for (let x = 0; x < T; x++) {
          const i = y * T + x;
          if (!land[i]) continue;
          const k = near[i];
          const st = state[k];
          let r = 0;
          let g = 0;
          let b = 0;
          let a = 0;
          if (!st.seen) { r = 8; g = 10; b = 16; a = 135; }
          else if (st.rgb) { [r, g, b] = st.rgb; a = 74; }
          if (st.selected) { r = (r * a + 255 * 40) / (a + 40); g = (g * a + 255 * 40) / (a + 40); b = (b * a + 255 * 40) / (a + 40); a += 40; }
          const rightK = x + 1 < T && land[i + 1] ? near[i + 1] : k;
          const downK = y + 1 < T && land[i + T] ? near[i + T] : k;
          if (rightK !== k || downK !== k) {
            const sel = st.selected || state[rightK].selected || state[downK].selected;
            r = sel ? 240 : 20; g = sel ? 207 : 16; b = sel ? 125 : 10; a = sel ? 230 : 150;
          }
          const o = i * 4;
          img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = a;
        }
      }
      ctx.putImageData(img, 0, 0);
      return canvas.toDataURL();
    }

    function castleSprite(tier, terrain, ownerColor) {
      const w = tier >= 3 ? 44 : tier === 2 ? 34 : 26;
      const stone = '#d6cdb8';
      const shade = '#9a9180';
      const line = '#2a2418';
      const parts = [];
      parts.push(sv('ellipse', { cx: 3, cy: 9, rx: w * 0.66, ry: 5, fill: 'rgba(0,0,0,0.3)' }));
      if (terrain === 'mountain') {
        parts.push(sv('path', { d: `M${-w * 0.75},10 L${-w * 0.35},-3 L${-w * 0.05},3 L${w * 0.3},-6 L${w * 0.75},10 Z`, fill: '#857d72', stroke: line, 'stroke-width': 1 }));
      }
      const wallTop = -4;
      parts.push(sv('rect', { x: -w / 2, y: wallTop, width: w, height: 13, fill: stone, stroke: line, 'stroke-width': 1.1 }));
      parts.push(sv('rect', { x: -w / 2, y: wallTop, width: w * 0.28, height: 13, fill: shade, opacity: 0.55 }));
      const teeth = Math.round(w / 6);
      for (let i = 0; i < teeth; i++) {
        parts.push(sv('rect', { x: -w / 2 + (i * w) / teeth + 0.5, y: wallTop - 2.6, width: w / teeth - 1.3, height: 2.8, fill: stone, stroke: line, 'stroke-width': 0.7 }));
      }
      const keepH = tier >= 3 ? 20 : 15;
      parts.push(sv('rect', { x: -w * 0.17, y: wallTop - keepH + 4, width: w * 0.34, height: keepH, fill: stone, stroke: line, 'stroke-width': 1.1 }));
      parts.push(sv('rect', { x: -w * 0.17, y: wallTop - keepH + 4, width: w * 0.1, height: keepH, fill: shade, opacity: 0.55 }));
      if (tier >= 2) {
        for (const sx of [-1, 1]) {
          const tx = sx * w * 0.5;
          parts.push(sv('rect', { x: tx - 3.4, y: wallTop - 7, width: 6.8, height: 20, fill: stone, stroke: line, 'stroke-width': 1 }));
          parts.push(sv('path', { d: `M${tx - 4.6},${wallTop - 7} L${tx},${wallTop - 14} L${tx + 4.6},${wallTop - 7} Z`, fill: ownerColor, stroke: line, 'stroke-width': 0.9 }));
        }
      }
      parts.push(sv('path', { d: `M-3.2,9 L-3.2,4 A3.2,3.2 0 0 1 3.2,4 L3.2,9 Z`, fill: '#2a2418' }));
      const poleTop = wallTop - keepH + 4 - 9;
      parts.push(sv('line', { x1: 0, y1: wallTop - keepH + 4, x2: 0, y2: poleTop, stroke: line, 'stroke-width': 1.2 }));
      parts.push(sv('path', { d: `M0,${poleTop} L11,${poleTop + 3.2} L0,${poleTop + 6.4} Z`, fill: ownerColor, stroke: line, 'stroke-width': 0.9 }));
      return sv('g', {}, ...parts);
    }

    async function showMap(gameId) {
      clearCleanup();
      state.view = 'map';
      state.roomId = gameId;
      await loadFactions();
      const uid = state.session.user.id;
      const memKey = `ss-fog-${gameId}-${uid}`;
      const ms = { council: [], worldEvents: [], captives: [], offers: [], deals: [], locks: [], turn: null, stops: [], profiles: new Map(), battles: [], inboxTab: 'reports', report: null, battleSeen: 0, chatTab: 'general', thread: null, compose: null, chat: [], threads: new Map(), chatSeen: 0, tab: 'info', moments: [], inbox: [], newIds: new Set(), marching: false, preview: null, xfer: 1, sel: null, edges: null, cells: null, mem: {}, rings: true, view: null, full: null, dragged: false, vis: new Set(), sources: [] };
      try { ms.mem = JSON.parse(localStorage.getItem(memKey)) || {}; } catch { ms.mem = {}; }
      const mutedKey = `ss-muted-${gameId}-${uid}`;
      try { ms.muted = new Set(JSON.parse(localStorage.getItem(mutedKey)) || []); } catch { ms.muted = new Set(); }

      const chatSeenKey = `ss-chatseen-${gameId}-${uid}`;
      try { ms.chatSeen = Number(localStorage.getItem(chatSeenKey)) || 0; } catch { ms.chatSeen = 0; }
      const battleSeenKey = `ss-battleseen-${gameId}-${uid}`;
      try { ms.battleSeen = Number(localStorage.getItem(battleSeenKey)) || 0; } catch { ms.battleSeen = 0; }
      ms.chatInput = h('input', { type: 'text', maxlength: '500', placeholder: 'Message everyone' });
      ms.threadInput = h('input', { type: 'text', maxlength: '2000', placeholder: 'Write a message' });
      const hud = h('div', { class: 'hud' });
      const sideEl = h('div', { class: 'side' });
      const svg = sv('svg', { preserveAspectRatio: 'xMidYMid meet' });
      const L = { terrain: sv('g'), tint: sv('g'), rivers: sv('g'), crossings: sv('g'), cells: sv('g'), edges: sv('g'), rings: sv('g'), preview: sv('g'), castles: sv('g'), dyn: sv('g') };
      svg.append(...Object.values(L));
      mount(h('div', { class: 'maproot' }, hud, h('div', { class: 'mapbody' }, h('div', { class: 'mapwrap' }, svg), sideEl)));

      try {
        if (!localStorage.getItem('ss-help-seen')) {
          localStorage.setItem('ss-help-seen', '1');
          helpDialog();
        }
      } catch {}

      const touch = () => { if (!document.hidden) sb.rpc('touch_activity', { p_game_id: gameId }); };
      touch();
      const touchTimer = setInterval(touch, 5 * 60 * 1000);
      state.cleanup.push(() => clearInterval(touchTimer));

      const color = (pid) => (pid && ms.players.get(pid) ? factionOf(ms.players.get(pid).faction_slug).color : '#6b6b78');
      const color2 = (pid) => (pid && ms.players.get(pid) ? factionOf(ms.players.get(pid).faction_slug).color2 : '#2a2a35');
      const pname = (pid) => (pid && ms.players.get(pid) ? ms.players.get(pid).display_name : 'Unclaimed');
      const dipStatus = (pid) => {
        const r = ms.dip.find((d) => d.player_a_id === pid || d.player_b_id === pid);
        return r ? r.status : 'neutral';
      };
      const isFriend = (pid) => pid === ms.me.id || dipStatus(pid) === 'allied';
      const rankOf = (c) => Object.values(ms.abil.get(c.id) || {}).reduce((a, b) => a + b, 0);

      const S = () => (ms.game && ms.game.world_scale) || 1;
      const M = () => Math.pow(S(), 0.5);
      const rangeOf = (stables) => (ms.game.free_travel ? (210 + 60 * stables) * S() : 90 + 60 * stables);
      const myStables = () => (ms.areas.find((a) => a.area === 'stables') || { level: 0 }).level;
      const reachableFrom = (tid) => {
        const range = rangeOf(myStables());
        const out = new Map();
        ms.edges.forEach((e) => {
          if (e.length > range) return;
          if (e.from_territory_id === tid) out.set(e.to_territory_id, e);
          else if (e.to_territory_id === tid) out.set(e.from_territory_id, e);
        });
        return out;
      };

      const tickF = () => {
        const g = ms.game;
        const interval = TICK_MS[g.tick_speed];
        if (!interval || !g.last_tick_processed_at || g.status !== 'active') return g.current_tick;
        return g.current_tick + Math.min(1, Math.max(0, (Date.now() - Date.parse(g.last_tick_processed_at)) / interval));
      };

      const movementPos = (m, tf) => {
        const p = m.path;
        const a = m.path_arrival_ticks;
        const n = p.length;
        if (tf >= a[n - 1]) {
          const t = ms.t.get(p[n - 1]);
          return { x: t.x, y: t.y, i: n - 1 };
        }
        let i = 0;
        while (i < n - 2 && a[i + 1] <= tf) i++;
        const A = ms.t.get(p[i]);
        const B = ms.t.get(p[i + 1]);
        const d = a[i + 1] - a[i];
        const f = d <= 0 ? 1 : Math.min(1, Math.max(0, (tf - a[i]) / d));
        return { x: A.x + (B.x - A.x) * f, y: A.y + (B.y - A.y) * f, i };
      };

      const cmdPos = (c, tf) => {
        if (c.current_territory_id) {
          const t = ms.t.get(c.current_territory_id);
          return { x: t.x, y: t.y };
        }
        const m = ms.mov.get(c.id);
        return m ? movementPos(m, tf) : null;
      };

      const computeVis = () => {
        ms.vis = new Set([...ms.t.values()].filter((t) => t.seen).map((t) => t.id));
        ms.sources = ms.serverSources;
      };

      const commanderSeen = () => true;

      const select = (type, id) => {
        if (ms.dragged) return;
        if (ms.marching && type === 't') return ms.stops.length ? addStop(id) : previewTo(id);
        ms.marching = false;
        ms.preview = null;
        ms.stops = [];
        ms.sel = type ? { type, id } : null;
        if (type) ms.tab = 'info';
        render();
        drawSide();
      };

      const act = (btn, fn) => run(btn, async () => {
        await fn();
        await load();
      });

      const addStop = (id) => {
        const c = ms.cmd.find((x) => x.id === ms.sel.id);
        const last = ms.stops.length ? ms.stops[ms.stops.length - 1].id : c.current_territory_id;
        if (id === last) return;
        if (ms.stops.length >= 10) { toast('A route can have at most 10 stops'); return; }
        ms.stops.push({ id, type: 'assault' });
        render();
        drawSide();
      };

      const previewTo = async (id) => {
        const c = ms.cmd.find((x) => x.id === ms.sel.id);
        if (id === c.current_territory_id) return;
        ms.preview = { to: id, type: ms.preview ? ms.preview.type : 'assault' };
        render();
        drawSide();
        const { data, error } = await sb.rpc('preview_march', { p_game_id: gameId, p_commander_id: c.id, p_to_territory_id: id });
        if (!ms.preview || ms.preview.to !== id) return;
        if (error) ms.preview.error = error.message;
        else ms.preview.plan = data;
        render();
        drawSide();
      };

      const fmtDuration = (msec) => {
        const m = Math.max(0, Math.round(msec / 60000));
        return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
      };

      const initTerrain = () => {
        const sites = [...ms.t.values()];
        ms.terrIds = sites.map((t) => t.id);
        ms.terr = paintTerrain(ms.art, ms.game.map_w, sites);
        const W = ms.game.map_w;
        L.terrain.replaceChildren(sv('image', { x: 0, y: 0, width: W, height: W, href: ms.terr.url, preserveAspectRatio: 'none', style: 'pointer-events:none' }));
        ms.tintEl = sv('image', { x: 0, y: 0, width: W, height: W, preserveAspectRatio: 'none', style: 'pointer-events:none' });
        L.tint.replaceChildren(ms.tintEl);
        const d = (r) => 'M' + r.p.map((q) => `${q[0]} ${q[1]}`).join(' L');
        L.rivers.replaceChildren(...ms.terr.rivers.flatMap((r) => [
          sv('path', { d: d(r), fill: 'none', stroke: '#2f6aa3', 'stroke-width': (4 + r.w * 1.6) * M(), 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.9, style: 'pointer-events:none' }),
          sv('path', { d: d(r), fill: 'none', stroke: '#7fb9ea', 'stroke-width': (2 + r.w * 1.1) * M(), 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.95, style: 'pointer-events:none' }),
        ]));
        const bridge = (x, y) => sv('g', { transform: `translate(${x},${y}) scale(${M()})` },
          sv('rect', { x: -9, y: -4, width: 18, height: 8, rx: 1, fill: '#c9a46a', stroke: '#2a2418', 'stroke-width': 1.2 }),
          sv('line', { x1: -9, y1: -1, x2: 9, y2: -1, stroke: '#2a2418', 'stroke-width': 0.8 }),
          sv('line', { x1: -9, y1: 2, x2: 9, y2: 2, stroke: '#2a2418', 'stroke-width': 0.8 }));
        const gap = (x, y) => sv('g', { transform: `translate(${x},${y}) scale(${M()})` },
          sv('path', { d: 'M-9,5 L-4,-6 L0,1 L4,-6 L9,5 Z', fill: '#e8dcc2', stroke: '#2a2418', 'stroke-width': 1.2 }),
          sv('line', { x1: 0, y1: 1, x2: 0, y2: 5, stroke: '#2a2418', 'stroke-width': 1 }));
        L.crossings.replaceChildren(...(ms.art.fords || []).map((f) => bridge(f[0], f[1])), ...(ms.art.passes || []).map((f) => gap(f[0], f[1])));
        svg.parentElement.style.background = '#0e2f4f';
      };

      const render = () => {
        computeVis();
        const tf = tickF();
        ms.t.forEach((t) => {
          if (ms.vis.has(t.id)) ms.mem[t.id] = { o: t.owner_player_id, tr: t.troops };
        });
        try { localStorage.setItem(memKey, JSON.stringify(ms.mem)); } catch {}

        if (ms.terr) {
          const state = ms.terrIds.map((id) => {
            const t = ms.t.get(id);
            const seen = ms.vis.has(id);
            const owner = seen ? t.owner_player_id : null;
            return { seen, rgb: owner ? hexToRgb(color(owner)) : null, selected: !!(ms.sel && ms.sel.type === 't' && ms.sel.id === id) };
          });
          const sig = state.map((x) => `${x.seen ? 1 : 0}${x.selected ? 1 : 0}${x.rgb ? x.rgb.join('.') : ''}`).join('|');
          if (sig !== ms.tintSig) {
            ms.tintSig = sig;
            ms.tintEl.setAttribute('href', paintTint(ms.terr, state));
          }
        }

        ms.reachable = null;
        if (ms.game.free_travel && ms.marching && ms.sel && ms.sel.type === 'c') {
          const c = ms.cmd.find((x) => x.id === ms.sel.id);
          if (c && c.current_territory_id) ms.reachable = new Set(reachableFrom(c.current_territory_id).keys());
        }

        const cells = [];
        const castles = [];
        ms.t.forEach((t) => {
          const seen = ms.vis.has(t.id);
          const owner = seen ? t.owner_player_id : (ms.mem[t.id] ? ms.mem[t.id].o : null);
          const selected = ms.sel && ms.sel.type === 't' && ms.sel.id === t.id;
          const pick = (e) => {
            if (ms.terr) {
              const q = toMap(e);
              if (!ms.terr.landAt(q.x, q.y)) return;
            }
            select('t', t.id);
          };
          cells[selected ? 'push' : 'unshift'](ms.terr
            ? sv('polygon', { points: ms.cells.get(t.id), fill: 'transparent', stroke: 'none', onclick: pick })
            : sv('polygon', {
              points: ms.cells.get(t.id),
              fill: owner ? color(owner) : '#2a2a38',
              'fill-opacity': seen ? (owner ? 0.4 : 0.55) : 0.14,
              stroke: selected ? '#f0cf7d' : '#0a0a0f',
              'stroke-width': selected ? 3 : 1.5,
              onclick: pick,
            }));

          const tier = t.tier || 1;
          const r = ms.terr ? (tier >= 3 ? 30 : tier === 2 ? 24 : 20) : 8 + 3 * tier;
          const rBot = ms.terr ? 12 : r;
          const showTroops = seen && (isFriend(t.owner_player_id) || !ms.game.fog_of_war || ms.vis.has(t.id));
          const here = ms.cmd.filter((c) => c.current_territory_id === t.id && commanderSeen(c, tf));
          const sieged = ms.cmd.some((c) => c.status === 'sieging' && c.current_territory_id === t.id && commanderSeen(c, tf));
          const k = ms.terr ? M() : 1;
          const reach = ms.reachable ? ms.reachable.has(t.id) || (ms.sel && ms.sel.type === 'c' && (ms.cmd.find((x) => x.id === ms.sel.id) || {}).current_territory_id === t.id) : true;
          const g = sv('g', { transform: `translate(${t.x},${t.y}) scale(${k})`, opacity: (seen ? 1 : 0.5) * (reach ? 1 : 0.4) },
            sieged ? sv('circle', { cx: 0, cy: 0, r: r + 7, fill: 'none', stroke: '#e0685c', 'stroke-width': 3, 'stroke-dasharray': '4 4', style: 'pointer-events:none' }) : null,
            ms.terr && t.natural_resources ? sv('circle', { cx: 0, cy: 0, r: 16 + 0.55 * t.natural_resources, fill: 'none', stroke: '#fff', 'stroke-opacity': 0.35, 'stroke-width': 1.5, style: 'pointer-events:none' }) : null,
            ms.terr
              ? sv('g', { style: 'cursor:pointer', onclick: pick }, castleSprite(tier, t.terrain, owner ? color(owner) : '#8a8a96'))
              : sv('circle', { cx: 0, cy: 0, r, fill: owner ? color(owner) : '#6b6b78', stroke: owner ? color2(owner) : '#222', 'stroke-width': 2.5, style: 'cursor:pointer', onclick: pick }),
            !ms.terr && ms.players.get(owner) && ms.players.get(owner).capital_territory_id === t.id ? sv('text', { x: 0, y: 5, 'text-anchor': 'middle', 'font-size': 15, fill: '#000', style: 'fill:#000' }, '♛') : null,
            showTroops && t.treasury_level !== null && t.treasury_level !== undefined ? sv('text', { class: 'zoomonly', x: 0, y: -r - 25, 'text-anchor': 'middle', 'font-size': 12, style: 'fill:#f0cf7d;paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round;pointer-events:none' }, `${t.treasury_level} / ${t.industry_level} / ${t.prestige_level}`) : null,
            sv('text', { x: 0, y: -r - 5, 'text-anchor': 'middle', 'font-size': 17, style: `fill:#fff;font-weight:bold${ms.terr ? ';paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round' : ''}` }, showTroops ? t.troops : '?'),
            sv('text', { x: 0, y: rBot + 16, 'text-anchor': 'middle', 'font-size': 14, style: ms.terr ? 'fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px;stroke-linejoin:round' : null }, `${ms.terr && ms.players.get(owner) && ms.players.get(owner).capital_territory_id === t.id ? '♛ ' : ''}${t.name}`),
            here.map((c, i) => sv('circle', {
              cx: (i - (here.length - 1) / 2) * 17,
              cy: rBot + 32,
              r: c.role === 'king' ? 8 : 6.5,
              fill: color(c.owner_player_id),
              stroke: ms.sel && ms.sel.type === 'c' && ms.sel.id === c.id ? '#fff' : (c.role === 'king' ? '#f0cf7d' : '#000'),
              'stroke-width': c.role === 'king' ? 2.2 : 1.5,
              style: 'cursor:pointer',
              onclick: (e) => { e.stopPropagation(); select('c', c.id); },
            })));
          castles.push(g);
        });
        L.cells.replaceChildren(...cells);
        L.castles.replaceChildren(...castles);

        const nearLimit = 150 * 1.7 * S();
        L.edges.replaceChildren(...ms.edges.filter((e) => !ms.game.free_travel || e.length <= nearLimit).map((e) => {
          const A = ms.t.get(e.from_territory_id);
          const B = ms.t.get(e.to_territory_id);
          const road = A.has_road && B.has_road;
          if (ms.game.free_travel && !road) return null;
          const seen = ms.vis.has(A.id) || ms.vis.has(B.id);
          if (ms.terr) {
            const style = road ? { stroke: '#e0b64a', w: 2.8, dash: null }
              : e.kind === 'pass' ? { stroke: '#e8c9a0', w: 2.2, dash: '2 5' }
                : e.kind === 'river' ? { stroke: '#cfe8ff', w: 2.2, dash: '7 4' }
                  : { stroke: '#efe4bf', w: 1.6, dash: '5 5' };
            return sv('line', { x1: A.x, y1: A.y, x2: B.x, y2: B.y, stroke: style.stroke, 'stroke-width': style.w * M(), 'stroke-dasharray': style.dash ? style.dash.split(' ').map((v) => v * M()).join(' ') : null, 'stroke-opacity': seen ? 0.7 : 0.2, 'stroke-linecap': 'round', style: 'pointer-events:none' });
          }
          return sv('line', { x1: A.x, y1: A.y, x2: B.x, y2: B.y, stroke: road ? '#b8923a' : '#4a4860', 'stroke-width': road ? 2.6 : 1.2, 'stroke-opacity': seen ? 0.85 : 0.25, style: 'pointer-events:none' });
        }).filter(Boolean));

        L.rings.replaceChildren(...(ms.rings && ms.game.fog_of_war
          ? ms.sources.map((s) => sv('circle', { cx: s.x, cy: s.y, r: s.r, fill: 'none', stroke: 'rgba(212,169,74,0.28)', 'stroke-dasharray': '5 5', style: 'pointer-events:none' }))
          : []));

        const pv = [];
        if (ms.marching && ms.sel && ms.sel.type === 'c') {
          const c = ms.cmd.find((x) => x.id === ms.sel.id);
          const pos = c && cmdPos(c, tf);
          const stables = (ms.areas.find((a) => a.area === 'stables') || { level: 0 }).level;
          if (pos) pv.push(sv('circle', { cx: pos.x, cy: pos.y, r: rangeOf(stables), fill: 'none', stroke: '#f0cf7d', 'stroke-width': 2 * M(), 'stroke-dasharray': `${2 * M()} ${6 * M()}`, style: 'pointer-events:none' }));
        }
        if (ms.marching && ms.stops.length && ms.sel && ms.sel.type === 'c') {
          const c = ms.cmd.find((x) => x.id === ms.sel.id);
          const pos = c && cmdPos(c, tf);
          if (pos) {
            const pts = [pos, ...ms.stops.map((st) => ms.t.get(st.id))];
            pv.push(sv('polyline', { points: pts.map((q) => `${q.x},${q.y}`).join(' '), fill: 'none', stroke: '#f0cf7d', 'stroke-width': 3 * M(), 'stroke-dasharray': `${8 * M()} ${6 * M()}`, style: 'pointer-events:none' }));
            ms.stops.forEach((st, i) => {
              const q = ms.t.get(st.id);
              pv.push(sv('circle', { cx: q.x, cy: q.y, r: 17 * M(), fill: '#3a2f12', stroke: '#f0cf7d', 'stroke-width': 2.5 * M(), style: 'pointer-events:none' }));
              pv.push(sv('text', { x: q.x, y: q.y + 5 * M(), 'text-anchor': 'middle', 'font-size': 15 * M(), style: 'fill:#f0cf7d;font-weight:bold' }, String(i + 1)));
            });
          }
        }
        if (ms.preview) {
          const dest = ms.t.get(ms.preview.to);
          const ok = !ms.preview.plan || ms.preview.plan.in_range;
          const tone = ms.preview.error ? '#e0685c' : (ok ? '#7fd08a' : '#e0685c');
          if (ms.preview.plan) {
            pv.push(sv('polyline', { points: ms.preview.plan.path.map((id) => `${ms.t.get(id).x},${ms.t.get(id).y}`).join(' '), fill: 'none', stroke: tone, 'stroke-width': 4 * M(), 'stroke-linejoin': 'round', style: 'pointer-events:none' }));
          }
          pv.push(sv('circle', { cx: dest.x, cy: dest.y, r: 26 * M(), fill: 'none', stroke: tone, 'stroke-width': 3 * M(), style: 'pointer-events:none' }));
        }
        L.preview.replaceChildren(...pv);

        renderDyn();
        drawHud();
      };

      const renderDyn = () => {
        const tf = tickF();
        const out = [];
        ms.cmd.forEach((c) => {
          if (c.status !== 'moving') return;
          const m = ms.mov.get(c.id);
          if (!m || !commanderSeen(c, tf)) return;
          const pos = movementPos(m, tf);
          const friend = isFriend(c.owner_player_id);
          if (friend) {
            const pts = [`${pos.x},${pos.y}`, ...m.path.slice(pos.i + 1).map((id) => `${ms.t.get(id).x},${ms.t.get(id).y}`)];
            out.push(sv('polyline', { points: pts.join(' '), fill: 'none', stroke: '#f0cf7d', 'stroke-width': 2 * M(), 'stroke-dasharray': `${3 * M()} ${5 * M()}`, style: 'pointer-events:none' }));
          }
          out.push(sv('circle', {
            cx: pos.x, cy: pos.y, r: (c.role === 'king' ? 9 : 7.5) * M(),
            fill: color(c.owner_player_id),
            stroke: ms.sel && ms.sel.type === 'c' && ms.sel.id === c.id ? '#fff' : '#f0cf7d',
            'stroke-width': 2 * M(),
            style: 'cursor:pointer',
            onclick: (e) => { e.stopPropagation(); select('c', c.id); },
          }));
          out.push(sv('text', { x: pos.x, y: pos.y - 13 * M(), 'text-anchor': 'middle', 'font-size': 14 * M(), style: 'fill:#f0cf7d;paint-order:stroke;stroke:#000;stroke-width:' + 3 * M() + 'px' }, friend ? c.troops : ''));
        });
        L.dyn.replaceChildren(...out);
      };

      const fmtCountdown = (ms_) => {
        const s = Math.max(0, Math.round(ms_ / 1000));
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      };

      const nextEl = h('span');
      const updateCountdown = () => {
        const g = ms.game;
        if (g.status !== 'active') { nextEl.textContent = ''; return; }
        const interval = TICK_MS[g.tick_speed];
        if (!interval) {
          const end = ms.turn && ms.turn.ends_at ? Date.parse(ms.turn.ends_at) - Date.now() : null;
          nextEl.textContent = end === null ? 'turn-based' : (end > 0 ? `turn ends in ${fmtDuration(end)}` : 'turn due');
          return;
        }
        const due = Date.parse(g.last_tick_processed_at) + interval - Date.now();
        nextEl.textContent = due > 0 ? `next tick in ${fmtCountdown(due)}` : 'tick due';
      };

      const canAct = () => ms.game.status === 'active' && ms.me.eliminated_at_tick == null;

      const pendingProposals = () => ms.dip.filter((d) => (d.status === 'proposed' || d.status === 'peace_proposed') && d.proposed_by_player_id !== ms.me.id).length + ms.offers.filter((o) => o.to_player_id === ms.me.id).length;

      const castlesOf = (pid) => ms.standings[pid] || 0;

      const turnControl = () => {
        if (!ms.turn || !ms.turn.turn_based || !canAct()) return null;
        if (ms.turn.submitted.includes(ms.me.id)) {
          const waiting = ms.turn.waiting.length;
          return h('span', { style: 'color:var(--gold2)' }, waiting ? `Turn submitted, waiting for ${waiting} player${waiting === 1 ? '' : 's'}` : 'Turn submitted');
        }
        return h('button', { class: 'primary', onclick: order('submit_turn', {}, 'Turn submitted') }, 'Submit turn');
      };

      const SEASONS = ['Spring', 'Summer', 'Autumn', 'Winter'];
      const seasonLabel = (g) => {
        const len = g.season_length_ticks;
        const idx = Math.floor(g.current_tick / len) % 4;
        return `${SEASONS[idx]} (to tick ${(Math.floor(g.current_tick / len) + 1) * len})`;
      };

      const drawHud = () => {
        const g = ms.game;
        const winAt = Math.ceil(ms.t.size * g.victory_pct);
        const winner = ms.players.get(g.winner_player_id);
        hud.replaceChildren(...[
          h('button', { onclick: showHome }, 'Back to games'),
          h('button', { onclick: helpDialog }, 'Help'),
          g.status === 'finished' ? h('button', { class: 'primary', onclick: () => summaryDialog(gameId) }, 'Final standings') : null,
          h('b', {}, g.name),
          h('span', {}, g.status === 'finished' ? `Finished${winner ? ' · winner ' + winner.display_name : ''}` : `Tick ${g.current_tick}`),
          nextEl,
          g.seasons_enabled && g.status === 'active' ? h('span', { style: 'color:var(--gold2)' }, seasonLabel(g)) : null,
          g.time_limit_ticks && g.status === 'active' ? h('span', { style: 'color:var(--dim)' }, `Ends at tick ${g.time_limit_ticks}`) : null,
          ms.me.eliminated_at_tick != null && g.status === 'active' ? h('span', { style: 'color:#e08b82' }, 'You are eliminated') : null,
          turnControl(),
          h('span', { class: 'grow' }),
          pendingProposals() ? h('button', { class: 'primary', onclick: () => { ms.sel = null; ms.tab = 'info'; ms.marching = false; ms.preview = null; ms.stops = []; render(); drawSide(); } }, `Proposals (${pendingProposals()})`) : null,
          h('span', {}, `Gold ${ms.me.gold}`),
          h('span', {}, `Castles ${castlesOf(ms.me.id)} / ${winAt} to win`),
          g.fog_of_war ? h('label', {}, h('input', { type: 'checkbox', checked: ms.rings, onchange: (e) => { ms.rings = e.target.checked; render(); } }), 'Scan rings') : null].filter(Boolean));
        updateCountdown();
      };

      const order = (fn, args, message) => (e) => act(e.currentTarget, async () => {
        const { data, error } = await sb.rpc(fn, { p_game_id: gameId, ...args });
        if (error) throw error;
        if (message) toast(typeof message === 'function' ? message(data) : message, true);
      });

      const INFRA = [
        { type: 'treasury', name: 'Treasury', col: 'treasury_level', base: 1250, note: 'gold' },
        { type: 'recruitment', name: 'Recruitment', col: 'industry_level', base: 2500, note: 'troops' },
        { type: 'prestige', name: 'Prestige', col: 'prestige_level', base: 10000, note: 'prestige' },
      ];

      const buildSection = (t) => {
        if (t.owner_player_id !== ms.me.id || !canAct()) return null;
        const mult = ms.game.infra_cost_mult;
        const gold = ms.me.gold;
        const out = [h('b', {}, 'Build')];
        INFRA.forEach((i) => {
          const lvl = t[i.col];
          const cost = Math.max(1, Math.floor(i.base * (lvl + 1) / t.resources * mult));
          out.push(h('button', {
            class: 'cmdrow',
            disabled: gold < cost,
            onclick: order('upgrade_infrastructure', { p_territory_id: t.id, p_type: i.type }, (d) => `${i.name} is now level ${d.level}`),
          }, `${i.name} ${lvl} > ${lvl + 1}`, h('span', { style: 'color:var(--dim);margin-left:auto' }, `${cost} gold`)));
        });
        if (t.has_road) {
          out.push(h('button', { class: 'cmdrow', onclick: order('demolish_road', { p_territory_id: t.id }, 'Road demolished') }, 'Demolish road', h('span', { style: 'color:var(--dim);margin-left:auto' }, 'free')));
        } else {
          const cost = Math.max(1, Math.floor(30 * t.resources * mult));
          out.push(h('button', { class: 'cmdrow', disabled: gold < cost, onclick: order('build_road', { p_territory_id: t.id }, 'Road built') }, 'Build road', h('span', { style: 'color:var(--dim);margin-left:auto' }, `${cost} gold`)));
        }
        if (ms.game.mercenaries_enabled) {
          const size = h('input', { type: 'number', min: '10', max: '60', value: '20', style: 'width:80px' });
          out.push(h('b', { style: 'margin-top:12px' }, 'Hire mercenaries (5 gold per troop, 48 tick contract)'),
            h('div', { class: 'row wrap2' }, size, h('button', {
              disabled: gold < 50,
              onclick: (e) => order('hire_mercenaries', { p_territory_id: t.id, p_troops: Number(size.value) }, (d) => `${d.name} hired for ${d.cost} gold`)(e),
            }, 'Hire company')));
        }
        const hire = ms.game.commander_cost;
        out.push(h('b', { style: 'margin-top:12px' }, `Hire a commander (${hire} gold)`),
          h('div', { class: 'row wrap2' }, SCHOOLS.map((sc) => h('button', {
            disabled: gold < hire,
            onclick: order('hire_commander', { p_territory_id: t.id, p_school: sc.slug }, (d) => `${d.name} joins${d.role === 'king' ? ' as king' : ''}`),
          }, sc.name))));
        return h('div', { class: 'sec' }, out);
      };

      const realmSection = () => {
        const g = ms.game;
        const live = canAct();
        const order_ = Object.keys(AREA_NAMES);
        const rows = [...ms.areas].sort((x, y) => order_.indexOf(x.area) - order_.indexOf(y.area)).map((a) => {
          const need = Math.ceil(144 * a.level * g.area_cost_mult);
          return h('div', { class: 'line' },
            h('span', { style: 'color:var(--text)' }, `${AREA_NAMES[a.area] || a.area}${a.is_active ? ' (active)' : ''}`),
            h('span', {}, `Lv ${a.level} · ${a.prestige_accumulated}/${need}`),
            live && !a.is_active ? h('button', { style: 'padding:2px 8px;font-size:.78rem', onclick: order('set_active_area', { p_area: a.area }, `${AREA_NAMES[a.area]} is now the active area`) }, 'Activate') : null);
        });
        const type = h('select', {}, INFRA.map((i) => h('option', { value: i.type }, i.name)));
        const budget = h('input', { type: 'number', min: '1', value: Math.min(100, ms.me.gold) || 1, style: 'width:90px' });
        return [
          h('div', { class: 'sec' }, h('b', {}, 'Realm areas (level, prestige to next)'), rows),
          live ? h('div', { class: 'sec' }, h('b', {}, 'Surrender'),
            h('button', {
              class: 'danger',
              onclick: (e) => {
                if (confirm('Concede defeat? You are eliminated at once, your commanders die and your castles become unowned. This cannot be undone.')) {
                  order('concede_defeat', {}, 'You have conceded')(e);
                }
              },
            }, 'Concede defeat')) : null,
          live ? h('div', { class: 'sec' }, h('b', {}, 'Upgrade everywhere, cheapest first'),
            h('div', { class: 'row wrap2' }, type, budget,
              h('button', {
                onclick: (e) => order('bulk_upgrade_infrastructure', { p_infra_type: type.value, p_budget: Number(budget.value) || 1 }, (d) => `${d.upgraded} upgrades for ${d.spent} gold`)(e),
              }, 'Spend'))) : null,
        ];
      };

      const assaultButton = (t) => h('button', {
        class: 'danger',
        onclick: (e) => {
          if (confirm(`Your besieging commanders at ${t.name} attack the castle now. The defenders get their bonus. Continue?`)) {
            order('break_siege_and_assault', { p_territory_id: t.id }, (d) => (d.captured ? `${t.name} captured` : 'The assault failed'))(e);
          }
        },
      }, 'Assault now');

      const siegeSection = (t) => {
        if (!canAct()) return null;
        const siegers = ms.cmd.filter((c) => c.status === 'sieging' && c.current_territory_id === t.id && commanderSeen(c, tickF()));
        if (!siegers.length) return null;
        const troops = siegers.reduce((a, c) => a + c.troops, 0);
        const out = [h('b', {}, 'Under siege'),
          line('Besieged by', [...new Set(siegers.map((c) => pname(c.owner_player_id)))].join(', ')),
          line('Besiegers', `${siegers.length} commander${siegers.length > 1 ? 's' : ''}, ${troops} troops`)];
        if (t.owner_player_id === ms.me.id) {
          const defenders = ms.cmd.filter((c) => c.current_territory_id === t.id && c.status === 'idle' && isFriend(c.owner_player_id));
          const force = t.troops + defenders.reduce((a, c) => a + c.troops, 0);
          out.push(line('Your force', `${t.troops} garrison + ${defenders.length} commander${defenders.length === 1 ? '' : 's'} (${force} troops)`),
            h('div', { style: 'margin-top:8px' }, h('button', {
              class: 'danger',
              onclick: (e) => {
                if (confirm('Sally out? Your garrison and idle commanders here fight the besiegers in the open. Ties go to the besiegers. If you lose, the garrison is emptied and those commanders die.')) {
                  order('sally_out', { p_territory_id: t.id }, (d) => (d.winner === 'sally' ? `Siege broken. ${d.survivors} survivors` : 'The sally was destroyed'))(e);
                }
              },
            }, 'Sally out')));
        }
        if (siegers.some((c) => c.owner_player_id === ms.me.id)) out.push(h('div', { style: 'margin-top:8px' }, assaultButton(t)));
        return h('div', { class: 'sec' }, out);
      };

      const commanderActions = (c) => {
        if (c.owner_player_id !== ms.me.id || !canAct()) return null;
        const call = (fn, args, message) => (e) => act(e.currentTarget, async () => {
          const { error } = await sb.rpc(fn, { p_game_id: gameId, ...args });
          if (error) throw error;
          if (message) toast(message, true);
        });

        if (c.status === 'moving') {
          const route = ms.routes.get(c.id);
          const m = ms.mov.get(c.id);
          if (route && route.status === 'recalled' && m) {
            return h('div', { class: 'sec' }, h('b', {}, 'Orders'),
              h('div', { style: 'color:var(--gold2)' }, `Recalled. Reaches ${ms.t.get(m.to_territory_id).name} first, then returns to ${ms.t.get(route.origin_territory_id).name}.`));
          }
          if (route && route.status === 'aborted' && m) {
            return h('div', { class: 'sec' }, h('b', {}, 'Orders'),
              h('div', { style: 'color:var(--gold2)' }, `Halting at ${ms.t.get(m.to_territory_id).name}.`));
          }
          return h('div', { class: 'sec' }, h('b', {}, 'Orders'),
            route && route.status === 'active' && route.stops.length > 1
              ? h('div', { style: 'color:var(--dim);margin-bottom:8px' }, `Route: ${route.stops.map((st) => (ms.t.get(st.territory_id) || { name: '?' }).name).join(' > ')}`)
              : null,
            h('div', { class: 'row wrap2' },
              h('button', { onclick: call('abort_route', { p_commander_id: c.id }, 'Will halt at the next stop') }, 'Halt at next stop'),
              h('button', { onclick: call('recall_route', { p_commander_id: c.id }, 'Recalling to origin') }, 'Recall')));
        }
        if ((c.status !== 'idle' && c.status !== 'sieging') || !c.current_territory_id) return null;

        const t = ms.t.get(c.current_territory_id);
        const out = [h('b', {}, 'Orders')];
        if (c.status === 'sieging') {
          out.push(h('div', { style: 'color:var(--gold2);margin-bottom:8px' }, `Besieging ${t.name}. The garrison starves each tick.`),
            h('div', { style: 'margin-bottom:10px' }, assaultButton(t)));
        }

        if (t.owner_player_id === ms.me.id) {
          const amount = h('input', { type: 'number', min: '1', value: ms.xfer, style: 'width:90px', oninput: (e) => { ms.xfer = Math.max(1, Number(e.target.value) || 1); } });
          out.push(h('div', { class: 'row wrap2', style: 'margin-bottom:10px' },
            amount,
            h('button', { onclick: (e) => act(e.currentTarget, async () => {
              const { error } = await sb.rpc('transfer_troops', { p_game_id: gameId, p_commander_id: c.id, p_amount: Number(amount.value) || 1 });
              if (error) throw error;
            }) }, 'Take'),
            h('button', { onclick: (e) => act(e.currentTarget, async () => {
              const { error } = await sb.rpc('transfer_troops', { p_game_id: gameId, p_commander_id: c.id, p_amount: -(Number(amount.value) || 1) });
              if (error) throw error;
            }) }, 'Leave'),
            h('span', { style: 'color:var(--dim);font-size:.8rem' }, `Garrison ${t.troops}`)));
        }

        const extras = [];
        if (t.owner_player_id === ms.me.id && t.garrison_commander_id !== c.id) {
          extras.push(h('button', { onclick: order('assign_garrison_commander', { p_commander_id: c.id }, 'Now leads the garrison') }, 'Lead garrison'));
        }
        if (!ms.cmd.some((x) => x.owner_player_id === ms.me.id && x.role === 'king')) {
          extras.push(h('button', { onclick: order('crown_commander', { p_commander_id: c.id }, (d) => `Crowned. Takes effect at tick ${d.effective_tick}`) }, 'Crown as king'));
        }
        if (extras.length) out.push(h('div', { class: 'row wrap2', style: 'margin-bottom:10px' }, extras));

        if (t.garrison_commander_id === c.id) {
          out.push(h('div', { style: 'color:var(--dim);margin-bottom:8px' }, 'Leads this garrison and cannot march.'),
            h('button', { onclick: call('unassign_garrison_commander', { p_territory_id: t.id }, 'Released from the garrison') }, 'Release from garrison'));
          return h('div', { class: 'sec' }, out);
        }

        if (!ms.marching) {
          out.push(h('button', { class: 'primary', onclick: () => { ms.marching = true; ms.preview = null; render(); drawSide(); } }, 'March...'));
          return h('div', { class: 'sec' }, out);
        }

        out.push(h('div', { style: 'color:var(--gold2);margin-bottom:8px' }, ms.stops.length ? 'Click a castle to add the next stop.' : 'Click a castle on the map to choose the destination.'));
        const pv = ms.preview;
        if (pv && pv.error) out.push(h('div', { style: 'color:#e08b82;margin-bottom:8px' }, pv.error));
        if (pv && !pv.plan && !pv.error) out.push(h('div', { class: 'empty' }, 'Planning route...'));
        if (pv && pv.plan) {
          const plan = pv.plan;
          const dest = ms.t.get(pv.to);
          const interval = TICK_MS[ms.game.tick_speed];
          const eta = interval ? ` (about ${fmtDuration((plan.arrival_tick - tickF()) * interval)})` : '';
          out.push(h('div', {},
            line('Destination', dest.name),
            line('Route', plan.path.map((id) => ms.t.get(id).name).join(' > ')),
            line('Travel', `${plan.travel_ticks} ticks`),
            line('Arrives', `tick ${plan.arrival_tick}${eta}`),
            line('Distance / range', `${Math.round(plan.raw_length)} / ${plan.range}`),
            line('In range', plan.in_range ? (plan.raw_length > plan.range ? 'Yes (single hop)' : 'Yes') : 'No')));
          const friendly = dest.owner_player_id && isFriend(dest.owner_player_id);
          if (!friendly) {
            const type = h('select', { onchange: (e) => { pv.type = e.target.value; } },
              h('option', { value: 'assault' }, 'Assault the castle'),
              h('option', { value: 'siege' }, 'Lay siege'));
            type.value = pv.type;
            out.push(h('label', {}, 'On arrival'), type);
          }
          out.push(h('div', { class: 'row wrap2', style: 'margin-top:10px' },
            h('button', {
              class: 'primary',
              disabled: !plan.in_range,
              onclick: (e) => act(e.currentTarget, async () => {
                const { data, error } = await sb.rpc('march_commander', { p_game_id: gameId, p_commander_id: c.id, p_to_territory_id: pv.to, p_march_type: pv.type });
                if (error) throw error;
                ms.marching = false;
                ms.preview = null;
                ms.stops = [];
                toast(`Marching. Arrives at tick ${data.arrival_tick}`, true);
              }),
            }, 'March'),
            h('button', {
              disabled: !plan.in_range,
              onclick: () => { ms.stops = [{ id: pv.to, type: pv.type }]; ms.preview = null; render(); drawSide(); },
            }, 'Start a route here')));
        }
        if (ms.stops.length) {
          out.push(h('div', { class: 'sec' }, h('b', {}, `Route (${ms.stops.length} of 10 stops)`),
            ms.stops.map((st, i) => {
              const dest = ms.t.get(st.id);
              const friendly = dest.owner_player_id && isFriend(dest.owner_player_id);
              const type = friendly ? null : h('select', { style: 'width:auto;padding:3px 6px', onchange: (e) => { st.type = e.target.value; } },
                h('option', { value: 'assault' }, 'Assault'), h('option', { value: 'siege' }, 'Siege'));
              if (type) type.value = st.type;
              return h('div', { class: 'line', style: 'align-items:center' },
                h('span', { style: 'color:var(--text)' }, `${i + 1}. ${dest.name}`),
                h('span', { class: 'row' }, type, h('button', { style: 'padding:2px 8px', onclick: () => { ms.stops.splice(i, 1); render(); drawSide(); } }, 'x')));
            }),
            h('div', { style: 'color:var(--dim);font-size:.8rem;margin:6px 0' }, 'Click more castles to add stops. Only the first leg is checked now; later legs are planned when the commander reaches each stop, and the route ends if one is blocked.'),
            h('button', {
              class: 'primary',
              onclick: (e) => act(e.currentTarget, async () => {
                const { data, error } = await sb.rpc('send_on_route', {
                  p_game_id: gameId, p_commander_id: c.id, p_march_type: 'assault',
                  p_stops: ms.stops.map((st) => ({ territory_id: st.id, march_type: st.type })),
                });
                if (error) throw error;
                ms.marching = false;
                ms.preview = null;
                ms.stops = [];
                toast(`Route started with ${data.stops} stop${data.stops === 1 ? '' : 's'}. First leg arrives at tick ${data.arrival_tick}`, true);
              }),
            }, `Send route (${ms.stops.length} stop${ms.stops.length === 1 ? '' : 's'})`)));
        }
        out.push(h('div', { style: 'margin-top:10px' }, h('button', { onclick: () => { ms.marching = false; ms.preview = null; ms.stops = []; render(); drawSide(); } }, 'Cancel')));
        return h('div', { class: 'sec' }, out);
      };

      const line = (k, v) => h('div', { class: 'line' }, h('span', {}, k), h('span', {}, v));
      const cmdRow = (c) => h('button', { class: 'cmdrow', onclick: () => select('c', c.id) },
        h('span', { class: 'chip', style: `background:${color(c.owner_player_id)}` }),
        `${c.role === 'king' ? '♛ ' : ''}${c.name}`,
        h('span', { style: 'color:var(--dim);margin-left:auto' }, `R${rankOf(c)} · ${c.troops}`));

      const momentText = (m) => {
        const p = m.payload;
        switch (m.type) {
          case 'game_started': return 'The realms are drawn. The game begins.';
          case 'war_declared': return `${pname(p.by_player_id)} ${p.how === 'declared' ? 'declared war on' : 'and'} ${pname(p.against_player_id)}${p.how === 'declared' ? '' : ' are at war'}${p.how === 'alliance_broken' ? ' after a broken alliance' : p.how === 'declared' ? '' : ' after the first attack'}`;
          case 'nap_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} signed a non-aggression pact`;
          case 'nap_broken': return `${pname(p.by_player_id)} broke the non-aggression pact with ${pname(p.against_player_id)}`;
          case 'marriage_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} sealed a marriage alliance until tick ${p.until_tick}`;
          case 'world_event': return p.kind === 'plague' ? `Plague breaks out at ${p.territory}` : p.kind === 'rebellion' ? `Unrest at ${p.territory}` : p.kind === 'harvest' ? `A bumper harvest at ${p.territory} (+${p.gold} gold)` : 'A comet crosses the sky; every realm gains prestige';
          case 'commander_captured': return `${p.name} (${pname(p.owner_player_id)}) was captured by ${pname(p.captor_player_id)}`;
          case 'captive_executed': return `${pname(p.by_player_id)} executed the captive ${p.name}`;
          case 'trade_agreed': return `${pname(p.player_a)} and ${pname(p.player_b)} agreed a trade deal`;
          case 'mediation_succeeded': return `${pname(p.mediator)} brokered a truce between ${pname(p.player_a)} and ${pname(p.player_b)}`;
          case 'alliance_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} formed an alliance`;
          case 'truce_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} agreed a truce until tick ${p.ends_tick}`;
          case 'truce_ended': return `The truce between ${pname(p.player_a)} and ${pname(p.player_b)} has ended`;
          case 'alliance_broken': return `${pname(p.by_player_id)} broke the alliance with ${pname(p.against_player_id)}`;
          case 'castle_captured': return `${pname(p.to_player_id)} captured ${p.territory}${p.from_player_id ? ' from ' + pname(p.from_player_id) : ''}`;
          case 'siege_started': return `${pname(p.by_player_id)} laid siege to ${p.territory}`;
          case 'siege_lifted': return `The siege of ${p.territory} was lifted ${p.by === 'sally' ? 'by a sally' : 'by relief forces'}`;
          case 'king_killed': return `${p.name}, king of ${pname(p.player_id)}, was killed`;
          case 'player_eliminated': return `${pname(p.player_id)} was eliminated`;
          case 'game_won': return `${pname(p.player_id)} won the game${p.reason === 'time_limit' ? ' at the time limit' : ''}`;
          default: return m.type.replace(/_/g, ' ');
        }
      };

      const markRead = async () => {
        const ids = ms.inbox.filter((i) => !i.is_read).map((i) => i.id);
        if (!ids.length) return;
        ms.newIds = new Set(ids);
        ms.inbox.forEach((i) => { i.is_read = true; });
        await sb.from('player_inbox').update({ is_read: true }).in('id', ids);
      };

      const sideTabs = () => {
        const unread = ms.inbox.filter((i) => !i.is_read).length + battlesUnread();
        const tab = (k, label) => h('button', {
          class: ms.tab === k ? 'on' : '',
          onclick: async () => {
            ms.tab = k;
            if (k === 'inbox') await markRead();
            drawSide();
            drawHud();
          },
        }, label);
        const chatN = chatUnread() + [...ms.threads.values()].filter(threadUnread).length;
        return h('div', { class: 'tabs' }, tab('info', 'Info'), tab('news', 'News'), tab('inbox', `Inbox${unread ? ` (${unread})` : ''}`), tab('chat', `Chat${chatN && !(ms.tab === 'chat') ? ` (${chatN})` : ''}`));
      };

      const threadUnread = (t) => t.msgs.some((m) => m.player_id !== ms.me.id && (!t.read || Date.parse(m.created_at) > Date.parse(t.read)));
      const chatUnread = () => ms.chat.filter((m) => m.player_id !== ms.me.id && !ms.muted.has(m.player_id) && m.id > ms.chatSeen).length;

      const markChatSeen = () => {
        const top = ms.chat.length ? ms.chat[ms.chat.length - 1].id : 0;
        if (top <= ms.chatSeen) return;
        ms.chatSeen = top;
        try { localStorage.setItem(chatSeenKey, String(top)); } catch {}
      };

      const markThreadRead = (t) => {
        if (!threadUnread(t)) return;
        t.read = new Date().toISOString();
        sb.from('thread_participants').update({ last_read_at: t.read }).eq('thread_id', t.id).eq('player_id', ms.me.id).then(() => {});
      };

      const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const readable = (pid) => {
        const c = color(pid);
        const n = parseInt(c.slice(1), 16);
        const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
        return lum < 0.3 ? color2(pid) : c;
      };

      const setMuted = (pid, on) => {
        if (on) ms.muted.add(pid); else ms.muted.delete(pid);
        try { localStorage.setItem(mutedKey, JSON.stringify([...ms.muted])); } catch {}
        drawSide();
      };

      const chatLine = (pid, text, at) => (ms.muted.has(pid) ? null : h('div', { class: 'chatline' },
        h('b', { style: `color:${readable(pid)};font-weight:bold` }, `${pname(pid)}: `), text, h('small', {}, fmtTime(at)),
        ...(pid !== ms.me.id && !(ms.players.get(pid) || {}).is_ai ? [h('button', { class: 'link', style: 'margin-left:6px', onclick: () => setMuted(pid, true) }, 'mute')] : [])));

      const mutedBar = () => (ms.muted.size
        ? h('div', { class: 'meta', style: 'color:var(--dim);margin-top:8px' }, 'Muted: ',
          ...[...ms.muted].map((pid) => h('button', { class: 'link', style: 'margin-right:8px', onclick: () => setMuted(pid, false) }, `${pname(pid)} (unmute)`)))
        : null);

      const threadTitle = (t) => t.parts.filter((id) => id !== ms.me.id).map(pname).join(', ') || 'Just you';

      const composer = (input, onSend) => h('form', { class: 'composer', onsubmit: (e) => { e.preventDefault(); onSend(); } },
        input, h('button', { type: 'submit', class: 'primary' }, 'Send'));

      const sendGeneral = async () => {
        const text = ms.chatInput.value.trim();
        if (!text) return;
        ms.chatInput.value = '';
        const { error } = await sb.rpc('send_chat_message', { p_game_id: gameId, p_message: text });
        if (error) { ms.chatInput.value = text; toast(error.message); return; }
        await load();
      };

      const sendInThread = async (t) => {
        const text = ms.threadInput.value.trim();
        if (!text) return;
        ms.threadInput.value = '';
        const { error } = await sb.rpc('send_thread_message', { p_thread_id: t.id, p_body: text });
        if (error) { ms.threadInput.value = text; toast(error.message); return; }
        await load();
      };

      const openDm = (pid) => {
        const want = [ms.me.id, pid].sort((a, b) => a - b).join(',');
        const t = [...ms.threads.values()].find((x) => [...x.parts].sort((a, b) => a - b).join(',') === want);
        ms.tab = 'chat';
        ms.chatTab = 'messages';
        ms.thread = t ? t.id : null;
        ms.compose = t ? null : { ids: new Set([pid]) };
        drawSide();
      };

      const chatView = () => {
        const nThreads = [...ms.threads.values()].filter(threadUnread).length;
        const sub = (k, label) => h('button', {
          class: ms.chatTab === k ? 'primary' : '',
          onclick: () => { ms.chatTab = k; ms.thread = null; ms.compose = null; drawSide(); },
        }, label);
        const bar = h('div', { class: 'row', style: 'margin:12px 0' }, sub('general', 'General'), sub('messages', `Messages${nThreads ? ` (${nThreads})` : ''}`));

        if (ms.chatTab === 'general') {
          markChatSeen();
          const lines = ms.chat.map((m) => chatLine(m.player_id, m.message, m.created_at)).filter(Boolean);
          return [bar, h('div', { class: 'chatlist', id: 'chatscroll' }, lines.length ? lines : h('div', { class: 'empty' }, 'No messages yet.')), composer(ms.chatInput, sendGeneral), mutedBar()].filter(Boolean);
        }

        if (ms.compose) {
          const humans = [...ms.players.values()].filter((p) => !p.is_ai && p.id !== ms.me.id);
          const boxes = humans.map((p) => h('label', { class: 'check', style: 'margin-top:6px' },
            h('input', { type: 'checkbox', checked: ms.compose.ids.has(p.id), onchange: (e) => { if (e.target.checked) ms.compose.ids.add(p.id); else ms.compose.ids.delete(p.id); } }),
            dots(p.faction_slug), p.display_name));
          return [bar, h('b', {}, 'New message to'), humans.length ? boxes : h('div', { class: 'empty' }, 'No other human players in this game.'),
            composer(ms.threadInput, async () => {
              const text = ms.threadInput.value.trim();
              if (!text) return;
              const ids = [...ms.compose.ids];
              if (!ids.length) { toast('Choose at least one player'); return; }
              const { data, error } = await sb.rpc('create_thread', { p_game_id: gameId, p_participant_ids: ids, p_first_message: text });
              if (error) { toast(error.message); return; }
              ms.threadInput.value = '';
              ms.compose = null;
              ms.thread = data;
              await load();
            }),
            h('div', { style: 'margin-top:10px' }, h('button', { onclick: () => { ms.compose = null; drawSide(); } }, 'Cancel'))];
        }

        const open = ms.thread ? ms.threads.get(ms.thread) : null;
        if (open) {
          markThreadRead(open);
          return [bar, h('div', { class: 'row', style: 'margin-bottom:8px' }, h('button', { onclick: () => { ms.thread = null; drawSide(); } }, 'All messages'), h('b', { style: 'color:var(--gold2);font-weight:normal' }, threadTitle(open))),
            h('div', { class: 'chatlist', id: 'chatscroll' }, open.msgs.map((m) => chatLine(m.player_id, m.body, m.created_at)).filter(Boolean)),
            composer(ms.threadInput, () => sendInThread(open)), mutedBar()].filter(Boolean);
        }

        const list = [...ms.threads.values()].sort((a, b) => (b.msgs.length ? b.msgs[b.msgs.length - 1].id : 0) - (a.msgs.length ? a.msgs[a.msgs.length - 1].id : 0));
        return [bar, h('button', { class: 'primary', onclick: () => { ms.compose = { ids: new Set() }; drawSide(); } }, 'New message'),
          list.length ? list.map((t) => {
            const last = t.msgs[t.msgs.length - 1];
            return h('button', { class: 'threadrow', onclick: () => { ms.thread = t.id; drawSide(); } },
              h('span', { style: threadUnread(t) ? 'color:var(--gold2)' : '' }, `${threadUnread(t) ? '\u25CF ' : ''}${threadTitle(t)}`),
              h('small', {}, last ? `${pname(last.player_id)}: ${last.body.slice(0, 60)}` : 'No messages'));
          }) : h('div', { class: 'empty', style: 'margin-top:10px' }, 'No conversations yet.')];
      };

      const KIND_LABELS = { assault: 'Assault', sally: 'Sally', relief: 'Relief', intercept: 'Intercept' };
      const ROLE_LABELS = { attacker: 'Attackers', defender: 'Defenders', sally: 'Sally force', siege: 'Besiegers', relief: 'Relief force', marching: 'Marching force' };

      const sidePlayers = (side) => [...new Set([side.player_id, ...side.commanders.map((c) => c.owner_player_id)].filter(Boolean))];
      const battleMeta = (b) => {
        const sides = b.report.sides;
        const mine = sides.findIndex((sd) => sidePlayers(sd).includes(ms.me.id));
        const other = sides[mine === 0 ? 1 : 0];
        return {
          mine,
          won: mine === b.report.winner,
          opponents: other ? (sidePlayers(other).map(pname).join(', ') || 'Neutral garrison') : '',
        };
      };

      const battlesUnread = () => ms.battles.filter((b) => b.id > ms.battleSeen).length;
      const markBattlesSeen = () => {
        const top = ms.battles.length ? ms.battles[0].id : 0;
        if (top <= ms.battleSeen) return;
        ms.battleSeen = top;
        try { localStorage.setItem(battleSeenKey, String(top)); } catch {}
      };

      const openBattle = (id) => {
        ms.tab = 'inbox';
        ms.inboxTab = 'battles';
        ms.report = id;
        drawSide();
        drawHud();
      };

      const placeOf = (b) => (b.territory_name ? `at ${b.territory_name}` : (b.report.location && b.report.location.near ? `near ${b.report.location.near}` : 'in the field'));

      const battleRow = (b) => {
        const m = battleMeta(b);
        return h('button', { class: 'threadrow', onclick: () => openBattle(b.id) },
          h('span', { style: `color:${m.won ? '#7fd08a' : '#e08b82'}` }, `${m.won ? 'Victory' : 'Defeat'} · ${KIND_LABELS[b.kind]} ${placeOf(b)}`),
          h('small', {}, `Tick ${b.tick} · against ${m.opponents}`));
      };

      const abilityChips = (abilities) => Object.entries(abilities).map(([k, v]) => `${ABILITY_NAMES[k] || k} ${v}`).join(', ');

      const battleChart = (b) => {
        const rounds = b.report.rounds;
        const sides = b.report.sides;
        const pts = [[sides[0].troops, sides[1].troops], ...rounds];
        const W = 300;
        const H = 110;
        const maxT = Math.max(1, ...pts.flat());
