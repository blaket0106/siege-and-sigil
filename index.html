    function h(tag, props, ...kids) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(props || {})) {
        if (v === undefined || v === null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else if (k === 'value') el.value = v;
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
      for (const kid of kids.flat()) {
        if (kid === null || kid === undefined || kid === false) continue;
        el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
      }
      return el;
    }

    const Sfx = (() => {
      let ac = null;
      let master = null;
      let pad = null;
      let on = true;
      let music = true;
      try { on = localStorage.getItem('ss-sound') !== '0'; music = localStorage.getItem('ss-music') !== '0'; } catch {}
      const ensure = () => {
        if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = on ? 0.9 : 0;
        const comp = ac.createDynamicsCompressor();
        master.connect(comp);
        comp.connect(ac.destination);
        return ac;
      };
      const tone = (freq, dur, o = {}) => {
        if (!on || !ensure()) return;
        const t0 = ac.currentTime + (o.at || 0);
        const osc = ac.createOscillator();
        const g = ac.createGain();
        const f = ac.createBiquadFilter();
        osc.type = o.type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t0 + dur);
        f.type = 'lowpass';
        f.frequency.value = o.cut || 6000;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t0 + (o.attack || 0.006));
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(f); f.connect(g); g.connect(master);
        osc.start(t0); osc.stop(t0 + dur + 0.05);
      };
      const noise = (dur, o = {}) => {
        if (!on || !ensure()) return;
        const t0 = ac.currentTime + (o.at || 0);
        const buf = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * dur)), ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        const src = ac.createBufferSource();
        src.buffer = buf;
        const f = ac.createBiquadFilter();
        f.type = 'bandpass';
        f.frequency.value = o.freq || 2000;
        const g = ac.createGain();
        g.gain.value = o.vol || 0.1;
        src.connect(f); f.connect(g); g.connect(master);
        src.start(t0);
      };
      const startMusic = () => {
        if (pad || !music || !ensure()) return;
        const out = ac.createGain();
        out.gain.value = 0.0001;
        out.gain.exponentialRampToValueAtTime(0.05, ac.currentTime + 6);
        const lp = ac.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 520;
        const lfo = ac.createOscillator();
        const lfoG = ac.createGain();
        lfo.frequency.value = 0.06;
        lfoG.gain.value = 220;
        lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
        const roots = [110, 98, 123.47, 87.31];
        const oscs = [];
        [1, 1.5, 2, 3].forEach((m, i) => {
          [-5, 5].forEach((det) => {
            const o = ac.createOscillator();
            o.type = i < 2 ? 'sawtooth' : 'triangle';
            o.frequency.value = roots[0] * m;
            o.detune.value = det;
            const g = ac.createGain();
            g.gain.value = i < 2 ? 0.5 : 0.25;
            o.connect(g); g.connect(lp); o.start();
            oscs.push({ o, m });
          });
        });
        lp.connect(out); out.connect(master);
        let step = 0;
        const timer = setInterval(() => {
          step = (step + 1) % roots.length;
          oscs.forEach(({ o, m }) => o.frequency.setTargetAtTime(roots[step] * m, ac.currentTime, 3));
        }, 14000);
        pad = { out, timer, oscs };
      };
      const stopMusic = () => {
        if (!pad) return;
        clearInterval(pad.timer);

        toggle: () => {

          return on;

        wake: () => { if (on) startMusic(); },

    })();

    function buildLand(light) {
      const W = 960;
      const H = 600;
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H; cv.className = 'land';
      const ctx = cv.getContext('2d');
      const hash = (x, y) => { let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) ^ 0x5bd1e995; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967295; };
      const vnoise = (x, y) => {
        const xi = Math.floor(x); const yi = Math.floor(y); const xf = x - xi; const yf = y - yi;
        const u = xf * xf * (3 - 2 * xf); const v = yf * yf * (3 - 2 * yf);
        return hash(xi, yi) * (1 - u) * (1 - v) + hash(xi + 1, yi) * u * (1 - v) + hash(xi, yi + 1) * (1 - u) * v + hash(xi + 1, yi + 1) * u * v;
      };
      const fbm = (x, y) => { let a = 0.5; let t = 0; let f = 1; for (let i = 0; i < 6; i++) { t += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return t; };
      const hgt = new Float32Array(W * H);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const nx = x / W; const ny = y / H;
          const dx = (nx - 0.5) * 1.5; const dy = ny - 0.52;
          const rim = Math.min(1, (dx * dx + dy * dy) * 2.4);
          hgt[y * W + x] = fbm(nx * 4.2 + 3.1, ny * 4.2 + 1.7) * 1.15 - rim * 0.34 + 0.06;
        }
      }
      const sea = 0.5;
      const img = ctx.createImageData(W, H);
      const mix = (a, b, t) => a + (b - a) * t;
      for (let y = 1; y < H - 1; y++) {
        for (let x = 1; x < W - 1; x++) {
          const i = y * W + x; const e = hgt[i];
          const shade = ((hgt[i - 1] - hgt[i + 1]) * 0.9 + (hgt[i - W] - hgt[i + W]) * 0.9) * 9;
          let r; let g; let b;
          if (e < sea) {
            const d = Math.min(1, (sea - e) * 6);
            if (light) { r = mix(212, 186, d); g = mix(196, 172, d); b = mix(150, 128, d); } else { r = mix(34, 12, d); g = mix(70, 26, d); b = mix(84, 34, d); }
          } else {
            const t = Math.min(1, (e - sea) * 3.2);
            if (light) { r = mix(228, 190, t); g = mix(212, 168, t); b = mix(166, 118, t); } else { r = mix(92, 178, t); g = mix(78, 148, t); b = mix(48, 98, t); }
            const k = 1 + shade * (light ? 0.55 : 0.9);
            r *= k; g *= k; b *= k;
          }
          const edge = Math.abs(e - sea);
          if (edge < 0.007) { const c = light ? 0.55 : 1.6; r *= c; g *= c; b *= c; if (!light) { r += 40; g += 30; } }
          else if (e < sea && edge < 0.03 && (Math.floor(e * 400) % 2 === 0)) { const c = light ? 0.94 : 1.1; r *= c; g *= c; b *= c; }
          const p = i * 4;
          img.data[p] = Math.max(0, Math.min(255, r)); img.data[p + 1] = Math.max(0, Math.min(255, g)); img.data[p + 2] = Math.max(0, Math.min(255, b)); img.data[p + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const sites = [];
      for (let k = 0; k < 4000 && sites.length < 16; k++) {
        const x = 40 + hash(k, 7) * (W - 80); const y = 40 + hash(k, 11) * (H - 80);
        if (hgt[Math.floor(y) * W + Math.floor(x)] > sea + 0.05 && sites.every(([sx, sy]) => Math.hypot(sx - x, sy - y) > 110)) sites.push([x, y]);
      }
      ctx.lineWidth = 1.6; ctx.setLineDash([5, 6]); ctx.strokeStyle = light ? 'rgba(92,60,20,0.65)' : 'rgba(240,206,120,0.5)';
      sites.forEach(([x, y], i) => { const [nx, ny] = sites[(i * 5 + 3) % sites.length]; if (Math.hypot(nx - x, ny - y) < 320) { ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo((x + nx) / 2 + 20, (y + ny) / 2 - 24, nx, ny); ctx.stroke(); } });
      ctx.setLineDash([]);
      sites.forEach(([x, y]) => {
        const grad = ctx.createRadialGradient(x, y, 0, x, y, 22);
        grad.addColorStop(0, light ? 'rgba(160,40,30,0.5)' : 'rgba(255,196,96,0.65)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad; ctx.fillRect(x - 24, y - 24, 48, 48);
        ctx.fillStyle = light ? '#7a1f18' : '#f6dc98'; ctx.strokeStyle = light ? '#2b1d0e' : '#1a0f06'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y, 4.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      });
      return cv;
    }

    function stageEmbers(light) {
      const el = stageFx.embers;
      const ctx = el.getContext('2d');
      const resize = () => { el.width = window.innerWidth; el.height = window.innerHeight; };
      resize();
      stageFx.parts = Array.from({ length: light ? 28 : 46 }, () => ({ x: Math.random() * el.width, y: Math.random() * el.height, r: 0.6 + Math.random() * 1.8, v: 0.12 + Math.random() * 0.4, a: Math.random() * Math.PI * 2, s: 0.003 + Math.random() * 0.01 }));
      const frame = () => {
        stageFx.raf = requestAnimationFrame(frame);
        if (document.hidden || document.body.classList.contains('in-map')) return;
        if (el.width !== window.innerWidth || el.height !== window.innerHeight) resize();
        ctx.clearRect(0, 0, el.width, el.height);
        const dark = document.documentElement.getAttribute('data-theme') !== 'light';
        stageFx.parts.forEach((p) => {
          p.y -= p.v; p.a += p.s; p.x += Math.sin(p.a) * 0.35;
          if (p.y < -10) { p.y = el.height + 10; p.x = Math.random() * el.width; }
          const flick = 0.55 + 0.45 * Math.sin(p.a * 6);
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
          g.addColorStop(0, dark ? `rgba(255,190,90,${0.9 * flick})` : `rgba(110,80,30,${0.35 * flick})`);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 5, 0, Math.PI * 2); ctx.fill();
        });
      };
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) frame();
    }

        stageFx.land = next;
      };
      stageFx.paint();
      stageEmbers(light());

      overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });

      overlay.append(h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, h('h2', {}, title), body, h('div', { class: 'actions' }, actions(close))));
      document.body.append(overlay);
      const first = overlay.querySelector('input:not([type=checkbox]), select');
      if (first) first.focus();
      return close;

    const FACTION_FALLBACK = {
      brannoch: ['#B8742A', '#6B3A1A', 'Brannoch'], dravos: ['#26262B', '#E8662A', 'Dravos'], halcyr: ['#E8EEF2', '#4A8FC4', 'Halcyr'],
      kaldran: ['#B3202A', '#E0A526', 'Kaldran'], mereth: ['#6A3FA0', '#E58AA8', 'Mereth'], ostrand: ['#1E8A8F', '#E3C98A', 'Ostrand'],
      thornwick: ['#2F6B3A', '#D9D2B0', 'Thornwick'], veyra: ['#1F3A93', '#C0C8D4', 'Veyra'],

    function factionOf(slug) {
      const found = state.factions.find((f) => f.slug === slug);
      if (found) return found;
      const fb = FACTION_FALLBACK[slug];
      return fb ? { slug, name: fb[2], color: fb[0], color2: fb[1] } : { slug, name: slug || 'Unknown', color: '#555a73', color2: '#2b3156' };
    }

    const ARMS = {
      kaldran: ['chief', 'tower'], veyra: ['pale', 'crescent'], dravos: ['bend', 'star'], halcyr: ['fess', 'sun'],
      mereth: ['chevron', 'star'], ostrand: ['quarterly', 'wave'], thornwick: ['pale', 'tree'], brannoch: ['bend', 'spear'],
    };
    const SHIELD = 'M4 4H60V34C60 52 46 62 32 68C18 62 4 52 4 34Z';
    const DIVISIONS = {
      chief: 'M0 0H64V24H0Z', pale: 'M32 0H64V72H32Z', bend: 'M0 0H18L64 54V72H46L0 20Z', fess: 'M0 26H64V44H0Z',
      chevron: 'M0 50L32 22L64 50V62L32 34L0 62Z', quarterly: 'M32 0H64V36H32ZM0 36H32V72H0Z', plain: '',
    };
    const STAR = Array.from({ length: 10 }, (_, i) => { const r = i % 2 ? 5.4 : 13; const a = (Math.PI * i) / 5 - Math.PI / 2; return `${(32 + r * Math.cos(a)).toFixed(1)},${(38 + r * Math.sin(a)).toFixed(1)}`; }).join(' ');
    let sigilSeq = 0;

    function luminance(hex) {
      const n = parseInt(hex.replace('#', ''), 16);
      return (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
    }

    function sigil(slug, width = 40, opts = {}) {
      const f = factionOf(slug);
      const [division, charge] = ARMS[slug] || ['plain', 'star'];
      const id = `sg${++sigilSeq}`;
      const ink = luminance(f.color) > 0.55 ? '#1a2040' : '#f2d58f';
      const mark = { fill: ink, stroke: 'rgba(0,0,0,0.4)', 'stroke-width': 0.8, 'stroke-linejoin': 'round' };
      const charges = {
        tower: [sv('path', { ...mark, d: 'M22 28h4v4h4v-4h4v4h4v-4h4v8h-3v12H25V36h-3Z' })],
        crescent: [sv('path', { ...mark, d: 'M38 24a13 13 0 1 0 0 28a10 10 0 1 1 0-28Z' })],
        star: [sv('polygon', { ...mark, points: STAR })],
        sun: [sv('circle', { ...mark, cx: 32, cy: 38, r: 6.5 }), ...Array.from({ length: 8 }, (_, i) => { const a = (Math.PI * i) / 4; return sv('line', { x1: 32 + 9.5 * Math.cos(a), y1: 38 + 9.5 * Math.sin(a), x2: 32 + 14 * Math.cos(a), y2: 38 + 14 * Math.sin(a), stroke: ink, 'stroke-width': 2.2, 'stroke-linecap': 'round' }); })],

    function toggleTheme() {

    function houseSlug() {
      if (state.house) return state.house;
      const slugs = Object.keys(FACTION_FALLBACK);
      const name = state.profile ? state.profile.display_name : '';
      let hsh = 0;
      for (const ch of name) hsh = (hsh * 31 + ch.charCodeAt(0)) >>> 0;
      return slugs[hsh % slugs.length];
    }

      let chosen = initial || null;
      const wrap = h('div', { class: 'factions' });
      const draw = () => {
        const buttons = [
          h('button', { type: 'button', class: 'fac' + (chosen === null ? ' on' : ''), onclick: () => { chosen = null; onPick(null); draw(); } },
            sv('svg', { viewBox: '0 0 64 72', width: 36, height: 41, 'aria-hidden': 'true' }, sv('path', { d: SHIELD, fill: 'var(--ink-3)', stroke: 'var(--dim)', 'stroke-width': 3 }), sv('text', { x: 32, y: 46, 'text-anchor': 'middle', 'font-size': 28, style: 'fill:var(--dim);font-family:var(--font-display)' }, '?')),
            'Random', h('small', {}, 'Let fate choose')),
          ...state.factions.map((f) =>
            h('button', {
              type: 'button',

    function renderAuth(recovery) {
      let tab = recovery ? 'recovery' : state.authTab;
      const message = h('div', { class: 'msg' });
      const email = h('input', { type: 'email', autocomplete: 'email', placeholder: 'you@example.com' });
      const password = h('input', { type: 'password', autocomplete: tab === 'signup' || tab === 'recovery' ? 'new-password' : 'current-password' });
      const name = h('input', { type: 'text', maxlength: '40', placeholder: 'Shown to other players' });
      const form = h('form', { novalidate: true });

      const draw = () => {
        const submit = h('button', { type: 'submit', class: 'primary', style: 'width:100%;margin-top:20px' },
          { signin: 'Sign in', signup: 'Create account', reset: 'Send reset link', recovery: 'Set new password' }[tab]);
        const tabs = recovery ? null : h('div', { class: 'tabs' },
          h('button', { type: 'button', class: tab === 'signin' ? 'on' : '', onclick: () => { state.authTab = tab = 'signin'; draw(); } }, 'Sign in'),
          h('button', { type: 'button', class: tab === 'signup' ? 'on' : '', onclick: () => { state.authTab = tab = 'signup'; draw(); } }, 'Create account'));
        const kids = [tabs];
        if (tab === 'signup') kids.push(h('label', {}, 'Display name'), name);
        if (tab !== 'recovery') kids.push(h('label', {}, 'Email'), email);
        if (tab !== 'reset') kids.push(h('label', {}, tab === 'recovery' ? 'New password' : 'Password'), password);
        kids.push(submit);
        if (tab === 'signin') kids.push(h('div', { style: 'margin-top:14px;text-align:center' }, h('button', { type: 'button', class: 'link', onclick: () => { tab = 'reset'; draw(); } }, 'Forgot password?')));
        if (tab === 'reset') kids.push(h('div', { style: 'margin-top:14px;text-align:center' }, h('button', { type: 'button', class: 'link', onclick: () => { tab = 'signin'; draw(); } }, 'Back to sign in')));
        kids.push(message);
        form.replaceChildren(...kids.filter(Boolean));
        message.textContent = '';
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = form.querySelector('button[type=submit]');
        await run(btn, async () => {
          message.textContent = '';
          if (tab === 'signin') {
            const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: password.value });
            if (error) throw error;
          } else if (tab === 'signup') {
            const display = name.value.trim();
            if (!display) throw new Error('Choose a display name');
            if (password.value.length < 8) throw new Error('Password must be at least 8 characters');
            const { data, error } = await sb.auth.signUp({
              email: email.value.trim(),
              password: password.value,
              options: { data: { display_name: display }, emailRedirectTo: location.href.split('#')[0] },
            });
            if (error) throw error;
            if (!data.session) message.textContent = 'Account created. Check your email for a confirmation link, then sign in.';
          } else if (tab === 'reset') {
            const { error } = await sb.auth.resetPasswordForEmail(email.value.trim(), { redirectTo: location.href.split('#')[0] });
            if (error) throw error;
            message.textContent = 'If that email has an account, a reset link is on its way.';
          } else {
            if (password.value.length < 8) throw new Error('Password must be at least 8 characters');
            const { error } = await sb.auth.updateUser({ password: password.value });
            if (error) throw error;
            toast('Password updated', true);
            await showHome();
          }
        });
      });

      draw();
      const slugs = Object.keys(FACTION_FALLBACK);
      const crest = slugs[Math.floor(Math.random() * slugs.length)];
      mount(h('div', { class: 'wrap' }, h('div', { class: 'welcome' },
        h('div', {},
          h('div', { class: 'bigcrest' }, sigil(crest, 240, { draw: true })),
          h('h1', {}, 'Siege & Sigil'),
          h('p', { class: 'lede' }, 'Raise a house. Hold the castles.'),
          h('div', { class: 'roster', 'aria-label': 'The eight houses' }, slugs.map((sl) => h('span', { title: factionOf(sl).name }, sigil(sl, 38))))),
        h('div', { class: 'panel auth-card' }, form))));
    }

        crestHolder.replaceChildren(sigil(slug, 150, { draw }));

        ]);

            bannerGrid,
            h('div', { class: 'section-title' }, h('h2', {}, 'Open lobbies'), h('button', { class: 'ghost', onclick: (e) => run(e.currentTarget, refresh) }, 'Refresh')),
            h('div', { class: 'panel' }, openList),
            h('div', { class: 'section-title' }, h('h2', {}, 'Roll of honor')),
            h('div', { class: 'panel' }, boardList)))));

      sb.rpc('get_leaderboard', { p_limit: 15 }).then(({ data, error }) => {

          : [h('div', { class: 'empty' }, 'No finished campaigns yet. The first victory will be recorded here.')]));
      });

      await refresh();

      state.cleanup.push(() => clearInterval(timer));

    async function openGame(gameId) {
      const { data } = await sb.from('games').select('id, status').eq('id', gameId).maybeSingle();
      if (!data) return showHome();
      if (data.status === 'lobby') return showRoom(gameId);
      if (data.status === 'picking') return showPicking(gameId);
      return showMap(gameId);
    }

    async function showPicking(gameId) {
      clearCleanup();
      state.view = 'picking';
      state.roomId = gameId;
      await loadFactions();

      const container = h('div', { class: 'wrap' });
      mount(container);
      const countdown = h('span', { class: 'tag gold', style: 'margin-left:0' });
      let deadline = null;
      const tickCountdown = () => {
        if (!deadline) return;
        const left = Math.max(0, Math.round((deadline - Date.now()) / 1000));
        countdown.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} left`;
      };

      const draw = async () => {
        if (state.view !== 'picking' || state.roomId !== gameId) return;
        const { data, error } = await sb.rpc('get_start_options', { p_game_id: gameId });
        if (state.view !== 'picking' || state.roomId !== gameId) return;
        if (error) { toast(error.message); return; }
        if (data.status !== 'picking') return openGame(gameId);
        deadline = data.deadline ? Date.parse(data.deadline) : null;
        const W = data.map_w;
        const mine = data.seats.find((x) => x.player_id === data.me);
        const pick = (seat) => run(null, async () => {
          const { error: e2 } = await sb.rpc('pick_start', { p_game_id: gameId, p_seat: seat });
          if (e2) throw e2;
          await draw();
        });
        const svg = sv('svg', { viewBox: `0 0 ${W} ${W}`, class: 'pickboard', style: 'width:100%;max-height:70vh' },
          data.castles.map((c) => sv('circle', { cx: c.x, cy: c.y, r: W * 0.004 * (c.tier || 1), fill: '#8f98b8', opacity: '0.55', style: 'pointer-events:none' })),
          data.seats.map((x) => {
            const taken = x.player_id !== null && x.player_id !== undefined;
            const col = taken ? factionOf(x.faction_slug).color : '#dbb259';
            const r = W * 0.024;
            return sv('g', { style: 'cursor:pointer', onclick: () => { if (!taken || x.player_id === data.me) pick(x.seat); } },
              sv('circle', { cx: x.x, cy: x.y, r: r * 1.6, fill: 'transparent' }),
              sv('circle', { cx: x.x, cy: x.y, r, fill: '#0e1325', stroke: col, 'stroke-width': r * 0.3, 'stroke-dasharray': taken ? null : `${r * 0.5} ${r * 0.4}` }),
              sv('text', { x: x.x, y: x.y + r * 0.35, 'text-anchor': 'middle', 'font-size': r, style: 'fill:#fff;pointer-events:none' }, String(x.seat + 1)),
              sv('text', { x: x.x, y: x.y - r * 1.4, 'text-anchor': 'middle', 'font-size': r * 0.8, style: 'fill:#fff;paint-order:stroke;stroke:#000;stroke-width:' + r * 0.2 + 'px;pointer-events:none' }, taken ? x.display_name : 'free'));
          }));
        container.replaceChildren(topbar(),
          h('div', { class: 'row', style: 'margin-bottom:14px' }, h('button', { onclick: showHome }, 'Back to games')),
          h('div', { class: 'panel' },
            h('h2', {}, 'Choose where your house begins'),
            h('div', { class: 'tip', style: 'margin:6px 0 12px;max-width:70ch' },
              data.fog_dark ? 'The realm is dark: you can only see where each house could begin. ' : 'Pick the start that suits you. ',
              'Click a free marker to claim it, or click yours again to keep it. Houses that have not chosen when time runs out, and AI houses, are given the remaining starts at random.'),
            h('div', { class: 'row wrap2', style: 'margin-bottom:10px' }, countdown,

            svg));
        tickCountdown();
      };

      await draw();
      let debounce = null;
      const kick = () => { clearTimeout(debounce); debounce = setTimeout(draw, 300); };
      const unwatch = watchGame(gameId, kick);
      const poll = setInterval(draw, 4000);
      const clock = setInterval(tickCountdown, 1000);
      state.cleanup.push(() => { clearTimeout(debounce); clearInterval(poll); clearInterval(clock); unwatch(); });

    async function showRoom(gameId) {
      clearCleanup();
      state.view = 'room';
      state.roomId = gameId;
      await loadFactions();

      const container = h('div', { class: 'wrap' });
      mount(container);

      let schoolsDraft = null;
      const chatInput = h('input', { type: 'text', maxlength: '500', placeholder: 'Message the lobby' });

      const draw = async () => {
        if (state.view !== 'room' || state.roomId !== gameId) return;
        const [gameRes, playersRes, schoolsRes, chatRes] = await Promise.all([
          sb.from('games').select(GAME_COLS).eq('id', gameId).maybeSingle(),
          sb.from('game_players').select(PLAYER_COLS).eq('game_id', gameId).order('id'),
          sb.rpc('my_starting_schools', { p_game_id: gameId }),
          sb.from('game_chat').select('*').eq('game_id', gameId).order('id', { ascending: false }).limit(60),
        ]);
        if (state.view !== 'room' || state.roomId !== gameId) return;
        const game = gameRes.data;
        if (!game) {
          toast('That game is no longer available.');
          return showHome();
        }
        if (game.status === 'picking') return showPicking(gameId);
        const players = playersRes.data || [];
        const me = players.find((p) => p.user_id === state.session.user.id);
        if (me) me.starting_schools = schoolsRes.data;
        const isHost = game.created_by === state.session.user.id;

        const parts = [topbar(), h('div', { class: 'row', style: 'margin-bottom:14px' },
          h('button', { onclick: showHome }, 'Back to games'))];

        const statusText = { lobby: 'Gathering', picking: 'Choosing starts', active: 'In progress', finished: 'Finished' }[game.status];
        const host = players.find((p) => p.user_id === game.created_by);
        parts.push(h('div', { class: 'room-head' },
          sigil(host ? host.faction_slug : 'kaldran', 64),
          h('div', {}, h('h1', { style: 'margin:0' }, game.name), h('div', { class: 'tip' }, `Hosted by ${host ? host.display_name : 'unknown'}${game.has_password ? ' · password required' : ''}`)),
          h('span', { class: 'tag' + (game.status === 'active' ? ' gold' : '') }, statusText)));
        parts.push(h('div', { class: 'panel' }, h('h2', {}, 'Articles of war'), articlesOfWar(game, players.length)));

        const slots = players.map((p) => h('div', { class: 'slot' },

    function clipPoly(poly, a, b, c) {
      const out = [];
      for (let i = 0; i < poly.length; i++) {
        const p = poly[i];
        const q = poly[(i + 1) % poly.length];
        const dp = a * p[0] + b * p[1] - c;
        const dq = a * q[0] + b * q[1] - c;
        if (dp <= 0) out.push(p);
        if ((dp < 0 && dq > 0) || (dp > 0 && dq < 0)) {
          const t = dp / (dp - dq);
          out.push([p[0] + t * (q[0] - p[0]), p[1] + t * (q[1] - p[1])]);
        }
      }
      return out;
    }

    function voronoiCells(sites, w, ht) {

          if (o === s || !poly.length) continue;
          const a = o.x - s.x;
          const b = o.y - s.y;
          poly = clipPoly(poly, a, b, (o.x * o.x + o.y * o.y - s.x * s.x - s.y * s.y) / 2);
        }

      }

    }

    function bilerp(grid, G, fx, fy) {
      fx = Math.min(G - 1.001, Math.max(0, fx));

      const ix = Math.floor(fx);
      const iy = Math.floor(fy);

      const ty = fy - iy;
      const a = grid[iy * G + ix];
      const b = grid[iy * G + ix + 1];
      const c = grid[(iy + 1) * G + ix];
      const d = grid[(iy + 1) * G + ix + 1];
      return a * (1 - tx) * (1 - ty) + b * tx * (1 - ty) + c * (1 - tx) * ty + d * tx * ty;

      const N = 48;
      const canvas = Object.assign(document.createElement('canvas'), { width: N, height: N });
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(N, N);
      const cs = mapW / N;
      for (let i = 0; i < N * N; i++) {
        let known = grid && grid[i] === '1';
        if (!known) {
          const cx = ((i % N) + 0.5) * cs;
          const cy = (Math.floor(i / N) + 0.5) * cs;
          known = sources.some((s) => Math.hypot(cx - s.x, cy - s.y) <= s.r + cs * 0.7);

        img.data[i * 4 + 3] = known ? 0 : 255;

      ctx.putImageData(img, 0, 0);
      return canvas.toDataURL();

    function resolveFight(mode, a, d, firstSide) {
      const aT = Math.max(0, Math.floor(a.troops));
      const dT = Math.max(0, Math.floor(d.troops));
      const aDmg = Math.max(1, Math.floor(a.damage));
      const dDmg = Math.max(1, Math.floor(d.damage)) + (mode === 'castle' ? 1 : 0);
      if (mode === 'castle' && dT === 0) return { winner: 'attacker', left: aT, note: 'An undefended castle always falls.' };
      if (aT === 0 && dT === 0) return { winner: null, left: 0, note: 'Neither side has troops.' };
      if (aT === 0) return { winner: 'defender', left: dT, note: 'The attacker has no troops.' };
      if (dT === 0) return { winner: 'attacker', left: aT, note: 'The defender has no troops.' };
      const defFirst = mode === 'castle' || firstSide === 'defender';
      const F = defFirst ? { side: 'defender', t: dT, dmg: dDmg } : { side: 'attacker', t: aT, dmg: aDmg };
      const S = defFirst ? { side: 'attacker', t: aT, dmg: aDmg } : { side: 'defender', t: dT, dmg: dDmg };
      const rS = Math.ceil(S.t / F.dmg);
      const rF = Math.ceil(F.t / S.dmg);
      if (rS <= rF) return { winner: F.side, left: F.t - (rS - 1) * S.dmg, note: `${F.side} strikes first and needs ${rS} round${rS === 1 ? '' : 's'}; ${S.side} needs ${rF}.` };
      return { winner: S.side, left: S.t - rF * F.dmg, note: `${F.side} strikes first and needs ${rS} round${rS === 1 ? '' : 's'}; ${S.side} needs ${rF}.` };
    }

    function lineChart(series, label) {

      const x0 = Math.min(...xs);
      const x1 = Math.max(...xs, x0 + 1);
      const y1 = Math.max(...ys, 1);
      const X = (x) => pad.l + ((x - x0) / (x1 - x0)) * (W - pad.l - pad.r);
      const Y = (y) => H - pad.b - (y / y1) * (H - pad.t - pad.b);
      const grid = [0, 0.25, 0.5, 0.75, 1].flatMap((f) => [

      ]);
      return sv('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', role: 'img', 'aria-label': label },

      mount(h('div', { class: 'maproot' }, hud, h('div', { class: 'mapbody' + (PREFS.side === 'left' ? ' sideleft' : '') }, wrap, sideEl)));

      try {
        if (!localStorage.getItem('ss-help-seen')) {
          localStorage.setItem('ss-help-seen', '1');
          helpDialog();
        }
      } catch {}

      const touch = () => { if (!document.hidden) sb.rpc('touch_activity', { p_game_id: gameId }); };
      touch();
      const touchTimer = setInterval(touch, 5 * 60 * 1000);
      state.cleanup.push(() => clearInterval(touchTimer));

      const color = (pid) => (pid && ms.players.get(pid) ? factionOf(ms.players.get(pid).faction_slug).color : '#6b6b78');
      const color2 = (pid) => (pid && ms.players.get(pid) ? factionOf(ms.players.get(pid).faction_slug).color2 : '#2a2a35');
      const pname = (pid) => (pid && ms.players.get(pid) ? ms.players.get(pid).display_name : 'Unclaimed');
      const dipStatus = (pid) => {
        const r = ms.dip.find((d) => d.player_a_id === pid || d.player_b_id === pid);
        return r ? r.status : 'neutral';
      };
      const isFriend = (pid) => pid === ms.me.id || dipStatus(pid) === 'allied';
      const rankOf = (c) => Object.values(ms.abil.get(c.id) || {}).reduce((a, b) => a + b, 0);

      const S = () => (ms.game && ms.game.world_scale) || 1;
      const M = () => Math.pow(S(), 0.5);
      const rangeOf = (stables) => (trailsOn() ? (300 + 120 * stables) * S() : ms.game.free_travel ? (210 + 60 * stables) * S() : 90 + 60 * stables);
      const trailsOn = () => ms.game.travel_mode === 'trails';
      const myStables = () => (ms.areas.find((a) => a.area === 'stables') || { level: 0 }).level;
      const reachableFrom = (tid) => {
        const range = rangeOf(myStables());
        const out = new Map();
        ms.edges.forEach((e) => {
          if (e.length > range) return;
          if (e.from_territory_id === tid) out.set(e.to_territory_id, e);
          else if (e.to_territory_id === tid) out.set(e.from_territory_id, e);
        });
        return out;
      };

      const adjacency = () => {
        if (ms.adjFor === ms.edges) return ms.adj;
        const adj = new Map();
        ms.edges.forEach((e) => {
          const w = e.length * e.move_cost_mult;
          if (!adj.has(e.from_territory_id)) adj.set(e.from_territory_id, []);
          if (!adj.has(e.to_territory_id)) adj.set(e.to_territory_id, []);
          adj.get(e.from_territory_id).push({ to: e.to_territory_id, w });
          adj.get(e.to_territory_id).push({ to: e.from_territory_id, w });
        });
        ms.adj = adj;
        ms.adjFor = ms.edges;
        return adj;
      };
      const trailReach = (fromId) => {
        const adj = adjacency();
        const range = rangeOf(myStables());
        const cost = new Map([[fromId, 0]]);
        const prev = new Map();
        const done = new Set();
        for (;;) {
          let u = null;
          let best = Infinity;
          cost.forEach((c, id) => { if (!done.has(id) && c < best) { best = c; u = id; } });
          if (u === null) break;
          done.add(u);
          const tu = ms.t.get(u);
          if (u !== fromId && !(tu && isFriend(tu.owner_player_id))) continue;
          (adj.get(u) || []).forEach(({ to, w }) => {
            if (!done.has(to) && best + w < (cost.get(to) ?? Infinity)) { cost.set(to, best + w); prev.set(to, u); }
          });
        }
        const out = new Map();
        cost.forEach((c, id) => {
          if (id === fromId) return;
          const path = [id];
          while (path[0] !== fromId) path.unshift(prev.get(path[0]));
          if (path.length === 2 || c <= range) out.set(id, { cost: c, path });
        });
        return out;
      };
      const trailPoly = (ids) => {
        const pts = [];
        for (let i = 0; i < ids.length - 1; i++) {
          const a = ids[i];
          const b = ids[i + 1];
          const e = ms.edges.find((x) => (x.from_territory_id === a && x.to_territory_id === b) || (x.from_territory_id === b && x.to_territory_id === a));
          let seg = e && e.path ? e.path.map((q) => ({ x: q[0], y: q[1] })) : [ms.t.get(a), ms.t.get(b)];
          if (e && e.path && e.from_territory_id !== a) seg = seg.slice().reverse();
          pts.push(...(i ? seg.slice(1) : seg));
        }
        return pts;
      };
      const stopTicks = () => {
        let ticks = 0;
        return ms.stops.map((st) => {
          if (st.cost && ms.speed) ticks += Math.ceil(st.cost / ms.speed);
          const at = ticks;
          ticks += st.delay || 0;
          return at;
        });
      };
      const tickText = (n) => {
        const interval = TICK_MS[ms.game.tick_speed];
        return interval ? `${n} ticks (about ${fmtDuration(n * interval)})` : `${n} ticks`;
      };

      const tickF = () => {
        const g = ms.game;
        const interval = TICK_MS[g.tick_speed];
        if (!interval || !g.last_tick_processed_at || g.status !== 'active' || g.paused_at) return g.current_tick;
        return g.current_tick + Math.min(1, Math.max(0, (Date.now() - Date.parse(g.last_tick_processed_at)) / interval));
      };

      const movementPos = (m, tf) => {
        const p = m.path;
        const a = m.path_arrival_ticks;
        const n = p.length;
        if (tf >= a[n - 1]) {
          const t = ms.t.get(p[n - 1]);
          return { x: t.x, y: t.y, i: n - 1 };
        }
        let i = 0;
        while (i < n - 2 && a[i + 1] <= tf) i++;
        const A = ms.t.get(p[i]);
        const B = ms.t.get(p[i + 1]);
        const d = a[i + 1] - a[i];
        const f = d <= 0 ? 1 : Math.min(1, Math.max(0, (tf - a[i]) / d));
        return { x: A.x + (B.x - A.x) * f, y: A.y + (B.y - A.y) * f, i };
      };

      const cmdPos = (c, tf) => {
        if (c.current_territory_id) {
          const t = ms.t.get(c.current_territory_id);
          return { x: t.x, y: t.y };
        }
        const m = ms.mov.get(c.id);
        return m ? movementPos(m, tf) : null;
      };

      const computeVis = () => {
        ms.vis = new Set([...ms.t.values()].filter((t) => t.seen).map((t) => t.id));
        ms.sources = ms.serverSources;
      };

      const commanderSeen = () => true;

      const select = (type, id) => {
        if (ms.dragged) return;
        if (ms.marching && type === 't') return ms.stops.length ? addStop(id) : previewTo(id);
        ms.marching = false;
        ms.preview = null;
        ms.stops = []; ms.loop = false;
        ms.sel = type ? { type, id } : null;
        if (type) ms.tab = 'info';
        render();
        drawSide();
      };

      const act = (btn, fn) => run(btn, async () => {
        await fn();
        await load();
      });

      const addStop = (id) => {
        const c = ms.cmd.find((x) => x.id === ms.sel.id);
        const last = ms.stops.length ? ms.stops[ms.stops.length - 1].id : c.current_territory_id;
        if (id === last) return;
        if (ms.stops.length >= 10) { toast('A route can have at most 10 stops'); return; }
        const stop = { id, type: 'assault', action: PREFS.action, amount: 0, delay: 0 };
        if (trailsOn()) {
          const leg = trailReach(last).get(id);
          if (!leg) { toast('Out of range from the previous stop'); return; }
          stop.path = leg.path;
          stop.cost = leg.cost;
        }
        ms.stops.push(stop);
        render();
        drawSide();
      };

      const previewTo = async (id) => {
        const c = ms.cmd.find((x) => x.id === ms.sel.id);
        if (id === c.current_territory_id) return;
        ms.preview = { to: id, type: ms.preview ? ms.preview.type : 'assault' };
        render();
        drawSide();
        const { data, error } = await sb.rpc('preview_march', { p_game_id: gameId, p_commander_id: c.id, p_to_territory_id: id });
        if (!ms.preview || ms.preview.to !== id) return;
        if (error) ms.preview.error = error.message;
        else { ms.preview.plan = data; ms.speed = data.speed; }
        render();
        drawSide();
      };

      const fmtDuration = (msec) => {
        const m = Math.max(0, Math.round(msec / 60000));
        return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
      };

      const initTerrain = () => {
        const sites = [...ms.t.values()];
        ms.terr = paintTerrain(ms.art, ms.game.map_w, sites);
        const W = ms.game.map_w;
        L.terrain.replaceChildren(sv('image', { x: 0, y: 0, width: W, height: W, href: ms.terr.url, preserveAspectRatio: 'none', style: 'pointer-events:none;filter:brightness(0.92) saturate(0.92)' }));
        const d = (r) => 'M' + r.p.map((q) => `${q[0]} ${q[1]}`).join(' L');
        L.rivers.replaceChildren(...ms.terr.rivers.flatMap((r) => [
          sv('path', { d: d(r), fill: 'none', stroke: '#2f6aa3', 'stroke-width': (4 + r.w * 1.6) * M(), 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.9, style: 'pointer-events:none' }),
          sv('path', { d: d(r), fill: 'none', stroke: '#7fb9ea', 'stroke-width': (2 + r.w * 1.1) * M(), 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.95, style: 'pointer-events:none' }),
        ]));
        const bridge = (x, y) => sv('g', { transform: `translate(${x},${y}) scale(${M()})` },
          sv('rect', { x: -9, y: -4, width: 18, height: 8, rx: 1, fill: '#c9a46a', stroke: '#2a2418', 'stroke-width': 1.2 }),
          sv('line', { x1: -9, y1: -1, x2: 9, y2: -1, stroke: '#2a2418', 'stroke-width': 0.8 }),
          sv('line', { x1: -9, y1: 2, x2: 9, y2: 2, stroke: '#2a2418', 'stroke-width': 0.8 }));
        const gap = (x, y) => sv('g', { transform: `translate(${x},${y}) scale(${M()})` },
          sv('path', { d: 'M-9,5 L-4,-6 L0,1 L4,-6 L9,5 Z', fill: '#e8dcc2', stroke: '#2a2418', 'stroke-width': 1.2 }),
          sv('line', { x1: 0, y1: 1, x2: 0, y2: 5, stroke: '#2a2418', 'stroke-width': 1 }));
        L.crossings.replaceChildren(...(ms.art.fords || []).map((f) => bridge(f[0], f[1])), ...(ms.art.passes || []).map((f) => gap(f[0], f[1])));
        svg.parentElement.style.background = ms.game.fog_dark ? '#000' : '#0e2f4f';
        if (!svg.parentElement.querySelector('.legend')) {
          const dot = (style) => h('span', { class: 'ldot', style });
          svg.parentElement.append(h('div', { class: 'legend' },
            h('div', {}, dot('border-color:#f0cf7d;box-shadow:0 0 0 2px #f0cf7d'), 'Yours'),
            h('div', {}, dot('border-color:#c0453a'), 'Other players'),
            h('div', {}, dot('border-color:#9aa3b2'), 'Unclaimed'),
            h('div', {}, dot('border-color:#5b6270;border-style:dashed'), 'Unknown')));
        }
      };

      const render = () => {
        computeVis();
        if (ms.terr && ms.game.fog_dark && ms.explored !== null) {
          const sig = `${ms.explored}|${(ms.sources || []).map((q) => `${q.x},${q.y},${q.r}`).join(';')}`;
          if (sig !== ms.fogSig) {
            ms.fogSig = sig;
            const W = ms.game.map_w;
            L.fog.replaceChildren(sv('image', { x: 0, y: 0, width: W, height: W, href: paintExplored(ms.explored, ms.sources || [], W), preserveAspectRatio: 'none', style: 'pointer-events:none' }));
          }
        } else if (ms.fogSig) {
          ms.fogSig = null;
          L.fog.replaceChildren();
        }
        const tf = tickF();
        ms.t.forEach((t) => {
          if (ms.vis.has(t.id)) ms.mem[t.id] = { o: t.owner_player_id, tr: t.troops };
        });
        try { localStorage.setItem(memKey, JSON.stringify(ms.mem)); } catch {}

        ms.reachable = null;
        ms.reachFrom = null;
        if ((ms.game.free_travel || trailsOn()) && ms.marching && ms.sel && ms.sel.type === 'c') {
          const c = ms.cmd.find((x) => x.id === ms.sel.id);
          if (trailsOn()) {
            const from = ms.stops.length ? ms.stops[ms.stops.length - 1].id : c && c.current_territory_id;
            if (from) {
              ms.reachFrom = from;
              ms.reachable = new Set(trailReach(from).keys());
            }
          } else if (c && c.current_territory_id) ms.reachable = new Set(reachableFrom(c.current_territory_id).keys());
        }

        const cells = [];
        const castles = [];
        ms.t.forEach((t) => {
          const seen = ms.vis.has(t.id);
          const owner = ms.replay ? (ms.replay.owners.get(t.id) ?? null) : seen ? t.owner_player_id : (ms.mem[t.id] ? ms.mem[t.id].o : null);
          const selected = ms.sel && ms.sel.type === 't' && ms.sel.id === t.id;
          const pick = (e) => {
            select('t', t.id);
          };
          if (!ms.terr) cells[selected ? 'push' : 'unshift'](sv('polygon', {
              points: ms.cells.get(t.id),
              fill: owner ? color(owner) : '#2a2a38',
              'fill-opacity': seen ? (owner ? 0.4 : 0.55) : 0.14,
              stroke: selected ? '#f0cf7d' : '#0a0a0f',
              'stroke-width': selected ? 3 : 1.5,
              onclick: pick,
            }));

          const tier = t.tier || 1;
          const plate = !!ms.terr;
          const showTroops = !ms.replay && seen && (isFriend(t.owner_player_id) || !ms.game.fog_of_war || ms.vis.has(t.id));
          const here = ms.replay ? [] : ms.cmd.filter((c) => c.current_territory_id === t.id && commanderSeen(c, tf));
          const sieged = ms.cmd.some((c) => c.status === 'sieging' && c.current_territory_id === t.id && commanderSeen(c, tf));
          const k = ms.terr ? M() * 1.3 * (t.crossing_kind ? 0.82 : 1) : 1;
          const reach = ms.reachable ? ms.reachable.has(t.id) || ms.reachFrom === t.id || (ms.sel && ms.sel.type === 'c' && (ms.cmd.find((x) => x.id === ms.sel.id) || {}).current_territory_id === t.id) : true;
          const mine = owner === ms.me.id;
          const isCap = ms.players.get(owner) && ms.players.get(owner).capital_territory_id === t.id;
          const nameLabel = `${isCap ? '♛ ' : ''}${t.name}`;
          const g = plate
            ? plateCastle({ t, tier, owner, seen, mine, showTroops, selected, sieged, here, reach, pick, nameLabel, colors: { c: color(owner), c2: color2(owner), cmd: color }, onCmd: (c) => select('c', c.id), cmdSel: (c) => !!ms.sel && ms.sel.type === 'c' && ms.sel.id === c.id })
            : sv('g', {}, sv('circle', { cx: 0, cy: 0, r: 8 + 3 * tier, fill: owner ? color(owner) : '#6b6b78', stroke: owner ? color2(owner) : '#222', 'stroke-width': 2.5, style: 'cursor:pointer', onclick: pick }), sv('text', { x: 0, y: -8 - 3 * tier - 5, 'text-anchor': 'middle', 'font-size': 17, style: 'fill:#fff;font-weight:bold' }, showTroops ? t.troops : '?'));
          g.setAttribute('transform', `translate(${t.x},${t.y}) scale(${k},${k * tiltK()})`);
          castles.push(g);
        });
        L.cells.replaceChildren(...cells);
        L.castles.replaceChildren(...castles);

        const nearLimit = 150 * 1.7 * S();
        L.edges.replaceChildren(...(trailsOn() ? [] : ms.edges).filter((e) => !ms.game.free_travel || e.length <= nearLimit).map((e) => {
          const A = ms.t.get(e.from_territory_id);
          const B = ms.t.get(e.to_territory_id);
          const road = A.has_road && B.has_road;
          if (ms.game.free_travel && !road) return null;
          const seen = ms.vis.has(A.id) || ms.vis.has(B.id);
          if (ms.terr) {
            const style = road ? { stroke: '#e0b64a', w: 2.8, dash: null }
              : e.kind === 'pass' ? { stroke: '#e8c9a0', w: 2.2, dash: '2 5' }
                : e.kind === 'river' ? { stroke: '#cfe8ff', w: 2.2, dash: '7 4' }
                  : { stroke: '#efe4bf', w: 1.6, dash: '5 5' };
            return sv('line', { x1: A.x, y1: A.y, x2: B.x, y2: B.y, stroke: style.stroke, 'stroke-width': style.w * M(), 'stroke-dasharray': style.dash ? style.dash.split(' ').map((v) => v * M()).join(' ') : null, 'stroke-opacity': seen ? 0.7 : 0.2, 'stroke-linecap': 'round', style: 'pointer-events:none' });
          }
          return sv('line', { x1: A.x, y1: A.y, x2: B.x, y2: B.y, stroke: road ? '#b8923a' : '#4a4860', 'stroke-width': road ? 2.6 : 1.2, 'stroke-opacity': seen ? 0.85 : 0.25, style: 'pointer-events:none' });
        }).filter(Boolean));

        if (trailsOn()) {
          L.edges.replaceChildren(...ms.edges.flatMap((e) => {
            const A = ms.t.get(e.from_territory_id);
            const B = ms.t.get(e.to_territory_id);
            const pts = (e.path || [[A.x, A.y], [B.x, B.y]]).map((q) => `${q[0]},${q[1]}`).join(' ');
            const road = A.has_road && B.has_road;
            const o = ms.vis.has(A.id) || ms.vis.has(B.id) ? 1 : 0.3;
            const base = { points: pts, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', style: 'pointer-events:none' };
            if (e.kind === 'wormhole') {
              return [
                sv('polyline', { ...base, stroke: '#7a4ad8', 'stroke-width': 8 * M(), 'stroke-opacity': 0.18 * o }),
                sv('polyline', { ...base, stroke: '#c9a8ff', 'stroke-width': 2.4 * M(), 'stroke-opacity': 0.95 * o, 'stroke-dasharray': `${1 * M()} ${6 * M()}` }),
              ];
            }
            return [
              sv('polyline', { ...base, stroke: '#2a1d0e', 'stroke-width': (road ? 5.4 : 4.2) * M(), 'stroke-opacity': 0.45 * o }),
              sv('polyline', { ...base, stroke: road ? '#e0b64a' : e.kind === 'pass' ? '#cdb897' : '#e6d6a4', 'stroke-width': (road ? 3 : 2.1) * M(), 'stroke-opacity': 0.9 * o, 'stroke-dasharray': !road && e.kind === 'pass' ? `${3 * M()} ${4 * M()}` : null }),
            ];
          }));
        }

        L.rings.replaceChildren(...(ms.rings && ms.game.fog_of_war
          ? ms.sources.map((s) => sv('circle', { cx: s.x, cy: s.y, r: s.r, fill: 'none', stroke: 'rgba(212,169,74,0.28)', 'stroke-dasharray': '5 5', style: 'pointer-events:none' }))
          : []));

        const pv = [];
        if (ms.marching && ms.sel && ms.sel.type === 'c') {
          const c = ms.cmd.find((x) => x.id === ms.sel.id);
          const pos = c && cmdPos(c, tf);
          const stables = (ms.areas.find((a) => a.area === 'stables') || { level: 0 }).level;
          if (pos && trailsOn() && ms.reachable) ms.reachable.forEach((id) => { const q = ms.t.get(id); pv.push(sv('circle', { cx: q.x, cy: q.y, r: 24 * M(), fill: 'none', stroke: '#f0cf7d', 'stroke-width': 2 * M(), 'stroke-dasharray': `${3 * M()} ${5 * M()}`, style: 'pointer-events:none' })); });
          if (pos && !trailsOn()) pv.push(sv('circle', { cx: pos.x, cy: pos.y, r: rangeOf(stables), fill: 'none', stroke: '#f0cf7d', 'stroke-width': 2 * M(), 'stroke-dasharray': `${2 * M()} ${6 * M()}`, style: 'pointer-events:none' }));
        }
        if (ms.marching && ms.stops.length && ms.sel && ms.sel.type === 'c') {
          const c = ms.cmd.find((x) => x.id === ms.sel.id);
          const pos = c && cmdPos(c, tf);
          if (pos) {
            const pts = trailsOn() && c.current_territory_id ? trailPoly([c.current_territory_id, ...ms.stops.flatMap((st) => st.path.slice(1))]) : [pos, ...ms.stops.map((st) => ms.t.get(st.id))];
            pv.push(sv('polyline', { points: pts.map((q) => `${q.x},${q.y}`).join(' '), fill: 'none', stroke: '#f0cf7d', 'stroke-width': 3 * M(), 'stroke-dasharray': `${8 * M()} ${6 * M()}`, style: 'pointer-events:none' }));
            ms.stops.forEach((st, i) => {
              const q = ms.t.get(st.id);
              pv.push(sv('circle', { cx: q.x, cy: q.y, r: 17 * M(), fill: '#3a2f12', stroke: '#f0cf7d', 'stroke-width': 2.5 * M(), style: 'pointer-events:none' }));
              pv.push(sv('text', { x: q.x, y: q.y + 5 * M(), 'text-anchor': 'middle', 'font-size': 15 * M(), style: 'fill:#f0cf7d;font-weight:bold' }, String(i + 1)));
            });
          }
        }
        if (ms.preview) {
          const dest = ms.t.get(ms.preview.to);
          const ok = !ms.preview.plan || ms.preview.plan.in_range;
          const tone = ms.preview.error ? '#e0685c' : (ok ? '#7fd08a' : '#e0685c');
          if (ms.preview.plan) {
            pv.push(sv('polyline', { points: (trailsOn() ? trailPoly(ms.preview.plan.path) : ms.preview.plan.path.map((id) => ms.t.get(id))).map((q) => `${q.x},${q.y}`).join(' '), fill: 'none', stroke: tone, 'stroke-width': 4 * M(), 'stroke-linejoin': 'round', style: 'pointer-events:none' }));
          }
          pv.push(sv('circle', { cx: dest.x, cy: dest.y, r: 26 * M(), fill: 'none', stroke: tone, 'stroke-width': 3 * M(), style: 'pointer-events:none' }));
        }
        L.preview.replaceChildren(...pv);

        renderDyn();
        drawHud();
      };

      const renderDyn = () => {
        if (ms.replay) { L.dyn.replaceChildren(); return; }
        const tf = tickF();
        const out = [];
        ms.cmd.forEach((c) => {
          if (c.status !== 'moving') return;
          const m = ms.mov.get(c.id);
          if (!m || !commanderSeen(c, tf)) return;
          const pos = movementPos(m, tf);
          const friend = isFriend(c.owner_player_id);
          if (friend) {
            const pts = [`${pos.x},${pos.y}`, ...m.path.slice(pos.i + 1).map((id) => `${ms.t.get(id).x},${ms.t.get(id).y}`)];
            out.push(sv('polyline', { class: 'marchline', points: pts.join(' '), fill: 'none', stroke: '#f5dc94', 'stroke-width': 3 * M(), 'stroke-linecap': 'round', 'stroke-dasharray': `${6 * M()} ${9 * M()}`, style: 'pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,0.8))' }));
          }

          line('Besieged by', [...new Set(siegers.map((c) => pname(c.owner_player_id)))].join(', ')),
          line('Besiegers', `${siegers.length} commander${siegers.length > 1 ? 's' : ''}, ${troops} troops`)];
        if (t.owner_player_id === ms.me.id) {
          const defenders = ms.cmd.filter((c) => c.current_territory_id === t.id && c.status === 'idle' && isFriend(c.owner_player_id));
          const force = t.troops + defenders.reduce((a, c) => a + c.troops, 0);
          out.push(line('Your force', `${t.troops} garrison + ${defenders.length} commander${defenders.length === 1 ? '' : 's'} (${force} troops)`),
            h('div', { style: 'margin-top:8px' }, h('button', {
              class: 'danger',
              onclick: (e) => {
                if (confirm('Sally out? Your garrison and idle commanders here fight the besiegers in the open. Ties go to the besiegers. If you lose, the garrison is emptied and those commanders die.')) {
                  order('sally_out', { p_territory_id: t.id }, (d) => (d.winner === 'sally' ? `Siege broken. ${d.survivors} survivors` : 'The sally was destroyed'))(e);
                }
              },
            }, 'Sally out')));
        }
        if (siegers.some((c) => c.owner_player_id === ms.me.id)) out.push(h('div', { style: 'margin-top:8px' }, assaultButton(t)));
        return h('div', { class: 'sec' }, out);
      };

      const routeLines = (route, call, c) => h('div', { style: 'margin-bottom:8px' },
        route.stops.map((st, i) => {
          const nm = (ms.t.get(st.territory_id) || { name: '?' }).name;
          const what = st.action && st.action !== 'nothing' ? ` · ${ACTION_NAMES[st.action]}${ACTION_NEEDS_AMOUNT.has(st.action) ? ' ' + st.amount : ''}` : '';
          const wait = st.delay ? ` · wait ${st.delay}` : '';
          return h('div', { style: `color:${i === route.next_stop_index ? 'var(--gold2)' : 'var(--dim)'}` }, `${i + 1}. ${nm}${what}${wait}`);
        }),
        route.looping ? h('div', { style: `color:${route.next_stop_index >= route.stops.length ? 'var(--gold2)' : 'var(--dim)'}` }, `Then back to ${(ms.t.get(route.origin_territory_id) || { name: '?' }).name} and repeat`) : null,
        h('div', { style: 'margin-top:6px' }, h('button', { onclick: call('set_route_loop', { p_commander_id: c.id, p_loop: !route.looping }, route.looping ? 'Loop turned off' : 'Looping from the last stop') }, route.looping ? 'Stop looping' : 'Loop route')));

      const commanderActions = (c) => {
        if (c.owner_player_id !== ms.me.id || !canAct()) return null;
        const call = (fn, args, message) => (e) => act(e.currentTarget, async () => {
          const { error } = await sb.rpc(fn, { p_game_id: gameId, ...args });
          if (error) throw error;
          if (message) toast(message, true);
        });

        if (c.status === 'moving') {
          const route = ms.routes.get(c.id);
          const m = ms.mov.get(c.id);
          if (route && route.status === 'recalled' && m) {
            return h('div', { class: 'sec' }, h('b', {}, 'Orders'),
              h('div', { style: 'color:var(--gold2)' }, `Recalled. Reaches ${ms.t.get(m.to_territory_id).name} first, then returns to ${ms.t.get(route.origin_territory_id).name}.`));
          }
          if (route && route.status === 'aborted' && m) {
            return h('div', { class: 'sec' }, h('b', {}, 'Orders'),
              h('div', { style: 'color:var(--gold2)' }, `Halting at ${ms.t.get(m.to_territory_id).name}.`));
          }
          return h('div', { class: 'sec' }, h('b', {}, 'Orders'),
            route && route.status === 'active' ? routeLines(route, call, c) : null,
            h('div', { class: 'row wrap2' },
              h('button', { onclick: call('abort_route', { p_commander_id: c.id }, 'Will halt at the next stop') }, 'Halt at next stop'),
              h('button', { onclick: call('recall_route', { p_commander_id: c.id }, 'Recalling to origin') }, 'Recall')));
        }
        if ((c.status !== 'idle' && c.status !== 'sieging') || !c.current_territory_id) return null;

        const t = ms.t.get(c.current_territory_id);
        const out = [h('b', {}, 'Orders')];
        const waiting = ms.routes.get(c.id);
        if (waiting && waiting.status === 'active' && waiting.resume_tick != null) {
          out.push(h('div', { style: 'color:var(--gold2);margin-bottom:6px' }, `Waiting at ${t.name} until tick ${waiting.resume_tick}, then continues its route.`),
            routeLines(waiting, call, c),
            h('div', { style: 'margin-bottom:10px' }, h('button', { onclick: call('abort_route', { p_commander_id: c.id }, 'Route cancelled') }, 'Cancel route')));
        }
        if (c.status === 'sieging') {
          out.push(h('div', { style: 'color:var(--gold2);margin-bottom:8px' }, `Besieging ${t.name}. The garrison starves each tick.`),
            h('div', { style: 'margin-bottom:10px' }, assaultButton(t)));
        }

        if (t.owner_player_id === ms.me.id) {
          const amount = h('input', { type: 'number', min: '1', value: ms.xfer, style: 'width:90px', oninput: (e) => { ms.xfer = Math.max(1, Number(e.target.value) || 1); } });
          out.push(h('div', { class: 'row wrap2', style: 'margin-bottom:10px' },
            amount,
            h('button', { onclick: (e) => act(e.currentTarget, async () => {
              const { error } = await sb.rpc('transfer_troops', { p_game_id: gameId, p_commander_id: c.id, p_amount: Number(amount.value) || 1 });
              if (error) throw error;
            }) }, 'Take'),
            h('button', { onclick: (e) => act(e.currentTarget, async () => {
              const { error } = await sb.rpc('transfer_troops', { p_game_id: gameId, p_commander_id: c.id, p_amount: -(Number(amount.value) || 1) });
              if (error) throw error;
            }) }, 'Leave'),
            h('span', { style: 'color:var(--dim);font-size:.8rem' }, `Garrison ${t.troops}`)));
        }

        const extras = [];
        if (t.owner_player_id === ms.me.id && t.garrison_commander_id !== c.id) {
          extras.push(h('button', { onclick: order('assign_garrison_commander', { p_commander_id: c.id }, 'Now leads the garrison') }, 'Lead garrison'));
        }
        if (!ms.cmd.some((x) => x.owner_player_id === ms.me.id && x.role === 'king')) {
          extras.push(h('button', { onclick: order('crown_commander', { p_commander_id: c.id }, (d) => `Crowned. Takes effect at tick ${d.effective_tick}`) }, 'Crown as king'));
        }
        if (extras.length) out.push(h('div', { class: 'row wrap2', style: 'margin-bottom:10px' }, extras));

        if (t.garrison_commander_id === c.id) {
          out.push(h('div', { style: 'color:var(--dim);margin-bottom:8px' }, 'Leads this garrison and cannot march.'),
            h('button', { onclick: call('unassign_garrison_commander', { p_territory_id: t.id }, 'Released from the garrison') }, 'Release from garrison'));
          return h('div', { class: 'sec' }, out);
        }

        if (!ms.marching) {
          out.push(h('button', { class: 'primary', onclick: () => { ms.marching = true; ms.preview = null; render(); drawSide(); } }, 'March...'));
          return h('div', { class: 'sec' }, out);
        }

        out.push(h('div', { style: 'color:var(--gold2);margin-bottom:8px' }, ms.stops.length ? 'Click a castle to add the next stop.' : 'Click a castle on the map to choose the destination.'));
        const pv = ms.preview;
        if (pv && pv.error) out.push(h('div', { style: 'color:var(--gules-hi);margin-bottom:8px' }, pv.error));
        if (pv && !pv.plan && !pv.error) out.push(h('div', { class: 'empty' }, 'Planning route...'));
        if (pv && pv.plan) {
          const plan = pv.plan;
          const dest = ms.t.get(pv.to);
          const interval = TICK_MS[ms.game.tick_speed];
          const eta = interval ? ` (about ${fmtDuration((plan.arrival_tick - tickF()) * interval)})` : '';
          out.push(h('div', {},
            line('Destination', dest.name),
            line('Route', plan.path.map((id) => ms.t.get(id).name).join(' > ')),
            line('Travel', `${plan.travel_ticks} ticks`),
            line('Arrives', `tick ${plan.arrival_tick}${eta}`),
            line('Distance / range', `${Math.round(plan.raw_length)} / ${plan.range}`),
            line('In range', plan.in_range ? (plan.raw_length > plan.range ? 'Yes (single hop)' : 'Yes') : 'No')));
          const friendly = dest.owner_player_id && isFriend(dest.owner_player_id);
          if (!friendly) {
            const type = h('select', { onchange: (e) => { pv.type = e.target.value; } },
              h('option', { value: 'assault' }, 'Assault the castle'),
              h('option', { value: 'siege' }, 'Lay siege'));
            type.value = pv.type;
            out.push(h('label', {}, 'On arrival'), type);
          }
          out.push(h('div', { class: 'row wrap2', style: 'margin-top:10px' },
            h('button', {
              class: 'primary',
              disabled: !plan.in_range,
              onclick: (e) => act(e.currentTarget, async () => {
                const { data, error } = await sb.rpc('march_commander', { p_game_id: gameId, p_commander_id: c.id, p_to_territory_id: pv.to, p_march_type: pv.type });
                if (error) throw error;
                ms.marching = false;
                ms.preview = null;
                ms.stops = []; ms.loop = false;
                toast(`Marching. Arrives at tick ${data.arrival_tick}`, true);
              }),
            }, 'March'),
            h('button', {
              disabled: !plan.in_range,
              onclick: () => { ms.stops = [{ id: pv.to, type: pv.type, action: PREFS.action, amount: 0, delay: 0, path: plan.path, cost: plan.raw_length }]; ms.loop = false; ms.preview = null; render(); drawSide(); },
            }, 'Start a route here')));
        }
        if (ms.stops.length) {
          const when = stopTicks();
          const origin = ms.t.get(c.current_territory_id);
          const loopBlocked = ms.loop && ms.stops[ms.stops.length - 1].id === c.current_territory_id;
          out.push(h('div', { class: 'sec' }, h('b', {}, `Route (${ms.stops.length} of 10 stops)`),
            ms.stops.map((st, i) => {
              const dest = ms.t.get(st.id);
              const friendly = dest.owner_player_id && isFriend(dest.owner_player_id);
              const type = friendly ? null : h('select', { style: 'width:auto;padding:3px 6px', onchange: (e) => { st.type = e.target.value; } },
                h('option', { value: 'assault' }, 'Assault'), h('option', { value: 'siege' }, 'Siege'));
              if (type) type.value = st.type;
              return h('div', {},
                h('div', { class: 'line', style: 'align-items:center' },
                  h('span', { style: 'color:var(--text)' }, `${i + 1}. ${dest.name}`),
                  h('span', { class: 'row' }, ms.speed && st.cost ? h('span', { style: 'color:var(--dim);font-size:.8rem' }, `+${when[i]} ticks`) : null, type,
                    h('button', { style: 'padding:2px 8px', onclick: () => { if (trailsOn()) ms.stops.splice(i); else ms.stops.splice(i, 1); render(); drawSide(); } }, 'x'))),
                dest.owner_player_id === ms.me.id ? orderControls(st, drawSide) : null);
            }),
            ms.speed ? line('Reaches the last stop in', tickText(when[when.length - 1])) : null,
            h('label', { class: 'check', style: 'margin:8px 0' }, h('input', { type: 'checkbox', checked: ms.loop, onchange: (e) => { ms.loop = e.target.checked; drawSide(); } }), `Loop: return to ${origin.name} and repeat`),
            ms.loop ? h('div', {}, h('div', { style: 'color:var(--dim);font-size:.8rem' }, `On each return to ${origin.name}`), orderControls(ms.originOrder, drawSide)) : null,
            loopBlocked ? h('div', { style: 'color:var(--gules-hi);margin:6px 0' }, 'A looping route must end somewhere other than where it starts.') : null,
            h('div', { style: 'color:var(--dim);font-size:.8rem;margin:6px 0' }, trailsOn()
              ? 'Click castles to add stops. Each stop must be within range of the one before it. Orders run when the commander arrives at a castle you own.'
              : 'Click more castles to add stops. Only the first leg is checked now; later legs are planned when the commander reaches each stop, and the route ends if one is blocked.'),
            h('button', {
              class: 'primary',
              disabled: loopBlocked,
              onclick: (e) => act(e.currentTarget, async () => {
                const { data, error } = await sb.rpc('send_on_route', {
                  p_game_id: gameId, p_commander_id: c.id, p_march_type: 'assault',
                  p_stops: ms.stops.map((st) => ({ territory_id: st.id, march_type: st.type, action: st.action || 'nothing', amount: st.amount || 0, delay: st.delay || 0 })),
                  p_options: { loop: ms.loop, origin_order: ms.originOrder },
                });
                if (error) throw error;
                ms.marching = false;
                ms.preview = null;
                ms.stops = []; ms.loop = false;
                toast(`Route started with ${data.stops} stop${data.stops === 1 ? '' : 's'}. First leg arrives at tick ${data.arrival_tick}`, true);
              }),
            }, `Send route (${ms.stops.length} stop${ms.stops.length === 1 ? '' : 's'})`)));
        }
        out.push(h('div', { style: 'margin-top:10px' }, h('button', { onclick: () => { ms.marching = false; ms.preview = null; ms.stops = []; ms.loop = false; render(); drawSide(); } }, 'Cancel')));
        return h('div', { class: 'sec' }, out);
      };

      const line = (k, v) => h('div', { class: 'line' }, h('span', {}, k), h('span', {}, v));
      const cmdRow = (c) => h('button', { class: 'cmdrow', onclick: () => select('c', c.id) },
        h('span', { class: 'chip', style: `background:${color(c.owner_player_id)}` }),
        `${c.role === 'king' ? '♛ ' : ''}${c.name}`,
        h('span', { style: 'color:var(--dim);margin-left:auto' }, `R${rankOf(c)} · ${c.troops}`));

      const momentText = (m) => {
        const p = m.payload;
        switch (m.type) {
          case 'game_started': return 'The realms are drawn. The game begins.';
          case 'war_declared': return `${pname(p.by_player_id)} ${p.how === 'declared' ? 'declared war on' : 'and'} ${pname(p.against_player_id)}${p.how === 'declared' ? '' : ' are at war'}${p.how === 'alliance_broken' ? ' after a broken alliance' : p.how === 'declared' ? '' : ' after the first attack'}`;
          case 'nap_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} signed a non-aggression pact`;
          case 'nap_broken': return `${pname(p.by_player_id)} broke the non-aggression pact with ${pname(p.against_player_id)}`;
          case 'marriage_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} sealed a marriage alliance until tick ${p.until_tick}`;
          case 'world_event': return p.kind === 'plague' ? `Plague breaks out at ${p.territory}` : p.kind === 'rebellion' ? `Unrest at ${p.territory}` : p.kind === 'harvest' ? `A bumper harvest at ${p.territory} (+${p.gold} gold)` : 'A comet crosses the sky; every realm gains prestige';
          case 'commander_captured': return `${p.name} (${pname(p.owner_player_id)}) was captured by ${pname(p.captor_player_id)}`;
          case 'captive_executed': return `${pname(p.by_player_id)} executed the captive ${p.name}`;
          case 'trade_agreed': return `${pname(p.player_a)} and ${pname(p.player_b)} agreed a trade deal`;
          case 'mediation_succeeded': return `${pname(p.mediator)} brokered a truce between ${pname(p.player_a)} and ${pname(p.player_b)}`;
          case 'alliance_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} formed an alliance`;
          case 'truce_formed': return `${pname(p.player_a)} and ${pname(p.player_b)} agreed a truce until tick ${p.ends_tick}`;
          case 'truce_ended': return `The truce between ${pname(p.player_a)} and ${pname(p.player_b)} has ended`;
          case 'alliance_broken': return `${pname(p.by_player_id)} broke the alliance with ${pname(p.against_player_id)}`;
          case 'castle_captured': return `${pname(p.to_player_id)} captured ${p.territory}${p.from_player_id ? ' from ' + pname(p.from_player_id) : ''}`;
          case 'siege_started': return `${pname(p.by_player_id)} laid siege to ${p.territory}`;
          case 'siege_lifted': return `The siege of ${p.territory} was lifted ${p.by === 'sally' ? 'by a sally' : 'by relief forces'}`;
          case 'king_killed': return `${p.name}, king of ${pname(p.player_id)}, was killed`;
          case 'player_eliminated': return `${pname(p.player_id)} was eliminated`;
          case 'game_won': return `${pname(p.player_id)} won the game${p.reason === 'time_limit' ? ' at the time limit' : ''}`;
          default: return m.type.replace(/_/g, ' ');
        }
      };

      const markRead = async () => {
        const ids = ms.inbox.filter((i) => !i.is_read).map((i) => i.id);
        if (!ids.length) return;
        ms.newIds = new Set(ids);
        ms.inbox.forEach((i) => { i.is_read = true; });
        await sb.from('player_inbox').update({ is_read: true }).in('id', ids);
      };

      const sideTabs = () => {
        const unread = ms.inbox.filter((i) => !i.is_read).length + battlesUnread();
        const tab = (k, label) => h('button', {
          class: ms.tab === k ? 'on' : '',
          onclick: async () => {
            ms.tab = k;
            if (k === 'inbox') await markRead();
            drawSide();
            drawHud();
          },
        }, label);
        const chatN = chatUnread() + [...ms.threads.values()].filter(threadUnread).length;
        return h('div', { class: 'tabs' }, tab('info', 'Info'), tab('news', 'News'), tab('inbox', `Inbox${unread ? ` (${unread})` : ''}`), tab('chat', `Chat${chatN && !(ms.tab === 'chat') ? ` (${chatN})` : ''}`));
      };

      const threadUnread = (t) => t.msgs.some((m) => m.player_id !== ms.me.id && (!t.read || Date.parse(m.created_at) > Date.parse(t.read)));
      const chatUnread = () => ms.chat.filter((m) => m.player_id !== ms.me.id && !ms.muted.has(m.player_id) && m.id > ms.chatSeen).length;

      const markChatSeen = () => {
        const top = ms.chat.length ? ms.chat[ms.chat.length - 1].id : 0;
        if (top <= ms.chatSeen) return;
        ms.chatSeen = top;
        try { localStorage.setItem(chatSeenKey, String(top)); } catch {}
      };

      const markThreadRead = (t) => {
        if (!threadUnread(t)) return;
        t.read = new Date().toISOString();
        sb.from('thread_participants').update({ last_read_at: t.read }).eq('thread_id', t.id).eq('player_id', ms.me.id).then(() => {});
      };

      const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const readable = (pid) => {
        const c = color(pid);
        const n = parseInt(c.slice(1), 16);
        const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
        return lum < 0.3 ? color2(pid) : c;
      };

      const setMuted = (pid, on) => {
        if (on) ms.muted.add(pid); else ms.muted.delete(pid);
        try { localStorage.setItem(mutedKey, JSON.stringify([...ms.muted])); } catch {}
        drawSide();
      };

      const chatLine = (pid, text, at) => (ms.muted.has(pid) ? null : h('div', { class: 'chatline' },
        h('b', { style: `color:${readable(pid)};font-weight:bold` }, `${pname(pid)}: `), text, h('small', {}, fmtTime(at)),
        ...(pid !== ms.me.id && !(ms.players.get(pid) || {}).is_ai ? [h('button', { class: 'link', style: 'margin-left:6px', onclick: () => setMuted(pid, true) }, 'mute')] : [])));

      const mutedBar = () => (ms.muted.size
        ? h('div', { class: 'meta', style: 'color:var(--dim);margin-top:8px' }, 'Muted: ',
          ...[...ms.muted].map((pid) => h('button', { class: 'link', style: 'margin-right:8px', onclick: () => setMuted(pid, false) }, `${pname(pid)} (unmute)`)))
        : null);

      const threadTitle = (t) => t.parts.filter((id) => id !== ms.me.id).map(pname).join(', ') || 'Just you';

      const composer = (input, onSend) => h('form', { class: 'composer', onsubmit: (e) => { e.preventDefault(); onSend(); } },
        input, h('button', { type: 'submit', class: 'primary' }, 'Send'));

      const sendGeneral = async () => {
        const text = ms.chatInput.value.trim();
        if (!text) return;
        ms.chatInput.value = '';
        const { error } = await sb.rpc('send_chat_message', { p_game_id: gameId, p_message: text });
        if (error) { ms.chatInput.value = text; toast(error.message); return; }
        await load();
      };

      const sendInThread = async (t) => {
        const text = ms.threadInput.value.trim();
        if (!text) return;
        ms.threadInput.value = '';
        const { error } = await sb.rpc('send_thread_message', { p_thread_id: t.id, p_body: text });
        if (error) { ms.threadInput.value = text; toast(error.message); return; }
        await load();
      };

      const openDm = (pid) => {
        const want = [ms.me.id, pid].sort((a, b) => a - b).join(',');
        const t = [...ms.threads.values()].find((x) => [...x.parts].sort((a, b) => a - b).join(',') === want);
        ms.tab = 'chat';
        ms.chatTab = 'messages';
        ms.thread = t ? t.id : null;
        ms.compose = t ? null : { ids: new Set([pid]) };
        drawSide();
      };

      const chatView = () => {
        const nThreads = [...ms.threads.values()].filter(threadUnread).length;
        const sub = (k, label) => h('button', {
          class: ms.chatTab === k ? 'primary' : '',
          onclick: () => { ms.chatTab = k; ms.thread = null; ms.compose = null; drawSide(); },
        }, label);
        const bar = h('div', { class: 'row', style: 'margin:12px 0' }, sub('general', 'General'), sub('messages', `Messages${nThreads ? ` (${nThreads})` : ''}`));

        if (ms.chatTab === 'general') {
          markChatSeen();
          const lines = ms.chat.map((m) => chatLine(m.player_id, m.message, m.created_at)).filter(Boolean);
          return [bar, h('div', { class: 'chatlist', id: 'chatscroll' }, lines.length ? lines : h('div', { class: 'empty' }, 'No messages yet.')), composer(ms.chatInput, sendGeneral), mutedBar()].filter(Boolean);
        }

        if (ms.compose) {
          const humans = [...ms.players.values()].filter((p) => !p.is_ai && p.id !== ms.me.id);
          const boxes = humans.map((p) => h('label', { class: 'check', style: 'margin-top:6px' },
            h('input', { type: 'checkbox', checked: ms.compose.ids.has(p.id), onchange: (e) => { if (e.target.checked) ms.compose.ids.add(p.id); else ms.compose.ids.delete(p.id); } }),
            sigil(p.faction_slug, 20), p.display_name));
          return [bar, h('b', {}, 'New message to'), humans.length ? boxes : h('div', { class: 'empty' }, 'No other human players in this game.'),
            composer(ms.threadInput, async () => {
              const text = ms.threadInput.value.trim();
              if (!text) return;

      const TILT = { deg: 34, persp: 1400, zoom: 1.22, origin: 0.55 };
      try { ms.tilt = localStorage.getItem('ss-tilt') !== '0'; } catch { ms.tilt = true; }
      const tiltK = () => (ms.tilt ? 1 / Math.cos((TILT.deg * Math.PI) / 180) : 1);
      const applyTilt = () => {
        wrap.style.perspective = ms.tilt ? `${TILT.persp}px` : '';
        wrap.style.perspectiveOrigin = `50% ${TILT.origin * 100}%`;
        svg.style.transformOrigin = `50% ${TILT.origin * 100}%`;
        svg.style.transform = ms.tilt ? `rotateX(${TILT.deg}deg) scale(${TILT.zoom})` : '';
        wrap.classList.toggle('tilted', ms.tilt);
      };
      const toMapWith = (view, e) => {
        const box = wrap.getBoundingClientRect();
        const W = box.width;
        const H = box.height;
        let lx = e.clientX - box.left;
        let ly = e.clientY - box.top;
        if (ms.tilt) {
          const th = (TILT.deg * Math.PI) / 180;
          const ox = W / 2;
          const oy = TILT.origin * H;
          const X = lx - ox;
          const Y = ly - oy;
          const u = (Y * TILT.persp) / (TILT.persp * Math.cos(th) + Y * Math.sin(th));
          const sc = TILT.persp / (TILT.persp - u * Math.sin(th));
          lx = ox + X / sc / TILT.zoom;
          ly = oy + u / TILT.zoom;
        }
        const k = Math.min(W / view.w, H / view.h);
        return { x: view.x + (lx - (W - view.w * k) / 2) / k, y: view.y + (ly - (H - view.h * k) / 2) / k };
      };
      const toMap = (e) => toMapWith(ms.view, e);
      const applyView = () => {
        svg.setAttribute('viewBox', `${ms.view.x} ${ms.view.y} ${ms.view.w} ${ms.view.h}`);

      svg.addEventListener('wheel', (e) => {

        const nw = Math.min(ms.full.w * 1.3, Math.max(ms.full.w / 8, v.w * Math.exp(e.deltaY * 0.0015)));
        const k = nw / v.w;

      let pinch = null;

        ms.fogDark = !!view.game.fog_dark;
        if (firstEdges || ms.fogDark) ms.edgesAll = ed.data;
        ms.edges = ms.edgesAll.filter((e) => ms.t.has(e.from_territory_id) && ms.t.has(e.to_territory_id));
        if (firstEdges) {
          const artRow = await sb.from('games').select('map_art').eq('id', gameId).maybeSingle();
          ms.art = artRow.data && artRow.data.map_art ? artRow.data.map_art : null;
          if (ms.art) initTerrain();
          else ms.cells = voronoiCells([...ms.t.values()], view.game.map_w, view.game.map_h);
        }
        if (firstLoad) {
          firstLoad = false;
          const pad = 40 * ((view.game && view.game.world_scale) || 1);
          ms.full = { x: -pad, y: -pad, w: view.game.map_w + 2 * pad, h: view.game.map_h + 2 * pad };
          ms.view = { ...ms.full };
          const cap = ms.me && ms.t.get(ms.me.capital_territory_id);
          const viewW = 150 * 6 * ((view.game && view.game.world_scale) || 1);
          if (cap && ms.full.w > viewW * 1.1) ms.view = { x: cap.x - viewW / 2, y: cap.y - viewW / 2, w: viewW, h: viewW };
          applyView();
        }
        render();
        drawSide();
      };

      await load();

      let debounce = null;
      const kick = () => { clearTimeout(debounce); debounce = setTimeout(load, 300); };
      const unwatch = watchGame(gameId, kick);
      const f = `game_id=eq.${gameId}`;
      let channel = sb.channel('map-data-' + gameId);
      ['diplomacy', 'realm_areas', 'game_moments', 'player_inbox', 'game_chat'].forEach((table) => {
        channel = channel.on('postgres_changes', { event: '*', schema: 'public', table, filter: f }, kick);
      });
      channel = channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'thread_messages' }, kick);
      channel.subscribe();
      let animStep = 0;
      const tickTimer = setInterval(() => {
        if (!ms.game) return;
        animStep = (animStep + 1) % 4;
        if (ms.mov.size || animStep === 0) renderDyn();
        if (animStep === 0) updateCountdown();
      }, 250);
      const loadTimer = setInterval(load, 20000);
      const onKey = (e) => {
        if (e.key !== 'Escape' || document.activeElement instanceof HTMLInputElement) return;
        if (ms.marching) { ms.marching = false; ms.preview = null; ms.stops = []; ms.loop = false; render(); drawSide(); }
        else if (ms.sel) select(null);
      };
      window.addEventListener('keydown', onKey);
      state.cleanup.push(() => { window.removeEventListener('keydown', onKey); clearTimeout(debounce); clearInterval(tickTimer); clearInterval(loadTimer); unwatch(); sb.removeChannel(channel); });
    }

    async function onSession(session, event) {
      state.session = session;
      if (!session) {
        clearCleanup();
        state.profile = null;
        state.view = 'auth';
        if (DEV_GUEST && await startGuest()) return;
        renderAuth(false);
        return;
      }
      if (event === 'PASSWORD_RECOVERY') {
        state.view = 'recovery';
        renderAuth(true);
        return;
      }
      if (state.view === 'recovery') return;
      if (state.view === 'home' || state.view === 'room' || state.view === 'map') return;
      await loadProfile();
      await showHome();
    }

    initStage();

    sb.auth.onAuthStateChange((event, session) => {
      setTimeout(() => onSession(session, event), 0);
    });

    sb.auth.getSession().then(async ({ data }) => {
      if (data.session) return;
      if (DEV_GUEST && await startGuest()) return;
      renderAuth(false);
    });
  </script>
</body>
</html>
